<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🧑‍🚀 นักบินอวกาศ — คิดส์เล่น</title>
<meta name="description" content="เกมนักบินอวกาศสำหรับเด็กไทย ลอยตัวในสถานีอวกาศ กิน นอน ออกกำลังกาย ห้องน้ำ มองโลกจากหน้าต่าง และประกอบจรวดปล่อยขึ้นอวกาศ">
<meta name="theme-color" content="#0b1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="นักบินอวกาศ">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
    --space: #0b1033; --space-2: #1b2160;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 35%, var(--space-2) 0%, var(--space) 60%, #05071c 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  /* brand cloud strip — here it drifts like space dust */
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.12; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--gold); text-shadow: 3px 3px 0 var(--brand-dark);
  }
  .modes, .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 600;
    min-height: 56px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35); transition: transform .1s;
  }
  .chip:active { transform: translateY(2px) scale(0.96); }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .row .chip.on { background: var(--gold); border-color: #e0b400; color: var(--ink); }
  .chip:disabled { opacity: .45; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .main > * { min-width: 0; }
  @media (min-width: 900px) and (orientation: landscape) { .main { grid-template-columns: minmax(0, 1fr) 360px; } }
  .view { position: relative; background: #05071c; border: 4px solid rgba(255,255,255,.18); border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.35); }
  .view svg { display: block; width: 100%; height: auto; }
  #scene { max-height: 70vh; touch-action: none; }
  .hold {
    font-family: 'Mitr', sans-serif; font-size: 24px; font-weight: 700; color: #fff;
    width: 100%; min-height: 88px; border-radius: 999px; margin-top: 10px; cursor: pointer;
    border: 4px solid #1e8449; background: #2ecc71; box-shadow: 0 6px 0 #1e8449; touch-action: none;
  }
  .hold.on { transform: translateY(4px); box-shadow: 0 2px 0 #1e8449; background: #7ed957; }
  .parts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 10px; }
  .part {
    min-height: 150px; border-radius: 22px; border: 3px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08);
    color: #fff; font-family: 'Mitr', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px;
  }
  .part svg { width: 100%; height: 108px; }
  .part:active { transform: scale(.95); }
  .prompt { text-align: center; font-size: 20px; font-weight: 700; color: var(--gold); margin-top: 10px; }

  /* info panel — inline, never a popup */
  .panel {
    background: var(--card); color: var(--ink);
    border: 4px solid var(--card-border); border-radius: 28px;
    padding: 16px 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  .p-head { display: flex; align-items: center; gap: 12px; }
  .say {
    margin-left: auto; flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--card-border); background: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .say:active { transform: translateY(2px); }
  .say.on { background: var(--gold); border-color: #e0b400; }
  .sayrow { display: flex; justify-content: flex-end; }
  .sayrow .say { width: auto; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 18px; font-weight: 600; color: var(--ink); }
  .sayable { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .1s; }
  .sayable:active { transform: scale(0.97); }
  .fact.sayable { position: relative; padding-right: 26px; }
  .fact.sayable::after { content: '🔈'; position: absolute; top: 6px; right: 6px; font-size: 13px; opacity: .55; }
  .know li.sayable::after { content: ' 🔈'; font-size: 13px; opacity: .55; }
  .reading { outline: 4px solid var(--gold); outline-offset: 2px; border-radius: 16px; background-color: #fff3b0 !important; }
  .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 12px 0 8px; }
  .fact { background: #f6f7ff; border-radius: 16px; padding: 8px 10px; }
  .fact .k { font-size: 13px; color: #6b7280; }
  .fact .v { font-size: 16px; font-weight: 600; line-height: 1.25; }
  .know { margin: 8px 0 0; padding: 0; list-style: none; }
  .know li { background: #fff6d6; border-radius: 16px; padding: 8px 12px; margin-top: 8px; font-size: 16px; line-height: 1.4; }
  .know li::before { content: '💡 '; }
  .q-text { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); text-align: center; margin: 6px 0; line-height: 1.2; }
  .res { font-size: 18px; line-height: 1.45; margin-top: 10px; }
  .res b { color: var(--brand-dark); }
  .big-btn {
    font-family: 'Mitr', sans-serif; font-size: 24px; font-weight: 700;
    min-height: 72px; width: 100%; margin-top: 12px; border-radius: 999px;
    border: 3px solid var(--brand-dark); background: var(--brand); color: #fff;
    box-shadow: 0 5px 0 var(--brand-dark); cursor: pointer;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--brand-dark); }
  .big-btn:disabled { opacity: .5; }
  .src { font-size: 11px; color: #9aa3b5; margin-top: 10px; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>🧑‍🚀 นักบินอวกาศ</h1></header>
  <div class="modes" id="modes">
    <button class="chip on" data-mode="float">🎈 ลอยตัว</button>
    <button class="chip" data-mode="eat">🍽️ กินข้าว</button>
    <button class="chip" data-mode="sleep">😴 นอน</button>
    <button class="chip" data-mode="gym">🏃 ออกกำลังกาย</button>
    <button class="chip" data-mode="toilet">🚽 ห้องน้ำ</button>
    <button class="chip" data-mode="window">🌍 หน้าต่าง</button>
    <button class="chip" data-mode="rocket">🚀 ประกอบจรวด</button>
  </div>
  <div class="main">
    <div>
      <div class="view"><svg id="scene" viewBox="0 0 1000 640" aria-label="สถานีอวกาศ"></svg></div>
      <div id="ctrls"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene'), ctrls = $('ctrls'), panel = $('panel');
let mode = 'float';
function svgPt(ev) {
  const pt = scene.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
function starfield(seed, n, w = 1000, h = 640) {
  let s = '', x = seed;
  const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) s += `<circle cx="${(rnd() * w).toFixed(0)}" cy="${(rnd() * h).toFixed(0)}" r="${(0.8 + rnd() * 1.8).toFixed(1)}" fill="#fff" opacity="${(0.25 + rnd() * 0.55).toFixed(2)}"/>`;
  return s;
}
const knowList = (a) => `<ul class="know">${a.map((k) => `<li>${k}</li>`).join('')}</ul>`;

// ============================================================================
// ART — the station cabin and the crew member (indoor clothes, no spacesuit)
// ============================================================================
const INK = 'stroke="#2d3436" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
function cabin(dim = 0) {
  let s = `<rect width="1000" height="640" fill="#dfe5ee"/>
    <rect x="0" y="0" width="1000" height="60" fill="#c3cbd8"/><rect x="0" y="580" width="1000" height="60" fill="#c3cbd8"/>`;
  for (let x = 40; x < 1000; x += 160) s += `<rect x="${x}" y="70" width="140" height="80" rx="10" fill="#eef2f7" stroke="#b7c0ce" stroke-width="3"/><rect x="${x}" y="490" width="140" height="80" rx="10" fill="#eef2f7" stroke="#b7c0ce" stroke-width="3"/>`;
  s += `<rect x="60" y="160" width="12" height="320" rx="6" fill="#f2c94c"/><rect x="928" y="160" width="12" height="320" rx="6" fill="#f2c94c"/>
    <path d="M120,150 q60,30 120,0 t120,0" fill="none" stroke="#4a6fa5" stroke-width="6"/><path d="M640,490 q60,-30 120,0 t120,0" fill="none" stroke="#d35454" stroke-width="6"/>
    <rect x="780" y="80" width="90" height="60" rx="6" fill="#2d3436"/><rect x="786" y="86" width="78" height="44" rx="4" fill="#5bc0eb"/>
    <rect x="200" y="500" width="70" height="60" rx="10" fill="#4a6fa5"/><rect x="290" y="500" width="70" height="60" rx="10" fill="#6c8ebf"/>
    <circle cx="500" cy="34" r="22" fill="#05071c" stroke="#9aa3b5" stroke-width="5"/><circle cx="494" cy="28" r="5" fill="#fff" opacity=".7"/>`;
  if (dim) s += `<rect width="1000" height="640" fill="#0b1033" opacity="${dim}"/>`;
  return s;
}
// crew member, centred at the belly, ~220 units tall; pose: 'float' | 'eat' | 'run' | 'sleep'
function crew(pose = 'float', t = 0) {
  const sw = Math.sin(t * 8), legA = pose === 'run' ? 26 * sw : 12, legB = pose === 'run' ? -26 * sw : -10;
  const armA = pose === 'eat' ? -60 : pose === 'run' ? -24 * sw : -30, armB = pose === 'run' ? 24 * sw : 40;
  return `<g>
    <g transform="rotate(${legA} -14 30)"><rect x="-26" y="30" width="24" height="76" rx="11" fill="#33415c" ${INK}/><ellipse cx="-14" cy="110" rx="18" ry="10" fill="#f2f2f2" ${INK}/></g>
    <g transform="rotate(${legB} 14 30)"><rect x="2" y="30" width="24" height="76" rx="11" fill="#33415c" ${INK}/><ellipse cx="14" cy="110" rx="18" ry="10" fill="#f2f2f2" ${INK}/></g>
    <g transform="rotate(${armA} -34 -48)"><rect x="-46" y="-50" width="22" height="70" rx="11" fill="#4a90d9" ${INK}/><circle cx="-35" cy="24" r="12" fill="#f5c9a0" ${INK}/></g>
    <rect x="-38" y="-62" width="76" height="100" rx="26" fill="#4a90d9" ${INK}/>
    <rect x="-18" y="-40" width="36" height="22" rx="6" fill="#ff6b9d" stroke="#2d3436" stroke-width="3"/><text x="0" y="-23" text-anchor="middle" font-size="16">⭐</text>
    <g transform="rotate(${armB} 34 -48)"><rect x="24" y="-50" width="22" height="70" rx="11" fill="#4a90d9" ${INK}/><circle cx="35" cy="24" r="12" fill="#f5c9a0" ${INK}/></g>
    <circle cx="0" cy="-104" r="40" fill="#f5c9a0" ${INK}/>
    <path d="M-40,-110 q4,-46 44,-40 q34,2 38,40 q-8,-22 -22,-24 q-14,10 -36,4 q-14,6 -24,20 Z" fill="#3b2a20" ${INK}/>
    ${pose === 'sleep' ? `<path d="M-20,-102 q8,6 16,0 M6,-102 q8,6 16,0" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>`
      : `<circle cx="-14" cy="-102" r="5" fill="#2d3436"/><circle cx="14" cy="-102" r="5" fill="#2d3436"/>`}
    ${pose === 'eat' ? `<ellipse cx="0" cy="-82" rx="10" ry="8" fill="#7a2d2d"/>` : `<path d="M-12,-84 q12,10 24,0" fill="none" stroke="#2d3436" stroke-width="4" stroke-linecap="round"/>`}
    <circle cx="-26" cy="-90" r="6" fill="#ff9aa8" opacity=".6"/><circle cx="26" cy="-90" r="6" fill="#ff9aa8" opacity=".6"/>
  </g>`;
}

// ============================================================================
// 🎈 FLOAT — everything (and everyone) floats: fling things, they glide until a wall.
// ============================================================================
const WALL = { x0: 90, x1: 910, y0: 80, y1: 560 };
let things = [], held = null, crewSpin = 0;
function resetFloat() {
  things = [
    { id: 'crew', x: 360, y: 330, vx: 6, vy: -4, r: 90, rot: 0, vr: 0 },
    { id: 'apple', e: '🍎', x: 640, y: 220, vx: -18, vy: 10, r: 34, rot: 0, vr: 20 },
    { id: 'wrench', e: '🔧', x: 760, y: 400, vx: 12, vy: -14, r: 34, rot: 0, vr: -30 },
    { id: 'book', e: '📘', x: 220, y: 180, vx: 10, vy: 8, r: 34, rot: 0, vr: 12 },
    { id: 'bear', e: '🧸', x: 560, y: 470, vx: -10, vy: -12, r: 38, rot: 0, vr: 16 },
    { id: 'sock', e: '🧦', x: 820, y: 170, vx: -8, vy: 14, r: 32, rot: 0, vr: -18 },
    { id: 'water', x: 470, y: 160, vx: 8, vy: 6, r: 36, rot: 0, vr: 0 },
  ];
}
function buildFloat() {
  scene.innerHTML = `<defs><radialGradient id="wball" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".35" stop-color="#a8ddff" stop-opacity=".8"/><stop offset="1" stop-color="#3a9ad9" stop-opacity=".85"/></radialGradient></defs>
    ${cabin()}<g id="things"></g>
    <text x="500" y="625" text-anchor="middle" font-family="Mitr" font-size="24" font-weight="600" fill="#5b6475">👆 ลากแล้วปล่อย ของจะลอยไปเรื่อยๆ</text>`;
  const g = $('things');
  for (const t of things) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    el.dataset.id = t.id;
    el.innerHTML = t.id === 'crew' ? `<g transform="scale(.8)">${crew('float')}</g><circle r="100" fill="transparent"/>`
      : t.id === 'water' ? `<ellipse class="wb" rx="34" ry="34" fill="url(#wball)" stroke="#3a9ad9" stroke-width="2"/><circle r="50" fill="transparent"/>`
      : `<text font-size="64" text-anchor="middle" dominant-baseline="central">${t.e}</text><circle r="50" fill="transparent"/>`;
    g.appendChild(el); t.el = el;
  }
  placeFloat(0);
}
function placeFloat(now) {
  for (const t of things) {
    t.el.setAttribute('transform', `translate(${t.x.toFixed(1)} ${t.y.toFixed(1)}) rotate(${t.rot.toFixed(1)})`);
    if (t.id === 'water') { const w = Math.sin(now / 180) * 3; const e = t.el.querySelector('.wb'); e.setAttribute('rx', 34 + w); e.setAttribute('ry', 34 - w); }
  }
}
function floatTick(dt, now) {
  for (const t of things) {
    if (t === held) continue;
    t.x += t.vx * dt; t.y += t.vy * dt; t.rot += t.vr * dt;
    const k = Math.pow(0.97, dt);                                  // a little air drag in the cabin
    t.vx *= k; t.vy *= k; t.vr *= Math.pow(0.9, dt);
    const r = t.id === 'crew' ? 80 : t.r;
    if (t.x < WALL.x0 + r) { t.x = WALL.x0 + r; t.vx = Math.abs(t.vx) * 0.8; bump(t); }
    if (t.x > WALL.x1 - r) { t.x = WALL.x1 - r; t.vx = -Math.abs(t.vx) * 0.8; bump(t); }
    if (t.y < WALL.y0 + r) { t.y = WALL.y0 + r; t.vy = Math.abs(t.vy) * 0.8; bump(t); }
    if (t.y > WALL.y1 - r) { t.y = WALL.y1 - r; t.vy = -Math.abs(t.vy) * 0.8; bump(t); }
  }
  if (crewSpin > 0) { const c = things[0]; const step = Math.min(crewSpin, 240 * dt); c.rot += step; crewSpin -= step; }
  placeFloat(now);
}
function bump(t) { if (Math.hypot(t.vx, t.vy) > 60) tone(260 + Math.random() * 80, 0.06, 'triangle', 0.05); }
const FLOAT_SAY = {
  crew: 'ตีลังกาในอวกาศ ง่ายมากเลย', apple: 'แอปเปิลลอยได้ นักบินอวกาศได้กินผลไม้สด ตอนยานขนของมาส่ง',
  wrench: 'เครื่องมือต้องผูกหรือติดตีนตุ๊กแกไว้ ไม่งั้นลอยหายไป', book: 'หนังสือลอยไปเรื่อยๆ จนกว่าจะชนผนัง',
  bear: 'ตุ๊กตาลอยได้ นักบินอวกาศมักเอาตุ๊กตาไปด้วย ถ้าตุ๊กตาเริ่มลอย แปลว่าถึงอวกาศแล้ว', sock: 'ถุงเท้าก็ลอย ต้องเก็บใส่ถุงให้ดี',
  water: 'น้ำในอวกาศไม่ไหล แต่จับตัวเป็นลูกกลมๆ ลอยอยู่',
};
let pick = null;
function floatDown(e) {
  const q = svgPt(e);
  let best = null, bd = 1e9;
  for (const t of things) { const d = Math.hypot(q.x - t.x, q.y - t.y); if (d < (t.id === 'crew' ? 110 : 64) && d < bd) { bd = d; best = t; } }
  if (!best) return;
  held = best; pick = { dx: best.x - q.x, dy: best.y - q.y, hist: [[performance.now(), q.x, q.y]], moved: 0 };
  try { scene.setPointerCapture(e.pointerId); } catch (_) {}
  buzz(8); blip(560);
}
function floatMove(e) {
  if (!held) return;
  const q = svgPt(e);
  pick.moved += Math.hypot(q.x + pick.dx - held.x, q.y + pick.dy - held.y);
  held.x = q.x + pick.dx; held.y = q.y + pick.dy;
  pick.hist.push([performance.now(), q.x, q.y]); if (pick.hist.length > 6) pick.hist.shift();
}
function floatUp() {
  if (!held) return;
  const h = pick.hist, a = h[0], b = h[h.length - 1], dt = Math.max(0.016, (b[0] - a[0]) / 1000);
  held.vx = Math.max(-900, Math.min(900, (b[1] - a[1]) / dt)); held.vy = Math.max(-900, Math.min(900, (b[2] - a[2]) / dt));
  held.vr = (Math.random() - 0.5) * 120;
  if (pick.moved < 12) {                                            // a tap, not a fling
    held.vx = held.vy = 0;
    if (held.id === 'crew') { crewSpin = 360; cheer(); }
    speak(FLOAT_SAY[held.id]);
  }
  held = null; pick = null;

let engine = null;

const ROCKET_KNOW = [

let AC = null;
function ensureAudio() {

}
function tone(f, d, type = 'sine', v = 0.12) {

function sayNow(text) {

  let fin = false;

}

function sayable(t) {                    // card text → speech: no emoji/English, symbols as words

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
