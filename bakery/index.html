<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🎂 ร้านขนมเพื่อนสัตว์ — คิดส์เล่น</title>
<meta name="description" content="ร้านเค้กของเพื่อนสัตว์ ผสมแป้ง ตอกไข่ คนให้เข้ากัน อบให้ฟู รอให้เย็น แต่งหน้าเค้ก ใส่ผลไม้และเทียนให้ครบตามที่สั่ง สำหรับเด็กเล็ก">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ร้านขนมเพื่อนสัตว์">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(28px, 6vw, 48px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .steps { display: flex; gap: 6px; justify-content: center; margin: 6px 0 10px; flex-wrap: wrap; }
  .steps span { width: 46px; height: 46px; border-radius: 50%; background: #fff; border: 3px solid var(--card-border); display: flex; align-items: center; justify-content: center; font-size: 24px; opacity: .5; }
  .steps span.on { opacity: 1; border-color: var(--brand); transform: scale(1.12); }
  .steps span.done { opacity: 1; background: #e8f9e0; border-color: #7ed957; }
  .view { position: relative; background: #fffef9; border: 4px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .view svg { display: block; width: 100%; height: auto; touch-action: none; }
  .tray { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 12px; }
  .it {
    min-width: 84px; min-height: 84px; border-radius: 22px; border: 3px solid var(--card-border); background: #fff; cursor: pointer;
    font-family: 'Mitr', sans-serif; font-size: 15px; font-weight: 600; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 8px;
  }
  .it b { font-size: 34px; line-height: 1.1; }
  .it.used { opacity: .35; }
  .it.on { background: var(--gold); border-color: #e0b400; }
  .it:active { transform: scale(.94); }
  .sw { width: 70px; height: 70px; border-radius: 50%; border: 5px solid #fff; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
  .sw.on { border-color: var(--ink); transform: scale(1.12); }
  .big {
    font-family: 'Mitr', sans-serif; font-size: 24px; font-weight: 700;
    min-height: 76px; width: 100%; margin-top: 12px; border-radius: 999px;
    border: 3px solid var(--brand-dark); background: var(--brand); color: #fff;
    box-shadow: 0 5px 0 var(--brand-dark); cursor: pointer;
  }
  .big:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--brand-dark); }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>🎂 ร้านขนมเพื่อนสัตว์</h1></header>
  <div class="steps" id="steps"></div>
  <div class="view"><svg id="scene" viewBox="0 0 1000 640" aria-label="ร้านขนม"></svg></div>
  <div id="ctrls"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene'), ctrls = $('ctrls');
const K = 'stroke="#2d3436" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const k3 = 'stroke="#2d3436" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const lerp = (a, b, u) => a + (b - a) * u, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function svgPt(ev) { const p = scene.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(scene.getScreenCTM().inverse()); }
const NUM = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า'];

// ============================================================================
// CUSTOMERS + ORDERS — drawn as friendly characters behind the counter
// ============================================================================
const CUSTOMERS = {
  bear: { th: 'หมี', fur: '#a0703c', draw: (c, t) => `${C(-62, -140, 26, c)}${C(62, -140, 26, c)}${C(-62, -140, 13, '#e0b48a')}${C(62, -140, 13, '#e0b48a')}${C(0, -90, 80, c)}${E(0, -66, 34, 26, '#e0b48a')}${E(0, -78, 12, 9, '#2d3436')}` },
  rabbit: { th: 'กระต่าย', fur: '#f2f2f2', draw: (c, t) => `<g transform="rotate(${Math.sin(t * 2) * 5} -30 -150)">${E(-30, -200, 18, 62, c)}${E(-30, -196, 8, 46, '#ffc1d3')}</g><g transform="rotate(${-Math.sin(t * 2) * 5} 30 -150)">${E(30, -200, 18, 62, c)}${E(30, -196, 8, 46, '#ffc1d3')}</g>${C(0, -90, 78, c)}${E(0, -70, 10, 7, '#ff8fb1')}<path d="M0,-63 v10 M-14,-48 q14,10 28,0" fill="none" ${k3}/>` },
  cat: { th: 'แมว', fur: '#f2a65a', draw: (c, t) => `<path d="M-70,-120 L-58,-190 L-20,-150 Z M70,-120 L58,-190 L20,-150 Z" fill="${c}" ${K}/>${C(0, -90, 80, c)}<path d="M-12,-74 L12,-74 L0,-62 Z" fill="#ff8fb1" ${k3}/><path d="M-30,-66 L-80,-74 M-30,-60 L-80,-56 M30,-66 L80,-74 M30,-60 L80,-56" stroke="#2d3436" stroke-width="2.5"/>` },
  elephant: { th: 'ช้าง', fur: '#9aa0a8', draw: (c, t) => `${E(-82, -98, 44, 56, c)}${E(82, -98, 44, 56, c)}${C(0, -100, 78, c)}<path d="M0,-80 C0,-30 ${10 + Math.sin(t * 2) * 10},-10 ${20 + Math.sin(t * 2) * 12},0" fill="none" stroke="#2d3436" stroke-width="34" stroke-linecap="round"/><path d="M0,-80 C0,-30 ${10 + Math.sin(t * 2) * 10},-10 ${20 + Math.sin(t * 2) * 12},0" fill="none" stroke="${c}" stroke-width="26" stroke-linecap="round"/>` },
  monkey: { th: 'ลิง', fur: '#a47148', draw: (c, t) => `${C(-80, -96, 22, '#f4a6a0')}${C(80, -96, 22, '#f4a6a0')}${C(0, -100, 78, c)}<path d="M-46,-96 C-46,-140 46,-140 46,-96 C46,-50 20,-36 0,-36 C-20,-36 -46,-50 -46,-96 Z" fill="#f4a6a0" ${k3}/><circle cx="-6" cy="-70" r="3" fill="#2d3436"/><circle cx="6" cy="-70" r="3" fill="#2d3436"/>` },
  penguin: { th: 'เพนกวิน', fur: '#2d3436', draw: (c, t) => `${C(0, -96, 80, c)}<path d="M-50,-90 C-50,-140 50,-140 50,-90 C50,-40 20,-26 0,-26 C-20,-26 -50,-40 -50,-90 Z" fill="#fafafa"/><path d="M-12,-74 L0,-56 L12,-74 Z" fill="#f5a623" ${k3}/>` },
};
const C = (cx, cy, r, f) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${K}/>`;
const E = (cx, cy, rx, ry, f) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${K}/>`;
function customer(id, t, mood) {
  const c = CUSTOMERS[id], eyes = mood === 'happy' ? `<path d="M-40,-104 q12,-14 24,0 M16,-104 q12,-14 24,0" fill="none" stroke="#2d3436" stroke-width="5" stroke-linecap="round"/>` : `<circle cx="-28" cy="-104" r="8" fill="#2d3436"/><circle cx="28" cy="-104" r="8" fill="#2d3436"/><circle cx="-25" cy="-107" r="3" fill="#fff"/><circle cx="31" cy="-107" r="3" fill="#fff"/>`;
  const mouth = mood === 'happy' ? `<path d="M-20,-46 q20,22 40,0 Z" fill="#c0392b" ${k3}/>` : mood === 'think' ? `<path d="M-12,-44 h24" ${k3}/>` : '';
  return `<g transform="translate(0 ${Math.sin(t * 2) * 3})"><path d="M-90,60 C-90,-10 90,-10 90,60 Z" fill="${c.fur}" ${K}/>${c.draw(c.fur, t)}${eyes}${id === 'penguin' || id === 'elephant' ? '' : mouth}<circle cx="-50" cy="-74" r="10" fill="#ff8fb1" opacity=".5"/><circle cx="50" cy="-74" r="10" fill="#ff8fb1" opacity=".5"/></g>`;
}
const TOPPINGS = {
  strawberry: { th: 'สตรอว์เบอร์รี', draw: () => `<path d="M0,14 C-14,4 -14,-10 0,-10 C14,-10 14,4 0,14 Z" fill="#e53935" ${k3}/><path d="M-8,-10 l4,-6 l4,4 l4,-4 l4,6" fill="#43a047" ${k3}/>${[[-4, -2], [4, -2], [0, 5]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#ffd93d"/>`).join('')}` },
  blueberry: { th: 'บลูเบอร์รี', draw: () => `<circle r="9" fill="#3f51b5" ${k3}/><path d="M-3,-6 l3,3 l3,-3" fill="none" stroke="#1a237e" stroke-width="2"/>` },
  cherry: { th: 'เชอร์รี', draw: () => `<path d="M0,-6 Q6,-24 16,-28" fill="none" stroke="#2e7d32" stroke-width="3"/><circle cy="2" r="10" fill="#c62828" ${k3}/><circle cx="-3" cy="-2" r="3" fill="#fff" opacity=".6"/>` },
  choc: { th: 'ช็อกโกแลต', draw: () => `<path d="M-9,8 Q0,-14 9,8 Z" fill="#5d3a1a" ${k3}/>` },
};
const FROST = [['#ffffff', 'ครีมสีขาว'], ['#ffb3c7', 'ครีมสีชมพู'], ['#fff1a8', 'ครีมสีเหลือง'], ['#b9e6ff', 'ครีมสีฟ้า'], ['#7b4a2a', 'ครีมช็อกโกแลต'], ['#c9f2b0', 'ครีมสีเขียว']];
let order = null, served = 0;
function newOrder() {
  const ids = Object.keys(CUSTOMERS), tops = Object.keys(TOPPINGS);
  const who = ids[(served + Math.floor(Math.random() * 3)) % ids.length];
  const max = served < 2 ? 3 : 5;
  order = { who, frost: FROST[Math.floor(Math.random() * FROST.length)][0], top: tops[Math.floor(Math.random() * tops.length)], n: 1 + Math.floor(Math.random() * max), candles: 1 + Math.floor(Math.random() * max) };
}
const frostName = (c) => FROST.find((f) => f[0] === c)[1];
// spoken in short recorded pieces chained together (a full sentence per combination would be thousands of clips)
const orderParts = (o) => [CUSTOMERS[o.who].th + 'อยากได้เค้ก', frostName(o.frost), 'มี' + TOPPINGS[o.top].th + ' ' + NUM[o.n] + ' ลูก', 'และเทียน ' + NUM[o.candles] + ' เล่ม'];

// ============================================================================
// KITCHEN STATE
// ============================================================================
const STEPS = [['order', '📝'], ['mix', '🥣'], ['stir', '🥄'], ['bake', '🔥'], ['cool', '❄️'], ['frost', '🍦'], ['decor', '🍓'], ['serve', '🎁']];
const ING = [['flour', '🌾', 'แป้ง'], ['egg', '🥚', 'ไข่'], ['milk', '🥛', 'นม'], ['sugar', '🍬', 'น้ำตาล'], ['butter', '🧈', 'เนย']];
let step = 'order', T = 0, k = {};
function resetCake() { k = { added: [], shells: 0, stir: 0, lastA: null, bake: 0, baking: false, out: false, heat: 0, frost: null, cover: [], tops: [], candles: [], lit: false, melt: 0, mood: '' }; }
function setStep(s) {
  step = s;
  $('steps').innerHTML = STEPS.map(([id, e]) => `<span class="${id === s ? 'on' : STEPS.findIndex((x) => x[0] === id) < STEPS.findIndex((x) => x[0] === s) ? 'done' : ''}">${e}</span>`).join('');
  renderCtrls();
  const L = { mix: 'ใส่ของลงในชาม แป้ง ไข่ นม น้ำตาล และเนย', stir: 'ลากนิ้ววนในชาม คนให้เข้ากัน', bake: 'เทแป้งลงพิมพ์ แล้วใส่เตาอบ', cool: 'เค้กยังร้อนอยู่ ต้องรอให้เย็นก่อน ไม่งั้นครีมจะละลาย', frost: 'เลือกสีครีม แล้วลากนิ้วปาดครีมบนเค้ก', decor: 'แตะบนเค้ก ใส่ผลไม้และเทียนให้ครบตามที่สั่ง' };
  if (L[s]) speak(L[s]);
}

// ============================================================================
// CONTROLS
// ============================================================================
let frostSel = FROST[0][0], decorSel = 'top';
function renderCtrls() {
  if (step === 'order') { ctrls.innerHTML = `<button class="big" id="go">👩‍🍳 เริ่มทำเค้ก</button>`; $('go').addEventListener('click', () => { ensureAudio(); buzz(10); resetCake(); setStep('mix'); }); return; }
  if (step === 'mix') {
    ctrls.innerHTML = `<div class="tray">${ING.map(([id, e, th]) => `<button class="it ${k.added.includes(id) ? 'used' : ''}" data-i="${id}"><b>${e}</b>${th}</button>`).join('')}</div>`;
    for (const b of ctrls.querySelectorAll('[data-i]')) b.addEventListener('click', () => { ensureAudio(); addIng(b.dataset.i); });
    return;
  }
  if (step === 'stir') { ctrls.innerHTML = `<div class="tray"><button class="it" disabled><b>🥄</b>ลากวนในชาม</button></div>`; return; }
  if (step === 'bake') {
    ctrls.innerHTML = k.out ? `<button class="big" id="next">✅ ออกจากเตาแล้ว</button>` : k.bake >= 1 ? `<button class="big" id="take">🧤 ใส่ถุงมือ หยิบเค้กออก</button>` : `<button class="big" id="bakeBtn" ${k.baking ? 'disabled' : ''}>${k.baking ? '⏳ กำลังอบ…' : '🔥 ใส่เตาอบ'}</button>`;
    const b = $('bakeBtn'); if (b) b.addEventListener('click', () => { ensureAudio(); buzz(10); k.baking = true; renderCtrls(); speak('อบเค้ก ดูสิ เค้กค่อยๆ ฟูขึ้น'); });
    const tk = $('take'); if (tk) tk.addEventListener('click', () => { ensureAudio(); buzz(10); k.out = true; k.heat = 1; speak('ใส่ถุงมือกันร้อนก่อนหยิบ เตาร้อนมาก'); setTimeout(() => setStep('cool'), 1400); renderCtrls(); });
    return;
  }
  if (step === 'cool') { ctrls.innerHTML = `<button class="big" id="early">🍦 แต่งหน้าเลย!</button>`; $('early').addEventListener('click', () => { ensureAudio(); if (k.heat > 0.15) { k.melt = 1; boop(); buzz([30, 40, 30]); speak('โอ๊ะ เค้กยังร้อน ครีมละลายไหลเยิ้ม รอให้เค้กเย็นก่อนนะ'); } else setStep('frost'); }); return; }
  if (step === 'frost') {
    ctrls.innerHTML = `<div class="tray">${FROST.map(([c, n]) => `<button class="sw ${c === frostSel ? 'on' : ''}" data-c="${c}" style="background:${c}" aria-label="${n}"></button>`).join('')}</div>` + (coverage() > 0.8 ? `<button class="big" id="next">✅ ปาดครีมเสร็จแล้ว</button>` : '');
    for (const b of ctrls.querySelectorAll('[data-c]')) b.addEventListener('click', () => { ensureAudio(); buzz(8); frostSel = b.dataset.c; if (k.frost && k.frost !== frostSel) k.cover = []; k.frost = frostSel; renderCtrls(); speak(frostName(frostSel)); });
    const n = $('next'); if (n) n.addEventListener('click', () => { ensureAudio(); buzz(10); setStep('decor'); });
    return;
  }
  if (step === 'decor') {
    ctrls.innerHTML = `<div class="tray"><button class="it ${decorSel === 'top' ? 'on' : ''}" data-d="top"><b>${{ strawberry: '🍓', blueberry: '🫐', cherry: '🍒', choc: '🍫' }[order.top]}</b>${TOPPINGS[order.top].th} ${k.tops.length}</button><button class="it ${decorSel === 'candle' ? 'on' : ''}" data-d="candle"><b>🕯️</b>เทียน ${k.candles.length}</button><button class="it" data-d="undo"><b>↩️</b>เอาออก</button></div><button class="big" id="serve">🎁 ยกไปเสิร์ฟ</button>`;
    for (const b of ctrls.querySelectorAll('[data-d]')) b.addEventListener('click', () => { ensureAudio(); buzz(8); if (b.dataset.d === 'undo') { (decorSel === 'top' ? k.tops : k.candles).pop(); renderCtrls(); return; } decorSel = b.dataset.d; renderCtrls(); });
    $('serve').addEventListener('click', () => { ensureAudio(); serve(); });
    return;
  }
  if (step === 'serve') { ctrls.innerHTML = `<button class="big" id="nextC">🛎️ ลูกค้าคนต่อไป</button>`; $('nextC').addEventListener('click', () => { ensureAudio(); buzz(8); newOrder(); resetCake(); setStep('order'); speakSeq(orderParts(order)); }); return; }
  ctrls.innerHTML = '';
}
function addIng(id) {
  if (k.added.includes(id)) return;
  k.added.push(id); buzz(10);
  if (id === 'egg') { k.shells++; tone(900, 0.06, 'square', 0.05); setTimeout(() => tone(500, 0.08, 'sine', 0.06), 120); speak('ตอกไข่ใส่ชาม เปลือกไข่ทิ้งลงถังขยะนะ'); }
  else { tone(300, 0.12, 'triangle', 0.08); speak({ flour: 'ใส่แป้ง', milk: 'เทนม', sugar: 'ใส่น้ำตาล', butter: 'ใส่เนยที่ละลายแล้ว' }[id]); }
  renderCtrls();
  if (k.added.length === ING.length) setTimeout(() => setStep('stir'), 1200);
}
const countWord = (n) => n <= 5 ? NUM[n] : n <= 12 ? String(n) : 'ตอนนี้มีเยอะเกินไปแล้ว';
const haveLine = (n, unit) => n > 5 ? 'ตอนนี้มีเยอะเกินไปแล้ว' : 'ตอนนี้มี ' + NUM[n] + ' ' + unit;
function coverage() { return Math.min(1, k.cover.length / 22); }
function serve() {
  const okN = k.tops.length === order.n, okC = k.candles.length === order.candles, okF = k.frost === order.frost;
  if (okN && okC && okF) {
    k.mood = 'happy'; k.lit = true; served++; setStep('serve');
    cheer(); celebrate(90); buzz([30, 20, 40]);
    speak('สุขสันต์วันเกิด ' + CUSTOMERS[order.who].th + 'ชอบมากเลย ขอบคุณนะ');
    return;
  }
  k.mood = 'think'; boop(); buzz(25);
  if (!okF) speak('อยากได้' + frostName(order.frost) + 'จ้า');
  else if (!okN) speakSeq(['อยากได้' + TOPPINGS[order.top].th + ' ' + NUM[order.n] + ' ลูก', haveLine(k.tops.length, 'ลูก')]);
  else speakSeq(['อยากได้เทียน ' + NUM[order.candles] + ' เล่ม', haveLine(k.candles.length, 'เล่ม')]);
  setTimeout(() => { k.mood = ''; }, 2500);
}

// ============================================================================
// SCENE
// ============================================================================
function kitchen() {
  return `<rect width="1000" height="640" fill="#fff3e6"/>${[...Array(10)].map((_, i) => `<rect x="${i * 100}" y="0" width="50" height="420" fill="#ffe6ee"/>`).join('')}

let AC = null;

/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');

    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
