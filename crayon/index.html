<style>
  :root {
    --sky-3: #b5e8ff; --grass-1: #7ed957;
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --paper: #fffef9; --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    height: 100dvh; overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 8%, #fff9c4 0%, transparent 48%),
      radial-gradient(ellipse at 86% 14%, #ffcfd2 0%, transparent 42%),
      linear-gradient(180deg, var(--sky-3) 0%, #d9f3c9 65%, var(--grass-1) 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }

  .screen { display: none; height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---- Home / action buttons (float) ---- */
  .fab {
    position: fixed; z-index: 60;
    width: 50px; height: 50px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; color: var(--ink);
    background: var(--paper); border: 4px solid var(--card-border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: transform .12s, box-shadow .12s, opacity .12s;
    cursor: pointer; padding: 0; font-family: inherit;
  }
  .fab:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .fab:disabled { opacity: .35; box-shadow: none; }
  .home { top: calc(10px + env(safe-area-inset-top)); left: 12px; }
  .actions {
    position: fixed; z-index: 60;
    top: calc(10px + env(safe-area-inset-top)); right: 12px;
    display: flex; gap: 8px;
  }
  .actions .fab { position: static; }

  /* ============================ SELECT SCREEN ============================ */
  #selectScreen { overflow-y: auto; display: none; }
  #selectScreen.active { display: block; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { text-align: center; padding: 14px 10px 6px; }
  .hero h1 {
    font-family: 'Itim', cursive; font-size: clamp(38px, 8vw, 60px);
    margin: 0; color: var(--brand-dark);
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
  }
  .hero p { font-size: clamp(15px, 3.2vw, 20px); margin: 8px 0 0; color: #555; font-weight: 500; }

  .lgrid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin: 22px 0 0;
  }
  @media (min-width: 720px) { .lgrid { grid-template-columns: repeat(3, 1fr); } }
  .lcard {
    background: var(--card); border: 4px solid var(--card-border);
    border-radius: 22px; padding: 12px 12px 10px; text-align: center;
    cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative; overflow: hidden;
  }
  .lcard:active { transform: scale(0.96) translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.07); }
  .lcard svg.preview { width: 100%; height: 150px; display: block; margin: 0 auto 6px; }
  .lcard svg.preview * { stroke: var(--brand-dark); stroke-width: 7; fill: #fff; }
  .lcard .ltitle {
    font-family: 'Itim', cursive; font-size: clamp(16px, 4.3vw, 22px);
    line-height: 1.15; color: var(--brand-dark); text-shadow: 2px 2px 0 #fff;
    overflow-wrap: anywhere;
  }
  .lcard .done-star {
    position: absolute; top: 6px; right: 8px; font-size: 22px;
    filter: drop-shadow(0 1px 0 rgba(0,0,0,0.15));
  }
  .lgrid .cat-header {
    grid-column: 1 / -1;
    font-family: 'Itim', cursive; font-size: 22px;
    color: var(--brand-dark); text-shadow: 2px 2px 0 #fff;
    margin: 16px 4px 0; letter-spacing: 0.5px;
  }
  .lgrid .cat-header:first-child { margin-top: 4px; }

  /* ============================ GAME SCREEN ============================ */
  #gameScreen { padding: env(safe-area-inset-top) 0 0; }
  .stage {
    flex: 1 1 auto; min-height: 0;
    display: grid; place-items: center;
    padding: 6px;
  }
  .paper {
    aspect-ratio: 800 / 1200;
    height: 100%; max-width: 100%; width: auto;
    background: var(--brand);
    border-radius: 30px;
    padding: 11px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.14);
  }
  .sheet {
    position: relative; width: 100%; height: 100%;
    background: #fff; border-radius: 20px; overflow: hidden;
    touch-action: none;
  }
  .sheet canvas, .sheet svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .sheet svg { pointer-events: none; }

  /* ---- Crayon cursor ---- */
  #crayon {
    position: fixed; left: 0; top: 0; z-index: 55;
    width: 44px; height: 100px;
    pointer-events: none; opacity: 0;
    transition: opacity .12s;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,0.28));
    will-change: transform;
  }
  #crayon.show { opacity: 1; }

  /* ---- Palette ---- */
  .palette {
    flex: 0 0 auto;
    display: flex; justify-content: center; align-items: center; flex-wrap: wrap;
    gap: 9px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .swatch {
    width: 50px; height: 50px; border-radius: 50%;
    border: 4px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    cursor: pointer; transition: transform .12s, box-shadow .12s; padding: 0;
  }
  .swatch:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .swatch.active { border-color: var(--gold); transform: scale(1.14); box-shadow: 0 5px 0 rgba(0,0,0,0.18), 0 0 0 4px var(--gold); }
  .swatch.eraser {
    background: linear-gradient(45deg, #fff 25%, #ddd 25%, #ddd 50%, #fff 50%, #fff 75%, #ddd 75%);
    background-size: 14px 14px; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
  }
  @media (max-width: 420px) { .swatch { width: 42px; height: 42px; border-width: 3px; } .palette { gap: 7px; } }
  @media (min-width: 768px) { .swatch { width: 58px; height: 58px; } }

  /* ---- Overlay message + confetti ---- */
  .overlay {
    position: fixed; inset: 0; display: none; z-index: 100;
    align-items: center; justify-content: center; pointer-events: none;
    font-family: 'Itim', cursive; color: #fff; text-align: center;
  }
  .overlay.shown { display: flex; }
  .overlay .msg {
    background: var(--gold); color: var(--ink);
    border: 4px solid #fff; border-radius: 30px;
    padding: 24px 44px; font-size: clamp(34px, 6.5vw, 60px); line-height: 1.15;
    box-shadow: 0 8px 0 rgba(0,0,0,0.16);
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,0.12);
    animation: pop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-width: 90vw;
  }
  @keyframes pop { 0% { transform: scale(.4) rotate(-6deg); opacity: 0; } 60% { transform: scale(1.1) rotate(2deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>

function line(id, d, sw) { return { id: id, shape: 'path', d: d, noClick: true, strokeWidth: sw || 6 }; }

  var R = function (id, x, y, w, h, rx, opt) { return rect(pfx + id, ox + x * s, oy + y * s, w * s, h * s, (rx || 0) * s, opt); };
  var C = function (id, cx, cy, r, opt) { return circ(pfx + id, ox + cx * s, oy + cy * s, r * s, opt); };

    line(pfx + 'coup', 'M' + (ox + 286 * s) + ',' + (oy + 108 * s) + ' h' + (26 * s), 8)
  ];
}

// ============================================================================
// AUDIO — subtle crayon scritch + blips (Web Audio, unlocked on first gesture)
// ============================================================================
var AC = null, noiseBuf = null;
function ensureAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    var len = Math.floor(AC.sampleRate * 0.3);
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function scritch() {
  if (!AC) return;
  try {
    var src = AC.createBufferSource(); src.buffer = noiseBuf;
    var f = AC.createBiquadFilter(); f.type = 'bandpass';
    f.frequency.value = 1500 + Math.random() * 900; f.Q.value = 0.8;
    var g = AC.createGain(); var t = AC.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.05, t + 0.02);
    g.gain.linearRampToValueAtTime(0, t + 0.12);
    src.connect(f); f.connect(g); g.connect(AC.destination);
    src.start(t); src.stop(t + 0.14);
  } catch (e) {}
}
function blip(freq) {
  if (!AC) return;
  try {
    var o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = 'sine'; o.frequency.value = freq || 660;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.16, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + 0.2);
  } catch (e) {}
}
function cheer() { [523, 659, 784, 1047].forEach(function (f, i) { setTimeout(function () { blip(f); }, i * 110); }); }

// ============================================================================
// PATH2D + SVG builders
// ============================================================================
function buildPath2D(r) {
  var p = new Path2D();
  if (r.shape === 'circle') { p.arc(r.cx, r.cy, r.r, 0, Math.PI * 2); }
  else if (r.shape === 'ellipse') { p.ellipse(r.cx, r.cy, r.rx, r.ry, 0, 0, Math.PI * 2); }
  else if (r.shape === 'rect') {
    if (r.rx && p.roundRect) { p.roundRect(r.x, r.y, r.w, r.h, r.rx); }
    else { p.rect(r.x, r.y, r.w, r.h); }
  } else { p = new Path2D(r.d); }
  return p;
}
function createShapeEl(r) {
  var ns = 'http://www.w3.org/2000/svg', el;
  if (r.shape === 'circle') { el = document.createElementNS(ns, 'circle'); el.setAttribute('cx', r.cx); el.setAttribute('cy', r.cy); el.setAttribute('r', r.r); }
  else if (r.shape === 'ellipse') { el = document.createElementNS(ns, 'ellipse'); el.setAttribute('cx', r.cx); el.setAttribute('cy', r.cy); el.setAttribute('rx', r.rx); el.setAttribute('ry', r.ry); }
  else if (r.shape === 'rect') { el = document.createElementNS(ns, 'rect'); el.setAttribute('x', r.x); el.setAttribute('y', r.y); el.setAttribute('width', r.w); el.setAttribute('height', r.h); if (r.rx) el.setAttribute('rx', r.rx); }
  else { el = document.createElementNS(ns, 'path'); el.setAttribute('d', r.d); }
  return el;
}
function outlineEl(r) {
  var el = createShapeEl(r);
  if (r.noClick && r.fill) {
    el.setAttribute('fill', r.fill); el.setAttribute('stroke', 'none');
  } else {
    el.setAttribute('fill', 'none');
    el.setAttribute('stroke', '#2d3436');
    el.setAttribute('stroke-width', r.strokeWidth || 6);
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('stroke-linecap', 'round');
  }
  return el;
}

// Build clean line-art: each shape's outline is hidden where a shape drawn on top
// of it (a later colorable region) covers it — proper hidden-line removal, so the
// picture reads like a tidy colouring page instead of overlapping full outlines.
var NS_SVG = 'http://www.w3.org/2000/svg';
function buildLineArt(target, regions, vbw, vbh, idPrefix) {
  target.innerHTML = '';
  var defs = document.createElementNS(NS_SVG, 'defs');
  target.appendChild(defs);
  regions.forEach(function (r, idx) {
    var el = outlineEl(r);
    if (!r.noClick) {
      var occ = [];
      for (var j = idx + 1; j < regions.length; j++) { if (!regions[j].noClick) occ.push(regions[j]); }
      if (occ.length) {
        var mid = 'occ_' + idPrefix + '_' + idx;
        var mask = document.createElementNS(NS_SVG, 'mask');
        mask.setAttribute('id', mid);
        mask.setAttribute('maskUnits', 'userSpaceOnUse');
        mask.setAttribute('x', 0); mask.setAttribute('y', 0);
        mask.setAttribute('width', vbw); mask.setAttribute('height', vbh);
        var bg = document.createElementNS(NS_SVG, 'rect');   // show everything by default
        bg.setAttribute('x', 0); bg.setAttribute('y', 0);
        bg.setAttribute('width', vbw); bg.setAttribute('height', vbh);
        bg.setAttribute('fill', '#fff');
        mask.appendChild(bg);
        occ.forEach(function (o) {                            // knock out the covered parts
          var s = createShapeEl(o);
          s.setAttribute('fill', '#000'); s.setAttribute('stroke', 'none');
          mask.appendChild(s);
        });
        defs.appendChild(mask);
        el.setAttribute('mask', 'url(#' + mid + ')');
      }
    }
    target.appendChild(el);
  });
}

// ============================================================================
// OPEN A SCENE
// ============================================================================
function openScene(sc) {
  state.scene = sc;
  state.touched = {};
  resetUndo();
  state.celebrated = false;
  updateUndoBtn();

  // Per-scene viewBox (portrait 800x1200 by default, landscape 1200x800, ...).
  VBW = sc.w || 800; VBH = sc.h || 1200;
  state.brushR = 34 * (VBW / 800);
  state.eraseR = 50 * (VBW / 800);
  linesSvg.setAttribute('viewBox', '0 0 ' + VBW + ' ' + VBH);
  paperEl.style.aspectRatio = VBW + ' / ' + VBH;

  // Prepare geometry: own Path2D + an even-odd clip = self minus everything on top.
  var colorable = sc.regions.filter(function (r) { return !r.noClick; });
  colorable.forEach(function (r, i) {
    r._p2d = buildPath2D(r);
    var clip = new Path2D();
    clip.addPath(r._p2d);
    for (var j = i + 1; j < colorable.length; j++) { clip.addPath(buildPath2D(colorable[j])); }
    r._clip = clip;
    r._touched = false;
  });
  state._colorable = colorable;

  // Build the black line-art overlay (with hidden-line removal so it looks tidy).
  buildLineArt(linesSvg, sc.regions, VBW, VBH, 'g');

  selectScreen.classList.remove('active');
  gameScreen.classList.add('active');
  // size the canvas after layout settles
  requestAnimationFrame(function () { fitCanvas(true); });
}

// ============================================================================
// CANVAS SIZING (preserves art on resize)
// ============================================================================
function fitCanvas(fresh) {
  var rect = sheet.getBoundingClientRect();
  var w = Math.max(1, Math.round(rect.width));
  var h = Math.max(1, Math.round(rect.height));
  var dpr = window.devicePixelRatio || 1;
  var snap = null;
  if (!fresh && canvas.width) {
    snap = document.createElement('canvas');
    snap.width = canvas.width; snap.height = canvas.height;
    snap.getContext('2d').drawImage(canvas, 0, 0);
  }
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  state.scale = canvas.width / VBW;
  ctx.setTransform(state.scale, 0, 0, canvas.height / VBH, 0, 0);
  if (snap) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(snap, 0, 0, snap.width, snap.height, 0, 0, canvas.width, canvas.height);
    ctx.restore();
  } else {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  resetUndo(); updateUndoBtn();
}

// ============================================================================
// DRAWING
// ============================================================================
function vbFromEvent(e) {
  var rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) / rect.width * VBW,
    y: (e.clientY - rect.top) / rect.height * VBH
  };
}
function deviceXY(vx, vy) { return [vx * (canvas.width / VBW), vy * (canvas.height / VBH)]; }

function hitRegion(vx, vy) {
  var d = deviceXY(vx, vy);
  var found = null;
  var list = state._colorable;
  for (var i = 0; i < list.length; i++) {
    if (ctx.isPointInPath(list[i]._p2d, d[0], d[1])) found = list[i];
  }
  return found;
}

function stampAt(vx, vy) {
  var R = (state.color === ERASE) ? state.eraseR : state.brushR;
  var i, a, dd;
  if (state.color === ERASE) {
    ctx.globalCompositeOperation = 'destination-out';
    for (i = 0; i < 3; i++) {
      a = Math.random() * 6.283; dd = Math.random() * R * 0.4;
      ctx.globalAlpha = 0.65;
      ctx.beginPath();
      ctx.arc(vx + Math.cos(a) * dd, vy + Math.sin(a) * dd, R * (0.5 + Math.random() * 0.4), 0, 6.283);
      ctx.fillStyle = '#000'; ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  } else {
    ctx.fillStyle = state.color;
    for (i = 0; i < 3; i++) {
      a = Math.random() * 6.283; dd = Math.random() * R * 0.42;
      ctx.globalAlpha = 0.09 + Math.random() * 0.11;
      ctx.beginPath();
      ctx.arc(vx + Math.cos(a) * dd, vy + Math.sin(a) * dd, R * (0.48 + Math.random() * 0.4), 0, 6.283);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function strokeTo(vx, vy) {
  var dx = vx - state.lastX, dy = vy - state.lastY;
  var dist = Math.hypot(dx, dy);
  var step = state.brushR * 0.3;
  var n = Math.max(1, Math.floor(dist / step));
  for (var k = 1; k <= n; k++) {
    stampAt(state.lastX + dx * (k / n), state.lastY + dy * (k / n));
  }
  state.lastX = vx; state.lastY = vy;
}

// Undo history (compressed): each entry is a PNG blob-url of the canvas plus the
// touched-region map. toBlob() encodes off the critical path so capturing a step
// never blocks colouring, and 50 steps stay cheap — enough to rewind to blank.
var undoSeq = 0;
function pushUndo() {
  var entry = { url: null, dead: false, touched: Object.assign({}, state.touched) };
  state.undo.push(entry);
  while (state.undo.length > 50) {
    var old = state.undo.shift();
    old.dead = true;
    if (old.url) URL.revokeObjectURL(old.url);
  }
  updateUndoBtn();
  try {
    canvas.toBlob(function (blob) {
      if (!blob || entry.dead) return;
      entry.url = URL.createObjectURL(blob);
    }, 'image/png');
  } catch (e) {}
}
function drawUndoURL(url, revoke) {
  var my = ++undoSeq;
  var img = new Image();
  img.onload = function () {
    if (my === undoSeq) {
      ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }

  };
  img.src = url;
}
function restoreUndo(entry) {                   // wait patiently for the blob to encode

    if (entry.url) { drawUndoURL(entry.url, true); return; }
    if (tries++ > 300) return;
    setTimeout(go, 16);
  })();
}
function resetUndo() {
  for (var i = 0; i < state.undo.length; i++) {
    state.undo[i].dead = true;
    if (state.undo[i].url) URL.revokeObjectURL(state.undo[i].url);
  }
  state.undo = [];
}

// ---- Pointer handlers ----
var lastScritch = 0;
sheet.addEventListener('pointerdown', function (e) {
  if (!state.scene) return;
  e.preventDefault();
  if (state.drawing) return;          // single active stroke — ignore extra fingers
  ensureAudio();
  var vb = vbFromEvent(e);
  var r = hitRegion(vb.x, vb.y);
  if (!r) return;
  pushUndo();
  state.drawing = true;
  state.pointerId = e.pointerId;
  state.region = r;
  state.lastX = vb.x; state.lastY = vb.y;
  try { sheet.setPointerCapture(e.pointerId); } catch (err) {}
  ctx.save();
  ctx.clip(r._clip, 'evenodd');
  stampAt(vb.x, vb.y);
  markTouched(r);
  showCrayon(e.clientX, e.clientY);
  scritch(); lastScritch = e.timeStamp || 0;
  buzz(6);
});

sheet.addEventListener('pointermove', function (e) {
  if (state.drawing) {
    if (e.pointerId !== state.pointerId) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var k = 0; k < evs.length; k++) {
      var vb = vbFromEvent(evs[k]);
      strokeTo(vb.x, vb.y);
    }
    moveCrayon(e.clientX, e.clientY);
    var ts = e.timeStamp || 0;
    if (ts - lastScritch > 130) { scritch(); lastScritch = ts; }
  }
});

function endStroke(e) {
  if (!state.drawing) return;
  if (e && e.pointerId != null && state.pointerId != null && e.pointerId !== state.pointerId) return;
  ctx.restore();               // drop the region clip
  state.drawing = false;
  state.pointerId = null;
  state.region = null;
  hideCrayon();
  checkComplete();
}
sheet.addEventListener('pointerup', endStroke);
sheet.addEventListener('pointercancel', endStroke);
sheet.addEventListener('lostpointercapture', endStroke);

function markTouched(r) {
  if (state.touched[r.id]) return;
  state.touched[r.id] = true;
  r._touched = true;
}

function checkComplete() {
  if (state.celebrated) return;
  var all = state._colorable.every(function (r) { return state.touched[r.id]; });
  if (!all) return;
  state.celebrated = true;
  saveProgress();
  celebrate(150);
  cheer();
  buzz([40, 30, 60]);
  flashOverlay('สวยจังเลย! 🌈', 1700);
}

// ============================================================================
// CRAYON CURSOR
// ============================================================================
function darken(hex, f) {
  if (hex[0] !== '#') return hex;
  var n = parseInt(hex.slice(1), 16);
  var r = Math.round(((n >> 16) & 255) * f);
  var g = Math.round(((n >> 8) & 255) * f);
  var b = Math.round((n & 255) * f);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
function tintCrayon(col) {
  var body = col === ERASE ? '#e6e6e6' : col;
  var cap = col === ERASE ? '#bdbdbd' : darken(col, 0.7);
  $('cr-body').setAttribute('fill', body);
  $('cr-cap').setAttribute('fill', cap);
}
function placeCrayon(x, y) {
  crayon.style.transformOrigin = '22px 99px';
  crayon.style.transform = 'translate(' + (x - 22) + 'px,' + (y - 99) + 'px) rotate(-24deg)';
}
function showCrayon(x, y) { placeCrayon(x, y); crayon.classList.add('show'); }
function moveCrayon(x, y) { placeCrayon(x, y); }
function hideCrayon() { crayon.classList.remove('show'); }

// ============================================================================
// PALETTE
// ============================================================================
function renderPalette() {
  palette.innerHTML = '';
  COLORS.forEach(function (c, i) {
    var sw = document.createElement('button');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = c;
    sw.setAttribute('aria-label', 'สี');
    sw.addEventListener('click', function () { selectColor(c, sw); });
    palette.appendChild(sw);
  });
  var er = document.createElement('button');
  er.className = 'swatch eraser';
  er.textContent = '🧽';
  er.setAttribute('aria-label', 'ยางลบ');
  er.addEventListener('click', function () { selectColor(ERASE, er); });
  palette.appendChild(er);
  tintCrayon(state.color);
}
function selectColor(c, el) {
  state.color = c;
  var sws = palette.querySelectorAll('.swatch');
  for (var i = 0; i < sws.length; i++) sws[i].classList.remove('active');
  el.classList.add('active');
  tintCrayon(c);
  ensureAudio(); blip(c === ERASE ? 380 : 720); buzz(6);
}

// ============================================================================
// BUTTONS
// ============================================================================
$('undoBtn').addEventListener('click', function () {
  var last = state.undo.pop();
  if (!last) { updateUndoBtn(); return; }
  state.touched = last.touched || {};
  state.celebrated = false;
  restoreUndo(last);
  updateUndoBtn(); buzz(10);
});
$('clearBtn').addEventListener('click', function () {
  pushUndo();
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.restore();
  state.touched = {}; state.celebrated = false;
  buzz(18);
});
$('saveBtn').addEventListener('click', savePng);
$('listBtn').addEventListener('click', function () {
  overlay.classList.remove('shown'); overlay.innerHTML = '';
  gameScreen.classList.remove('active');
  renderSelect();
  selectScreen.classList.add('active');
});

function updateUndoBtn() { $('undoBtn').disabled = state.undo.length === 0; }

// Save = flatten line-art SVG over the painted canvas into a PNG.
function savePng() {
  if (!state.scene) return;
  var out = document.createElement('canvas');
  out.width = VBW * 2; out.height = VBH * 2;
  var octx = out.getContext('2d');
  octx.fillStyle = '#ffffff'; octx.fillRect(0, 0, out.width, out.height);
  octx.drawImage(canvas, 0, 0, out.width, out.height);   // painted colors
  var clone = linesSvg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  var xml = new XMLSerializer().serializeToString(clone);
  var svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  var url = URL.createObjectURL(svgBlob);
  var img = new Image();
  img.onload = function () {
    octx.drawImage(img, 0, 0, out.width, out.height);
    URL.revokeObjectURL(url);
    exportImage(out, 'ระบายสี-' + state.scene.id + '.png');
  };
  img.onerror = function () { flashOverlay('บันทึกไม่ได้ 😢', 1200); URL.revokeObjectURL(url); };
  img.src = url;
}
// Save that works on iPad: hand the PNG to the share sheet ("Save Image" → Photos),
// falling back to a direct download where sharing files isn't supported.
function exportImage(cvs, filename) {
  var url;
  try { url = cvs.toDataURL('image/png'); } catch (e) { flashOverlay('บันทึกไม่ได้ 😢', 1200); return; }
  var file = null;
  try {
    var arr = url.split(','), mime = (arr[0].match(/:(.*?);/) || [])[1] || 'image/png';
    var bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    file = new File([u8], filename, { type: mime });
  } catch (e) {}
  function done() { flashOverlay('บันทึกแล้ว! 💾', 1100); buzz([30, 20, 30]); }
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    navigator.share({ files: [file] }).then(done, function (err) {
      if (err && err.name === 'AbortError') return;
      dlURL(url, filename); done();
    });
    return;
  }
  dlURL(url, filename); done();
}
function dlURL(url, filename) {
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

// ============================================================================
// OVERLAY + CONFETTI + PROGRESS
// ============================================================================
function flashOverlay(text, ms) {
  overlay.classList.add('shown');
  overlay.innerHTML = '<div class="msg">' + text + '</div>';
  setTimeout(function () { overlay.classList.remove('shown'); overlay.innerHTML = ''; }, ms);
}
function celebrate(n) {
  var colors = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#ff914d', '#b388ff'];
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.7 + 's';
    c.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    (function (el) { setTimeout(function () { el.remove(); }, 5000); })(c);
  }
}
function saveProgress() {
  if (!state.scene) return;
  var p = loadProgress();
  p[state.scene.id] = (p[state.scene.id] || 0) + 1;
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); } catch (e) {}
}

// ============================================================================
// EVENTS / INIT
// ============================================================================
var resizeT = 0;
window.addEventListener('resize', function () {
  if (!gameScreen.classList.contains('active')) return;
  clearTimeout(resizeT); resizeT = setTimeout(function () { fitCanvas(false); }, 150);
});
window.addEventListener('orientationchange', function () {
  if (!gameScreen.classList.contains('active')) return;
  clearTimeout(resizeT); resizeT = setTimeout(function () { fitCanvas(false); }, 250);
});
var lastTouchEnd = 0;
document.addEventListener('touchend', function (e) {
  var now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });
document.addEventListener('contextmenu', function (e) { e.preventDefault(); });

renderPalette();
renderSelect();
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
