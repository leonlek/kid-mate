<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🐄 ฟาร์มน้อย — คิดส์เล่น</title>
<meta name="description" content="ฟาร์มน้อย ให้อาหารวัว รีดนม เก็บไข่ไก่ หมูกลิ้งโคลน ตัดขนแกะ แพะปีนหิน เป็ดมุดน้ำ สำหรับเด็กเล็ก">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ฟาร์มน้อย">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .view { position: relative; background: #fffef9; border: 4px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .view svg { display: block; width: 100%; height: auto; touch-action: none; }
  .acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .act {
    min-height: 80px; border-radius: 22px; border: 3px solid var(--card-border); background: #fff; cursor: pointer;
    font-family: 'Mitr', sans-serif; font-size: 17px; font-weight: 600; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px;
  }
  .act b { font-size: 32px; line-height: 1; }
  .act.on { background: var(--gold); border-color: #e0b400; }
  .act:active { transform: scale(.95); }
  .fact { margin-top: 12px; background: #fff; border: 4px solid var(--card-border); border-radius: 24px; padding: 12px 16px; font-size: 18px; line-height: 1.45; box-shadow: 0 5px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .fact::before { content: '💡 '; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>🐄 ฟาร์มน้อย</h1></header>
  <div class="view"><svg id="scene" viewBox="0 0 1000 640" aria-label="ฟาร์ม"></svg></div>
  <div class="acts" id="acts"></div>
  <div class="fact" id="fact"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene');
const K = 'stroke="#2d3436" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const k3 = 'stroke="#2d3436" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const P = (d, f, x = '') => `<path d="${d}" fill="${f}" ${K} ${x}/>`;
const E = (cx, cy, rx, ry, f, x = '') => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${K} ${x}/>`;
const C = (cx, cy, r, f, x = '') => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${K} ${x}/>`;
const lerp = (a, b, u) => a + (b - a) * u, clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function svgPt(ev) { const p = scene.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(scene.getScreenCTM().inverse()); }
const blinkAt = (t, o = 0) => ((t + o) % 4.1) < 0.13;
// round pupil (cow, pig, duck, hen) vs horizontal slit (goat, sheep — true for both)
function eyeR(x, y, r, t) { return blinkAt(t) ? `<path d="M${x - r},${y} q${r},${r * 0.6} ${2 * r},0" fill="none" ${k3}/>` : `<circle cx="${x}" cy="${y}" r="${r}" fill="#2d3436"/><circle cx="${x + r * 0.35}" cy="${y - r * 0.35}" r="${r * 0.35}" fill="#fff"/>`; }
function eyeSlit(x, y, r, t) { return blinkAt(t, 1) ? `<path d="M${x - r},${y} q${r},${r * 0.6} ${2 * r},0" fill="none" ${k3}/>` : `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * 0.8}" fill="#e6c25a" ${k3}/><rect x="${x - r * 0.75}" y="${y - r * 0.18}" width="${r * 1.5}" height="${r * 0.36}" rx="${r * 0.18}" fill="#2d3436"/>`; }

// ============================================================================
// ANIMALS — draw(s) at close-up scale; s = per-animal state.
// ============================================================================
const A = {
  cow: { th: 'วัว', sound: 'มอ', voice: 'วัวร้อง มอ',
    fact: 'วัวนมพันธุ์ขาวดำ ให้นมหลังจากออกลูก ลูกวัวได้ดื่มนมแม่ด้วย วัวกลืนหญ้าแล้วสำรอกขึ้นมาเคี้ยวใหม่ เรียกว่าเคี้ยวเอื้อง',
    acts: [['grass', '🌾', 'ให้หญ้า'], ['milk', '🥛', 'รีดนม'], ['brush', '🪮', 'แปรงขน']] },
  hen: { th: 'ไก่', sound: 'กุ๊ก กุ๊ก', voice: 'กุ๊ก กุ๊ก กุ๊ก',
    fact: 'แม่ไก่ไข่ได้วันละไม่เกิน 1 ฟอง ไก่ตัวผู้ไม่ไข่ แต่มีหงอนใหญ่ หางยาวโค้ง และขันตอนเช้า',
    acts: [['corn', '🌽', 'โปรยข้าวโพด'], ['egg', '🥚', 'เก็บไข่'], ['dawn', '🌅', 'เช้าแล้ว']] },
  pig: { th: 'หมู', sound: 'อู๊ด อู๊ด', voice: 'อู๊ด อู๊ด',
    fact: 'หมูเหงื่อออกน้อยมาก จึงกลิ้งโคลนเพื่อคลายร้อน และกันแดดเผา หมูจมูกไวมาก ใช้จมูกดุนดินหาอาหาร',
    acts: [['veg', '🥬', 'ให้ผัก'], ['mud', '🟫', 'เล่นโคลน'], ['shower', '🚿', 'อาบน้ำ']] },
  sheep: { th: 'แกะ', sound: 'แบ๊ะ', voice: 'แกะร้อง แบ๊ะ',
    fact: 'ขนแกะยาวขึ้นเรื่อยๆ ต้องตัดปีละครั้ง ไม่เจ็บเหมือนตัดผม เอาไปทำไหมพรมและเสื้อกันหนาว แกะมีม่านตาเป็นขีดแนวนอน',
    acts: [['shear', '✂️', 'ตัดขน'], ['grass', '🌾', 'ให้หญ้า'], ['regrow', '⏩', 'ผ่านไป 1 ปี']] },
  goat: { th: 'แพะ', sound: 'แบะ แบะ', voice: 'แพะร้อง แบะ แบะ',
    fact: 'แพะปีนเก่งมาก ชอบกินใบไม้และยอดไม้ แพะไม่ได้กินกระป๋องอย่างในการ์ตูน แค่ชอบแทะสำรวจของ ม่านตาแพะเป็นขีดแนวนอน ช่วยมองได้กว้าง',
    acts: [['leaves', '🌿', 'ให้ใบไม้'], ['climb', '🪨', 'ปีนหิน'], ['pet', '🤚', 'ลูบหัว']] },
  duck: { th: 'เป็ด', sound: 'ก๊าบ ก๊าบ', voice: 'ก๊าบ ก๊าบ',
    fact: 'เป็ดมีพังผืดระหว่างนิ้ว ช่วยพายน้ำ ขนมีน้ำมันกันน้ำ เป็ดมุดหัวลงน้ำ ก้นชี้ฟ้า เพื่อหากินใต้น้ำ ขนมปังไม่ดีต่อเป็ด ควรให้ผักหรืออาหารเป็ด',
    acts: [['peas', '🫛', 'ให้ผักกับถั่ว'], ['bread', '🍞', 'ขนมปัง'], ['dive', '💦', 'มุดน้ำ']] },
};
const ORDER = ['cow', 'hen', 'pig', 'sheep', 'goat', 'duck'];
const HOME = { cow: [210, 420, 0.42], hen: [470, 520, 0.36], pig: [700, 520, 0.38], sheep: [850, 400, 0.36], goat: [600, 330, 0.34], duck: [120, 560, 0.32] };

// shared state per animal
const S = { t: 0, chew: 0, eat: 0, milk: 0, milking: 0, brush: 0, eggs: [], laid: 0, crow: 0, corn: [], peck: 0, mud: 0, wash: 0, roll: 0,
  wool: 1, shear: [], climb: 0, pet: 0, dive: 0, bread: 0, peas: 0 };

function drawCow(s, far) {
  const t = s.t, jaw = s.chew > 0 ? Math.sin(t * 6) * 5 : 0, tail = Math.sin(t * 1.3) * 10, head = s.eat > 0 ? 70 : 0;
  let g = `<path d="M250,300 Q220,360 228,${430 + tail}" fill="none" stroke="#2d3436" stroke-width="7"/><path d="M220,${425 + tail} l8,26 l8,-26 Z" fill="#2d3436"/>`;
  for (const [x, far2] of [[300, 1], [560, 1], [330, 0], [590, 0]]) g += P(`M${x - 17},420 L${x + 17},420 L${x + 14},560 L${x - 14},560 Z`, far2 ? '#e6e6e6' : '#fff') + `<path d="M${x - 15},552 h30 l0,10 h-30 Z M${x},552 v10" fill="#3d3d3d" stroke="#2d3436" stroke-width="2"/>`;
  g += P('M250,330 C250,280 330,262 430,264 C540,266 640,270 650,330 C660,410 610,440 450,442 C320,444 250,420 250,330 Z', '#fafafa');
  g += `<clipPath id="cowB"><path d="M250,330 C250,280 330,262 430,264 C540,266 640,270 650,330 C660,410 610,440 450,442 C320,444 250,420 250,330 Z"/></clipPath><g clip-path="url(#cowB)"><path d="M300,260 C340,300 330,360 290,380 C260,350 260,300 300,260 Z M420,262 C460,300 520,300 540,262 Z M470,360 C520,330 600,350 600,420 C560,450 480,440 470,360 Z" fill="#2d3436"/></g>`;
  // udder with 4 teats (pink), visible under the belly
  const sq = s.milking > 0 ? Math.sin(t * 14) * 4 : 0;
  g += P('M400,430 C400,470 470,474 476,436 Z', '#f6b7c3') + [408, 426, 450, 466].map((x, i) => P(`M${x - 5},458 L${x + 5},458 L${x + 3},${474 + (i % 2 ? sq : -sq)} L${x - 3},${474 + (i % 2 ? sq : -sq)} Z`, '#f29fb0')).join('');
  // head (lowers to graze)
  let h = P('M620,300 C620,260 660,246 690,256 C720,266 728,300 722,340 C716,380 690,394 670,390 C640,380 622,340 620,300 Z', '#fafafa');
  h += `<path d="M640,262 C660,290 690,286 704,262 Z" fill="#2d3436"/>`;
  h += P('M622,286 L590,272 L610,300 Z', '#fafafa') + P('M716,280 L746,266 L730,298 Z', '#fafafa') + `<rect x="590" y="280" width="12" height="10" rx="2" fill="#ffd93d" stroke="#2d3436" stroke-width="2"/>`;
  h += eyeR(650, 304, 6, t) + eyeR(700, 304, 6, t);
  h += `<g transform="translate(${jaw} 0)">${P('M640,350 C640,330 712,330 712,352 C712,384 640,384 640,350 Z', '#f6b7c3')}<ellipse cx="660" cy="354" rx="5" ry="7" fill="#c97b84"/><ellipse cx="692" cy="354" rx="5" ry="7" fill="#c97b84"/></g>`;
  if (s.eat > 0) h += `<g transform="translate(676 384)">${[-14, -6, 2, 10, 18].map((x, i) => `<path d="M${x},0 l${(i - 2) * 4},${-16 - (i % 2) * 6}" stroke="#7cb342" stroke-width="5" stroke-linecap="round"/>`).join('')}</g>`;
  g += `<g transform="rotate(${head * 0.4} 630 300) translate(0 ${head})">${h}</g>`;
  if (s.brush > 0) g += `<g transform="translate(${450 + Math.sin(t * 8) * 70} 320) rotate(-20)"><rect x="-40" y="-14" width="80" height="22" rx="8" fill="#8d5a2b" ${k3}/><path d="M-36,8 v14 M-24,8 v14 M-12,8 v14 M0,8 v14 M12,8 v14 M24,8 v14 M36,8 v14" stroke="#c9a27a" stroke-width="4"/></g>`;
  return g;
}
function drawCalf(t) {
  return `<g transform="translate(-60 330) scale(.45)">${drawCow({ t: t + 1.7, chew: 0, eat: 0, milking: 0, brush: 0 }, true)}</g>`;
}
function drawHen(x, y, k, t, peck, flip = 1) {
  const p = peck ? Math.max(0, Math.sin(t * 9)) * 40 : 0;
  return `<g transform="translate(${x} ${y}) scale(${k * flip} ${k})">
    <path d="M-6,0 L-10,40 M10,0 L14,40 M-10,40 l-14,6 M-10,40 l10,6 M14,40 l-12,6 M14,40 l14,6" stroke="#f0a030" stroke-width="7" stroke-linecap="round"/>
    <path d="M-80,-40 C-96,-80 -84,-110 -62,-116 L-50,-60 Z" fill="#7a3a14" ${K}/>
    ${E(-10, -40, 80, 52, '#a0522d')}<path d="M-60,-46 q40,30 90,4" fill="none" stroke="#7a3a14" stroke-width="5"/>
    <g transform="rotate(${p} 40 -60)">${C(56, -96, 30, '#a0522d')}<path d="M44,-124 q4,-14 10,-2 q6,-14 10,0 q6,-10 8,4" fill="#e74c3c" ${k3}/><path d="M82,-98 L104,-90 L82,-84 Z" fill="#f0a030" ${k3}/><path d="M78,-80 q6,14 -2,18 q-8,-4 -2,-18 Z" fill="#e74c3c" ${k3}/>${eyeR(66, -102, 4.5, t)}</g></g>`;
}
function drawRooster(x, y, k, t, crow) {
  const c = crow > 0 ? -25 : 0;
  return `<g transform="translate(${x} ${y}) scale(${k} ${k})">
    <path d="M-8,0 L-12,48 M12,0 L16,48 M-12,48 l-16,6 M16,48 l16,6" stroke="#f0a030" stroke-width="8" stroke-linecap="round"/>
    <path d="M-70,-50 C-130,-150 -40,-180 -30,-120 C-60,-150 -90,-120 -70,-50 Z" fill="#1b4d3e" ${K}/><path d="M-70,-40 C-150,-110 -110,-160 -60,-120" fill="none" stroke="#2e7d5b" stroke-width="12" stroke-linecap="round"/>
    ${E(-10, -46, 82, 56, '#d35400')}<path d="M-50,-60 q40,34 90,6" fill="none" stroke="#8e3a00" stroke-width="6"/><path d="M-30,-20 q30,16 70,0" fill="none" stroke="#1b4d3e" stroke-width="10"/>
    <g transform="rotate(${c} 40 -70)">${C(56, -110, 32, '#e67e22')}<path d="M34,-140 q4,-26 14,-6 q6,-26 14,-4 q8,-24 14,0 q8,-18 10,6" fill="#e74c3c" ${k3}/>
      ${crow > 0 ? '<path d="M84,-114 L110,-122 L86,-108 Z M84,-104 L108,-96 L86,-100 Z" fill="#f0a030" stroke="#2d3436" stroke-width="3"/>' : '<path d="M84,-112 L108,-104 L84,-98 Z" fill="#f0a030" stroke="#2d3436" stroke-width="3"/>'}
      <path d="M78,-92 q10,24 -4,28 q-12,-8 -4,-28 Z" fill="#e74c3c" ${k3}/>${eyeR(68, -116, 5, t)}</g></g>`;
}
function drawPig(s) {
  const t = s.t, mud = s.mud, roll = s.roll > 0 ? Math.sin(clamp(s.roll / 2.4) * Math.PI) : 0, nose = s.eat > 0 ? Math.sin(t * 10) * 4 : 0;
  const skin = mudMix('#f7b7c4', '#7b5a3a', mud);
  let g = `<g transform="rotate(${roll * 160} 470 470) translate(0 ${roll * -40})">`;
  g += `<path d="M300,360 q-30,-10 -26,-34 q4,-20 22,-10 q14,10 -2,22" fill="none" stroke="#2d3436" stroke-width="9" stroke-linecap="round"/><path d="M300,360 q-30,-10 -26,-34 q4,-20 22,-10 q14,10 -2,22" fill="none" stroke="${skin}" stroke-width="5" stroke-linecap="round"/>`;
  for (const [x, f] of [[350, 1], [560, 1], [380, 0], [590, 0]]) g += P(`M${x - 18},440 L${x + 18},440 L${x + 15},520 L${x - 15},520 Z`, f ? mudMix('#e8a4b2', '#6b4a2a', mud) : skin) + `<path d="M${x - 15},510 h30 v12 h-30 Z M${x},510 v12" fill="#8a6a5a" stroke="#2d3436" stroke-width="2"/>`;
  g += E(470, 400, 190, 92, skin);
  g += `<g transform="translate(${nose} 0)">${P('M610,330 C640,300 700,316 712,360 C722,400 690,440 640,436 C610,432 592,400 600,360 Z', skin)}
    ${P('M620,320 L612,280 L648,312 Z', skin)}${P('M672,326 L700,290 L700,336 Z', skin)}${eyeR(640, 360, 5, t)}${eyeR(680, 360, 5, t)}
    ${E(706, 396, 26, 22, mudMix('#f29fb0', '#6b4a2a', mud))}<ellipse cx="698" cy="396" rx="4" ry="7" fill="#8a4a5a"/><ellipse cx="714" cy="396" rx="4" ry="7" fill="#8a4a5a"/>
    <path d="M660,420 q14,8 28,0" fill="none" ${k3}/></g>`;
  if (mud > 0.05) g += [[400, 380], [500, 430], [560, 360], [430, 450]].map(([x, y]) => `<ellipse cx="${x}" cy="${y}" rx="${30 * mud + 6}" ry="${16 * mud + 4}" fill="#5d3f22" opacity="${(mud * 0.7).toFixed(2)}"/>`).join('');
  g += `</g>`;
  return g;
}
function mudMix(a, b, u) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)), A1 = p(a), B1 = p(b);
  return '#' + A1.map((v, i) => Math.round(v + (B1[i] - v) * clamp(u)).toString(16).padStart(2, '0')).join('');
}
function drawSheep(s) {
  const t = s.t, w = s.wool, jaw = s.eat > 0 ? Math.sin(t * 6) * 4 : 0;
  let g = '';
  for (const [x, f] of [[360, 1], [560, 1], [390, 0], [590, 0]]) g += P(`M${x - 12},420 L${x + 12},420 L${x + 10},540 L${x - 10},540 Z`, f ? '#e8e0d4' : '#f4ede2') + `<rect x="${x - 11}" y="530" width="22" height="12" rx="3" fill="#3d3d3d"/>`;
  // shorn body underneath, fleece on top (fades/clumps as it is shorn)
  g += E(475, 372, 150 + 20 * w, 70 + 26 * w, '#f3e3d8');
  if (w > 0.02) {
    let fleece = '';
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, rx = 150 + 24 * w, ry = 74 + 30 * w; const x = 475 + Math.cos(a) * rx * 0.86, y = 372 + Math.sin(a) * ry * 0.86; if (!s.shear.some((p) => Math.hypot(p[0] - x, p[1] - y) < 60)) fleece += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(34 * w + 4).toFixed(0)}" fill="#fffaf0" ${k3}/>`; }
    for (let i = 0; i < 14; i++) { const x = 380 + (i % 5) * 46, y = 330 + Math.floor(i / 5) * 40; if (!s.shear.some((p) => Math.hypot(p[0] - x, p[1] - y) < 60)) fleece += `<circle cx="${x}" cy="${y}" r="${(32 * w + 4).toFixed(0)}" fill="#fffaf0"/>`; }

    if (S.climbT) { S.climb = clamp(S.climb + S.climbT * dt * 1.2); if (S.climb <= 0 || S.climb >= 1) S.climbT = 0; }
    if (cur === 'hen' && S.corn.length && Math.random() < dt * 2.5) S.corn.shift();
    for (const c of S.clumps) { c.vy += 400 * dt; c.y = Math.min(540, c.y + c.vy * dt); }
    scene.innerHTML = cur ? renderClose() : renderOverview();
  }
  requestAnimationFrame(tick);
}

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
}
function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
const boop = () => tone(220, 0.22, 'triangle', 0.12);
function cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.15), i * 110)); }
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function pickVoice() {
  try { return (speechSynthesis.getVoices() || []).find(v => (v.lang || '').toLowerCase().startsWith('th')) || null; } catch (e) { return null; }
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
// Recorded clip first (voice/, made by tools/gen_voice.py), device TTS as fallback.
function speak(text) {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  if (!window.VoiceClips) { deviceSpeak(text); return; }
  ensureAudio(); VoiceClips.say(text, AC, deviceSpeak);
}
function deviceSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Block double-tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

$('fact').textContent = INTRO;
$('fact').addEventListener('click', () => { ensureAudio(); speak($('fact').textContent); });
buildActs();
requestAnimationFrame(tick);

// Every line the game can say — `index.html?lines` prints them for tools/gen_voice.py.
VoiceClips.lines(() => {
  const L = [INTRO, 'กลับไปที่ฟาร์ม', 'วันนี้แม่ไก่ไข่ไปแล้ว 1 ฟอง พรุ่งนี้ค่อยมาดูใหม่นะ', 'แม่ไก่ไข่แล้ว 1 ฟอง แตะไข่เก็บใส่ตะกร้า', 'ได้นมเต็มถังแล้ว',
    'ตัดขนเสร็จแล้ว แกะตัวผอมลงเยอะเลย ขนพวกนี้เอาไปทำไหมพรมได้'];
  for (let n = 1; n <= 50; n++) L.push('เก็บไข่ได้ ' + n + ' ฟอง');
  for (const id of ORDER) L.push(A[id].voice, A[id].fact);
  for (const k in SAY) L.push(SAY[k]);
  return L;
});
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
