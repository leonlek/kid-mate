<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🧩 จิ๊กซอว์ — คิดส์เล่น</title>
<meta name="description" content="เกมต่อจิ๊กซอว์ภาพง่ายๆ ฝึกการสังเกตและการลาก">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="จิ๊กซอว์">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-3: #b5e8ff; --grass-1: #7ed957;
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --good: #5bc13a; --good-dark: #3fa024;
    --bad: #ff5757; --bad-dark: #d83838;
    --ink: #2d3436; --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 10%, #fff9c4 0%, transparent 50%),
      radial-gradient(ellipse at 85% 15%, #ffcfd2 0%, transparent 45%),
      linear-gradient(180deg, var(--sky-3) 0%, #d9f3c9 65%, var(--grass-1) 100%);
    background-attachment: fixed;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.55; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .app { max-width: 880px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
  body:has(#gameScreen.active) .app {
    max-width: 100%; padding: 0; min-height: 100vh; min-height: 100dvh;
  }
  body:has(#gameScreen.active)::before { display: none; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero { text-align: center; padding: 14px 10px 18px; }
  .hero h1 {
    font-family: 'Itim', cursive;
    font-size: clamp(42px, 9vw, 68px);
    margin: 0; color: var(--brand-dark);
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
    letter-spacing: 1px;
  }
  .howto {
    list-style: none; padding: 12px 18px; margin: 8px auto 18px;
    max-width: 360px; background: rgba(255,255,255,0.55);
    border: 2px dashed var(--card-border); border-radius: 18px;
    font-size: 16px; color: #555; font-weight: 500; text-align: left;
  }
  .howto li { display: flex; align-items: center; gap: 10px; padding: 3px 0; line-height: 1.3; }
  .howto-icon { font-size: 22px; flex-shrink: 0; width: 28px; text-align: center; }
  @media (min-width: 768px) { .howto { font-size: 18px; max-width: 440px; } .howto-icon { font-size: 26px; } }

  .lgrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin: 10px 0 32px;
  }
  .lcard {
    background: var(--card); border: 4px solid var(--card-border);
    border-radius: 24px; padding: 22px 14px 18px; text-align: center;
    cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative; overflow: hidden;
  }
  .lcard:active { transform: scale(0.96) translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.07); }
  .lcard:hover { border-color: var(--brand); }
  .lcard .preview {
    font-size: 56px; line-height: 1;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.12));
    margin-bottom: 6px;
  }
  .lcard .ltitle {
    font-family: 'Itim', cursive; font-size: 26px;
    color: var(--brand-dark); text-shadow: 2px 2px 0 #fff;
  }
  .lcard .lsub { font-size: 14px; color: #777; font-weight: 500; margin-top: 4px; }
  .lcard .stars { font-size: 15px; line-height: 1; margin: -8px 0 8px; white-space: nowrap; }
  .lcard .stars.many { font-size: 12.5px; }
  .lgroup {
    grid-column: 1 / -1; margin: 10px 0 -2px; text-align: center;
    font-family: 'Itim', cursive; font-size: 26px; font-weight: normal;
    color: var(--brand-dark); text-shadow: 2px 2px 0 #fff;
  }

  /* Own photos: take / pick a photo, saved on this device, then choose 1★–7★ */
  .photo-box { margin: 4px 0 8px; }
  .photo-box .lgroup { margin: 0 0 10px; }
  .photo-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .pbtn {
    position: relative; overflow: hidden;
    font-family: 'Itim', cursive; font-size: 24px; line-height: 1;
    min-height: 64px; padding: 18px 26px;
    border: 4px solid #fff; border-radius: 999px;
    background: var(--brand); color: #fff; text-shadow: 2px 2px 0 var(--brand-dark);
    box-shadow: 0 6px 0 var(--brand-dark); cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
    transition: transform .12s, box-shadow .12s;
  }
  .pbtn:nth-child(2) { background: #5bc0eb; box-shadow: 0 6px 0 #2f93bf; text-shadow: 2px 2px 0 #2f93bf; }
  .pbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-dark); }
  .vh-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .pgrid {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
    margin: 16px 0 0;
  }
  .pgrid:empty, .pgrid[hidden], .ppanel[hidden] { display: none; }
  .pcard {
    position: relative; aspect-ratio: 1; padding: 0; cursor: pointer;
    border: 4px solid var(--card-border); border-radius: 20px; overflow: hidden;
    background: #fff; box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    transition: transform .15s, border-color .15s;
  }
  .pcard img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  .pcard:active { transform: scale(0.95); }
  .pcard.sel { border-color: var(--brand); animation: pop .4s ease; }
  .pdel {
    position: absolute; top: 4px; right: 4px; width: 36px; height: 36px;
    border-radius: 50%; border: 2px solid #fff; background: rgba(45,52,54,0.7);
    color: #fff; font-size: 16px; line-height: 1; padding: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .ppanel {
    margin: 14px 0 0; padding: 14px;
    background: rgba(255,255,255,0.7); border: 3px dashed var(--brand); border-radius: 24px;
    display: flex; gap: 14px; align-items: center;
  }
  .ppanel-img {
    width: 150px; height: 150px; object-fit: cover; flex-shrink: 0;
    border: 4px solid #fff; border-radius: 18px; box-shadow: 0 4px 0 rgba(0,0,0,0.1);
  }
  .tgrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .tbtn {
    min-height: 64px; padding: 8px 4px; cursor: pointer;
    border: 3px solid var(--card-border); border-radius: 18px; background: #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.07); font-family: 'Mitr', sans-serif; color: #777;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    transition: transform .12s, border-color .12s;
  }
  .tbtn:hover { border-color: var(--brand); }
  .tbtn:active { transform: scale(0.94); }
  .tbtn .tstars { font-size: 13px; line-height: 1.15; white-space: nowrap; }
  .tbtn .tsub { font-size: 15px; font-weight: 600; color: var(--brand-dark); }
  @media (max-width: 600px) {
    .pgrid { grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .ppanel { flex-direction: column; }
    .ppanel-img { width: 120px; height: 120px; }
    .tgrid { width: 100%; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  }
  @media (max-width: 480px) {
    .pbtn { font-size: 20px; padding: 16px 18px; }
    .tbtn .tstars { font-size: 11px; }
  }

  /* Game */
  #gameScreen.active {
    display: flex; flex-direction: column;
    min-height: 100vh; min-height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow: hidden;
  }
  .hud {
    flex: 0 0 auto; display: flex; justify-content: center; gap: 10px;
    margin: 10px 14px 0; font-family: 'Itim', cursive; font-size: 22px;
    flex-wrap: wrap;
  }
  .hud-item {
    background: #fff; border: 3px solid var(--card-border);
    border-radius: 999px; padding: 6px 16px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    min-width: 80px; text-align: center;
  }
  .hud-item.placed { color: var(--good-dark); }
  .hud-item.time   { color: #2980b9; }

  .stage {
    flex: 1 1 auto;
    display: flex; flex-direction: column;
    align-items: center; padding: 10px;
    gap: 12px;
    overflow: hidden;
  }

  .preview-tag {
    font-family: 'Itim', cursive;
    color: var(--brand-dark);
    font-size: 20px;
    text-shadow: 2px 2px 0 #fff;
    margin: 0;
  }

  .mini-preview {
    width: 140px; height: 140px;
    background: #fff;
    border: 3px solid var(--card-border);
    border-radius: 16px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    display: grid;
    overflow: hidden;
    flex-shrink: 0;
  }
  .mini-preview img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .mini-preview .mp-cell {
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    line-height: 1;
  }
  .preview-row { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  /* Preview above the board on narrow screens; beside it (left) when there's room */
  .play-row { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .stage.side .play-row { flex-direction: row; align-items: flex-start; gap: 18px; }
  @media (max-width: 480px) {
    .mini-preview { width: 116px; height: 116px; border-width: 2px; }
    .mini-preview .mp-cell { font-size: 26px; }
    .preview-tag { font-size: 18px; }
  }
  @media (min-width: 768px) {
    .mini-preview { width: 170px; height: 170px; }
    .mini-preview .mp-cell { font-size: 40px; }
  }

  .board {
    background: #fffbf2;
    border: 4px dashed var(--brand);
    border-radius: 22px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08);
    padding: 8px;
    display: grid;
    gap: 6px;
    width: min(86vw, 380px);
    aspect-ratio: 1;
  }
  .slot {
    background: #fff;
    border: 2px dashed #ffd6e4;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(28px, 8vw, 56px);
    line-height: 1;
    position: relative;
  }
  .slot.hover { background: #ffe9f1; border-color: var(--brand); }
  .slot.filled { background: #e8ffe0; border: 2px solid var(--good); animation: pop .4s ease; }
  @keyframes pop {
    0% { transform: scale(0.85); } 60% { transform: scale(1.08); } 100% { transform: scale(1); }
  }

  .tray-label {
    font-family: 'Itim', cursive;
    color: #555;
    font-size: 16px;
    margin: 0;
  }
  .tray {
    background: rgba(255,255,255,0.5);
    border: 3px dashed var(--card-border);
    border-radius: 22px;
    padding: 10px;
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center;
    width: min(96vw, 420px);
    min-height: 80px;
  }
  .piece {
    width: 64px; height: 64px;
    background: #fff;
    border: 3px solid var(--card-border);
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    display: flex; align-items: center; justify-content: center;
    font-size: 38px;
    line-height: 1;
    cursor: grab;
    touch-action: none;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .piece:active { cursor: grabbing; }
  .piece.dragging {
    transition: none;
    box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    transform: scale(1.05);
    z-index: 1000;
  }
  .piece.shake { animation: shake .35s ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }
  @media (max-width: 480px) {
    .piece { width: 52px; height: 52px; font-size: 30px; border-width: 2px; }
    .tray { padding: 6px; gap: 6px; }
  }

  /* === Real jigsaw piece (SVG) === */
  .board.jboard {
    background: #fffbf2;
    border: 4px dashed var(--brand);
    padding: 0; gap: 0;
    aspect-ratio: auto;
    position: relative;
    width: auto;        /* set inline */
    height: auto;       /* set inline */
    display: block;
    overflow: visible;  /* tab outlines may peek slightly */
  }
  /* Ghost overlay — full scene image at low opacity behind every slot */
  .jboard .ghost {
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    height: 100%;
    object-fit: fill;
    opacity: 0.22;
    pointer-events: none;
    z-index: 0;
  }
  .jslot {
    position: absolute;
    pointer-events: none;
    z-index: 1;
  }
  .jslot path.outline {
    fill: rgba(255, 255, 255, 0.18);
    stroke: rgba(229, 75, 130, 0.6);
    stroke-width: 2;
    stroke-dasharray: 5 4;
  }
  .jslot.filled { display: none; }
  .piece.jpiece { z-index: 2; }
  .piece.jpiece {
    display: block;
    width: auto; height: auto;
    background: transparent;
    border: none; border-radius: 0;
    box-shadow: none;
    padding: 0;
    overflow: visible;
    filter: drop-shadow(0 4px 3px rgba(0,0,0,0.22));
  }
  .piece.jpiece path.outline {
    fill: none;
    stroke: #fff;
    stroke-width: 2.5;
    stroke-linejoin: round;
    opacity: 0.85;
    pointer-events: none;
  }
  .tray.jtray {
    background: rgba(255,255,255,0.5);
    border: 3px dashed var(--card-border);
    border-radius: 22px;
    padding: 12px;
    display: flex;               /* full-width rows, wrapping to a new line when full */
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    align-items: center;
    gap: 6px;
    width: min(calc(100vw - 24px), 1100px);
    max-width: none;
    overflow-y: auto;            /* max-height set in layoutGame(); scrolls only on very short screens */
    overscroll-behavior: contain;
  }
  .tray.jtray .jpiece { flex: 0 0 auto; }

  /* Results */
  #resultsScreen { text-align: center; padding-top: 20px; }
  .trophy {
    font-size: clamp(120px, 22vw, 180px); line-height: 1;
    filter: drop-shadow(4px 6px 0 rgba(0,0,0,0.18));
    animation: bobBig 1.2s ease-in-out infinite;
  }
  @keyframes bobBig {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-12px) rotate(4deg); }
  }
  .winner-name {
    font-family: 'Itim', cursive;
    font-size: clamp(44px, 9vw, 72px);
    color: var(--brand-dark); margin: 18px 0 6px;
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
  }
  .winner-sub {
    font-size: clamp(18px, 4vw, 24px);
    color: #555; margin: 0 0 6px; font-weight: 500;
  }
  .stars-row {
    font-size: clamp(48px, 10vw, 72px); line-height: 1;
    margin: 8px 0 4px; letter-spacing: 4px;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.12));
  }
  .rating-text {
    font-family: 'Itim', cursive;
    font-size: clamp(28px, 6vw, 40px);
    color: var(--brand-dark); margin: 4px 0 16px;
  }
  .action-bar {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    margin-top: 12px; flex-wrap: wrap;
  }
  .btn-main {
    font-family: 'Itim', cursive;
    font-size: 28px; padding: 16px 36px;
    border: 4px solid #fff; border-radius: 999px;
    background: var(--brand); color: #fff;
    box-shadow: 0 6px 0 var(--brand-dark);
    cursor: pointer; text-shadow: 2px 2px 0 var(--brand-dark);
    transition: transform .12s, box-shadow .12s;
  }
  .btn-main:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-dark); }
  .btn-ghost {
    font-family: 'Itim', cursive;
    font-size: 24px; padding: 14px 30px;
    border: 4px solid var(--brand); border-radius: 999px;
    background: #fff; color: var(--brand-dark);
    box-shadow: 0 5px 0 rgba(0,0,0,0.12); cursor: pointer;
    transition: transform .12s, box-shadow .12s;
  }
  .btn-ghost:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }

  .confetti {
    position: fixed; top: -20px;
    width: 12px; height: 18px;
    z-index: 90; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  .home-btn, .back-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #fff; border: 3px solid var(--brand);
    box-shadow: 0 3px 0 var(--brand-dark);
    align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; color: var(--ink);
    z-index: 60;
    transition: transform .12s;
    font-family: inherit; padding: 0; cursor: pointer;
  }
  .home-btn { left: 12px; display: flex; font-size: 26px; }
  .back-btn { right: 12px; display: none; }
  .back-btn.show { display: flex; }
  .home-btn:active, .back-btn:active { transform: scale(0.92); }

  @media (min-width: 768px) {
    .lgrid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .hud { font-size: 26px; }
    .hud-item { padding: 8px 22px; min-width: 110px; }
    .board { width: 420px; }
    .piece { width: 76px; height: 76px; font-size: 46px; }
  }
  @media (max-width: 480px) {
    .lgrid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .lcard { padding: 16px 10px 14px; border-width: 3px; border-radius: 20px; }
    .lcard .ltitle { font-size: 22px; }
    .hud { font-size: 18px; margin: 8px 10px 0; }
    .hud-item { padding: 5px 12px; min-width: 60px; }
  }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>
<button class="back-btn" id="backBtn" type="button" aria-label="เลือกด่านใหม่">📋</button>
<div class="app">

  <section id="selectScreen" class="screen active">
    <header class="hero">
      <h1>🧩 จิ๊กซอว์</h1>
      <ul class="howto">
        <li><span class="howto-icon">👀</span> ดูภาพตัวอย่างเล็กๆ</li>
        <li><span class="howto-icon">✋</span> ลากชิ้นไปวางในช่องที่ถูก</li>
        <li><span class="howto-icon">🏆</span> ต่อให้ครบทุกชิ้น!</li>
      </ul>
    </header>

    <div class="photo-box">
      <h2 class="lgroup">📷 รูปของหนู</h2>
      <div class="photo-actions">
        <label class="pbtn">📷 ถ่ายรูป<input id="camInput" class="vh-input" type="file" accept="image/*" capture="environment"></label>
        <label class="pbtn">🖼️ เลือกจากคลังรูป<input id="libInput" class="vh-input" type="file" accept="image/*"></label>
      </div>
      <div id="photoGrid" class="pgrid"></div>
      <div id="photoPanel" class="ppanel" hidden>
        <img id="photoPanelImg" class="ppanel-img" alt="">
        <div id="tierGrid" class="tgrid"></div>
      </div>
    </div>

    <div id="levelGrid" class="lgrid"></div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="hud">
      <div class="hud-item placed">🧩 <span id="placedCount">0</span>/<span id="placedTotal">4</span></div>
      <div class="hud-item time">⏱ <span id="timeText">0:00</span></div>
    </div>
    <div id="stage" class="stage">
      <div class="play-row">
        <div class="preview-row">
          <span class="preview-tag">ภาพตัวอย่าง:</span>
          <div id="miniPreview" class="mini-preview"></div>
        </div>
        <div id="board" class="board"></div>
      </div>

const TAB_DEPTH_FRAC = 0.18; // tab depth as fraction of cell size

// === Jigsaw shape generator ===
// edges[r][c] = { top, right, bottom, left }; each ∈ {-1, 0, 1}
// 0 = flat (board border), 1 = tab (bumps outward), -1 = blank (bumps inward)
// Neighbors must be complementary: piece below's top = -(piece's bottom).
function makeEdges(cols, rows) {
  const e = [];
  for (let r = 0; r < rows; r++) {
    e[r] = [];
    for (let c = 0; c < cols; c++) {
      const cell = {};
      cell.top    = (r === 0)        ? 0 : -e[r-1][c].bottom;
      cell.left   = (c === 0)        ? 0 : -e[r][c-1].right;
      cell.right  = (c === cols - 1) ? 0 : (Math.random() < 0.5 ? 1 : -1);
      cell.bottom = (r === rows - 1) ? 0 : (Math.random() < 0.5 ? 1 : -1);
      e[r][c] = cell;
    }
  }
  return e;
}

// Build SVG path d="..." for one piece. Traverses clockwise: top → right → bottom → left.
// Piece outer box is (S+2T) × (S+2T); cell area is (T,T) to (T+S, T+S).
function piecePath(edges, S, T) {
  const segs = [`M ${T} ${T}`];
  segs.push(edgeSeg(edges.top,    S, T, 0));
  segs.push(edgeSeg(edges.right,  S, T, 1));
  segs.push(edgeSeg(edges.bottom, S, T, 2));
  segs.push(edgeSeg(edges.left,   S, T, 3));
  segs.push('Z');
  return segs.join(' ');
}

// One edge segment, traveling in `dir`: 0=right (+x), 1=down (+y), 2=left (-x), 3=up (-y).
// d: 0 flat, 1 tab (bumps outward), -1 blank (bumps inward).
function edgeSeg(d, S, T, dir) {
  function rot(x, y) {
    // Rotate reference frame (dir=0: right) by 90° clockwise per dir step.
    switch (dir) {
      case 0: return [x, y];
      case 1: return [-y, x];
      case 2: return [-x, -y];
      case 3: return [y, -x];
    }
  }
  if (d === 0) {
    const [dx, dy] = rot(S, 0);
    return `l ${dx.toFixed(2)} ${dy.toFixed(2)}`;
  }
  // Reference (dir=0, top edge going right): tab bumps to -y (outward = up for top edge).
  // d=+1 → s=-1 (y bump negative); d=-1 → s=+1 (y bump positive, blank goes into cell).
  const s = -d;
  // Smooth knob: line 35% → cubic to peak (50%, sT) → cubic to (65%, 0) → line 35%.
  // Control points chosen so tangents at junctions are horizontal (no kinks).
  const cmds = [
    ['l', 0.35*S, 0],
    ['c', 0.05*S, 0,       0.10*S, s*T,     0.15*S, s*T],
    ['c', 0.05*S, 0,       0.10*S, -s*T,    0.15*S, -s*T],
    ['l', 0.35*S, 0],
  ];
  const out = [];
  for (const c of cmds) {
    if (c[0] === 'l') {
      const [rx, ry] = rot(c[1], c[2]);
      out.push(`l ${rx.toFixed(2)} ${ry.toFixed(2)}`);
    } else {
      const [r1x, r1y] = rot(c[1], c[2]);
      const [r2x, r2y] = rot(c[3], c[4]);
      const [rex, rey] = rot(c[5], c[6]);
      out.push(`c ${r1x.toFixed(2)} ${r1y.toFixed(2)} ${r2x.toFixed(2)} ${r2y.toFixed(2)} ${rex.toFixed(2)} ${rey.toFixed(2)}`);
    }
  }
  return out.join(' ');
}

// AUDIO
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
}
function tone(freq, ms, type='sine', vol=0.18) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g).connect(audioCtx.destination);
  const t = audioCtx.currentTime, d = ms/1000;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
function playSnap()  { tone(660, 90, 'triangle', 0.16); setTimeout(()=>tone(990, 100, 'triangle', 0.14), 80); }
function playMiss()  { tone(180, 180, 'sawtooth', 0.14); }
function playWin()   {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(()=>tone(f, 180, 'triangle', 0.18), i * 120));
}

const SVG_NS = 'http://www.w3.org/2000/svg';

// GAME
function startGame(level) {
  if (state.tickTimer) clearInterval(state.tickTimer);
  state.level = level;
  state.placed = 0;
  state.misses = 0;
  state.drag = null;
  board.innerHTML = '';
  tray.innerHTML = '';

  // Photo levels carry their own def ({ url, cols, rows }); built-in levels use an SVG scene
  const def = level.def || SCENES_SVG[level.scene];
  const { cols, rows } = def;
  state.scene = def;
  state.total = cols * rows;

  state.edges = makeEdges(cols, rows);
  state.sceneDataUrl = def.url || ('data:image/svg+xml;charset=utf-8,' + encodeURIComponent(def.svg));

  $('placedCount').textContent = '0';
  $('placedTotal').textContent = state.total;
  $('timeText').textContent = '0:00';

  const mini = $('miniPreview');
  mini.style.gridTemplateColumns = '';
  mini.style.gridTemplateRows = '';
  mini.innerHTML = `<img alt="" src="${state.sceneDataUrl}" style="width:100%;height:100%;object-fit:cover;display:block;">`;
  tray.className = 'tray jtray';

  showScreen('game');
  layoutGame();
  state.startTime = performance.now();
  state.tickTimer = setInterval(tickTime, 250);
}

const TRAY_GAP = 6, TRAY_CHROME = 30; // flex gap; tray padding + border, both sides

function pieceWFor(S) { return S + 2 * Math.round(S * TAB_DEPTH_FRAC); }

// Largest tray scale (pieces ≥ minPx on screen) at which all remaining pieces fit
// in maxH. Returns null if none does.
function trayFit(W, n, innerW, maxH, minPx) {
  for (let s = 1; W * s >= minPx; s -= 0.05) {
    const cell = Math.round(W * s) + TRAY_GAP;
    const perRow = Math.max(1, Math.floor((innerW + TRAY_GAP) / cell));
    if (Math.ceil(n / perRow) * cell - TRAY_GAP + TRAY_CHROME <= maxH) return s;
  }
  return null;
}

// Size the board and tray for the current viewport: the biggest board that
// still lets the whole tray fit below it with pieces ≥ 64 px (tap-target rule),
// then ≥ 52 px; on very short screens the tray scrolls instead.
// A picked-up tray piece always grows back to board size.
function layoutGame() {
  const { cols, rows } = state.scene;
  const n = state.total;
  const vw = window.innerWidth;
  const vh = Math.min(window.innerHeight, document.documentElement.clientHeight || Infinity);
  const wide = cols >= 5;
  const cap = vw >= 600 ? (wide ? 520 : 380) : (wide ? 368 : 320);
  const maxS = Math.floor(Math.min(vw * (wide ? 0.94 : 0.84), cap) / cols);

  // Big preview: left of the board when there's room, else above it — capped so
  // the board still gets most of a phone's height.
  const stageW = $('stage').clientWidth - 20;
  const sideW = Math.min(460, stageW - (maxS * cols + 8) - 18, Math.floor(vh * 0.55 * cols / rows));
  const side = sideW >= 260;
  $('stage').classList.toggle('side', side);
  const mw = side ? sideW
    : Math.min(n > 12 ? 300 : 400, stageW, Math.floor(vh * 0.34 * cols / rows));
  const mini = $('miniPreview');
  mini.style.width = mw + 'px';
  mini.style.height = Math.round(mw * rows / cols) + 'px';

  // Build once at max size to measure the fixed chrome around board + tray
  buildBoard(maxS);
  const b = board.getBoundingClientRect(), t = tray.getBoundingClientRect();
  const avail = vh - b.top - (t.top - b.bottom) - 12;
  const innerW = tray.clientWidth - 24;

  let S = 0, scale = null;
  for (const [minPx, minS] of [[64, maxS * 0.7], [52, maxS * 0.6]]) {
    for (let s = maxS; s >= Math.max(40, minS); s -= 2) {
      scale = trayFit(pieceWFor(s), n, innerW, avail - (s * rows + 8), minPx);
      if (scale) { S = s; break; }
    }
    if (S) break;
  }
  if (!S) { // too short: keep ~2 rows of tray visible and let it scroll
    S = Math.max(40, Math.min(maxS, Math.floor((avail - 150) / rows)));
    scale = Math.min(1, 52 / pieceWFor(S));
  }
  if (S !== maxS) buildBoard(S);
  state.trayScale = scale;
  tray.style.maxHeight = Math.max(140, avail - (S * rows + 8)) + 'px';
  for (const p of tray.children) sizeForTray(p);
}

// Tray-only refit (after a resize mid-game, when placed pieces pin the board size)
function refitTray() {
  const n = tray.children.length;
  const vh = Math.min(window.innerHeight, document.documentElement.clientHeight || Infinity);
  const maxH = Math.max(140, vh - tray.getBoundingClientRect().top - 12);
  state.trayScale = trayFit(state.pieceW, n, tray.clientWidth - 24, maxH, 52)
    || Math.min(1, 52 / state.pieceW);
  tray.style.maxHeight = maxH + 'px';
  for (const p of tray.children) sizeForTray(p);
}

let resizeTimer = 0;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!screens.game.classList.contains('active') || state.drag) return;
    if (state.placed === 0) layoutGame(); else refitTray();
  }, 250);
});

// Slots + ghost on the board, all pieces (unplaced) in the tray, at cell size S
function buildBoard(S) {
  const { cols, rows } = state.scene;
  const T = Math.round(S * TAB_DEPTH_FRAC);
  state.cellSize = S;
  state.tabDepth = T;
  state.pieceW = S + 2 * T;
  const boardW = S * cols, boardH = S * rows;

  board.className = 'board jboard';
  // +8 for the 4px border (border-box), so slots and ghost share the same boardW×boardH area
  board.style.width = (boardW + 8) + 'px';
  board.style.height = (boardH + 8) + 'px';
  board.innerHTML = '';

  // Ghost overlay — full scene image behind slots, so kids see where each piece goes
  const ghost = document.createElement('img');
  ghost.className = 'ghost';
  ghost.alt = '';
  ghost.src = state.sceneDataUrl;
  board.appendChild(ghost);

  const piecesInfo = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx = r * cols + c;
      const path = piecePath(state.edges[r][c], S, T);
      const pieceW = S + 2 * T;
      const pieceX = c * S - T;
      const pieceY = r * S - T;

      // Slot outline (ghost)
      const slot = document.createElementNS(SVG_NS, 'svg');
      slot.setAttribute('class', 'jslot');
      slot.setAttribute('viewBox', `0 0 ${pieceW} ${pieceW}`);
      slot.setAttribute('width', pieceW);
      slot.setAttribute('height', pieceW);
      slot.dataset.idx = idx;
      slot.style.left = pieceX + 'px';
      slot.style.top  = pieceY + 'px';
      slot.style.width  = pieceW + 'px';
      slot.style.height = pieceW + 'px';
      const slotPath = document.createElementNS(SVG_NS, 'path');
      slotPath.setAttribute('class', 'outline');
      slotPath.setAttribute('d', path);
      slot.appendChild(slotPath);
      board.appendChild(slot);

      piecesInfo.push({ idx, r, c, path, pieceW, pieceX, pieceY });
    }
  }

  // Tray
  tray.innerHTML = '';
  state.placed = 0;
  for (const info of shuffle(piecesInfo)) {
    const piece = makeJigsawPiece(info, boardW, boardH);
    piece.addEventListener('pointerdown', (e) => startDrag(e, piece));
    tray.appendChild(piece);
  }
}

function sizeForTray(piece) {
  const px = Math.round(state.pieceW * state.trayScale) + 'px';
  piece.style.width = piece.style.height = px;
}

function makeJigsawPiece(info, boardW, boardH) {
  const { idx, r, c, path, pieceW } = info;
  const S = state.cellSize, T = state.tabDepth;
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'piece jpiece');
  svg.setAttribute('viewBox', `0 0 ${pieceW} ${pieceW}`);
  svg.setAttribute('width', pieceW);
  svg.setAttribute('height', pieceW);
  svg.dataset.idx = idx;
  svg.dataset.row = r;
  svg.dataset.col = c;
  svg.style.touchAction = 'none';
  svg.style.cursor = 'grab';

  const defs = document.createElementNS(SVG_NS, 'defs');
  const pat  = document.createElementNS(SVG_NS, 'pattern');
  const patId = `pat-${idx}-${Math.random().toString(36).slice(2,7)}`;
  pat.setAttribute('id', patId);
  pat.setAttribute('patternUnits', 'userSpaceOnUse');
  pat.setAttribute('x', String(T - c * S));
  pat.setAttribute('y', String(T - r * S));
  pat.setAttribute('width',  String(boardW));
  pat.setAttribute('height', String(boardH));
  const img = document.createElementNS(SVG_NS, 'image');
  img.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', state.sceneDataUrl);
  img.setAttribute('href', state.sceneDataUrl);
  img.setAttribute('width', String(boardW));
  img.setAttribute('height', String(boardH));
  img.setAttribute('preserveAspectRatio', 'none');
  pat.appendChild(img);
  defs.appendChild(pat);
  svg.appendChild(defs);

  const fill = document.createElementNS(SVG_NS, 'path');
  fill.setAttribute('d', path);
  fill.setAttribute('fill', `url(#${patId})`);
  svg.appendChild(fill);

  const stroke = document.createElementNS(SVG_NS, 'path');
  stroke.setAttribute('class', 'outline');
  stroke.setAttribute('d', path);
  svg.appendChild(stroke);

  return svg;
}

function tickTime() {
  const ms = performance.now() - state.startTime;
  const s = Math.floor(ms / 1000);
  const mm = Math.floor(s / 60);
  const ss = String(s % 60).padStart(2, '0');
  $('timeText').textContent = mm + ':' + ss;
}

function startDrag(e, piece) {
  if (state.drag) return;
  e.preventDefault();
  const rect = piece.getBoundingClientRect();
  piece.classList.add('dragging');

  // Grow a (possibly shrunk) tray piece back to board size, keeping the same
  // spot under the finger, then lift to body via fixed positioning.
  const W = state.pieceW;
  const offsetX = (e.clientX - rect.left) / rect.width * W;
  const offsetY = (e.clientY - rect.top) / rect.height * W;
  piece.style.width = piece.style.height = W + 'px';
  piece.style.position = 'fixed';
  piece.style.left = (e.clientX - offsetX) + 'px';
  piece.style.top  = (e.clientY - offsetY) + 'px';
  document.body.appendChild(piece);
  try { piece.setPointerCapture(e.pointerId); } catch(_) {}

  state.drag = { piece, offsetX, offsetY, pointerId: e.pointerId };

  piece.onpointermove = onDragMove;
  piece.onpointerup = piece.onpointercancel = onDragEnd;
}

function onDragMove(e) {
  const d = state.drag;
  if (!d) return;
  d.piece.style.left = (e.clientX - d.offsetX) + 'px';
  d.piece.style.top  = (e.clientY - d.offsetY) + 'px';
}

function onDragEnd(e) {
  const d = state.drag;
  if (!d) return;
  const p = d.piece;
  try { p.releasePointerCapture(d.pointerId); } catch(_) {}
  p.onpointermove = p.onpointerup = p.onpointercancel = null;
  state.drag = null;

  // Snap if piece center is within threshold of the correct slot's center.
  const r = p.getBoundingClientRect();
  const cx = r.left + r.width / 2;
  const cy = r.top  + r.height / 2;
  const slot = board.querySelector(`.jslot[data-idx="${p.dataset.idx}"]`);
  if (slot && !slot.classList.contains('filled')) {
    const sr = slot.getBoundingClientRect();
    const sx = sr.left + sr.width / 2;
    const sy = sr.top  + sr.height / 2;
    if (Math.hypot(cx - sx, cy - sy) <= state.cellSize * 0.5) {
      snapPiece(p, slot);
      return;
    }
  }

  // Wrong / not close enough — count as a miss only if dropped over the board area.
  const boardRect = board.getBoundingClientRect();
  const overBoard = cx >= boardRect.left && cx <= boardRect.right && cy >= boardRect.top && cy <= boardRect.bottom;
  if (overBoard) {
    state.misses += 1;
    playMiss();
    buzz([30, 80, 30]);
    returnPiece(p, true);
  } else {
    returnPiece(p, false);
  }
}

function snapPiece(piece, slot) {
  piece.classList.remove('dragging');
  piece.style.position = 'absolute';
  piece.style.left = slot.style.left;
  piece.style.top  = slot.style.top;
  piece.style.pointerEvents = 'none';
  board.appendChild(piece);
  slot.classList.add('filled');
  state.placed += 1;
  $('placedCount').textContent = state.placed;
  playSnap();
  buzz([20, 40, 20]);
  if (state.placed === state.total) {
    setTimeout(endGame, 500);
  }
}

function returnPiece(piece, shake) {
  piece.classList.remove('dragging');
  piece.style.position = '';
  piece.style.left = piece.style.top = '';
  sizeForTray(piece);
  tray.appendChild(piece);
  if (shake) {
    piece.classList.add('shake');
    setTimeout(() => piece.classList.remove('shake'), 380);
  }
}

function endGame() {
  if (state.tickTimer) clearInterval(state.tickTimer);
  state.endTime = performance.now();
  showResults();
}

// RESULTS
function showResults() {
  const seconds = Math.floor((state.endTime - state.startTime) / 1000);
  const mm = Math.floor(seconds / 60);
  const ss = String(seconds % 60).padStart(2, '0');
  const r = ratingFor(state.misses, state.level);
  $('resultTitle').textContent = r.title;
  $('resultSub').textContent   = `${mm}:${ss} · ลองผิด ${state.misses} ครั้ง`;
  $('resultStars').textContent = r.stars;
  $('resultText').textContent  = r.text;
  showScreen('results');
  celebrate(r.confetti);
  playWin();
  buzz([60, 40, 60, 40, 100]);
}

function ratingFor(misses, level) {
  if (misses <= level.parMisses)            return { stars: '🌟🌟🌟', text: 'สุดยอด!', title: 'เก่งมาก!',  confetti: 140 };
  if (misses <= level.parMisses * 2 + 1)    return { stars: '⭐⭐',     text: 'เก่ง!',    title: 'ผ่านแล้ว!', confetti: 90 };
  return                                            { stars: '⭐',         text: 'ดีมาก!',  title: 'ผ่าน',       confetti: 50 };
}

function celebrate(n) {
  const colors = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#ff914d', '#b388ff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.8 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// OWN PHOTOS — stay on this device (IndexedDB); nothing is uploaded.
// Every photo can be played at any tier; it's centre-cropped to that tier's cols:rows.
const PHOTO_TIERS = [
  { stars: 1, cols: 2, rows: 2, parMisses: 1 },
  { stars: 2, cols: 3, rows: 3, parMisses: 3 },
  { stars: 3, cols: 4, rows: 3, parMisses: 5 },
  { stars: 4, cols: 4, rows: 4, parMisses: 6 },
  { stars: 5, cols: 5, rows: 4, parMisses: 8 },
  { stars: 6, cols: 6, rows: 5, parMisses: 12 },
  { stars: 7, cols: 7, rows: 6, parMisses: 16 },
];
const PHOTO_MAX = 6;        // newest kept, oldest evicted
const PHOTO_LONG_SIDE = 1600;

const photoDB = (() => {
  let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      const r = indexedDB.open('jigsaw-photos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  function tx(mode, fn) {
    return open().then(db => new Promise((res, rej) => {
      const t = db.transaction('photos', mode);
      const out = fn(t.objectStore('photos'));
      t.oncomplete = () => res(out && out.result);
      t.onerror = () => rej(t.error);
    }));
  }
  return {
    all: () => tx('readonly', s => s.getAll()).then(list => (list || []).sort((a, b) => b.t - a.t)),
    put: (p) => tx('readwrite', s => s.put(p)),
    del: (id) => tx('readwrite', s => s.delete(id)),
  };
})();

const photo = { list: [], urls: new Map(), selId: null, playUrl: null };

function loadImage(src) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(img);
    img.onerror = rej;
    img.src = src;
  });
}
function canvasBlob(cv) {
  return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('toBlob')), 'image/jpeg', 0.86));
}

// Downscale the picked file once, then keep it
async function importPhoto(file) {
  if (!file) return;
  const src = URL.createObjectURL(file);
  try {
    const img = await loadImage(src);
    const k = Math.min(1, PHOTO_LONG_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k);
    cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    const p = { id: 'p' + Date.now(), t: Date.now(), blob: await canvasBlob(cv) };
    await photoDB.put(p);
    const all = await photoDB.all();
    for (const old of all.slice(PHOTO_MAX)) await photoDB.del(old.id);
    await renderPhotos();
    selectPhoto(p.id);
    buzz(20);
  } catch (e) {
    console.warn('photo import failed', e); // e.g. undecodable format — stay silent
  } finally {
    URL.revokeObjectURL(src);
  }
}

function photoUrl(p) {
  if (!photo.urls.has(p.id)) photo.urls.set(p.id, URL.createObjectURL(p.blob));
  return photo.urls.get(p.id);
}

async function renderPhotos() {
  try { photo.list = await photoDB.all(); } catch (e) { photo.list = []; }
  const ids = new Set(photo.list.map(p => p.id));
  for (const [id, url] of photo.urls) if (!ids.has(id)) { URL.revokeObjectURL(url); photo.urls.delete(id); }
  if (!ids.has(photo.selId)) selectPhoto(null);

  const grid = $('photoGrid');
  grid.innerHTML = '';
  for (const p of photo.list) {
    const c = document.createElement('div');
    c.className = 'pcard' + (p.id === photo.selId ? ' sel' : '');
    c.innerHTML = `<img alt="" src="${photoUrl(p)}"><button class="pdel" type="button" aria-label="ลบรูป">✕</button>`;
    c.addEventListener('click', () => { buzz(15); selectPhoto(photo.selId === p.id ? null : p.id); });
    c.querySelector('.pdel').addEventListener('click', async (e) => {
      e.stopPropagation();
      try { await photoDB.del(p.id); } catch (_) {}
      renderPhotos();
    });
    grid.appendChild(c);
  }
}

// Tapping a photo opens the tier picker under the grid; tapping it again closes it
function selectPhoto(id) {
  photo.selId = id;
  for (const c of $('photoGrid').children) c.classList.remove('sel');
  const idx = photo.list.findIndex(p => p.id === id);
  if (idx >= 0) $('photoGrid').children[idx].classList.add('sel');
  const panel = $('photoPanel');
  panel.hidden = idx < 0;
  if (idx < 0) return;
  $('photoPanelImg').src = photoUrl(photo.list[idx]);
  panel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function renderTiers() {
  const g = $('tierGrid');
  g.innerHTML = '';
  for (const tier of PHOTO_TIERS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tbtn';
    b.innerHTML = `<span class="tstars">${'⭐'.repeat(tier.stars)}</span><span class="tsub">${tier.cols * tier.rows} ชิ้น</span>`;
    b.addEventListener('click', () => { ensureAudio(); startPhotoGame(tier); });
    g.appendChild(b);
  }
}

// Centre-crop the saved photo to the tier's aspect, then play it like any level
async function startPhotoGame(tier) {
  const p = photo.list.find(x => x.id === photo.selId);
  if (!p) return;
  try {
    const img = await loadImage(photoUrl(p));
    const aspect = tier.cols / tier.rows;
    let sw = img.naturalWidth, sh = sw / aspect;
    if (sh > img.naturalHeight) { sh = img.naturalHeight; sw = sh * aspect; }
    const sx = (img.naturalWidth - sw) / 2, sy = (img.naturalHeight - sh) / 2;
    const cv = document.createElement('canvas');
    cv.width = Math.round(Math.min(sw, 1200));
    cv.height = Math.round(cv.width / aspect);
    cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, cv.width, cv.height);
    const blob = await canvasBlob(cv);
    if (photo.playUrl) URL.revokeObjectURL(photo.playUrl);
    photo.playUrl = URL.createObjectURL(blob);
    startGame({
      id: 'photo', stars: tier.stars, name: 'รูปของหนู', parMisses: tier.parMisses,
      def: { url: photo.playUrl, cols: tier.cols, rows: tier.rows },
    });
  } catch (e) {
    console.warn('photo game failed', e);
  }
}

for (const id of ['camInput', 'libInput']) {
  const inp = $(id);
  inp.addEventListener('click', () => ensureAudio());
  inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.value = ''; importPhoto(f); });
}
renderTiers();
if (window.indexedDB) renderPhotos(); else $('photoGrid').hidden = true;

// EVENTS
$('backBtn').addEventListener('click', () => { abortGame(); renderLevels(); showScreen('select'); });
$('againBtn').addEventListener('click', () => {
  if (!state.level) { showScreen('select'); return; }
  ensureAudio(); startGame(state.level);
});
$('newBtn').addEventListener('click', () => {
  state.level = null; showScreen('select');
});

let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

renderLevels();
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
