<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🪐 ท่องอวกาศ — คิดส์เล่น</title>
<meta name="description" content="เกมสำรวจระบบสุริยะ ดาวเคราะห์โคจรจริง แตะดาวฟังข้อมูลจริงจาก NASA เทียบขนาดดาว และภารกิจหาดาว">
<meta name="theme-color" content="#0b1033">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ท่องอวกาศ">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
    --space: #0b1033; --space-2: #1b2160;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: #fff;
    min-height: 100vh;
    background: radial-gradient(ellipse at 50% 35%, var(--space-2) 0%, var(--space) 60%, #05071c 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  /* brand cloud strip — here it drifts like space dust */
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.12; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }

  .app {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--gold); text-shadow: 3px 3px 0 var(--brand-dark);
  }

  /* mode chips */
  .modes, .ctrls, .levels { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 600;
    min-height: 56px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.35); transition: transform .1s;
  }
  .chip:active { transform: translateY(2px) scale(0.96); }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .chip.icon { font-size: 24px; padding: 0 12px; }

  /* layout: view + side panel (landscape) / stacked (portrait) */
  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .main > * { min-width: 0; }
  @media (min-width: 900px) and (orientation: landscape) {
    .main { grid-template-columns: minmax(0, 1fr) 380px; }
  }
  .view {
    position: relative;
    background: rgba(255,255,255,0.03);
    border: 3px solid rgba(255,255,255,0.12);
    border-radius: 28px; overflow: hidden;
  }
  .view svg { display: block; width: 100%; height: auto; touch-action: manipulation; }
  #orbitSvg { max-height: 78vh; }
  .clock {
    position: absolute; left: 14px; bottom: 10px;
    font-size: 15px; color: #cfd6ff; background: rgba(0,0,0,0.35);
    padding: 4px 12px; border-radius: 999px;
  }
  .note {
    position: absolute; right: 14px; bottom: 10px; max-width: 55%;
    font-size: 12px; color: #aab3e6; text-align: right; line-height: 1.3;
  }
  #sizeWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #sizeSvg { min-width: 760px; }

  /* planet picker strip — the big, easy tap targets */
  .strip { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  @media (min-width: 760px) { .strip { grid-template-columns: repeat(10, minmax(0, 1fr)); } }
  .pbtn {
    min-height: 84px; border-radius: 20px;
    background: rgba(255,255,255,0.08); border: 3px solid rgba(255,255,255,0.18);
    color: #fff; font-family: 'Mitr', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.15; text-align: center; overflow-wrap: anywhere;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; padding: 6px 2px; box-shadow: 0 4px 0 rgba(0,0,0,0.35);
    transition: transform .1s, border-color .15s;
  }
  .pbtn svg { width: 46px; height: 46px; }
  .pbtn:active { transform: translateY(2px) scale(0.95); }
  .pbtn.sel { border-color: var(--gold); background: rgba(255,217,61,0.18); }
  .pbtn.wobble { animation: wobble .45s; }
  @keyframes wobble { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }

  /* info panel — inline, never a popup */
  .panel {
    background: var(--card); color: var(--ink);
    border: 4px solid var(--card-border); border-radius: 28px;
    padding: 16px 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,0.35);
  }
  .p-head { display: flex; align-items: center; gap: 12px; }
  .p-head svg { width: 92px; height: 92px; flex-shrink: 0; }
  .p-name { font-family: 'Itim', cursive; font-size: 34px; line-height: 1.05; color: var(--brand-dark); }
  .p-sub { font-size: 14px; color: #777; }
  .say {
    margin-left: auto; flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--card-border); background: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .say:active { transform: translateY(2px); }
  .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 12px 0 8px; }
  .fact { background: #f6f7ff; border-radius: 16px; padding: 8px 10px; }
  .fact .k { font-size: 13px; color: #6b7280; }
  .fact .v { font-size: 16px; font-weight: 600; line-height: 1.25; }
  .know { margin: 8px 0 0; padding: 0; list-style: none; }
  .know li { background: #fff6d6; border-radius: 16px; padding: 8px 12px; margin-top: 8px; font-size: 16px; line-height: 1.4; }
  .know li::before { content: '💡 '; }
  .q-text { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); text-align: center; margin: 6px 0; line-height: 1.2; }
  .q-hint { text-align: center; font-size: 15px; color: #6b7280; }
  .score { text-align: center; font-size: 26px; margin-top: 8px; min-height: 34px; letter-spacing: 2px; }
  .src { font-size: 11px; color: #9aa3b5; margin-top: 10px; }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header>
    <h1>🪐 ท่องอวกาศ</h1>
  </header>

  <div class="modes" id="modes">
    <button class="chip on" data-mode="explore">🔭 สำรวจ</button>
    <button class="chip" data-mode="size">📏 เทียบขนาด</button>
    <button class="chip" data-mode="mission">🎯 ภารกิจ</button>
  </div>

  <div class="main">
    <div>
      <div class="view" id="orbitView">
        <svg id="orbitSvg" viewBox="0 0 1000 1000" aria-label="ระบบสุริยะ"></svg>
        <div class="clock" id="clock">⏱ 0 วัน</div>
        <div class="note">ขนาดดาวและระยะทางย่อให้ดูง่าย<br>ของจริงอยู่ห่างกันมากกว่านี้มาก</div>
      </div>
      <div class="view hidden" id="sizeView">
        <div id="sizeWrap"><svg id="sizeSvg" viewBox="0 0 1900 600" aria-label="เทียบขนาดดาว"></svg></div>
        <div class="note" style="position:static;max-width:none;text-align:center;padding:0 12px 10px">ขนาดในหน้านี้เทียบกันตามจริง · ดวงอาทิตย์ใหญ่จนล้นจอ!</div>
      </div>
      <div class="ctrls" id="ctrls">
        <button class="chip icon" data-speed="0" aria-label="หยุด">⏸</button>
        <button class="chip icon" data-speed="0.25" aria-label="ช้า">🐢</button>
        <button class="chip icon on" data-speed="1" aria-label="ปกติ">▶️</button>
        <button class="chip icon" data-speed="6" aria-label="เร็ว">🚀</button>
      </div>
      <div class="strip" id="strip"></div>
    </div>

    <div class="panel" id="panel"></div>
  </div>
</div>

const BY = Object.fromEntries(BODIES.map(b => [b.id, b]));
const PLANETS = BODIES.filter(b => b.order);
const EARTH_D = 12756;

// ============================================================================
// PLANET ART — one function draws any body at (cx,cy) radius r, used everywhere
// ============================================================================
let uidN = 0;
function art(id, cx, cy, r, opt = {}) {
  const u = 'u' + (++uidN), clip = `<clipPath id="c${u}"><circle cx="${cx}" cy="${cy}" r="${r}"/></clipPath>`;
  const base = (g) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#g-${g})"/>`;
  const C = (x, y, rr, f, o = 1) => `<circle cx="${cx + x * r}" cy="${cy + y * r}" r="${rr * r}" fill="${f}" opacity="${o}"/>`;
  const E = (x, y, rx, ry, f, o = 1, rot = 0) => `<ellipse cx="${cx + x * r}" cy="${cy + y * r}" rx="${rx * r}" ry="${ry * r}" fill="${f}" opacity="${o}" transform="rotate(${rot} ${cx + x * r} ${cy + y * r})"/>`;
  const band = (y, h, f, o = 1) => `<rect x="${cx - r}" y="${cy + y * r}" width="${2 * r}" height="${h * r}" fill="${f}" opacity="${o}"/>`;
  switch (id) {
    case 'sun':
      return (opt.glow ? `<circle cx="${cx}" cy="${cy}" r="${r * 1.45}" fill="url(#g-sunglow)"/>` : '') + base('sun') +
        C(-0.3, 0.2, 0.12, '#ff9b1e', 0.35) + C(0.35, -0.25, 0.08, '#ff9b1e', 0.35);
    case 'mercury':
      return clip + base('mercury') + `<g clip-path="url(#c${u})">` + C(-0.35, -0.2, 0.22, '#6b635e', 0.45) + C(0.3, 0.3, 0.16, '#6b635e', 0.45) + C(0.15, -0.5, 0.1, '#6b635e', 0.45) + C(-0.1, 0.55, 0.12, '#6b635e', 0.4) + '</g>';
    case 'venus':
      return clip + base('venus') + `<g clip-path="url(#c${u})">` + E(0, -0.35, 1.1, 0.12, '#e6c27a', 0.55, -8) + E(0.1, 0.1, 1.1, 0.1, '#e6c27a', 0.45, -8) + E(0, 0.5, 1.1, 0.1, '#e6c27a', 0.45, -8) + '</g>';
    case 'earth':
      return clip + base('earth') + `<g clip-path="url(#c${u})">` +
        `<path d="M ${cx - 0.55 * r} ${cy - 0.55 * r} c ${0.3 * r} ${-0.15 * r} ${0.55 * r} ${0.05 * r} ${0.45 * r} ${0.3 * r} c ${-0.1 * r} ${0.25 * r} ${-0.35 * r} ${0.2 * r} ${-0.3 * r} ${0.55 * r} c ${0.02 * r} ${0.2 * r} ${-0.3 * r} ${0.15 * r} ${-0.35 * r} ${-0.1 * r} c ${-0.08 * r} ${-0.4 * r} ${0.0} ${-0.6 * r} ${0.2 * r} ${-0.75 * r} z" fill="#3fae5a"/>` +
        `<path d="M ${cx + 0.25 * r} ${cy + 0.05 * r} c ${0.25 * r} ${-0.05 * r} ${0.45 * r} ${0.15 * r} ${0.4 * r} ${0.4 * r} c ${-0.05 * r} ${0.2 * r} ${-0.3 * r} ${0.35 * r} ${-0.4 * r} ${0.2 * r} c ${-0.1 * r} ${-0.2 * r} ${-0.15 * r} ${-0.45 * r} ${0} ${-0.6 * r} z" fill="#3fae5a"/>` +
        E(0, -0.92, 0.6, 0.14, '#ffffff', 0.95) + E(-0.1, -0.1, 0.5, 0.06, '#ffffff', 0.75, -12) + E(0.25, 0.65, 0.45, 0.06, '#ffffff', 0.7, 10) + '</g>';
    case 'mars':
      return clip + base('mars') + `<g clip-path="url(#c${u})">` + E(0, -0.88, 0.45, 0.18, '#ffffff', 0.95) + E(-0.2, 0.15, 0.4, 0.14, '#8f2f14', 0.45, 15) + E(0.35, -0.15, 0.22, 0.1, '#8f2f14', 0.4) + '</g>';
    case 'jupiter':
      return clip + base('jupiter') + `<g clip-path="url(#c${u})">` +
        band(-0.62, 0.14, '#b98656', 0.75) + band(-0.32, 0.18, '#c99b6c', 0.7) + band(0.02, 0.1, '#e8d2ad', 0.8) + band(0.2, 0.17, '#b98656', 0.75) + band(0.55, 0.12, '#c99b6c', 0.6) +
        E(0.28, 0.32, 0.22, 0.12, '#c4502c', 0.95) + '</g>';
    case 'saturn': {
      const ring = (front) => `<path d="M ${cx - 2.15 * r} ${cy} A ${2.15 * r} ${0.62 * r} 0 0 ${front ? 0 : 1} ${cx + 2.15 * r} ${cy} L ${cx + 1.45 * r} ${cy} A ${1.45 * r} ${0.38 * r} 0 0 ${front ? 1 : 0} ${cx - 1.45 * r} ${cy} Z" fill="#d9c08a" opacity="${front ? 0.95 : 0.75}" transform="rotate(-14 ${cx} ${cy})"/>`;
      return ring(false) + clip + base('saturn') + `<g clip-path="url(#c${u})">` + band(-0.55, 0.16, '#d6b16b', 0.6) + band(-0.15, 0.12, '#e8cf94', 0.6) + band(0.25, 0.16, '#d6b16b', 0.55) + '</g>' + ring(true);
    }
    case 'uranus':
      return clip + base('uranus') + `<g clip-path="url(#c${u})">` + E(0, 0, 0.12, 1.1, '#9ee3e6', 0.35, 8) + '</g>' +
        `<ellipse cx="${cx}" cy="${cy}" rx="${0.32 * r}" ry="${1.55 * r}" fill="none" stroke="#bff3f3" stroke-width="${Math.max(1, 0.06 * r)}" opacity=".7" transform="rotate(8 ${cx} ${cy})"/>`;
    case 'neptune':
      return clip + base('neptune') + `<g clip-path="url(#c${u})">` + band(-0.35, 0.12, '#4a74e0', 0.55) + band(0.3, 0.1, '#2a4bbf', 0.6) + E(-0.25, -0.05, 0.3, 0.05, '#e8f0ff', 0.75, -6) + '</g>';
    case 'moon':
      return clip + base('moon') + `<g clip-path="url(#c${u})">` + C(-0.3, -0.25, 0.22, '#8a8a8a', 0.5) + C(0.3, 0.2, 0.18, '#8a8a8a', 0.45) + C(-0.1, 0.45, 0.1, '#8a8a8a', 0.45) + '</g>';
  }
  return '';
}

// ============================================================================
// ORBIT VIEW — real order, real relative orbit speeds (1 / period).
// Distances and sizes are compressed (stated on screen) so everything fits.
// ============================================================================
const NS = 'http://www.w3.org/2000/svg';
const orbitSvg = document.getElementById('orbitSvg');
const ORBIT_R = { mercury: 95, venus: 138, earth: 182, mars: 226, jupiter: 318, saturn: 372, uranus: 418, neptune: 458 };
// display radius ~ sqrt(diameter): keeps the true size ORDER, but small planets stay visible
const SHOW_R = Object.fromEntries(PLANETS.map(p => [p.id, Math.round(4.2 + 2.25 * Math.sqrt(p.d / 1000))]));
const angle = {};
PLANETS.forEach((p, i) => { angle[p.id] = (i * 2.399) % (Math.PI * 2); });   // spread out at start
let moonAngle = 0, beltAngle = 0;
let days = 0, speed = 1, selected = 'earth', mode = 'explore';
const DAYS_PER_SEC = 365.25 / 20;   // at ▶ speed one Earth year takes 20 seconds

function buildOrbit() {
  let s = `<circle cx="500" cy="500" r="${ORBIT_R.mercury - 30}" fill="none"/>`;
  for (const p of PLANETS) s += `<circle cx="500" cy="500" r="${ORBIT_R[p.id]}" fill="none" stroke="rgba(170,185,255,0.28)" stroke-width="2"/>`;
  // asteroid belt between Mars and Jupiter
  let belt = '';
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 170; i++) {
    const a = rnd() * Math.PI * 2, rr = 252 + rnd() * 40;
    belt += `<circle cx="${(500 + rr * Math.cos(a)).toFixed(1)}" cy="${(500 + rr * Math.sin(a)).toFixed(1)}" r="${(1 + rnd() * 1.8).toFixed(1)}" fill="#a39b8f" opacity="${(0.5 + rnd() * 0.5).toFixed(2)}"/>`;
  }
  s += `<g id="belt">${belt}</g>`;
  s += `<g id="sunG" data-id="sun">${art('sun', 500, 500, 48, { glow: true })}</g>`;
  for (const p of PLANETS) {
    s += `<g id="pl-${p.id}" data-id="${p.id}"><circle class="selring" cx="0" cy="0" r="${SHOW_R[p.id] + 10}" fill="none" stroke="#ffd93d" stroke-width="4" stroke-dasharray="6 6" opacity="0"/>${art(p.id, 0, 0, SHOW_R[p.id])}` +
      (p.id === 'earth' ? `<g id="moonG">${art('moon', 0, 0, 4)}</g>` : '') + `</g>`;
  }
  s += `<text id="selLabel" x="0" y="0" text-anchor="middle" font-family="Mitr" font-size="24" font-weight="600" fill="#ffd93d" stroke="#0b1033" stroke-width="6" paint-order="stroke"></text>`;
  orbitSvg.innerHTML = s;
}
function placeOrbit() {
  for (const p of PLANETS) {
    const r = ORBIT_R[p.id], a = angle[p.id];
    const x = 500 + r * Math.cos(a), y = 500 + r * Math.sin(a);
    const g = document.getElementById('pl-' + p.id);
    g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    g._x = x; g._y = y;
    g.querySelector('.selring').setAttribute('opacity', selected === p.id ? 1 : 0);
  }
  const mg = document.getElementById('moonG');
  mg.setAttribute('transform', `translate(${(24 * Math.cos(moonAngle)).toFixed(1)} ${(24 * Math.sin(moonAngle)).toFixed(1)})`);
  document.getElementById('belt').setAttribute('transform', `rotate(${(beltAngle * 180 / Math.PI).toFixed(2)} 500 500)`);
  const lab = document.getElementById('selLabel');
  const sb = BY[selected];
  if (selected === 'sun') { lab.setAttribute('x', 500); lab.setAttribute('y', 500 + 48 + 34); lab.textContent = sb.th; }
  else if (selected === 'moon') { const g = document.getElementById('pl-earth'); lab.setAttribute('x', g._x); lab.setAttribute('y', g._y + 50); lab.textContent = sb.th; }
  else { const g = document.getElementById('pl-' + selected); lab.setAttribute('x', g._x); lab.setAttribute('y', g._y + SHOW_R[selected] + 34); lab.textContent = sb.th; }
}
function fmtDays(d) {
  const y = Math.floor(d / 365.25), rest = Math.floor(d - y * 365.25);
  return '⏱ ผ่านไป ' + (y ? y + ' ปี ' : '') + rest + ' วัน (เวลาบนโลก)';
}
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (mode !== 'size' && speed > 0 && !document.hidden) {
    const dd = dt * DAYS_PER_SEC * speed;
    days += dd;
    for (const p of PLANETS) angle[p.id] -= dd / p.periodDays * Math.PI * 2;   // counter-clockwise seen from above the north pole
    moonAngle -= dd / 27.32 * Math.PI * 2;
    beltAngle -= dd / 1680 * Math.PI * 2;                                       // ~4.6-year average belt orbit
    placeOrbit();
    document.getElementById('clock').textContent = fmtDays(days);
  }
  requestAnimationFrame(tick);
}

// tap in the orbit view → nearest body (generous radius, little fingers)
orbitSvg.addEventListener('pointerdown', (e) => {
  ensureAudio();
  const pt = orbitSvg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const q = pt.matrixTransform(orbitSvg.getScreenCTM().inverse());
  let best = null, bd = 1e9;
  const consider = (id, x, y, r) => { const d = Math.hypot(q.x - x, q.y - y) - r; if (d < bd) { bd = d; best = id; } };
  consider('sun', 500, 500, 48);
  for (const p of PLANETS) { const g = document.getElementById('pl-' + p.id); consider(p.id, g._x, g._y, SHOW_R[p.id]); }
  const eg = document.getElementById('pl-earth');
  consider('moon', eg._x + 24 * Math.cos(moonAngle), eg._y + 24 * Math.sin(moonAngle), 4);
  if (best && bd < 60) choose(best);
});

// ============================================================================
// SIZE VIEW — all diameters to the same true scale (Earth radius = 16 units)
// ============================================================================
function buildSize() {
  const sv = document.getElementById('sizeSvg');
  const K = 16 / (EARTH_D / 2);                 // units per km of radius
  const cy = 300;
  const sunR = BY.sun.d / 2 * K;                // ≈ 1747 — far bigger than the screen
  let s = `<g data-id="sun">${art('sun', 210 - sunR, cy, sunR)}</g>`;
  s += `<text x="40" y="${cy}" font-family="Mitr" font-size="30" font-weight="600" fill="#5a2a00">ดวงอาทิตย์</text>`;
  let x = 250;
  for (const p of PLANETS) {
    const r = p.d / 2 * K;
    const half = p.id === 'saturn' ? r * 2.27 : Math.max(r, 6);   // Saturn's main rings reach ~2.27× its radius
    x += half;
    s += `<g data-id="${p.id}">${art(p.id, x, cy, r)}</g>`;
    const big = r > 40;
    s += big
      ? `<text x="${x}" y="${cy + r + 44}" text-anchor="middle" font-family="Mitr" font-size="24" font-weight="600" fill="#fff">${p.th}</text>`
      : `<line x1="${x}" y1="${cy + r + 6}" x2="${x}" y2="${cy + (p.order % 2 ? 130 : 200)}" stroke="#aab3e6" stroke-width="2"/><text x="${x}" y="${cy + (p.order % 2 ? 160 : 230)}" text-anchor="middle" font-family="Mitr" font-size="22" font-weight="600" fill="#fff">${p.th}</text>`;
    x += half + 34;
  }
  sv.innerHTML = s;
  sv.addEventListener('pointerdown', (e) => {
    const g = e.target.closest('[data-id]'); if (g) { ensureAudio(); choose(g.dataset.id); }
  });
}

  document.getElementById('sayBtn').addEventListener('click', () => { ensureAudio(); speak(b.say + ' ' + b.know[0]); });

function markStrip(id) { for (const el of strip.children) el.classList.toggle('sel', el.dataset.id === id); }

function choose(id) {

}

    <div class="levels" id="lv">
      <button class="chip ${level === 1 ? 'on' : ''}" data-lv="1">⭐ หาตามชื่อ</button>
      <button class="chip ${level === 2 ? 'on' : ''}" data-lv="2">⭐⭐ ทายจากคำใบ้</button>
    </div>
    <div class="q-text">${level === 1 ? '🔎 หา' : '🤔'} ${target.q}</div>
    <div class="q-hint">แตะดาวในภาพ หรือปุ่มดาวด้านล่าง</div>
    <div style="text-align:center;margin-top:8px"><button class="say" id="sayBtn" style="margin:0" aria-label="ฟังคำถาม">🔊</button></div>
    <div class="score">${'⭐'.repeat(stars % 10)}${stars >= 10 ? ' ×' + stars : ''}</div>`;
  document.getElementById('sayBtn').addEventListener('click', () => speak(target.say));
  for (const b of panel.querySelectorAll('[data-lv]')) b.addEventListener('click', () => { level = +b.dataset.lv; buzz(8); newQuestion(); });
}
function answer(id) {
  if (waiting || !target) return;
  if (id === target.id) {
    waiting = true; stars++;
    selected = id; markStrip(id); placeOrbit();
    cheer(); celebrate(90); buzz([30, 20, 40]);
    speak('เก่งมาก นั่นคือ' + BY[id].th);
    renderMission();
    setTimeout(newQuestion, 2600);
  } else {
    const btn = strip.querySelector(`[data-id="${id}"]`);
    if (btn) { btn.classList.remove('wobble'); void btn.offsetWidth; btn.classList.add('wobble'); }
    boop(); buzz(25);
    speak('นี่คือ' + BY[id].th + ' ลองใหม่นะ');
  }
}

// ============================================================================
// MODES + SPEED
// ============================================================================
function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('#modes .chip')) b.classList.toggle('on', b.dataset.mode === m);
  document.getElementById('orbitView').classList.toggle('hidden', m === 'size');
  document.getElementById('sizeView').classList.toggle('hidden', m !== 'size');
  document.getElementById('ctrls').classList.toggle('hidden', m === 'size');
  if (m === 'mission') { target = null; newQuestion(); }
  else { renderInfo(selected); markStrip(selected); }
}
for (const b of document.querySelectorAll('#modes .chip')) b.addEventListener('click', () => { ensureAudio(); buzz(8); setMode(b.dataset.mode); });
for (const b of document.querySelectorAll('#ctrls .chip')) b.addEventListener('click', () => {
  speed = +b.dataset.speed; buzz(8);
  for (const o of document.querySelectorAll('#ctrls .chip')) o.classList.toggle('on', o === b);
});

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
}
function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
const blip = (f) => tone(f, 0.12, 'sine', 0.1);
const boop = () => tone(220, 0.22, 'triangle', 0.12);
function cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.15), i * 110)); }
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function pickVoice() {
  try { return (speechSynthesis.getVoices() || []).find(v => (v.lang || '').toLowerCase().startsWith('th')) || null; } catch (e) { return null; }
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
function speak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function celebrate(n) {
  const cols = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#9b59b6', '#ff914d'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// twinkling star field behind everything
(function stars() {
  const cv = document.getElementById('stars'), ctx = cv.getContext('2d');
  let pts = [];
  function size() {
    cv.width = innerWidth * (devicePixelRatio || 1); cv.height = innerHeight * (devicePixelRatio || 1);
    cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    pts = Array.from({ length: 160 }, () => [Math.random() * cv.width, Math.random() * cv.height, Math.random() * 1.6 + 0.4, Math.random() * 6.28]);
  }
  function draw(t) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of pts) { ctx.globalAlpha = 0.35 + 0.45 * Math.abs(Math.sin(t / 1400 + p[3])); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p[0], p[1], p[2] * (devicePixelRatio || 1), 0, 6.283); ctx.fill(); }
    requestAnimationFrame(draw);
  }
  addEventListener('resize', size); size(); requestAnimationFrame(draw);
})();

// Block double-tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

// Init
buildOrbit(); buildSize(); buildStrip();
placeOrbit(); markStrip(selected); renderInfo(selected);
requestAnimationFrame(tick);
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
