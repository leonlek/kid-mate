<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --paper: #fffef9; --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden; overflow-x: clip;   /* clip keeps position: sticky working (hidden breaks it) */
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }
  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 820px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 6px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 48px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .hidden { display: none !important; }

  .modes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 6px 0 10px; }
  .mode {
    font-family: 'Mitr', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.15;
    min-height: 72px; padding: 6px 4px; border-radius: 22px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.16); transition: transform .1s;
  }
  .mode b { display: block; font-size: 28px; line-height: 1.1; }
  .mode { overflow-wrap: anywhere; min-width: 0; }
  .mode.on { background: var(--gold); border-color: #e0b400; }
  .mode:active, .btn:active, .chip:active, .fcard:active, .opt:active, .sw:active { transform: translateY(3px); }

  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 4px 0 10px; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 17px; font-weight: 600;
    min-height: 52px; min-width: 64px; padding: 0 16px; border-radius: 999px;
    border: 3px solid var(--card-border); background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .fcard {
    position: relative; background: var(--card); border: 3px solid var(--card-border); border-radius: 20px;
    padding: 8px 6px 6px; cursor: pointer; font-family: 'Mitr', sans-serif; color: var(--ink);
    box-shadow: 0 5px 0 rgba(0,0,0,0.14); min-height: 104px;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px;
  }
  .fcard .fl { width: 100%; height: 62px; display: flex; align-items: center; justify-content: center; }
  .fcard img { max-width: 92%; max-height: 62px; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .fcard img.np { box-shadow: none; filter: drop-shadow(0 0 1px rgba(0,0,0,.4)); }
  .fcard span { font-size: 15px; font-weight: 600; line-height: 1.15; text-align: center; }
  .fcard i { position: absolute; top: -8px; right: -6px; font-style: normal; font-size: 24px; }
  .fcard .lv { position: absolute; top: -9px; left: -4px; font-size: 12px; background: #fff; border-radius: 999px; padding: 0 5px; border: 2px solid var(--card-border); }

  /* paint */
  .ptitle { text-align: center; font-family: 'Itim', cursive; font-size: clamp(26px, 6vw, 38px); color: var(--brand-dark); text-shadow: 2px 2px 0 #fff; margin: 0 56px; min-height: 40px; }
  .stage { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px; margin: 4px 0; }
  #cv { display: block; touch-action: none; cursor: pointer; filter: drop-shadow(0 6px 0 rgba(0,0,0,0.15)); }
  #cv.bump { animation: bump .35s ease; }
  @keyframes bump { 50% { transform: scale(1.03); } }
  .ref {
    display: flex; align-items: center; gap: 8px; background: #fff; border: 3px solid var(--card-border); border-radius: 14px;
    padding: 5px; box-shadow: 0 4px 0 rgba(0,0,0,0.15); z-index: 3; text-align: center; font-size: 13px; font-weight: 600;
  }
  .ref img { display: block; height: 52px; max-width: 110px; object-fit: contain; }
  .ref.big img { height: 90px; max-width: 180px; }
  .palette { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 10px 0 6px; }
  .sw {
    width: 68px; height: 68px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    box-shadow: 0 0 0 3px rgba(0,0,0,0.18), 0 5px 0 rgba(0,0,0,0.18); transition: transform .12s;
  }
  .sw.on { transform: scale(1.18); box-shadow: 0 0 0 4px var(--ink), 0 5px 0 rgba(0,0,0,0.25); }
  .sw.hint { animation: hint .5s ease 3; }
  @keyframes hint { 50% { transform: scale(1.3) rotate(-8deg); } }
  .ctrls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  .btn {
    font-family: 'Mitr', sans-serif; font-size: 19px; font-weight: 700;
    min-height: 64px; min-width: 64px; padding: 0 20px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
  }
  .btn.go { background: var(--brand); border-color: var(--brand-dark); color: #fff; animation: pulse .9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06); } }
  .info {
    background: var(--paper); border: 3px solid var(--card-border); border-radius: 24px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.14); padding: 10px 14px; margin: 8px auto 0; max-width: 560px;
  }
  .info .ln { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 14px; cursor: pointer; min-height: 52px; }
  .info .ln:active { background: #fff3c4; }
  .info .ln.say { background: #fff3c4; }
  .info .ln::after { content: '🔊'; margin-left: auto; font-size: 22px; }
  .info .nm { font-size: 24px; font-weight: 700; }
  .info .nm small, .info .hi small { font-weight: 500; font-size: 16px; color: #636e72; }
  .info .hi { font-size: 26px; font-weight: 600; }
  .info .ft { font-size: 17px; line-height: 1.4; }
  .score { text-align: center; font-size: 22px; font-weight: 700; min-height: 30px; color: var(--brand-dark); }

  /* map */
  #mapSvg { display: block; width: 100%; height: auto; border-radius: 22px; border: 4px solid #fff; box-shadow: 0 6px 0 rgba(0,0,0,0.15); background: #8fd3f4; touch-action: manipulation; }
  #mapSvg .pin { cursor: pointer; }
  .count { text-align: center; font-family: 'Itim', cursive; font-size: 28px; color: var(--brand-dark); text-shadow: 2px 2px 0 #fff; }

  /* quiz */
  .q { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 12px; }
  .q .txt { font-size: clamp(22px, 5.5vw, 32px); font-weight: 700; text-align: center; }
  .opts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 680px; margin: 0 auto; }
  .opt {
    background: #fff; border: 4px solid var(--card-border); border-radius: 22px; padding: 10px 8px; cursor: pointer; min-height: 100px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .opt img { max-width: 100%; max-height: 120px; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); }
  .opt img.np { box-shadow: none; }
  .opt.ok { border-color: #2ecc71; background: #eafff1; animation: bump .4s ease; }
  .opt.no { opacity: .45; animation: shake .4s ease; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .stars { text-align: center; font-size: 26px; min-height: 36px; margin-top: 10px; }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 420px) { .mode { font-size: 12px; padding: 6px 2px; } .mode b { font-size: 24px; } }

  /* 👆 know */
  .kstage {
    position: sticky; top: calc(70px + env(safe-area-inset-top)); z-index: 5; display: flex; gap: 10px; align-items: center;
    background: var(--paper); border: 3px solid var(--card-border); border-radius: 24px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.14); padding: 8px 10px; margin: 0 0 12px;
  }
  .kflag { flex: 0 0 36%; display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; min-height: 96px; perspective: 500px; }
  .kflag img { max-width: 100%; max-height: 120px; box-shadow: 0 0 0 1px rgba(0,0,0,0.25); transform-origin: left center; }
  .kflag img.np { box-shadow: none; }
  .kflag img.fly { animation: flutter 1.6s ease-in-out infinite; }
  @keyframes flutter { 0%, 100% { transform: rotateY(-10deg) skewY(-1.5deg); } 50% { transform: rotateY(8deg) skewY(1.5deg); } }
  .kside { flex: 1; min-width: 0; }
  .kside .info { border: 0; box-shadow: none; padding: 0; margin: 0; background: transparent; }
  .kside .info .nm { font-size: 21px; } .kside .info .hi { font-size: 20px; } .kside .info .ft { font-size: 15px; }
  .kside .info .ln { min-height: 44px; padding: 3px 4px; }
  .khelp { font-size: 20px; font-weight: 600; text-align: center; padding: 18px 4px; }
  .kflag .btn { min-height: 52px; font-size: 15px; padding: 0 10px; }
  .kside .info .ft { line-height: 1.3; }
  .fcard.on { border-color: var(--brand); background: #fff0f6; }
</style>
</head>

// ============================================================================
// FLAGS — official geometry and colours. Simple flags are built here from their
// legal construction sheets; the complex emblems (Angkor Wat, Sun of May, Brazil's
// stars and lettering) and several layouts are taken from the Wikimedia Commons
// SVGs (public domain). Each flag: viewBox `vb`, optional `defs`, colours `col`,
// paintable regions `regs` = [colourKey, svg] drawn back→front (a later region hides
// what's under it), and fixed `decor` drawn on top. Regions use fill="currentColor".
// Tiny parts (stars, a sun, trigrams) add a 3rd item: a big "hit" shape — a tap
// anywhere inside it paints the tiny part (see pickRegion), and they glow when the
// chosen colour is theirs, so a 3-year-old finger never has to land on a 4 mm star.

const R = (x, y, w, h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const C = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}"/>`;
function STAR(cx, cy, Rr, rot = 0, n = 5, k = 0.382) {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const a = (-90 + rot) * Math.PI / 180 + i * Math.PI / n, r = i % 2 ? Rr * k : Rr;
    p.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2));
  }
  return `<polygon points="${p.join(' ')}"/>`;
}
const toward = (cx, cy, tx, ty) => Math.atan2(ty - cy, tx - cx) * 180 / Math.PI + 90;
const STROKE = (d, w, extra = '') => `<path d="${d}" fill="none" stroke="currentColor" stroke-width="${w}" ${extra}/>`;

// US: 13 stripes, union 7 stripes high × 0.76 H, 50 stars in 9 rows (Executive Order 10834)
const US_H = 3900, US_S = 300, US_G = 0.063 * US_H, US_E = 0.054 * US_H, US_K = 0.0616 * US_H / 2;
function usStars() {
  let s = '';
  for (let r = 0; r < 9; r++) {
    const six = r % 2 === 0;
    for (let k = 0; k < (six ? 6 : 5); k++) s += STAR(US_G * (six ? 2 * k + 1 : 2 * k + 2), US_E * (r + 1), US_K);
  }
  return s;
}
const usStripes = (odd) => { let s = ''; for (let i = odd ? 1 : 0; i < 13; i += 2) s += R(0, i * US_S, 7410, US_S); return s; };

  $('qStars').textContent = qStars ? '⭐'.repeat(((qStars - 1) % 10) + 1) : '';
  say(['ธงไหนเป็นของประเทศ' + sayName(qAns)]);
}
function answer(f, b) {
  if (qLocked || b.classList.contains('no')) return;
  ac();
  if (f === qAns) {
    qLocked = true; b.classList.add('ok'); sfx.win(); vib([30, 50, 60]); qStars++;
    $('qStars').textContent = '⭐'.repeat(((qStars - 1) % 10) + 1);
    $('qNext').classList.remove('hidden');
    say([[LINES.right], ...flagLines(f).slice(1, 3)]);
  } else {
    b.classList.add('no'); sfx.wrong(); vib(40);
    say([[LINES.thisIs], ['ธงชาติ' + sayName(f)]]);
  }
}
$('qSay').addEventListener('click', () => { ac(); if (qAns) say(['ธงไหนเป็นของประเทศ' + sayName(qAns)]); });
$('qNext').addEventListener('click', () => { ac(); sfx.tap(); newQuestion(); });

// #jp opens a flag to paint, #map / #quiz / #free / #know open a mode
const H = location.hash.slice(1);
if (BY[H]) { setMode('follow', true); openFlag(BY[H], 'follow'); }
else if (['map', 'quiz', 'free', 'know'].includes(H)) setMode(H, true);
else setMode('follow', true);
