<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🍪 ดินน้ำมัน — คิดส์เล่น</title>
<meta name="description" content="ปั้นดินน้ำมัน กดพิมพ์คุกกี้รูปหัวใจ ดาว ดอกไม้ โรยเม็ดน้ำตาล คลึงเป็นเส้นงู กดให้เด้ง มีเสียงนุ่มๆ เล่นเพลินสำหรับเด็กเล็ก">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ดินน้ำมัน">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --ink: #2d3436; --paper: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    height: 100dvh; overflow: hidden;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 65%, #7ed957 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body { display: flex; flex-direction: column; }

  .home {
    position: fixed; top: 12px; left: 12px; z-index: 30;
    width: 52px; height: 52px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none;
    background: var(--paper); border: 4px solid var(--card-border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: transform .12s, box-shadow .12s;
  }
  .home:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }

  .stage { flex: 1; min-height: 0; position: relative; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .toolbar {
    flex-shrink: 0; background: var(--paper);
    border-top: 4px solid var(--card-border);
    box-shadow: 0 -4px 0 rgba(0,0,0,0.05);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 20;
  }
  .palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .swatch {
    width: 44px; height: 44px; border-radius: 999px;
    border: 3px solid rgba(0,0,0,0.12); box-shadow: 0 3px 0 rgba(0,0,0,0.10);
    cursor: pointer; padding: 0; transition: transform .12s;
  }
  .swatch:active { transform: scale(0.9); }
  .swatch.sel { transform: scale(1.14); border-color: var(--ink);
                box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--brand); }

  .row { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .cutter {
    width: 54px; height: 54px; border-radius: 16px;
    border: 3px solid var(--card-border); background: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08); transition: transform .12s, background .12s, border-color .12s;
    padding: 0;
  }
  .cutter:active { transform: scale(0.92); }
  .cutter.sel { border-color: var(--brand-dark); background: #fff0f6; transform: scale(1.06); }
  .sep { width: 3px; height: 34px; background: var(--card-border); border-radius: 3px; }
  .tbtn {
    min-width: 58px; height: 56px; padding: 0 10px;
    border-radius: 18px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.10); }
  .tbtn.active { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  @media (max-width: 380px) {
    .swatch { width: 38px; height: 38px; }
    .cutter { width: 48px; height: 48px; }
    .tbtn { min-width: 52px; height: 50px; font-size: 23px; }
  }
</style>
</head>
<body>
  <a class="home" href="../" aria-label="กลับหน้าหลัก">🏠</a>

  <div class="stage">
    <canvas id="board"></canvas>
  </div>

  <div class="toolbar">
    <div class="palette" id="palette"></div>
    <div class="row" id="cutters"></div>
    <div class="row">
      <button class="tbtn" id="sprinkleBtn" aria-label="โรยเม็ด">🍬</button>
      <button class="tbtn" id="snakeBtn" aria-label="เส้นงู">🐍</button>
      <div class="sep"></div>
      <button class="tbtn" id="clearBtn" aria-label="ล้างทั้งหมด">🗑️</button>
      <button class="tbtn" id="saveBtn" aria-label="บันทึกรูป">💾</button>
      <button class="tbtn active" id="soundBtn" aria-label="เสียง">🔊</button>
    </div>
  </div>

<script>
(function () {
  'use strict';

  // ---- Config -------------------------------------------------------------
  var PLATE = '#fdf1df';
  var COLORS = ['#ff9ec0','#8fc6ff','#ffd76b','#a6e08a','#c9a6f0','#b06b3f','#fff2d6','#ffb066'];
  var SPRINKLE = ['#ff5757','#4a90e2','#ffd93d','#5bc13a','#ff6bb0','#a259d6','#ff9f43','#20b6b6'];
  var CUTTERS = [
    { id:'circle', label:'วงกลม' }, { id:'heart', label:'หัวใจ' },
    { id:'star', label:'ดาว' }, { id:'flower', label:'ดอกไม้' },
    { id:'moon', label:'พระจันทร์' }, { id:'person', label:'ตุ๊กตา' }
  ];
  var MAX_ITEMS = 60;

  // ---- State --------------------------------------------------------------
  var color = COLORS[0];
  var shape = CUTTERS[0].id;
  var mode = 'stamp';           // stamp | sprinkle | snake
  var soundOn = true;
  var items = [];               // cookies + ropes, drawn in order

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var stage = canvas.parentNode;
  var dpr = 1, W = 0, H = 0, baseR = 60;

  // ---- Audio (generated) --------------------------------------------------
  var actx = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  }
  function tone(freq, dur, type, gain, slideTo) {
    if (!actx || !soundOn) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  var noiseBuf = null;
  function squelch(freq, gain) {
    if (!actx || !soundOn) return;
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.2, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    var t = actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseBuf;
    var bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq || 400; bp.Q.value = 1.1;
    var g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain || 0.12, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
    s.connect(bp); bp.connect(g); g.connect(actx.destination); s.start(t); s.stop(t + 0.13);
  }
  function sndPlop()  { tone(120, 0.17, 'sine', 0.30, 58); squelch(320, 0.13); }
  function sndSquish(){ tone(175, 0.13, 'sine', 0.26, 82); squelch(520, 0.10); }
  function sndTick()  { tone(1250, 0.05, 'square', 0.10, 1550); }
  function sndSnake() { tone(150, 0.20, 'sine', 0.20, 120); }
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---- Colour helpers -----------------------------------------------------
  function hexToHsl(hex) {
    var r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = 0, l = (mx + mn) / 2;
    if (mx !== mn) { var d = mx - mn; s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
      if (mx === r) h = (g - b) / d + (g < b ? 6 : 0); else if (mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4; h *= 60; }
    return { h: h, s: Math.round(s * 100), l: Math.round(l * 100) };
  }
  function shades(hex) {
    var c = hexToHsl(hex);
    function L(dl) { return 'hsl(' + c.h + ',' + c.s + '%,' + Math.max(8, Math.min(96, c.l + dl)) + '%)'; }
    return { fill: L(0), light: L(13), rim: L(-17) };
  }

  // ---- Sizing -------------------------------------------------------------
  function fit() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    baseR = Math.max(38, Math.min(W, H) * 0.11);
  }

  // ---- Shape paths (centred at origin, extent ~R) -------------------------
  function starPts(R) {
    var a = [];
    for (var i = 0; i < 10; i++) { var rr = (i % 2) ? R * 0.42 : R; var t = -Math.PI / 2 + i * Math.PI / 5;
      a.push([Math.cos(t) * rr, Math.sin(t) * rr]); }
    return a;
  }
  function buildPath(s, R) {
    ctx.beginPath();
    if (s === 'circle') { ctx.arc(0, 0, R, 0, Math.PI * 2); return 'nonzero'; }
    if (s === 'heart') {
      ctx.moveTo(0, R * 0.72);
      ctx.bezierCurveTo(-R * 1.08, -R * 0.06, -R * 0.5, -R * 0.95, 0, -R * 0.34);
      ctx.bezierCurveTo(R * 0.5, -R * 0.95, R * 1.08, -R * 0.06, 0, R * 0.72);
      return 'nonzero';
    }
    if (s === 'star') { var p = starPts(R); ctx.moveTo(p[0][0], p[0][1]);
      for (var i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); return 'nonzero'; }
    if (s === 'flower') {
      for (var k = 0; k < 6; k++) { var t = -Math.PI / 2 + k * Math.PI / 3;
        var px = Math.cos(t) * R * 0.55, py = Math.sin(t) * R * 0.55;
        ctx.moveTo(px + R * 0.42, py); ctx.arc(px, py, R * 0.42, 0, Math.PI * 2); }
      ctx.moveTo(R * 0.36, 0); ctx.arc(0, 0, R * 0.36, 0, Math.PI * 2); return 'nonzero';
    }
    if (s === 'moon') { ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.arc(R * 0.34, 0, R * 0.80, 0, Math.PI * 2); return 'evenodd'; }
    if (s === 'person') {
      ctx.moveTo(R * 0.34, -R * 0.62); ctx.arc(0, -R * 0.62, R * 0.34, 0, Math.PI * 2); // head
      ctx.rect(-R * 0.30, -R * 0.30, R * 0.60, R * 0.72);   // body
      ctx.rect(-R * 0.88, -R * 0.20, R * 1.76, R * 0.26);   // arms
      ctx.rect(-R * 0.34, R * 0.38, R * 0.24, R * 0.55);    // left leg
      ctx.rect(R * 0.10, R * 0.38, R * 0.24, R * 0.55);     // right leg
      return 'nonzero';
    }
    return 'nonzero';
  }

  // ---- Draw ---------------------------------------------------------------
  function drawCookie(k) {
    ctx.save();
    ctx.translate(k.x, k.y);
    ctx.scale(k.sx, k.sy);
    var rule = buildPath(k.shape, k.R);
    ctx.fillStyle = k.fill; ctx.fill(rule);
    // matte bevel + top highlight (clipped)
    ctx.save(); ctx.clip(rule);
    var g = ctx.createRadialGradient(-k.R * 0.25, -k.R * 0.30, k.R * 0.1, 0, 0, k.R * 1.15);
    g.addColorStop(0, k.light); g.addColorStop(0.6, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, k.R * 1.3, 0, Math.PI * 2); ctx.fill();
    // sprinkles
    for (var i = 0; i < k.spr.length; i++) {
      var sp = k.spr[i];
      ctx.save();
      ctx.translate(sp.lx * k.R, sp.ly * k.R); ctx.rotate(sp.ang);
      ctx.fillStyle = sp.col;
      roundRect(-k.R * 0.11, -k.R * 0.035, k.R * 0.22, k.R * 0.07, k.R * 0.035);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
    // rim (skip crescent — its two-circle path would draw a stray inner ring)
    if (k.shape !== 'moon') {
      buildPath(k.shape, k.R);
      ctx.lineWidth = Math.max(2, k.R * 0.09); ctx.strokeStyle = k.rim;
      ctx.lineJoin = 'round'; ctx.stroke();
    }
    ctx.restore();
  }
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function drawRope(k) {
    if (k.pts.length < 2) {
      if (!k.pts.length) return;
      var p = k.pts[0];
      ctx.beginPath(); ctx.fillStyle = k.fill; ctx.arc(p.x, p.y, k.R, 0, Math.PI * 2); ctx.fill();
      return;
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    function stroke(col, wd) {
      ctx.beginPath(); ctx.moveTo(k.pts[0].x, k.pts[0].y);
      for (var i = 1; i < k.pts.length; i++) ctx.lineTo(k.pts[i].x, k.pts[i].y);
      ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.stroke();
    }
    stroke(k.rim, k.R * 2 + 4);
    stroke(k.fill, k.R * 2);
    stroke(k.light, k.R * 0.7);
  }

  function draw() {
    ctx.fillStyle = PLATE; ctx.fillRect(0, 0, W, H);
    for (var i = 0; i < items.length; i++) {
      var k = items[i];
      if (k.type === 'rope') drawRope(k); else drawCookie(k);
    }
  }

  // ---- Physics (squish springs) ------------------------------------------
  function step() {
    for (var i = 0; i < items.length; i++) {
      var k = items[i];
      if (k.type === 'rope') continue;
      k.vsx += (1 - k.sx) * 0.22; k.vsx *= 0.62; k.sx += k.vsx;
      k.vsy += (1 - k.sy) * 0.22; k.vsy *= 0.62; k.sy += k.vsy;
    }
  }

  // ---- Items --------------------------------------------------------------
  function trim() { while (items.length > MAX_ITEMS) items.shift(); }
  function newCookie(x, y) {
    var sh = shades(color);
    items.push({ type: 'cookie', shape: shape, x: x, y: y, R: baseR,
                 fill: sh.fill, light: sh.light, rim: sh.rim,
                 sx: 0.35, sy: 0.35, vsx: 0.22, vsy: 0.22, spr: [] });
    trim();
  }
  function squish(k) { k.vsx += 0.55; k.vsy -= 0.55; }
  function addSprinkles(k, x, y) {
    var lx = (x - k.x) / k.R, ly = (y - k.y) / k.R;
    for (var i = 0; i < 5; i++) {
      k.spr.push({ lx: lx + (Math.random() - 0.5) * 0.5, ly: ly + (Math.random() - 0.5) * 0.5,
                   ang: Math.random() * Math.PI, col: SPRINKLE[(Math.random() * SPRINKLE.length) | 0] });
    }
  }
  function hitCookie(x, y) {
    for (var i = items.length - 1; i >= 0; i--) {
      var k = items[i];
      if (k.type === 'cookie' && Math.hypot(x - k.x, y - k.y) <= k.R * 1.02) return k;
    }
    return null;
  }

  // ---- Pointer ------------------------------------------------------------
  var rope = null, lastX = 0, lastY = 0;
  function rel(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault(); ensureAudio();
    var p = rel(e);
    if (mode === 'snake') {
      var sh = shades(color);
      rope = { type: 'rope', pts: [{ x: p.x, y: p.y }], R: baseR * 0.4, fill: sh.fill, light: sh.light, rim: sh.rim };
      items.push(rope); trim(); lastX = p.x; lastY = p.y;
      sndSnake(); buzz(8);
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    var k = hitCookie(p.x, p.y);
    if (mode === 'sprinkle') {
      if (k) { addSprinkles(k, p.x, p.y); squish(k); sndTick(); buzz(6); }
      return;
    }
    // stamp mode
    if (k) { squish(k); sndSquish(); buzz(10); }
    else { newCookie(p.x, p.y); sndPlop(); buzz(12); }
  });

  canvas.addEventListener('pointermove', function (e) {
    if (!rope) return;
    e.preventDefault();
    var p = rel(e);
    if (Math.hypot(p.x - lastX, p.y - lastY) > baseR * 0.35) {
      rope.pts.push({ x: p.x, y: p.y }); lastX = p.x; lastY = p.y;
    }
  });
  function endRope() { rope = null; }
  canvas.addEventListener('pointerup', endRope);
  canvas.addEventListener('pointercancel', endRope);
  canvas.addEventListener('lostpointercapture', endRope);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- UI -----------------------------------------------------------------
  var palette = document.getElementById('palette'), swatchEls = [];
  COLORS.forEach(function (c, i) {
    var b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' sel' : ''); b.style.background = c;
    if (c.toLowerCase() === '#fff2d6') b.style.borderColor = '#e7d4a8';
    b.addEventListener('click', function () {
      color = c; setMode('stamp');
      swatchEls.forEach(function (s) { s.classList.remove('sel'); }); b.classList.add('sel'); buzz(8);
    });
    palette.appendChild(b); swatchEls.push(b);
  });

  var cutters = document.getElementById('cutters'), cutterEls = [];
  CUTTERS.forEach(function (cu, i) {
    var b = document.createElement('button');
    b.className = 'cutter' + (i === 0 ? ' sel' : '');
    b.setAttribute('aria-label', cu.label);
    b.appendChild(cutterIcon(cu.id));
    b.addEventListener('click', function () {
      shape = cu.id; setMode('stamp');
      cutterEls.forEach(function (s) { s.classList.remove('sel'); }); b.classList.add('sel'); buzz(8);
    });
    cutters.appendChild(b); cutterEls.push(b);
  });
  function cutterIcon(id) {
    var S = 44, r = window.devicePixelRatio || 1;
    var cv = document.createElement('canvas'); cv.width = S * r; cv.height = S * r;
    cv.style.width = S + 'px'; cv.style.height = S + 'px';
    var c = cv.getContext('2d'); c.setTransform(r, 0, 0, r, 0, 0);
    c.translate(S / 2, S / 2);
    var save = ctx; ctx = c;            // reuse buildPath with the icon context
    var rule = buildPath(id, S * 0.34);
    c.fillStyle = '#ff9ec0'; c.fill(rule);
    c.lineWidth = 2; c.strokeStyle = '#d46a8f'; c.lineJoin = 'round'; c.stroke();
    ctx = save;
    return cv;
  }

  var sprinkleBtn = document.getElementById('sprinkleBtn');
  var snakeBtn = document.getElementById('snakeBtn');
  var soundBtn = document.getElementById('soundBtn');
  function setMode(m) {
    mode = m;
    sprinkleBtn.classList.toggle('active', m === 'sprinkle');
    snakeBtn.classList.toggle('active', m === 'snake');
    cutterEls.forEach(function (b, i) { b.classList.toggle('sel', m === 'stamp' && CUTTERS[i].id === shape); });
  }
  sprinkleBtn.addEventListener('click', function () { setMode(mode === 'sprinkle' ? 'stamp' : 'sprinkle'); buzz(8); });
  snakeBtn.addEventListener('click', function () { setMode(mode === 'snake' ? 'stamp' : 'snake'); buzz(8); });

  document.getElementById('clearBtn').addEventListener('click', function () { items = []; buzz(15); });
  document.getElementById('saveBtn').addEventListener('click', function () {
    var url; try { url = canvas.toDataURL('image/png'); } catch (e) { return; }
    var a = document.createElement('a'); a.href = url; a.download = 'ดินน้ำมัน.png';
    document.body.appendChild(a); a.click(); a.remove(); buzz(20);
  });
  soundBtn.addEventListener('click', function () {
    soundOn = !soundOn; soundBtn.classList.toggle('active', soundOn);
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) { ensureAudio(); sndPlop(); } buzz(8);
  });

  // ---- Loop ---------------------------------------------------------------
  function frame() { step(); draw(); requestAnimationFrame(frame); }
  fit(); requestAnimationFrame(frame);
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(fit, 150); });
  window.addEventListener('orientationchange', function () { clearTimeout(rt); rt = setTimeout(fit, 250); });
})();
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }

</script>
