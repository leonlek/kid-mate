<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>👀 ดูแล้ววาด — เกมสำหรับเด็ก</title>
<meta name="description" content="ดูรูปตัวอย่างที่มุมจอ แล้ววาดเองอิสระบนกระดาน ฝึกสังเกตและวาดตามแบบ มีบ้าน รถไฟ สะพานข้ามทางรถไฟ และอีกมากมาย">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ดูแล้ววาด">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon.svg">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --paper: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 65%, #7ed957 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body { display: flex; flex-direction: column; }

  /* Home button — fixed top-left, matches the family style */
  .home {
    position: fixed; top: 12px; left: 12px; z-index: 30;
    width: 52px; height: 52px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none;
    background: var(--paper); border: 4px solid var(--card-border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: transform .12s, box-shadow .12s;
  }
  .home:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }

  /* Drawing stage */
  .stage { flex: 1; min-height: 0; position: relative; }
  #board {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
    background: var(--paper);
  }

  /* Reference card — top-right, shows the picture to copy */
  .refcard {
    position: fixed; top: 12px; right: 12px; z-index: 30; width: 118px;
    background: var(--paper); border: 4px solid var(--card-border); border-radius: 18px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.12); padding: 6px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .refcard.hide { display: none; }
  .rimg { width: 100%; border-radius: 12px; overflow: hidden; background: #fff; cursor: pointer; position: relative; }
  .rimg svg { width: 100%; height: auto; display: block; }
  .rimg::after { content: '🔍'; position: absolute; right: 3px; bottom: 1px; font-size: 13px; opacity: .7; }
  .rlabel { font-family: 'Itim', cursive; font-size: 13px; text-align: center; color: var(--brand-dark); line-height: 1.15; }
  .rchange {
    font-family: 'Mitr', sans-serif; font-size: 13px; font-weight: 600; color: #fff;
    background: var(--brand); border: none; border-radius: 999px; padding: 6px 0; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12); transition: transform .12s, box-shadow .12s;
  }
  .rchange:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.12); }

  /* Enlarged reference overlay */
  .refbig { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.5);
            display: none; align-items: center; justify-content: center; padding: 20px; }
  .refbig.open { display: flex; }
  .refbig .box { background: #fff; border: 6px solid #fff; border-radius: 24px;
                 box-shadow: 0 10px 0 rgba(0,0,0,0.2); width: min(82vw, 70vh); }
  .refbig .box svg { width: 100%; height: auto; display: block; border-radius: 18px; }
  .refbig .bl { font-family: 'Itim', cursive; font-size: 22px; text-align: center;
                color: var(--brand-dark); padding: 8px 6px 2px; }

  /* Subject picker screen */
  .picker { position: fixed; inset: 0; z-index: 70; display: flex; flex-direction: column;
            background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 65%, #7ed957 100%); }
  .picker.hide { display: none; }
  .phead { flex-shrink: 0; display: flex; align-items: center; gap: 8px;
           padding: calc(10px + env(safe-area-inset-top)) 12px 6px; }
  .phead h1 { flex: 1; font-family: 'Itim', cursive; font-size: 24px; color: var(--ink);
              text-align: center; margin: 0; }
  .phome, .pclose {
    width: 48px; height: 48px; flex-shrink: 0; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; font-size: 24px;
    text-decoration: none; background: var(--paper); border: 4px solid var(--card-border);
    color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.12); cursor: pointer;
  }
  .phome:active, .pclose:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .pclose.hide { visibility: hidden; }
  .pgrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr);
           gap: 12px; padding: 8px 14px calc(16px + env(safe-area-inset-bottom)); align-content: start; }
  .pcard { background: #fff; border: 4px solid var(--card-border); border-radius: 20px; padding: 8px;
           box-shadow: 0 5px 0 rgba(0,0,0,0.10); cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .pcard:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.10); }
  .pcard svg { width: 100%; height: auto; display: block; border-radius: 12px; }
  .pcard .pn { font-family: 'Itim', cursive; font-size: 15px; text-align: center; color: var(--ink); margin-top: 4px; }
  @media (min-width: 560px) { .pgrid { grid-template-columns: repeat(4, 1fr); } }

  /* Bottom toolbar */
  .toolbar {
    flex-shrink: 0;
    background: var(--paper);
    border-top: 4px solid var(--card-border);
    box-shadow: 0 -4px 0 rgba(0,0,0,0.05);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
    position: relative; z-index: 20;
  }

  .palette { display: flex; flex-wrap: wrap; justify-content: center; gap: 7px; }
  .swatch {
    width: 44px; height: 44px; border-radius: 999px;
    border: 3px solid rgba(0,0,0,0.12);
    box-shadow: 0 3px 0 rgba(0,0,0,0.10);
    cursor: pointer; padding: 0; transition: transform .12s; position: relative;
  }
  .swatch:active { transform: scale(0.9); }
  .swatch.sel {
    transform: scale(1.12); border-color: var(--ink);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--brand);
  }
  .swatch.rainbow {
    background: conic-gradient(#ff5757,#ff9f43,#ffd93d,#5bc13a,#20b6b6,#4a90e2,#a259d6,#ff6b9d,#ff5757);
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }

  .tools { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
  .tbtn {
    min-width: 58px; height: 58px; padding: 0 10px;
    border-radius: 18px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.10); }
  .tbtn.active { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .tbtn:disabled { opacity: .35; box-shadow: none; }

  .sizes { display: flex; gap: 6px; align-items: center;
           background: #fff7fb; border: 3px solid var(--card-border);
           border-radius: 18px; padding: 4px; }
  .sbtn { width: 50px; height: 50px; border-radius: 14px; border: none; background: transparent;
          cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .12s; }
  .sbtn.active { background: var(--brand); }
  .sbtn .dot { background: var(--ink); border-radius: 999px; }
  .sbtn.active .dot { background: #fff; }
  .sep { width: 3px; height: 36px; background: var(--card-border); border-radius: 3px; }

  /* Tray (stamps / shapes) — overlays above the toolbar */
  .stamptray {
    position: absolute; left: 0; right: 0; bottom: 100%;
    background: var(--paper); border-top: 4px solid var(--card-border);
    box-shadow: 0 -6px 12px rgba(0,0,0,0.08);
    padding: 10px; display: none; flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  .stamptray.open { display: flex; }
  .stamp {
    width: 56px; height: 56px; border-radius: 16px;
    border: 3px solid var(--card-border); background: #fff; font-size: 30px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08); transition: transform .12s;
  }
  .stamp:active { transform: scale(0.9); }
  .stamp.sel { border-color: var(--brand-dark); background: #fff0f6; transform: scale(1.06); }
  .stamp.shptoggle { background: #fff7fb; border-style: dashed; border-color: var(--brand); }

  /* "saved" toast */
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-80px);
    background: var(--brand-dark); color: #fff; font-family: 'Itim', cursive; font-size: 20px;
    padding: 10px 22px; border-radius: 999px; box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    z-index: 40; opacity: 0; pointer-events: none;
    transition: transform .3s ease, opacity .3s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 380px) {
    .swatch { width: 38px; height: 38px; }
    .tbtn { min-width: 52px; height: 52px; font-size: 23px; }
    .sbtn { width: 44px; height: 44px; }
    .refcard { width: 100px; }
  }
</style>
</head>
<body>
  <a class="home" href="../" aria-label="กลับหน้าหลัก">🏠</a>

  <div class="refcard hide" id="refcard">
    <div class="rimg" id="rimg"></div>
    <div class="rlabel" id="rlabel"></div>
    <button class="rchange" id="changeBtn">🔄 เปลี่ยน</button>
  </div>

  <div class="stage">
    <canvas id="board"></canvas>
  </div>

  <div class="toolbar">
    <div class="stamptray" id="stamptray"></div>
    <div class="stamptray" id="shapetray"></div>
    <div class="palette" id="palette"></div>
    <div class="tools">
      <div class="sizes" id="sizes"></div>
      <div class="sep"></div>
      <button class="tbtn" id="eraserBtn" aria-label="ยางลบ">🩹</button>
      <button class="tbtn" id="fillBtn" aria-label="ถังเทสี">🪣</button>
      <button class="tbtn" id="shapesBtn" aria-label="รูปทรง">🔷</button>
      <button class="tbtn" id="stampBtn" aria-label="แสตมป์">⭐</button>
      <div class="sep"></div>
      <button class="tbtn" id="undoBtn" aria-label="ย้อนกลับ">↩️</button>
      <button class="tbtn" id="clearBtn" aria-label="ล้างทั้งหมด">🗑️</button>
      <button class="tbtn" id="saveBtn" aria-label="บันทึกรูป">💾</button>
    </div>
  </div>

  <div class="refbig" id="refbig">
    <div>
      <div class="box" id="bigbox"></div>
      <div class="bl" id="biglabel"></div>
    </div>
  </div>

  <div class="picker" id="picker">
    <div class="phead">
      <a class="phome" href="../" aria-label="กลับหน้าหลัก">🏠</a>
      <h1>เลือกแบบที่อยากวาด</h1>
      <button class="pclose hide" id="pclose" aria-label="ปิด">✕</button>
    </div>
    <div class="pgrid" id="pgrid"></div>
  </div>

  <div class="toast" id="toast">บันทึกแล้ว!</div>

    { id: 'circle',   label: 'วงกลม' },     { id: 'square',   label: 'สี่เหลี่ยม' },

  var SIZE_DOTS     = [12, 22, 34];
  var STAMP_SIZE    = [40, 66, 96];
  var SHAPE_DEFAULT = [64, 120, 190];
  var UNDO_MAX      = 8;

  // ---- State --------------------------------------------------------------
  var mode = 'brush';          // brush | eraser | fill | stamp | shape
  var color = COLORS[0];
  var rainbow = false;
  var sizeIdx = 1;
  var stamp = STAMPS[0];
  var shapeType = SHAPES[0].id;
  var shapeOutline = false;    // shapes: false = filled, true = outline only
  var hue = 0;
  var current = null;          // chosen subject

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stage = canvas.parentNode;
  var dpr = 1;
  var canvasRect = null;
  var undoStack = [];

  var probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  var pctx = probe.getContext('2d', { willReadFrequently: true });
  function parseColor(css) {
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillStyle = css;
    pctx.fillRect(0, 0, 1, 1);
    return pctx.getImageData(0, 0, 1, 1).data;
  }

  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---- Canvas sizing ------------------------------------------------------
  function fitCanvas() {
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width));
    var h = Math.max(1, Math.round(r.height));
    var snap = null;
    if (canvas.width) {
      snap = document.createElement('canvas');
      snap.width = canvas.width; snap.height = canvas.height;
      snap.getContext('2d').drawImage(canvas, 0, 0);
    }
    dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    if (snap) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(snap, 0, 0, snap.width, snap.height, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
    canvasRect = canvas.getBoundingClientRect();
    undoStack = [];
    updateUndoBtn();
  }

  // ---- Undo ---------------------------------------------------------------
  function pushUndo() {
    try { undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); } catch (e) { return; }
    if (undoStack.length > UNDO_MAX) undoStack.shift();
    updateUndoBtn();
  }
  function undo() {
    if (!undoStack.length) return;
    var img = undoStack.pop();
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(img, 0, 0);
    ctx.restore();
    updateUndoBtn();
    buzz(10);
  }
  function updateUndoBtn() {
    document.getElementById('undoBtn').disabled = undoStack.length === 0;
  }
  function clearCanvas() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.restore();
  }

    var w = SIZES[sizeIdx];
    return mode === 'eraser' ? w * 2.2 : w;
  }
  function drawColor() {
    if (mode === 'eraser') return PAPER;
    if (rainbow) return 'hsl(' + hue + ',90%,55%)';
    return color;
  }
  function pt(ev) {
    var r = canvasRect;
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function drawDot(x, y) {
    ctx.beginPath();
    ctx.fillStyle = drawColor();
    ctx.arc(x, y, Math.max(1, lineWidth() / 2), 0, Math.PI * 2);
    ctx.fill();
    if (rainbow && mode !== 'eraser') hue = (hue + 8) % 360;
  }
  function drawSeg(x0, y0, x1, y1) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = lineWidth();
    ctx.strokeStyle = drawColor();
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    if (rainbow && mode !== 'eraser') hue = (hue + 8) % 360;
  }
  function placeStamp(x, y) {
    var sz = STAMP_SIZE[sizeIdx];
    ctx.save();
    ctx.font = sz + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(stamp, x, y);
    ctx.restore();
  }

  // ---- Flood fill (scanline) ----------------------------------------------
  function dist2(a, b) {
    var dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2], da = a[3] - b[3];
    return dr * dr + dg * dg + db * db + da * da;
  }
  function floodFill(cssX, cssY) {
    var w = canvas.width, h = canvas.height;
    var sx = Math.max(0, Math.min(w - 1, Math.round(cssX * dpr)));
    var sy = Math.max(0, Math.min(h - 1, Math.round(cssY * dpr)));
    var img = ctx.getImageData(0, 0, w, h);
    var d = img.data;
    var fill = rainbow ? parseColor('hsl(' + hue + ',90%,55%)') : parseColor(color);
    var si = (sy * w + sx) * 4;
    var target = [d[si], d[si + 1], d[si + 2], d[si + 3]];
    var tol = 48, tol2 = tol * tol;
    if (dist2(target, [fill[0], fill[1], fill[2], 255]) <= tol2) return;
    function matches(i) {
      var dr = d[i] - target[0], dg = d[i + 1] - target[1],
          db = d[i + 2] - target[2], da = d[i + 3] - target[3];
      return (dr * dr + dg * dg + db * db + da * da) <= tol2;
    }
    var stack = [[sx, sy]];
    while (stack.length) {
      var p = stack.pop(), x = p[0], y = p[1];
      while (y >= 0 && matches((y * w + x) * 4)) y--;
      y++;
      var reachL = false, reachR = false;
      while (y < h && matches((y * w + x) * 4)) {
        var i = (y * w + x) * 4;
        d[i] = fill[0]; d[i + 1] = fill[1]; d[i + 2] = fill[2]; d[i + 3] = 255;
        if (x > 0) {
          if (matches((y * w + x - 1) * 4)) { if (!reachL) { stack.push([x - 1, y]); reachL = true; } }
          else reachL = false;
        }
        if (x < w - 1) {
          if (matches((y * w + x + 1) * 4)) { if (!reachR) { stack.push([x + 1, y]); reachR = true; } }
          else reachR = false;
        }
        y++;
      }
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(img, 0, 0);
    ctx.restore();
    if (rainbow) hue = (hue + 40) % 360;
  }

  // ---- Shapes -------------------------------------------------------------
  function shade(css) {
    var d = parseColor(css);
    return 'rgb(' + Math.round(d[0] * 0.62) + ',' + Math.round(d[1] * 0.62) +
                    ',' + Math.round(d[2] * 0.62) + ')';
  }
  function normBox(x0, y0, x1, y1) {
    return { x: Math.min(x0, x1), y: Math.min(y0, y1),
             w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  }
  var P_TRI     = [[.5,0],[1,1],[0,1]];
  var P_DIAMOND = [[.5,0],[1,.5],[.5,1],[0,.5]];
  var P_ARROW   = [[0,.32],[.58,.32],[.58,.12],[1,.5],[.58,.88],[.58,.68],[0,.68]];
  var P_PLUS    = [[.34,0],[.66,0],[.66,.34],[1,.34],[1,.66],[.66,.66],[.66,1],
                   [.34,1],[.34,.66],[0,.66],[0,.34],[.34,.34]];
  var P_BOLT    = [[.6,0],[.15,.55],[.44,.55],[.36,1],[.85,.4],[.54,.4],[.62,0]];
  function regPts(n) {
    var a = [], s = -Math.PI / 2;
    for (var i = 0; i < n; i++) {
      var t = s + i * 2 * Math.PI / n;
      a.push([0.5 + 0.5 * Math.cos(t), 0.5 + 0.5 * Math.sin(t)]);
    }
    return a;
  }
  function starPts(sp) {
    var a = [];
    for (var i = 0; i < sp * 2; i++) {
      var r = (i % 2) ? 0.2 : 0.5;
      var t = -Math.PI / 2 + i * Math.PI / sp;
      a.push([0.5 + r * Math.cos(t), 0.5 + r * Math.sin(t)]);
    }
    return a;
  }
  function pathPoly(c, pts, b) {
    c.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var X = b.x + pts[i][0] * b.w, Y = b.y + pts[i][1] * b.h;
      if (i) c.lineTo(X, Y); else c.moveTo(X, Y);
    }
    c.closePath();
  }
  function heartPath(c, b) {
    var x = b.x, y = b.y, w = b.w, h = b.h, cx = x + w / 2;
    c.beginPath();
    c.moveTo(cx, y + h * 0.88);
    c.bezierCurveTo(x - w * 0.02, y + h * 0.55, x + w * 0.06, y + h * 0.02, cx, y + h * 0.28);
    c.bezierCurveTo(x + w * 0.94, y + h * 0.02, x + w * 1.02, y + h * 0.55, cx, y + h * 0.88);
    c.closePath();
  }
  function cloudPath(c, b) {
    var x = b.x, y = b.y, w = b.w, h = b.h;
    c.beginPath();
    c.rect(x + w * 0.18, y + h * 0.55, w * 0.64, h * 0.33);
    c.moveTo(x + w * 0.32 + h * 0.26, y + h * 0.6); c.arc(x + w * 0.32, y + h * 0.6, h * 0.26, 0, Math.PI * 2);
    c.moveTo(x + w * 0.5  + h * 0.32, y + h * 0.45); c.arc(x + w * 0.5,  y + h * 0.45, h * 0.32, 0, Math.PI * 2);
    c.moveTo(x + w * 0.7  + h * 0.24, y + h * 0.6); c.arc(x + w * 0.7,  y + h * 0.6, h * 0.24, 0, Math.PI * 2);
  }
  function flowerPath(c, b) {
    var cx = b.x + b.w / 2, cy = b.y + b.h / 2, R = Math.min(b.w, b.h) / 2;
    c.beginPath();
    for (var i = 0; i < 6; i++) {
      var t = -Math.PI / 2 + i * Math.PI / 3;
      var px = cx + Math.cos(t) * R * 0.55, py = cy + Math.sin(t) * R * 0.55;
      c.moveTo(px + R * 0.34, py); c.arc(px, py, R * 0.34, 0, Math.PI * 2);
    }
    c.moveTo(cx + R * 0.3, cy); c.arc(cx, cy, R * 0.3, 0, Math.PI * 2);
  }
  function drawLine(c, x0, y0, x1, y1, lw, col) {
    c.save();
    c.lineCap = 'round'; c.lineWidth = lw; c.strokeStyle = col;
    c.beginPath(); c.moveTo(x0, y0); c.lineTo(x1, y1); c.stroke();
    c.restore();
  }
  function drawShape(c, type, b, fill, stroke, lw, outline) {
    c.save();
    c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = lw || 3;
    var doStroke = !!stroke, rule = 'nonzero';
    switch (type) {
      case 'circle':
        c.beginPath();
        c.ellipse(b.x + b.w / 2, b.y + b.h / 2, Math.max(1, b.w / 2), Math.max(1, b.h / 2), 0, 0, Math.PI * 2);
        break;
      case 'square':   c.beginPath(); c.rect(b.x, b.y, b.w, b.h); break;
      case 'triangle': pathPoly(c, P_TRI, b); break;
      case 'diamond':  pathPoly(c, P_DIAMOND, b); break;
      case 'pentagon': pathPoly(c, regPts(5), b); break;
      case 'hexagon':  pathPoly(c, regPts(6), b); break;
      case 'star':     pathPoly(c, starPts(5), b); break;
      case 'arrow':    pathPoly(c, P_ARROW, b); break;
      case 'plus':     pathPoly(c, P_PLUS, b); break;
      case 'bolt':     pathPoly(c, P_BOLT, b); break;
      case 'heart':    heartPath(c, b); break;
      case 'cloud':    cloudPath(c, b); doStroke = false; break;
      case 'flower':   flowerPath(c, b); doStroke = false; break;
      case 'crescent':
        c.beginPath();
        c.ellipse(b.x + b.w * 0.5,  b.y + b.h * 0.5, b.w * 0.48, b.h * 0.48, 0, 0, Math.PI * 2);
        c.ellipse(b.x + b.w * 0.6,  b.y + b.h * 0.5, b.w * 0.38, b.h * 0.38, 0, 0, Math.PI * 2);
        rule = 'evenodd'; doStroke = false; break;
    }
    if (outline) {                       // outline only — ready to fill-bucket inside
      c.strokeStyle = stroke; c.stroke();
    } else {
      c.fillStyle = fill; c.fill(rule);
      if (doStroke) { c.strokeStyle = stroke; c.stroke(); }
    }
    c.restore();
  }
  function shapeIcon(type) {
    var S = 40, r = window.devicePixelRatio || 1;
    var cv = document.createElement('canvas');
    cv.width = S * r; cv.height = S * r;
    cv.style.width = S + 'px'; cv.style.height = S + 'px';
    var c = cv.getContext('2d');
    c.setTransform(r, 0, 0, r, 0, 0);
    if (type === 'line') drawLine(c, 7, 20, 33, 20, 5, '#ff6b9d');
    else drawShape(c, type, { x: 6, y: 6, w: 28, h: 28 }, '#ff6b9d', '#c23b6b', 2);
    return cv;
  }

  // ---- Pointer interaction ------------------------------------------------
  var drawing = false, lastX = 0, lastY = 0;
  var shaping = false, shapeSnap = null, sStartX = 0, sStartY = 0, sCurX = 0, sCurY = 0;

  function renderShapePreview() {
    ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(shapeSnap, 0, 0);
    ctx.restore();
    var moved = Math.hypot(sCurX - sStartX, sCurY - sStartY) > 8;
    var fill   = rainbow ? 'hsl(' + hue + ',90%,55%)' : color;
    var stroke = rainbow ? 'hsl(' + hue + ',85%,32%)' : shade(color);
    var lw = Math.max(3, SIZES[sizeIdx] * 0.45);
    if (shapeType === 'line') {
      var lcol = rainbow ? 'hsl(' + hue + ',90%,50%)' : color;
      var llw = SIZES[sizeIdx] + 4;
      if (moved) drawLine(ctx, sStartX, sStartY, sCurX, sCurY, llw, lcol);
      else { var d = SHAPE_DEFAULT[sizeIdx] / 2; drawLine(ctx, sStartX - d, sStartY, sStartX + d, sStartY, llw, lcol); }
      return;
    }
    var box;
    if (moved) box = normBox(sStartX, sStartY, sCurX, sCurY);
    else { var s = SHAPE_DEFAULT[sizeIdx]; box = { x: sStartX - s / 2, y: sStartY - s / 2, w: s, h: s }; }
    if (shapeOutline) {
      var ocol = rainbow ? 'hsl(' + hue + ',90%,50%)' : color;
      drawShape(ctx, shapeType, box, null, ocol, Math.max(4, SIZES[sizeIdx] * 0.6), true);
    } else {
      drawShape(ctx, shapeType, box, fill, stroke, lw);
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    canvasRect = canvas.getBoundingClientRect();
    var p = pt(e);
    closeTray();
    if (mode === 'fill') { pushUndo(); floodFill(p.x, p.y); buzz(12); return; }
    if (mode === 'stamp') { pushUndo(); placeStamp(p.x, p.y); buzz(12); return; }
    if (mode === 'shape') {
      pushUndo();
      shapeSnap = ctx.getImageData(0, 0, canvas.width, canvas.height);
      shaping = true;
      sStartX = sCurX = p.x; sStartY = sCurY = p.y;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    pushUndo();
    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    lastX = p.x; lastY = p.y;
    drawDot(p.x, p.y);
  });

  canvas.addEventListener('pointermove', function (e) {
    if (shaping) {
      e.preventDefault();
      var sp = pt(e); sCurX = sp.x; sCurY = sp.y;
      renderShapePreview();
      return;
    }
    if (!drawing) return;
    e.preventDefault();
    var evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
    if (!evs || !evs.length) evs = [e];
    for (var k = 0; k < evs.length; k++) {
      var p = pt(evs[k]);
      drawSeg(lastX, lastY, p.x, p.y);
      lastX = p.x; lastY = p.y;
    }
  });

  function endStroke() {
    if (shaping) {
      renderShapePreview();
      shaping = false; shapeSnap = null;
      if (rainbow) hue = (hue + 30) % 360;
    }
    drawing = false;
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);
  canvas.addEventListener('lostpointercapture', endStroke);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // ---- UI build -----------------------------------------------------------
  var palette = document.getElementById('palette');
  var swatchEls = [];
  COLORS.forEach(function (c) {
    var b = document.createElement('button');
    b.className = 'swatch';
    b.style.background = c;
    if (c.toLowerCase() === '#ffffff') b.style.borderColor = '#ddd';
    b.addEventListener('click', function () { pickColor(c, b); });
    palette.appendChild(b);
    swatchEls.push(b);
  });
  var rainbowEl = document.createElement('button');
  rainbowEl.className = 'swatch rainbow';
  rainbowEl.textContent = '🌈';
  rainbowEl.setAttribute('aria-label', 'แปรงสายรุ้ง');
  rainbowEl.addEventListener('click', function () { pickRainbow(); });
  palette.appendChild(rainbowEl);

  var sizesWrap = document.getElementById('sizes');
  var sizeEls = [];
  SIZES.forEach(function (_, idx) {
    var b = document.createElement('button');
    b.className = 'sbtn' + (idx === sizeIdx ? ' active' : '');
    b.setAttribute('aria-label', 'ขนาด ' + (idx + 1));
    var dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.width = SIZE_DOTS[idx] + 'px';
    dot.style.height = SIZE_DOTS[idx] + 'px';
    b.appendChild(dot);
    b.addEventListener('click', function () { pickSize(idx); });
    sizesWrap.appendChild(b);
    sizeEls.push(b);
  });

  var tray = document.getElementById('stamptray');
  var stampEls = [];
  STAMPS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'stamp';
    b.textContent = s;
    b.addEventListener('click', function () { pickStamp(s, b); });
    tray.appendChild(b);
    stampEls.push(b);
  });

  var shapeTray = document.getElementById('shapetray');
  var shapeEls = [];
  var fillToggleBtn = document.createElement('button');
  fillToggleBtn.className = 'stamp shptoggle';
  fillToggleBtn.setAttribute('aria-label', 'สลับ ทึบ / ขอบ');
  function renderToggleIcon() {
    var S = 40, r = window.devicePixelRatio || 1;
    var cv = document.createElement('canvas');
    cv.width = S * r; cv.height = S * r;
    cv.style.width = S + 'px'; cv.style.height = S + 'px';
    var c = cv.getContext('2d');
    c.setTransform(r, 0, 0, r, 0, 0);
    c.lineJoin = 'round';
    if (shapeOutline) {
      c.lineWidth = 5; c.strokeStyle = '#ff6b9d';
      c.strokeRect(9, 9, 22, 22);
    } else {
      c.fillStyle = '#ff6b9d'; c.strokeStyle = '#c23b6b'; c.lineWidth = 2;
      c.beginPath(); c.rect(8, 8, 24, 24); c.fill(); c.stroke();
    }
    fillToggleBtn.innerHTML = '';
    fillToggleBtn.appendChild(cv);
  }
  renderToggleIcon();
  fillToggleBtn.addEventListener('click', function () {
    shapeOutline = !shapeOutline;
    renderToggleIcon();
    if (mode !== 'shape') { mode = 'shape'; refreshTools(); }
    buzz(8);
  });
  shapeTray.appendChild(fillToggleBtn);
  SHAPES.forEach(function (sh) {
    var b = document.createElement('button');
    b.className = 'stamp';
    b.setAttribute('aria-label', sh.label);
    b.appendChild(shapeIcon(sh.id));
    b.addEventListener('click', function () { pickShape(sh.id, b); });
    shapeTray.appendChild(b);
    shapeEls.push(b);
  });

  var eraserBtn = document.getElementById('eraserBtn');
  var fillBtn   = document.getElementById('fillBtn');
  var shapesBtn = document.getElementById('shapesBtn');
  var stampBtn  = document.getElementById('stampBtn');

  // ---- Tool selection -----------------------------------------------------
  function clearSwatchSel() { swatchEls.forEach(function (s) { s.classList.remove('sel'); });
                              rainbowEl.classList.remove('sel'); }
  function refreshTools() {
    eraserBtn.classList.toggle('active', mode === 'eraser');
    fillBtn.classList.toggle('active', mode === 'fill');
    shapesBtn.classList.toggle('active', mode === 'shape');
    stampBtn.classList.toggle('active', mode === 'stamp');
  }
  function pickColor(c, el) {
    color = c; rainbow = false; mode = 'brush';
    clearSwatchSel(); el.classList.add('sel');
    closeTray(); refreshTools(); buzz(8);
  }
  function pickRainbow() {
    rainbow = true; mode = 'brush';
    clearSwatchSel(); rainbowEl.classList.add('sel');
    closeTray(); refreshTools(); buzz(8);
  }
  function pickSize(idx) {
    sizeIdx = idx;
    sizeEls.forEach(function (b, i) { b.classList.toggle('active', i === idx); });
    buzz(8);
  }
  function pickStamp(s, el) {
    stamp = s; mode = 'stamp';
    stampBtn.textContent = s;
    stampEls.forEach(function (b) { b.classList.remove('sel'); });
    el.classList.add('sel');
    refreshTools(); buzz(8);
  }
  function pickShape(id, el) {
    shapeType = id; mode = 'shape';
    shapeEls.forEach(function (b) { b.classList.remove('sel'); });
    el.classList.add('sel');
    refreshTools(); buzz(8);
  }
  function closeTray() { tray.classList.remove('open'); shapeTray.classList.remove('open'); }
  function openTray(t) { closeTray(); t.classList.add('open'); }

  eraserBtn.addEventListener('click', function () {
    mode = 'eraser'; closeTray(); refreshTools(); buzz(10);
  });
  fillBtn.addEventListener('click', function () {
    mode = 'fill'; closeTray(); refreshTools(); buzz(10);
  });
  stampBtn.addEventListener('click', function () {
    if (mode === 'stamp') { var wasOpen = tray.classList.contains('open'); closeTray(); if (!wasOpen) tray.classList.add('open'); return; }
    mode = 'stamp';
    openTray(tray);
    if (!stampEls.some(function (b) { return b.classList.contains('sel'); })) {
      pickStamp(STAMPS[0], stampEls[0]);
    }
    refreshTools(); buzz(10);
  });
  shapesBtn.addEventListener('click', function () {
    if (mode === 'shape') { var wasOpen = shapeTray.classList.contains('open'); closeTray(); if (!wasOpen) shapeTray.classList.add('open'); return; }
    mode = 'shape';
    openTray(shapeTray);
    if (!shapeEls.some(function (b) { return b.classList.contains('sel'); })) {
      pickShape(SHAPES[0].id, shapeEls[0]);
    }
    refreshTools(); buzz(10);
  });

  document.getElementById('undoBtn').addEventListener('click', undo);

  document.getElementById('clearBtn').addEventListener('click', function () {
    pushUndo();
    clearCanvas();
    buzz(15);
  });

  document.getElementById('saveBtn').addEventListener('click', function () {
    var url;
    try { url = canvas.toDataURL('image/png'); } catch (e) { return; }
    var a = document.createElement('a');
    a.href = url; a.download = (current ? current.name : 'ดูแล้ววาด') + '.png';
    document.body.appendChild(a); a.click(); a.remove();
    showToast(); buzz(20);
  });

  var toast = document.getElementById('toast'), toastT = 0;
  function showToast() {
    toast.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  // ---- Reference + subject picker ----------------------------------------
  var refcard  = document.getElementById('refcard');
  var rimg     = document.getElementById('rimg');
  var rlabel   = document.getElementById('rlabel');
  var refbig   = document.getElementById('refbig');
  var bigbox   = document.getElementById('bigbox');
  var biglabel = document.getElementById('biglabel');
  var picker   = document.getElementById('picker');
  var pgrid    = document.getElementById('pgrid');
  var pclose   = document.getElementById('pclose');

  function svgMarkup(s) { return '<svg viewBox="0 0 100 100">' + s.svg + '</svg>'; }

  SUBJECTS.forEach(function (s) {
    var card = document.createElement('button');
    card.className = 'pcard';
    card.innerHTML = svgMarkup(s) + '<div class="pn">' + s.name + '</div>';
    card.addEventListener('click', function () { setSubject(s); });
    pgrid.appendChild(card);
  });

  function setSubject(s) {
    current = s;
    rimg.innerHTML = svgMarkup(s);
    rlabel.textContent = s.name;
    bigbox.innerHTML = svgMarkup(s);
    biglabel.textContent = s.name;
    refcard.classList.remove('hide');
    pushUndo();
    clearCanvas();
    closePicker();
    buzz(12);
  }
  function openPicker() {
    pclose.classList.toggle('hide', !current);   // no cancel until something is chosen
    picker.classList.remove('hide');
  }
  function closePicker() { picker.classList.add('hide'); }

  rimg.addEventListener('click', function () { refbig.classList.add('open'); });
  refbig.addEventListener('click', function () { refbig.classList.remove('open'); });
  document.getElementById('changeBtn').addEventListener('click', openPicker);
  pclose.addEventListener('click', closePicker);

  // ---- Init ---------------------------------------------------------------
  swatchEls[0].classList.add('sel');
  refreshTools();
  fitCanvas();
  openPicker();                 // choose a subject first

  var resizeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(fitCanvas, 150);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(fitCanvas, 250);
  });
})();
</script>
</body>
</html>
