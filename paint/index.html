<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🖌️ วาดรูป — เกมสำหรับเด็ก</title>
<meta name="description" content="กระดานวาดรูประบายสีอิสระ มีจานสี แปรงสายรุ้ง แสตมป์ ถังเทสี ฝึกจินตนาการและการควบคุมนิ้ว">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="วาดรูป">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/icon.svg">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --paper: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    height: 100dvh;
    overflow: hidden;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 65%, #7ed957 100%);
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  body { display: flex; flex-direction: column; }

  /* Home button — fixed top-left, matches the family style */
  .home {
    position: fixed; top: 12px; left: 12px; z-index: 30;
    width: 52px; height: 52px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none;
    background: var(--paper); border: 4px solid var(--card-border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    transition: transform .12s, box-shadow .12s;
  }
  .home:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }

  /* Drawing stage */
  .stage { flex: 1; min-height: 0; position: relative; }
  #board {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block; touch-action: none;
    background: var(--paper);
  }

  /* Bottom toolbar */
  .toolbar {
    flex-shrink: 0;
    background: var(--paper);
    border-top: 4px solid var(--card-border);
    box-shadow: 0 -4px 0 rgba(0,0,0,0.05);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px;
    position: relative; z-index: 20;
  }

  .palette {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 7px;
  }
  .swatch {
    width: 44px; height: 44px; border-radius: 999px;
    border: 3px solid rgba(0,0,0,0.12);
    box-shadow: 0 3px 0 rgba(0,0,0,0.10);
    cursor: pointer; padding: 0;
    transition: transform .12s;
    position: relative;
  }
  .swatch:active { transform: scale(0.9); }
  .swatch.sel {
    transform: scale(1.12);
    border-color: var(--ink);
    box-shadow: 0 0 0 3px #fff, 0 0 0 6px var(--brand);
  }
  .swatch.rainbow {
    background: conic-gradient(#ff5757,#ff9f43,#ffd93d,#5bc13a,#20b6b6,#4a90e2,#a259d6,#ff6b9d,#ff5757);
    font-size: 22px; display: flex; align-items: center; justify-content: center;
  }

  .tools {
    display: flex; flex-wrap: wrap; justify-content: center;
    align-items: center; gap: 8px;
  }
  .tbtn {
    min-width: 58px; height: 58px; padding: 0 10px;
    border-radius: 18px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink);
    font-size: 26px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10);
    transition: transform .12s, box-shadow .12s, background .12s;
  }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.10); }
  .tbtn.active { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .tbtn:disabled { opacity: .35; box-shadow: none; }

  /* Size picker group */
  .sizes { display: flex; gap: 6px; align-items: center;
           background: #fff7fb; border: 3px solid var(--card-border);
           border-radius: 18px; padding: 4px; }
  .sbtn {
    width: 50px; height: 50px; border-radius: 14px;
    border: none; background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s;
  }
  .sbtn.active { background: var(--brand); }
  .sbtn .dot { background: var(--ink); border-radius: 999px; }
  .sbtn.active .dot { background: #fff; }
  .sep { width: 3px; height: 36px; background: var(--card-border); border-radius: 3px; }

  /* Sticker tray — overlays above the toolbar, doesn't resize the canvas */
  .stamptray {
    position: absolute; left: 0; right: 0; bottom: 100%;
    background: var(--paper); border-top: 4px solid var(--card-border);
    box-shadow: 0 -6px 12px rgba(0,0,0,0.08);
    padding: 10px; display: none;
    flex-wrap: wrap; justify-content: center; gap: 8px;
  }
  .stamptray.open { display: flex; }
  .stamp {
    width: 56px; height: 56px; border-radius: 16px;
    border: 3px solid var(--card-border); background: #fff;
    font-size: 30px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    transition: transform .12s;
  }
  .stamp:active { transform: scale(0.9); }
  .stamp.sel { border-color: var(--brand-dark); background: #fff0f6; transform: scale(1.06); }
  /* fill/outline toggle sits at the front of the shape tray */
  .stamp.shptoggle { background: #fff7fb; border-style: dashed; border-color: var(--brand); }

  /* "saved" toast */
  .toast {
    position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-80px);
    background: var(--brand-dark); color: #fff;
    font-family: 'Itim', cursive; font-size: 20px;
    padding: 10px 22px; border-radius: 999px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
    z-index: 40; opacity: 0; pointer-events: none;
    transition: transform .3s ease, opacity .3s ease;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @media (max-width: 380px) {
    .swatch { width: 38px; height: 38px; }
    .tbtn { min-width: 52px; height: 52px; font-size: 23px; }
    .sbtn { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
  <a class="home" href="../" aria-label="กลับหน้าหลัก">🏠</a>

  <div class="stage">
    <canvas id="board"></canvas>
  </div>

  <div class="toolbar">
    <div class="stamptray" id="stamptray"></div>
    <div class="stamptray" id="shapetray"></div>
    <div class="palette" id="palette"></div>
    <div class="tools">
      <div class="sizes" id="sizes"></div>
      <div class="sep"></div>
      <button class="tbtn" id="eraserBtn" aria-label="ยางลบ">🩹</button>
      <button class="tbtn" id="fillBtn" aria-label="ถังเทสี">🪣</button>
      <button class="tbtn" id="smokeBtn" aria-label="ควัน">💨</button>
      <button class="tbtn" id="shapesBtn" aria-label="รูปทรง">🔷</button>
      <button class="tbtn" id="stampBtn" aria-label="แสตมป์">⭐</button>
      <div class="sep"></div>
      <button class="tbtn" id="undoBtn" aria-label="ย้อนกลับ">↩️</button>
      <button class="tbtn" id="clearBtn" aria-label="ล้างทั้งหมด">🗑️</button>
      <button class="tbtn" id="saveBtn" aria-label="บันทึกรูป">💾</button>
    </div>
  </div>

  <div class="toast" id="toast">บันทึกแล้ว!</div>

<script>
(function () {
  'use strict';

  // ---- Config -------------------------------------------------------------
  var PAPER  = '#ffffff';
  var COLORS = ['#2d3436','#ff5757','#ff9f43','#ffc7a8','#ffd93d','#5bc13a','#20b6b6',
                '#5bc0eb','#4a90e2','#1e3a8a','#7b5cff','#a259d6','#ff6b9d','#b06b3f','#95a5a6','#cfd8dc','#ffffff'];
  var STAMPS = ['⭐','❤️','🌸','🦋','🐶','🐱','🚗','🌈','🎈','🌞','🍎','🐠'];
  var SHAPES = [
    { id: 'circle',    label: 'วงกลม' },      { id: 'square',    label: 'สี่เหลี่ยม' },
    { id: 'roundrect', label: 'สี่เหลี่ยมมน' }, { id: 'triangle',  label: 'สามเหลี่ยม' },
    { id: 'diamond',   label: 'ข้าวหลามตัด' }, { id: 'pentagon',  label: 'ห้าเหลี่ยม' },
    { id: 'hexagon',   label: 'หกเหลี่ยม' },    { id: 'star',      label: 'ดาว' },
    { id: 'heart',     label: 'หัวใจ' },        { id: 'arrow',     label: 'ลูกศร' },
    { id: 'uturn',     label: 'ลูกศรกลับรถ' },  { id: 'plus',      label: 'กากบาท' },
    { id: 'bolt',      label: 'สายฟ้า' },       { id: 'crescent',  label: 'พระจันทร์' },
    { id: 'cloud',     label: 'เมฆ' },          { id: 'flower',    label: 'ดอกไม้' },
    { id: 'line',      label: 'เส้นตรง' }
  ];
  var SIZES         = [8, 18, 38];    // brush widths (css px)
  var SIZE_DOTS     = [12, 22, 34];   // visual dot sizes in the picker
  var STAMP_SIZE    = [40, 66, 96];   // emoji sizes per size step
  var SHAPE_DEFAULT = [64, 120, 190]; // tap-to-place shape box (css px) per size step
  var UNDO_MAX      = 50;             // deep history so you can undo back to blank

  // ---- State --------------------------------------------------------------
  var mode = 'brush';          // brush | eraser | fill | stamp | shape | smoke
  var color = COLORS[0];
  var rainbow = false;
  var sizeIdx = 1;
  var stamp = STAMPS[0];
  var shapeType = SHAPES[0].id;
  var shapeOutline = false;    // shapes: false = filled, true = outline only
  var hue = 0;

  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d', { willReadFrequently: true });
  var stage = canvas.parentNode;
  var dpr = 1;
  var canvasRect = null;
  var undoStack = [];              // [{url, dead}] — PNG blob-url snapshots

  // A freshly-placed shape "floats" (movable/resizable/rotatable) until committed.
  var active = null, baseSnap = null, shGrab = null, grabInfo = null;

  // tiny helper context to parse any CSS color into rgba
  var probe = document.createElement('canvas');
  probe.width = probe.height = 1;
  var pctx = probe.getContext('2d', { willReadFrequently: true });
  function parseColor(css) {
    pctx.clearRect(0, 0, 1, 1);
    pctx.fillStyle = css;
    pctx.fillRect(0, 0, 1, 1);
    return pctx.getImageData(0, 0, 1, 1).data; // [r,g,b,a]
  }

  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---- Canvas sizing (preserves art across orientation changes) -----------
  function fitCanvas() {
    commitShape();                 // bake any floating shape before rescaling
    var r = stage.getBoundingClientRect();
    var w = Math.max(1, Math.round(r.width));
    var h = Math.max(1, Math.round(r.height));
    var snap = null;
    if (canvas.width) {
      snap = document.createElement('canvas');
      snap.width = canvas.width; snap.height = canvas.height;
      snap.getContext('2d').drawImage(canvas, 0, 0);
    }
    dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, w, h);
    if (snap) {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.drawImage(snap, 0, 0, snap.width, snap.height, 0, 0, canvas.width, canvas.height);
      ctx.restore();
    }
    canvasRect = canvas.getBoundingClientRect();
    for (var u = 0; u < undoStack.length; u++) {
      undoStack[u].dead = true;
      if (undoStack[u].url) URL.revokeObjectURL(undoStack[u].url);
    }
    undoStack = [];           // sizes won't match after a resize — start fresh
    updateUndoBtn();
  }

  // ---- Undo (async-compressed history — rewinds to the blank page) --------
  // Each entry is a PNG blob-url of the canvas BEFORE an action. toBlob() snapshots
  // the bitmap at call time and encodes off the critical path, so capturing an undo
  // step never blocks the next brush stroke, and 50 steps stay cheap in memory.
  var undoSeq = 0;
  function pushUndo() {
    var entry = { url: null, dead: false };
    undoStack.push(entry);
    while (undoStack.length > UNDO_MAX) {
      var old = undoStack.shift();
      old.dead = true;
      if (old.url) URL.revokeObjectURL(old.url);
    }
    updateUndoBtn();
    try {
      canvas.toBlob(function (blob) {
        if (!blob || entry.dead) return;
        entry.url = URL.createObjectURL(blob);
      }, 'image/png');
    } catch (e) {}
  }
  function drawURL(url, revoke) {
    var my = ++undoSeq;
    var img = new Image();
    img.onload = function () {
      if (my === undoSeq) {
        ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.restore();
      }
      if (revoke) URL.revokeObjectURL(url);
    };
    img.src = url;
  }
  function restoreEntry(entry) {                 // wait patiently for the blob to encode
    var tries = 0;
    (function go() {
      if (entry.dead) return;
      if (entry.url) { drawURL(entry.url, true); return; }
      if (tries++ > 300) return;
      setTimeout(go, 16);
    })();
  }
  function undo() {
    if (active) { discardActive(); buzz(10); return; }   // drop the floating shape first
    if (!undoStack.length) return;
    restoreEntry(undoStack.pop());
    updateUndoBtn();
    buzz(10);
  }
  function updateUndoBtn() {
    document.getElementById('undoBtn').disabled = (undoStack.length === 0 && !active);
  }

  // ---- Drawing primitives -------------------------------------------------
  function lineWidth() {
    var w = SIZES[sizeIdx];
    return mode === 'eraser' ? w * 2.2 : w;
  }
  function drawColor() {
    if (mode === 'eraser') return PAPER;
    if (rainbow) return 'hsl(' + hue + ',90%,55%)';
    return color;
  }
  function pt(ev) {
    var r = canvasRect;
    return { x: ev.clientX - r.left, y: ev.clientY - r.top };
  }
  function drawDot(x, y) {
    ctx.beginPath();
    ctx.fillStyle = drawColor();
    ctx.arc(x, y, Math.max(1, lineWidth() / 2), 0, Math.PI * 2);
    ctx.fill();
    if (rainbow && mode !== 'eraser') hue = (hue + 8) % 360;
  }
  function drawSeg(x0, y0, x1, y1) {
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.lineWidth = lineWidth();
    ctx.strokeStyle = drawColor();
    ctx.beginPath();
    ctx.moveTo(x0, y0);
    ctx.lineTo(x1, y1);
    ctx.stroke();
    if (rainbow && mode !== 'eraser') hue = (hue + 8) % 360;
  }
  function placeStamp(x, y) {
    var sz = STAMP_SIZE[sizeIdx];
    ctx.save();
    ctx.font = sz + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(stamp, x, y);
    ctx.restore();
  }

  // ---- Smoke / airbrush (soft fluffy cloud puffs) -------------------------
  // One low-alpha radial puff of the current colour; overlaps build up softly.
  function drawSmoke(x, y) {
    var css = rainbow ? 'hsl(' + hue + ',85%,72%)' : color;
    var d = parseColor(css);
    var rgb = d[0] + ',' + d[1] + ',' + d[2];
    var base = SIZES[sizeIdx] * 1.7 + 10;
    var r = base * (0.75 + Math.random() * 0.5);
    var g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(' + rgb + ',0.30)');
    g.addColorStop(0.5, 'rgba(' + rgb + ',0.14)');
    g.addColorStop(1, 'rgba(' + rgb + ',0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    if (rainbow) hue = (hue + 6) % 360;
  }
  // Stamp puffs evenly along a drag segment, with a little perpendicular jitter.
  function smokeSeg(x0, y0, x1, y1) {
    var dx = x1 - x0, dy = y1 - y0, dist = Math.hypot(dx, dy);
    var step = Math.max(3, SIZES[sizeIdx] * 0.6 + 3);
    var jit = SIZES[sizeIdx] * 0.8 + 2;
    if (dist < step) { drawSmoke(x1, y1); return; }
    for (var d = 0; d < dist; d += step) {
      var t = d / dist;
      drawSmoke(x0 + dx * t + (Math.random() - 0.5) * jit,
                y0 + dy * t + (Math.random() - 0.5) * jit);
    }
  }

  // ---- Flood fill (scanline) ----------------------------------------------
  function dist2(a, b) {
    var dr = a[0] - b[0], dg = a[1] - b[1], db = a[2] - b[2], da = a[3] - b[3];
    return dr * dr + dg * dg + db * db + da * da;
  }
  function floodFill(cssX, cssY) {
    var w = canvas.width, h = canvas.height;
    var sx = Math.max(0, Math.min(w - 1, Math.round(cssX * dpr)));
    var sy = Math.max(0, Math.min(h - 1, Math.round(cssY * dpr)));
    var img = ctx.getImageData(0, 0, w, h);
    var d = img.data;
    var fill = rainbow ? parseColor('hsl(' + hue + ',90%,55%)') : parseColor(color);
    var si = (sy * w + sx) * 4;
    var target = [d[si], d[si + 1], d[si + 2], d[si + 3]];
    var tol = 48, tol2 = tol * tol;
    if (dist2(target, [fill[0], fill[1], fill[2], 255]) <= tol2) return; // already that color
    function matches(i) {
      var dr = d[i] - target[0], dg = d[i + 1] - target[1],
          db = d[i + 2] - target[2], da = d[i + 3] - target[3];
      return (dr * dr + dg * dg + db * db + da * da) <= tol2;
    }
    var stack = [[sx, sy]];
    while (stack.length) {
      var p = stack.pop(), x = p[0], y = p[1];
      while (y >= 0 && matches((y * w + x) * 4)) y--;
      y++;
      var reachL = false, reachR = false;
      while (y < h && matches((y * w + x) * 4)) {
        var i = (y * w + x) * 4;
        d[i] = fill[0]; d[i + 1] = fill[1]; d[i + 2] = fill[2]; d[i + 3] = 255;
        if (x > 0) {
          if (matches((y * w + x - 1) * 4)) { if (!reachL) { stack.push([x - 1, y]); reachL = true; } }
          else reachL = false;
        }
        if (x < w - 1) {
          if (matches((y * w + x + 1) * 4)) { if (!reachR) { stack.push([x + 1, y]); reachR = true; } }
          else reachR = false;
        }
        y++;
      }
    }
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.putImageData(img, 0, 0);
    ctx.restore();
    if (rainbow) hue = (hue + 40) % 360;
  }

  // ---- Shapes -------------------------------------------------------------
  // Darken any css color ~38% for a shape's outline (white -> mid grey).
  function shade(css) {
    var d = parseColor(css);
    return 'rgb(' + Math.round(d[0] * 0.62) + ',' + Math.round(d[1] * 0.62) +
                    ',' + Math.round(d[2] * 0.62) + ')';
  }
  function normBox(x0, y0, x1, y1) {
    return { x: Math.min(x0, x1), y: Math.min(y0, y1),
             w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
  }
  // Normalized (0..1) polygon point sets, mapped into a box on draw.
  var P_TRI     = [[.5,0],[1,1],[0,1]];
  var P_DIAMOND = [[.5,0],[1,.5],[.5,1],[0,.5]];
  var P_ARROW   = [[0,.32],[.58,.32],[.58,.12],[1,.5],[.58,.88],[.58,.68],[0,.68]];
  var P_PLUS    = [[.34,0],[.66,0],[.66,.34],[1,.34],[1,.66],[.66,.66],[.66,1],
                   [.34,1],[.34,.66],[0,.66],[0,.34],[.34,.34]];
  var P_BOLT    = [[.6,0],[.15,.55],[.44,.55],[.36,1],[.85,.4],[.54,.4],[.62,0]];
  function regPts(n) {                // regular polygon, first vertex at top
    var a = [], s = -Math.PI / 2;
    for (var i = 0; i < n; i++) {
      var t = s + i * 2 * Math.PI / n;
      a.push([0.5 + 0.5 * Math.cos(t), 0.5 + 0.5 * Math.sin(t)]);
    }
    return a;
  }
  function starPts(sp) {              // sp-pointed star, top point up
    var a = [];
    for (var i = 0; i < sp * 2; i++) {
      var r = (i % 2) ? 0.2 : 0.5;
      var t = -Math.PI / 2 + i * Math.PI / sp;
      a.push([0.5 + r * Math.cos(t), 0.5 + r * Math.sin(t)]);
    }
    return a;
  }
  function pathPoly(c, pts, b) {
    c.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var X = b.x + pts[i][0] * b.w, Y = b.y + pts[i][1] * b.h;
      if (i) c.lineTo(X, Y); else c.moveTo(X, Y);
    }
    c.closePath();
  }
  function heartPath(c, b) {
    var x = b.x, y = b.y, w = b.w, h = b.h, cx = x + w / 2;
    c.beginPath();
    c.moveTo(cx, y + h * 0.88);

    pushUndo();
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = PAPER;
    ctx.fillRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    ctx.restore();
    buzz(15);
  });

  // ---- Save (one button, works on iPad) ----------------------------------
  // Build the file synchronously inside the click so iOS keeps the user gesture,
  // then hand it to the share sheet (which offers "Save Image" → Photos). Falls
  // back to a direct download where sharing files isn't supported.
  function dataURLtoFile(durl, name) {
    try {
      var arr = durl.split(','), mime = (arr[0].match(/:(.*?);/) || [])[1] || 'image/png';
      var bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
      while (n--) u8[n] = bstr.charCodeAt(n);
      return new File([u8], name, { type: mime });
    } catch (e) { return null; }
  }
  function downloadURL(url) {
    var a = document.createElement('a');
    a.href = url; a.download = 'วาดรูป.png';
    document.body.appendChild(a); a.click(); a.remove();
  }
  document.getElementById('saveBtn').addEventListener('click', function () {
    commitShape();
    var url;
    try { url = canvas.toDataURL('image/png'); } catch (e) { showToast('เซฟไม่ได้'); return; }
    buzz(20);
    var file = dataURLtoFile(url, 'วาดรูป.png');
    if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
      navigator.share({ files: [file] }).then(function () {
        showToast('เซฟแล้ว!');
      }, function (err) {
        if (err && err.name === 'AbortError') return;   // user closed the sheet
        downloadURL(url); showToast();                   // sharing failed → download
      });
      return;
    }
    downloadURL(url); showToast();
  });

  var toast = document.getElementById('toast'), toastT = 0;
  function showToast(msg) {
    toast.textContent = msg || 'บันทึกแล้ว!';
    toast.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove('show'); }, 1600);
  }

  // ---- Init ---------------------------------------------------------------
  swatchEls[0].classList.add('sel');   // start on black brush
  refreshTools();
  fitCanvas();

  var resizeT = 0;
  window.addEventListener('resize', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(fitCanvas, 150);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(resizeT);
    resizeT = setTimeout(fitCanvas, 250);
  });
})();
</script>
</body>
</html>
