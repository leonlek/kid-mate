<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 900px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 6px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .modes, .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .chip, .btn {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 700;
    min-height: 64px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18); transition: transform .1s;
  }
  .chip:active, .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .view { position: relative; background: #fffef9; border: 4px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .view canvas { display: block; width: 100%; height: auto; touch-action: none; }
  .hidden { display: none !important; }

  /* paint tubes */
  .tubes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .tube {
    min-height: 92px; border-radius: 22px; border: 3px solid #fff; background: rgba(255,255,255,0.85); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-family: 'Mitr', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.15); padding: 4px 2px;
  }
  .tube svg { width: 100%; max-width: 92px; height: 52px; }
  .tube:active { transform: scale(.94); }
  .tube.squeeze svg { animation: squeeze .35s; }
  @keyframes squeeze { 40% { transform: scaleX(.8) scaleY(1.08); } }
  .tube .n { font-size: 12px; color: #6b7280; min-height: 14px; }

  /* target */
  .target { display: flex; align-items: center; gap: 12px; justify-content: center; background: #fff; border: 4px solid var(--card-border); border-radius: 24px; padding: 8px 14px; margin-bottom: 8px; box-shadow: 0 5px 0 rgba(0,0,0,0.12); }
  .swatch { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 3px #e5e7eb; flex-shrink: 0; cursor: pointer; }
  .meter { flex: 1; max-width: 320px; }
  .meter .bar { height: 22px; border-radius: 999px; background: #eef0f5; overflow: hidden; }
  .meter .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #ffb3c7, #7ed957); transition: width .3s; }
  .meter .lbl { font-size: 17px; font-weight: 700; margin-bottom: 4px; }

  .result { display: flex; align-items: center; gap: 12px; justify-content: center; min-height: 72px; margin-top: 10px; }
  .result .swatch { width: 60px; height: 60px; }
  .result .rname { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); }
  .saved { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 8px; min-height: 8px; }
  .saved .swatch { width: 54px; height: 54px; }

  /* pour mode */
  .pots { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 8px; }
  .pot {
    min-height: 84px; border-radius: 22px; border: 3px solid #fff; background: rgba(255,255,255,0.85); cursor: pointer; touch-action: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    font-family: 'Mitr', sans-serif; font-size: 15px; font-weight: 700; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.15); padding: 4px 2px;
    -webkit-touch-callout: none;
  }
  .pot svg { width: 56px; height: 50px; pointer-events: none; }
  .pot span { pointer-events: none; }
  .pot.on { border-color: var(--brand); background: #fff0f5; }
  .pot.pouring { transform: scale(.94); }
  .ratio { display: flex; height: 30px; border-radius: 999px; overflow: hidden; margin-top: 10px; background: #eef0f5; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,0.12); }
  .ratio div { height: 100%; transition: width .15s; min-width: 0; }
  /* the glass never pushes the buckets off-screen: it shrinks to the screen height */
  #pourUI .view { max-width: max(240px, calc((100vh - 470px) * 1.25)); max-width: max(240px, calc((100dvh - 470px) * 1.25)); margin: 0 auto; }
  #pourUI .ratio { max-width: max(240px, calc((100dvh - 470px) * 1.25)); margin-left: auto; margin-right: auto; }
  #pourRes { position: absolute; top: 6px; right: 10px; margin: 0; min-height: 0; gap: 8px; pointer-events: none; }
  #pourRes .swatch { width: 46px; height: 46px; pointer-events: auto; }
  #pourRes .rname { font-size: 24px; text-shadow: 2px 2px 0 #fff; }

  /* iPad / wide landscape: buckets and tubes in a column beside the glass / palette */
  @media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {
    .app { max-width: 1240px; text-align: center; }
    header { display: inline-block; vertical-align: middle; margin: 0 14px 0 64px; }
    .modes { display: inline-flex; vertical-align: middle; margin: 4px 0 10px; }
    #pourUI:not(.hidden), #mixUI:not(.hidden) { display: grid; gap: 0 16px; justify-content: center; align-items: start; text-align: left; }
    #pourUI { grid-template-columns: auto 260px; grid-template-areas: "v s" "r s"; grid-template-rows: auto 1fr; }
    #pourUI .view { grid-area: v; width: calc((100dvh - 190px) * 1.25); max-width: calc(100vw - 330px); }
    #pourUI .ratio { grid-area: r; width: 100%; max-width: none; }
    .pourSide { grid-area: s; }
    #pourUI .pots { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 0; }
    #pourUI .row .btn { font-size: 16px; padding: 0 14px; }
    #pourUI .pot { min-height: 72px; }
    #pourUI .row { gap: 6px; } #pourUI .row .btn { min-height: 60px; }
    #mixUI { grid-template-columns: auto 170px; grid-template-areas: "t t" "v tb" "res res" "row row" "sv sv"; }
    #mixUI .tube { min-height: 72px; flex-direction: row; gap: 6px; padding: 4px 8px; }
    #mixUI .tube svg { width: 64px; height: 34px; flex-shrink: 0; }
    #mixUI .tube .n { display: none; }
    #targetBox { grid-area: t; } #mixUI .view { grid-area: v; width: calc((100dvh - 290px) * 1.5); max-width: calc(100vw - 200px); }
    #mixUI .tubes { grid-area: tb; grid-template-columns: 1fr; margin-top: 0; }
    #result { grid-area: res; } #mixUI .row { grid-area: row; } #saved { grid-area: sv; }
  }

  /* paint mode */
  .wells { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  .well { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,0.18), inset 0 -6px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .well:active { transform: scale(.92); }
  .cup { width: 72px; height: 72px; border-radius: 16px 16px 26px 26px; border: 4px solid #cfe3f2; background: rgba(200,230,255,0.6); cursor: pointer; position: relative; overflow: hidden; font-size: 30px; display: flex; align-items: center; justify-content: center; }
  .cup .water { position: absolute; left: 0; right: 0; bottom: 0; height: 70%; opacity: 0; }
  .brushNow { display: flex; align-items: center; gap: 8px; justify-content: center; font-weight: 700; margin-top: 8px; }
  .brushNow .swatch { width: 44px; height: 44px; }
  .pics { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 10px; }
  /* the picture shrinks to the screen height so the paint wells never need scrolling */
  #paintUI .view { max-width: max(260px, calc(100dvh - var(--pv, 430px))); margin: 0 auto; }
  @media (orientation: landscape) and (min-width: 900px) and (min-height: 600px) {
    #paintUI:not(.hidden) { display: grid; grid-template-columns: auto 250px; grid-template-areas: "v b" "v w" "v p"; grid-template-rows: auto auto 1fr; gap: 10px 16px; justify-content: center; align-items: start; }
    #paintUI .view { grid-area: v; width: calc(100dvh - 130px); max-width: calc(100vw - 320px); }
    #paintUI .brushNow { grid-area: b; margin-top: 0; }
    #paintUI .wells { grid-area: w; margin-top: 0; }
    #paintUI .pics { grid-area: p; margin-top: 0; }
  }

  .fact { margin-top: 12px; background: #fff; border: 4px solid var(--card-border); border-radius: 24px; padding: 12px 16px; font-size: 18px; line-height: 1.45; box-shadow: 0 5px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .fact::before { content: '💡 '; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>

<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">

      <div class="swatch" id="tSwatch"></div>

    <div class="ratio" id="ratio"></div>
    <div class="pourSide">

  <!-- PAINT -->

    <div class="wells" id="wells"></div>
    <div class="pics" id="pics"></div>
  </div>

  <!-- LIGHT -->
  <div id="lightUI" class="hidden">
    <div class="view" style="background:#0a0d1c"><canvas id="lightC" width="800" height="560" aria-label="ไฟฉายสามสี"></canvas></div>
  </div>

  <div class="fact" id="fact"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// ============================================================================
// PAINT PHYSICS — two-constant Kubelka–Munk over 10 wavelength bands (410–680 nm).
// Each pigment = reflectance curve + scattering strength S; a mixture adds K and S by
// amount, so yellow + blue really gives green, ratios matter, white tints, black shades.
// The curves were fitted so the classic mixes land on real poster-paint colours.
// ============================================================================
const CMF = [[0.0435,0.0012,0.2074],[0.3483,0.0230,1.7471],[0.1954,0.0910,1.2876],[0.0049,0.3230,0.2720],[0.1655,0.8620,0.0422],
  [0.5945,0.9950,0.0039],[1.0263,0.7570,0.0011],[0.8544,0.3810,0.0002],[0.2835,0.1070,0],[0.0468,0.0170,0]];
const PIG = ['red', 'yellow', 'blue', 'white', 'black'];
const PIG_TH = { red: 'แดง', yellow: 'เหลือง', blue: 'น้ำเงิน', white: 'ขาว', black: 'ดำ' };
const CURVE = {
  red:    [[0.119,0.097,0.055,0.01,0.01,0.08,0.34,0.95,0.851,0.95], 0.05],
  yellow: [[0.047,0.036,0.089,0.395,0.476,0.786,0.95,0.95,0.155,0.048], 0.472],
  blue:   [[0.95,0.583,0.295,0.223,0.206,0.087,0.01,0.04,0.173,0.95], 0.102],
  white:  [[0.93,0.93,0.93,0.93,0.93,0.93,0.93,0.93,0.93,0.93], 1.0],
  black:  [[0.03,0.03,0.03,0.03,0.03,0.03,0.03,0.03,0.03,0.03], 0.35],
};
const KK = PIG.map((p) => CURVE[p][0].map((R) => (1 - R) ** 2 / (2 * R) * CURVE[p][1])), SS = PIG.map((p) => CURVE[p][1]);
const WX = CMF.reduce((a, c) => a + c[0], 0), WY = CMF.reduce((a, c) => a + c[1], 0), WZ = CMF.reduce((a, c) => a + c[2], 0);
const gam = (u) => 255 * (u <= 0.0031308 ? 12.92 * u : 1.055 * Math.pow(u, 1 / 2.4) - 0.055);
// c = amounts of the 5 pigments (any scale) → [r, g, b] 0..255
function kmRGB(c) {
  let S = 0; for (let i = 0; i < 5; i++) S += c[i] * SS[i];
  if (S <= 0) return [255, 255, 255];
  let X = 0, Y = 0, Z = 0;
  for (let b = 0; b < 10; b++) {
    let K = 0; for (let i = 0; i < 5; i++) K += c[i] * KK[i][b];
    const k = K / S, R = 1 + k - Math.sqrt(k * k + 2 * k);
    X += R * CMF[b][0]; Y += R * CMF[b][1]; Z += R * CMF[b][2];
  }
  X = X / WX * 0.9505; Y /= WY; Z = Z / WZ * 1.089;
  const r = 3.2406 * X - 1.5372 * Y - 0.4986 * Z, g = -0.9689 * X + 1.8758 * Y + 0.0415 * Z, bl = 0.0557 * X - 0.2040 * Y + 1.0570 * Z;
  return [r, g, bl].map((u) => Math.max(0, Math.min(255, Math.round(gam(Math.max(0, u))))));
}
const hex = (rgb) => '#' + rgb.map((v) => v.toString(16).padStart(2, '0')).join('');
function lab(rgb) {
  const l = (u) => { u /= 255; return u <= 0.04045 ? u / 12.92 : Math.pow((u + 0.055) / 1.055, 2.4); };
  const [r, g, b] = rgb.map(l);
  const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  const fx = f((0.4124 * r + 0.3576 * g + 0.1805 * b) / 0.9505), fy = f(0.2126 * r + 0.7152 * g + 0.0722 * b), fz = f((0.0193 * r + 0.1192 * g + 0.9505 * b) / 1.089);
  return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
}
const dE = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
const vec = (o) => PIG.map((p) => o[p] || 0);

// Colour names — each one's reference is what THIS paint model gives for the classic
// recipe, so the name always agrees with what the child sees. [name, recipe…]
const NAMES = [
  ['แดง', { red: 1 }], ['เหลือง', { yellow: 1 }], ['น้ำเงิน', { blue: 1 }], ['ขาว', { white: 1 }], ['ดำ', { black: 1 }],
  ['ส้ม', { red: 1, yellow: 1 }, { red: 1, yellow: 2 }], ['เขียว', { yellow: 1, blue: 1 }, { yellow: 2, blue: 1 }], ['ม่วง', { red: 1, blue: 1 }, { red: 2, blue: 1 }],
  ['ชมพู', { red: 1, white: 1 }, { red: 1, white: 2 }], ['ชมพูอ่อน', { red: 1, white: 5 }], ['ฟ้า', { blue: 1, white: 1 }, { blue: 1, white: 2 }], ['ฟ้าอ่อน', { blue: 1, white: 5 }],
  ['ม่วงอ่อน', { red: 1, blue: 1, white: 3 }], ['น้ำตาล', { red: 1, yellow: 1, blue: 1 }, { red: 1, yellow: 1, black: 1 }, { red: 2, yellow: 1, blue: 1 }],
  ['เทา', { black: 1, white: 3 }, { black: 1, white: 2 }], ['เทาอ่อน', { black: 1, white: 8 }], ['ครีม', { yellow: 1, white: 5 }], ['เหลืองอ่อน', { yellow: 1, white: 2 }],
  ['เขียวอ่อน', { yellow: 3, blue: 1, white: 3 }, { yellow: 4, blue: 1 }], ['เขียวเข้ม', { yellow: 1, blue: 1, black: 1 }, { yellow: 1, blue: 2 }],
  ['น้ำเงินเข้ม', { blue: 2, black: 1 }], ['แดงเข้ม', { red: 2, black: 1 }], ['ส้มอ่อน', { red: 1, yellow: 1, white: 3 }],
];
const REFS = []; for (const [n, ...rs] of NAMES) for (const r of rs) REFS.push({ n, lab: lab(kmRGB(vec(r))) });
const NAME_REF = Object.fromEntries(NAMES.map(([n, r]) => [n, r]));
function nameOf(rgb) { const L = lab(rgb); let b = REFS[0], bd = 1e9; for (const r of REFS) { const d = dE(L, r.lab); if (d < bd) { bd = d; b = r; } } return b.n; }
const recipeLine = (c) => { const tot = c.reduce((a, b) => a + b, 0); return PIG.filter((p, i) => c[i] > 0.03 * tot).map((p) => PIG_TH[p]).join('ผสม'); };

// ============================================================================
// 🎨 THE PALETTE — a grid of wet paint (thickness + pigment amounts per cell).
// Tubes squeeze blobs; dragging the brush smears paint along the stroke and slowly
// evens it out, so colours streak first and then blend — like real paint.
// ============================================================================
const pal = $('pal'), pctx = pal.getContext('2d');
const GW = 180, GH = 120, CELL = 4, N = GW * GH;
const A = new Float32Array(N), C = new Float32Array(N * 5);       // thickness, pigment amount per cell
const RGB = new Uint8ClampedArray(N * 3), dirty = new Uint8Array(N);
const inPal = new Uint8Array(N);

      qc.beginPath(); qc.moveTo(380 + wob, Math.max(y0, ly + 30)); qc.lineTo(380 + wob, lv - 6); qc.stroke();
    }
  }
  // glass front: outline, measuring ticks (1 ส่วน each), shine, thick base
  qc.strokeStyle = 'rgba(110,150,180,0.95)'; qc.lineWidth = 6; qc.lineJoin = 'round';
  qc.beginPath(); qc.moveTo(gxl(GT) - 10, GT); qc.lineTo(gxl(GB) - 10, GB); qc.lineTo(gxr(GB) + 10, GB); qc.lineTo(gxr(GT) + 10, GT); qc.stroke();
  qc.fillStyle = 'rgba(200,225,240,0.75)'; qc.fillRect(gxl(GB) - 7, IN_BOT + 2, gxr(GB) - gxl(GB) + 14, GB - IN_BOT - 5);
  qc.strokeStyle = 'rgba(90,120,150,0.6)'; qc.lineWidth = 3;
  for (let k = 1; k <= CAP; k++) { const y = levelY(k), x = gxr(y); qc.beginPath(); qc.moveTo(x - (k % 5 ? 16 : 30), y); qc.lineTo(x, y); qc.stroke(); }
  qc.fillStyle = 'rgba(255,255,255,0.55)';
  qc.beginPath(); qc.moveTo(gxl(GT) + 14, GT + 20); qc.lineTo(gxl(GT) + 34, GT + 20); qc.lineTo(gxl(GB) + 34, GB - 50); qc.lineTo(gxl(GB) + 16, GB - 50); qc.closePath(); qc.fill();
  // the chosen bucket, tipping over the glass
  if (potSel >= 0) {
    const col = hex(POTS[potSel].rgb);
    qc.save(); qc.translate(CAN.x, CAN.y); qc.rotate(canAng);
    qc.strokeStyle = '#6b7785'; qc.lineWidth = 5; qc.beginPath(); qc.arc(0, -40, 50, Math.PI * 1.1, Math.PI * 1.9); qc.stroke();
    qc.fillStyle = '#dfe5ec'; qc.strokeStyle = '#6b7785'; qc.lineWidth = 5;
    qc.beginPath(); qc.moveTo(-58, -48); qc.lineTo(58, -48); qc.lineTo(50, 48); qc.lineTo(-50, 48); qc.closePath(); qc.fill(); qc.stroke();
    qc.fillStyle = col; qc.fillRect(-55, -45, 110, 14);
    qc.beginPath(); qc.moveTo(30, -32); qc.lineTo(30, -6); qc.arc(36, -6, 6, Math.PI, 0, true); qc.lineTo(42, -32); qc.fill();
    qc.restore();
  }
}

const TIPS = {

    'ใส่สีไหนมากกว่า สีที่ได้จะเอียงไปทางสีนั้น', 'เติมสีขาวให้สีอ่อนลง เติมสีดำให้สีเข้มขึ้น', 'ผสมสีแม่ทั้งสามสีเข้าด้วยกัน จะได้สีน้ำตาลหม่นๆ'],
  pour: ['แตะค้างที่ถังสี สีจะไหลลงแก้ว ยกนิ้วขึ้นเมื่อไหร่ก็หยุดเท', 'เทสีไหนนานกว่า สีในแก้วจะเอียงไปทางสีนั้น',

  light: ['ลากวงไฟให้ซ้อนกันดูสิ แสงยิ่งผสมยิ่งสว่าง ไม่เหมือนสีน้ำที่ยิ่งผสมยิ่งเข้ม',
    'จอโทรศัพท์และทีวีมีจุดแสงแดง เขียว น้ำเงิน เล็กๆ เต็มไปหมด รวมกันเป็นทุกสีที่เราเห็น'],
};
let mode = 'mix', tipN = 0;
function setFact(t) { $('fact').textContent = t; }
$('fact').addEventListener('click', () => { ensureAudio(); speak($('fact').textContent); });
function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll('#modes .chip')) b.classList.toggle('on', b.dataset.mode === m);
  $('mixUI').classList.toggle('hidden', !(m === 'mix' || m === 'target'));
  $('targetBox').classList.toggle('hidden', m !== 'target');
  $('paintUI').classList.toggle('hidden', m !== 'paint');
  $('pourUI').classList.toggle('hidden', m !== 'pour');
  if (m !== 'pour') stopPour();
  $('lightUI').classList.toggle('hidden', m !== 'light');
  ['saveBtn', 'toPaint'].forEach((id) => $(id).classList.toggle('hidden', m === 'target'));
  $('saved').classList.toggle('hidden', m === 'target');
  if (m === 'mix') { setFact(TIPS.mix[tipN++ % TIPS.mix.length]); speak('บีบสีลงจาน แล้วลากพู่กันผสมสีเลย'); }
  else if (m === 'pour') { setFact(TIPS.pour[tipN++ % TIPS.pour.length]); markPots(); renderPourInfo(); speak('แตะค้างที่ถังสี แล้วเทลงแก้วเลย'); }
  else if (m === 'target') { setFact(TIPS.target[0]); startTarget(); }

}
for (const b of document.querySelectorAll('#modes .chip')) b.addEventListener('click', () => { ensureAudio(); buzz(8); setMode(b.dataset.mode); });

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
}
function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
function noise(dur, f, q, v) {
  if (!AC) return;
  const t = AC.currentTime, b = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = b; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; g.gain.value = v;
  s.connect(bp).connect(g).connect(AC.destination); s.start(t);
}
const squish = () => { noise(0.18, 500, 2, 0.5); tone(160, 0.12, 'sine', 0.08); };
const swish = () => noise(0.12, 2200, 0.8, 0.12);
const dip = () => noise(0.1, 900, 3, 0.3);
const splash = () => { noise(0.35, 1200, 1, 0.4); tone(600, 0.1, 'sine', 0.05); };
const chime = () => { tone(880, 0.12, 'sine', 0.1); setTimeout(() => tone(1320, 0.16, 'sine', 0.09), 90); };
function cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.15), i * 110)); }
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function pickVoice() {
  try { return (speechSynthesis.getVoices() || []).find(v => (v.lang || '').toLowerCase().startsWith('th')) || null; } catch (e) { return null; }
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
// Recorded clip first (voice/, made by tools/gen_voice.py), device TTS as fallback.
function speak(text) { seqTok++; say1(text); }
function say1(text) {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  if (!window.VoiceClips) { deviceSpeak(text); return Promise.resolve(false); }
  ensureAudio(); return VoiceClips.say(text, AC, deviceSpeak);
}
// "แดงผสมเหลือง" + "ได้สีส้ม" — two short clips chained instead of one per combination
let seqTok = 0;
async function speakSeq(parts) {
  const my = ++seqTok;
  for (const p of parts) { if (my !== seqTok) return; const ok = await say1(p); if (!ok) await new Promise((r) => setTimeout(r, 300 + p.length * 90)); }
}
function deviceSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function celebrate(n) {
  const cols = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#9b59b6', '#ff914d'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}
let loopT = 0;
function loop(now) {
  const dt = loopT ? Math.min(0.05, (now - loopT) / 1000) : 0.016; loopT = now;
  if (palDirty && (mode === 'mix' || mode === 'target')) renderPal();
  if (mode === 'pour') pourTick(dt, now);
  requestAnimationFrame(loop);
}

// Block double-tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

buildTubes(); buildPots(); renderSaved(); setFact(TIPS.mix[tipN++]); renderPal(); requestAnimationFrame(loop);

    'สีเก่าติดมาด้วย ล้างพู่กันในแก้วน้ำก่อนนะ', 'เปลี่ยนน้ำใหม่แล้ว', 'น้ำล้างพู่กันสกปรกแล้ว แตะแก้วอีกทีเพื่อเปลี่ยนน้ำ', 'ล้างพู่กันแล้ว', 'ลากไฟฉายให้แสงซ้อนกันดูสิ',
    'แตะค้างที่ถังสี แล้วเทลงแก้วเลย', 'แก้วเต็มแล้ว เทออกแล้วเริ่มใหม่นะ', 'เทสีออกแล้ว', 'เทสีลงแก้วก่อนนะ',
    ...Object.values(LIGHT_SAY), ...Object.values(TIPS).flat()];
  for (const [n] of NAMES) L.push('สี' + n, 'ได้สี' + n, 'เก็บสี' + n + 'ไว้แล้ว');
  for (const n of TARGETS) L.push('ผสมให้ได้สี' + n, 'เก่งมาก ได้สี' + n + 'แล้ว');
  for (const p of PIG) L.push('ลองเติมสี' + PIG_TH[p] + 'อีกนิด');
  for (let m = 1; m < 32; m++) L.push(PIG.filter((_, i) => m & (1 << i)).map((p) => PIG_TH[p]).join('ผสม'));
  for (const P of PICS) {
    L.push('ระบาย' + P.th, realLine(P));
    for (const r of P.regions) if (r.real) L.push(r.th + 'สี' + r.real + ' เหมือนจริงเลย');
  }
  return L;
});

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
