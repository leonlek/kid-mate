<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🚂 ต่อรางรถไฟ — คิดส์เล่น</title>
<meta name="description" content="ต่อรางรถไฟ วางราง หมุนราง สร้างสะพานข้ามแม่น้ำ ให้รถไฟวิ่งจากสถานีถึงปลายทาง มีด่านปริศนาและโหมดสร้างอิสระ ฝึกวางแผนและมิติสัมพันธ์">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ต่อรางรถไฟ">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-3: #b5e8ff; --grass-1: #7ed957;
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --paper: #fffef9; --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif; color: var(--ink);
    height: 100dvh; overflow: hidden;
    background:
      radial-gradient(ellipse at 18% 8%, #fff9c4 0%, transparent 48%),
      radial-gradient(ellipse at 86% 14%, #ffcfd2 0%, transparent 42%),
      linear-gradient(180deg, var(--sky-3) 0%, #d9f3c9 65%, var(--grass-1) 100%);
    user-select: none; -webkit-user-select: none; touch-action: none;
  }
  .screen { display: none; height: 100dvh; }
  .screen.active { display: flex; flex-direction: column; }

  .fab {
    position: fixed; z-index: 60; width: 50px; height: 50px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; color: var(--ink);
    background: var(--paper); border: 4px solid var(--card-border);
    box-shadow: 0 4px 0 rgba(0,0,0,0.12); cursor: pointer; padding: 0; font-family: inherit;
    transition: transform .12s, box-shadow .12s;
  }
  .fab:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.12); }
  .home { top: calc(10px + env(safe-area-inset-top)); left: 12px; }
  .back { top: calc(10px + env(safe-area-inset-top)); left: 72px; }

  /* ---- Select screen ---- */
  #selectScreen { overflow-y: auto; display: none; }
  #selectScreen.active { display: block; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }
  .hero { text-align: center; padding: 16px 10px 4px; }
  .hero h1 { font-family: 'Itim', cursive; font-size: clamp(34px, 8vw, 56px); margin: 0;
             color: var(--brand-dark); text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08); }
  .hero p { font-size: clamp(15px, 3.2vw, 19px); margin: 6px 0 0; color: #555; font-weight: 500; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px 0 8px; }
  .mode-card {
    background: var(--card); border: 4px solid var(--card-border); border-radius: 22px;
    padding: 18px 12px; text-align: center; cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08); transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  .mode-card:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .mode-card.sel { border-color: var(--brand); }
  .mode-card .me { font-size: 54px; line-height: 1; }
  .mode-card .mt { font-family: 'Itim', cursive; font-size: 24px; color: var(--brand-dark); margin-top: 6px; }
  .mode-card .md { font-size: 13px; color: #666; margin-top: 2px; }

  .lgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 12px; margin-top: 8px; }
  .lcard {
    background: var(--card); border: 4px solid var(--card-border); border-radius: 18px;
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,0.07); position: relative;
    transition: transform .12s, box-shadow .12s;
  }
  .lcard:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.07); }
  .lcard .ln { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); }
  .lcard .done-star { position: absolute; top: 4px; right: 6px; font-size: 20px; }
  .section-title { font-family: 'Itim', cursive; font-size: 22px; color: var(--brand-dark);
                   text-shadow: 2px 2px 0 #fff; margin: 20px 4px 6px; }

  /* ---- Game screen ---- */
  #gameScreen { padding: env(safe-area-inset-top) 0 0; }
  .topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
            gap: 10px; padding: 3px 62px; }
  .topbar .info { font-family: 'Itim', cursive; font-size: 19px; color: var(--brand-dark); }
  .stage { flex: 1 1 auto; min-height: 0; display: grid; place-items: center; padding: 2px 4px; }
  #board { display: block; background: #eaf6d8; border-radius: 18px;
           box-shadow: 0 6px 0 rgba(0,0,0,0.10); touch-action: none; }

  .toolbar {
    flex: 0 0 auto; background: var(--paper); border-top: 4px solid var(--card-border);
    box-shadow: 0 -4px 0 rgba(0,0,0,0.05);
    padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px;
  }
  .tbtn {
    min-width: 58px; height: 58px; padding: 0 10px; border-radius: 16px;
    border: 3px solid var(--card-border); background: #fff; color: var(--ink);
    font-size: 25px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 0 rgba(0,0,0,0.10); transition: transform .12s, box-shadow .12s, background .12s;
    font-family: inherit;
  }
  .tbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.10); }
  .tbtn.sel { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .tbtn.run { background: var(--gold); border-color: #e0b800; min-width: 92px; font-family: 'Itim', cursive; font-size: 22px; }
  .tbtn.run.running { background: #ff8f43; border-color: #e06a1a; color: #fff; }
  .sep { width: 3px; height: 40px; background: var(--card-border); border-radius: 3px; }

  /* ---- Win overlay ---- */
  .overlay { position: fixed; inset: 0; z-index: 100; display: none;
             align-items: center; justify-content: center; background: rgba(0,0,0,0.28); }
  .overlay.shown { display: flex; }
  .win-card { background: var(--card); border: 5px solid var(--gold); border-radius: 28px;
              padding: 26px 30px; text-align: center; box-shadow: 0 10px 0 rgba(0,0,0,0.15);
              max-width: 86%; }
  .win-card .we { font-size: 66px; }
  .win-card .wt { font-family: 'Itim', cursive; font-size: 34px; color: var(--brand-dark); margin: 4px 0 14px; }
  .big-btn { display: block; width: 100%; margin: 8px 0 0; padding: 12px; border: none; cursor: pointer;
             font-family: 'Itim', cursive; font-size: 22px; color: #fff; background: var(--brand);
             border-radius: 999px; box-shadow: 0 5px 0 var(--brand-dark); }
  .big-btn:active { transform: translateY(2px); box-shadow: 0 3px 0 var(--brand-dark); }
  .big-btn.secondary { background: #b7c4cf; box-shadow: 0 5px 0 #8a97a3; }

  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 120; pointer-events: none;
              animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(112vh) rotate(720deg); } }
</style>
</head>
<body>
  <a class="fab home" href="../" id="homeBtn" aria-label="กลับหน้าหลัก">🏠</a>
  <button class="fab back" id="menuBtn" aria-label="เลือกโหมด" style="display:none">⬅️</button>

  <!-- ============ SELECT ============ -->
  <section id="selectScreen" class="screen active">
    <div class="wrap">
      <div class="hero">
        <h1>🚂 ต่อรางรถไฟ</h1>
        <p>วางราง หมุนราง ต่อสะพาน ให้รถไฟวิ่งถึงปลายทาง</p>
      </div>
      <div class="modes">
        <div class="mode-card" id="modePuzzle">
          <div class="me">🧩</div><div class="mt">ด่านปริศนา</div>
          <div class="md">ต่อรางให้ถึงสถานีปลายทาง</div>
        </div>
        <div class="mode-card" id="modeSandbox">
          <div class="me">🏗️</div><div class="mt">สร้างอิสระ</div>
          <div class="md">ต่อรางของตัวเอง วิ่งวนได้</div>
        </div>
      </div>
      <div class="section-title" id="levelTitle" style="display:none">เลือกด่าน</div>
      <div class="lgrid" id="levelGrid" style="display:none"></div>
    </div>
  </section>

  <!-- ============ GAME ============ -->
  <section id="gameScreen" class="screen">
    <div class="topbar"><div class="info" id="infoText">ด่าน 1</div></div>
    <div class="stage"><canvas id="board"></canvas></div>
    <div class="toolbar" id="toolbar">
      <button class="tbtn sel" id="tStraight" aria-label="รางตรง">━</button>
      <button class="tbtn" id="tCurve" aria-label="รางโค้ง">╭</button>
      <button class="tbtn" id="tJunction" aria-label="ทางแยก">┳</button>
      <button class="tbtn" id="tWye" aria-label="ทางแยกตัว Y">Y</button>
      <button class="tbtn" id="tSwitch" aria-label="ที่สับราง">🔀</button>
      <button class="tbtn" id="tCross" aria-label="สะพานข้ามราง">🌉</button>
      <button class="tbtn" id="tStation" aria-label="สถานี">🚉</button>
      <button class="tbtn" id="tErase" aria-label="ลบราง">🧽</button>
      <div class="sep"></div>
      <button class="tbtn run" id="runBtn">▶ วิ่ง!</button>
      <button class="tbtn" id="resetBtn" aria-label="เริ่มใหม่">🔄</button>
    </div>
  </section>

  <div class="overlay" id="winOverlay">
    <div class="win-card">
      <div class="we">🎉</div>
      <div class="wt" id="winText">รถไฟถึงแล้ว!</div>
      <button class="big-btn" id="nextBtn">ด่านต่อไป ➡️</button>
      <button class="big-btn secondary" id="selBtn">เลือกด่านอื่น</button>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // ---- Directions & pieces -----------------------------------------------
  // sides: 0=N 1=E 2=S 3=W (clockwise)
  var DV = [[0,-1],[1,0],[0,1],[-1,0]];
  function opp(s) { return (s + 2) % 4; }
  function rotSide(s, r) { return (s + r) % 4; }
  // base openings at rot 0
  var BASE = { straight: [1, 3], curve: [0, 1], cross: [0, 1, 2, 3], station: [1, 3],
               'switch': [3, 1, 2], junction: [3, 1, 2], wye: [1, 3, 2] };  // wye = Y: stem S -> arms E,W
  function openings(type, rot) { return BASE[type].map(function (s) { return rotSide(s, rot); }); }
  function hasOpen(cell, side) {
    if (!cell || !cell.type) return false;
    return openings(cell.type, cell.rot).indexOf(side) >= 0;
  }
  // connections to DRAW for a piece: list of [sideA, sideB]
  function connections(type, rot) {
    if (type === 'cross') return [[rotSide(1, rot), rotSide(3, rot)], [rotSide(0, rot), rotSide(2, rot)]];
    var o = openings(type, rot);
    return [[o[0], o[1]]];
  }

  // ---- Levels -------------------------------------------------------------
  // dir on a station = the side that opens INTO the grid.
  var LEVELS = [
    { c: 4, r: 3, a: { x: 0, y: 1, d: 1 }, b: { x: 3, y: 1, d: 3 }, water: [] },
    { c: 5, r: 4, a: { x: 0, y: 0, d: 1 }, b: { x: 4, y: 3, d: 3 }, water: [] },
    { c: 5, r: 4, a: { x: 0, y: 3, d: 1 }, b: { x: 4, y: 0, d: 3 }, water: [[2,1],[2,2]] },
    { c: 6, r: 5, a: { x: 0, y: 2, d: 1 }, b: { x: 5, y: 2, d: 3 }, water: [[2,0],[2,1],[2,2],[2,3],[2,4]] },
    { c: 6, r: 5, a: { x: 2, y: 0, d: 2 }, b: { x: 3, y: 4, d: 0 }, water: [[0,2],[1,2],[4,2],[5,2]] },
    { c: 6, r: 6, a: { x: 0, y: 0, d: 1 }, b: { x: 5, y: 5, d: 3 }, water: [[3,1],[3,2],[3,3],[3,4]] }
  ];

  // ---- State --------------------------------------------------------------
  var canvas = $('board'), ctx = canvas.getContext('2d');
  var S = {
    mode: 'puzzle', levelIdx: 0, cols: 4, rows: 3, cell: 40, dpr: 1,
    grid: [], a: null, b: null, tool: 'straight',
    running: false, anim: null, cleared: loadCleared()
  };

  function blankGrid(c, r) {
    var g = [];
    for (var y = 0; y < r; y++) { g[y] = []; for (var x = 0; x < c; x++) g[y][x] = { type: null, rot: 0, water: false, fixed: false }; }
    return g;
  }

  // ---- Audio (generated) --------------------------------------------------
  var actx = null, chuffTimer = 0;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (e) {} }
  }
  function tone(freq, dur, type, gain, slide) {
    if (!actx) return;
    var t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gain || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  }
  function sndClack() { tone(240, 0.07, 'square', 0.14, 180); }
  function sndRot() { tone(520, 0.06, 'triangle', 0.12, 640); }
  function sndChuff() { tone(120, 0.12, 'sawtooth', 0.10, 70); }
  function sndWhistle() { tone(720, 0.5, 'sine', 0.16, 900); setTimeout(function(){ tone(880, 0.4, 'sine', 0.14, 700); }, 120); }
  function sndWin() { [523,659,784,1047].forEach(function (f, i) { setTimeout(function () { tone(f, 0.22, 'triangle', 0.2); }, i * 130); }); }
  function sndNope() { tone(200, 0.2, 'sine', 0.14, 130); }
  function buzz(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

  // ---- Cleared storage ----------------------------------------------------
  function loadCleared() { try { return JSON.parse(localStorage.getItem('train-track-cleared') || '{}'); } catch (e) { return {}; } }
  function saveCleared() { try { localStorage.setItem('train-track-cleared', JSON.stringify(S.cleared)); } catch (e) {} }

  // ---- Build level / sandbox ---------------------------------------------
  function startPuzzle(idx) {
    S.mode = 'puzzle'; S.levelIdx = idx;
    var L = LEVELS[idx];
    S.cols = L.c; S.rows = L.r; S.grid = blankGrid(L.c, L.r);
    (L.water || []).forEach(function (w) { S.grid[w[1]][w[0]].water = true; });
    S.a = { x: L.a.x, y: L.a.y, d: L.a.d };
    S.b = { x: L.b.x, y: L.b.y, d: L.b.d };
    $('infoText').textContent = 'ด่าน ' + (idx + 1);
    enterGame();
  }
  function startSandbox() {
    S.mode = 'sandbox'; S.cols = 7; S.rows = 7; S.grid = blankGrid(7, 7);
    // a river down the middle to invite bridges
    for (var y = 0; y < 7; y++) S.grid[y][3].water = true;
    S.grid[3][3].water = true;
    S.a = { x: 0, y: 3, d: 1 }; S.b = null;   // depot only; no goal
    $('infoText').textContent = '🏗️ สร้างอิสระ';
    enterGame();
  }
  function enterGame() {
    stopTrain();
    $('selectScreen').classList.remove('active');
    $('gameScreen').classList.add('active');
    $('menuBtn').style.display = '';
    $('nextBtn').style.display = (S.mode === 'puzzle') ? '' : 'none';
    requestAnimationFrame(function () { fit(); render(); });
  }

  // ---- Sizing -------------------------------------------------------------
  function fit() {
    var stage = canvas.parentNode, pad = 8;
    var availW = stage.clientWidth - pad, availH = stage.clientHeight - pad;
    var cell = Math.floor(Math.min(availW / S.cols, availH / S.rows));
    cell = Math.max(38, Math.min(cell, 200));
    S.cell = cell;
    S.dpr = window.devicePixelRatio || 1;
    var w = cell * S.cols, h = cell * S.rows;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    canvas.width = Math.round(w * S.dpr); canvas.height = Math.round(h * S.dpr);
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  }
  function cellAt(px, py) {
    var r = canvas.getBoundingClientRect();
    var x = Math.floor((px - r.left) / (r.width / S.cols));
    var y = Math.floor((py - r.top) / (r.height / S.rows));
    if (x < 0 || y < 0 || x >= S.cols || y >= S.rows) return null;
    return { x: x, y: y };
  }

  // ---- Geometry helpers (centerline of a connection) ----------------------
  function edgeMid(x, y, side) {
    var s = S.cell, ox = x * s, oy = y * s;
    if (side === 0) return [ox + s / 2, oy];          // N
    if (side === 1) return [ox + s, oy + s / 2];      // E
    if (side === 2) return [ox + s / 2, oy + s];      // S
    return [ox, oy + s / 2];                          // W
  }
  // sample points along the centerline of a connection (sideA<->sideB) in a cell
  function centerline(x, y, sa, sb, n) {
    n = n || 10;
    var s = S.cell, ox = x * s, oy = y * s, cx = ox + s / 2, cy = oy + s / 2;
    var A = edgeMid(x, y, sa), B = edgeMid(x, y, sb), pts = [];
    if (opp(sa) === sb) {                       // straight
      for (var i = 0; i <= n; i++) { var t = i / n; pts.push([A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t]); }
      return pts;
    }
    // curve: arc centered at the shared corner, radius s/2
    var corner = [ (sa === 1 || sb === 1) ? ox + s : ((sa === 3 || sb === 3) ? ox : cx),
                   (sa === 2 || sb === 2) ? oy + s : ((sa === 0 || sb === 0) ? oy : cy) ];
    var a0 = Math.atan2(A[1] - corner[1], A[0] - corner[0]);
    var a1 = Math.atan2(B[1] - corner[1], B[0] - corner[0]);
    // choose short arc
    var d = a1 - a0; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI;
    for (var j = 0; j <= n; j++) { var tt = j / n, ang = a0 + d * tt;
      pts.push([corner[0] + (s / 2) * Math.cos(ang), corner[1] + (s / 2) * Math.sin(ang)]); }
    return pts;
  }

  // ---- Rendering ----------------------------------------------------------
  function render() {
    var s = S.cell, W = s * S.cols, H = s * S.rows;
    ctx.clearRect(0, 0, W, H);
    // terrain + grid
    for (var y = 0; y < S.rows; y++) for (var x = 0; x < S.cols; x++) {
      var c = S.grid[y][x];
      ctx.fillStyle = c.water ? '#7ec8ff' : '#cdeeb0';
      ctx.fillRect(x * s, y * s, s, s);
      if (c.water) {                              // little ripples
        ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = Math.max(1.5, s * 0.03);
        for (var k = 0; k < 2; k++) { ctx.beginPath();
          var wy = y * s + s * (0.35 + k * 0.32);
          ctx.moveTo(x * s + s * 0.2, wy); ctx.quadraticCurveTo(x * s + s * 0.5, wy - s * 0.08, x * s + s * 0.8, wy); ctx.stroke(); }
      }
      ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 1;
      ctx.strokeRect(x * s + 0.5, y * s + 0.5, s, s);
    }
    // tracks
    for (y = 0; y < S.rows; y++) for (x = 0; x < S.cols; x++) {
      var cc = S.grid[y][x];
      if (cc.type) drawTrack(x, y, cc);
    }
    // stations
    if (S.a) drawStation(S.a, S.mode === 'sandbox' ? '#3fa64d' : '#3fa64d', S.mode === 'sandbox' ? '🏠' : 'A');
    if (S.b) drawStation(S.b, '#e23b3b', 'B');
    // train
    if (S.running && S.anim) drawTrain();
  }

  function drawTrack(x, y, cell) {
    if (cell.type === 'cross') { drawOverpass(x, y, cell); return; }
    if (cell.type === 'switch') { drawSwitch(x, y, cell); return; }
    if (cell.type === 'junction') { drawJunction(x, y, cell); return; }
    if (cell.type === 'wye') { drawWye(x, y, cell); return; }
    connections(cell.type, cell.rot).forEach(function (cn) {
      drawSeg(centerline(x, y, cn[0], cn[1], 12), cell.water);
    });
    if (cell.type === 'station') drawStationStop(x, y);
  }
  function drawSeg(pts, water) {                 // ties + two rails along a polyline
    var s = S.cell;
    if (water) drawBridge(pts, s);
    ctx.strokeStyle = '#b5763b'; ctx.lineWidth = Math.max(2, s * 0.07); ctx.lineCap = 'butt';
    for (var i = 1; i < pts.length; i += 2) {
      var p = pts[i], q = pts[Math.min(i + 1, pts.length - 1)], pr = pts[i - 1];
      var tx = q[0] - pr[0], ty = q[1] - pr[1], tl = Math.hypot(tx, ty) || 1;
      var nx = -ty / tl, ny = tx / tl, tw = s * 0.2;
      ctx.beginPath(); ctx.moveTo(p[0] - nx * tw, p[1] - ny * tw); ctx.lineTo(p[0] + nx * tw, p[1] + ny * tw); ctx.stroke();
    }
    var gap = s * 0.15; drawRail(pts, gap); drawRail(pts, -gap);
  }
  function halfLine(x, y, side, n) {             // center -> edge midpoint
    var s = S.cell, cx = x * s + s / 2, cy = y * s + s / 2, e = edgeMid(x, y, side), pts = [];
    n = n || 6; for (var i = 0; i <= n; i++) { var t = i / n; pts.push([cx + (e[0] - cx) * t, cy + (e[1] - cy) * t]); }
    return pts;
  }
  function drawOverpass(x, y, cell) {            // one line raised over the other (bridge)
    var s = S.cell, ox = x * s, cy = y * s + s / 2;
    drawSeg(centerline(x, y, 0, 2, 12), cell.water);           // lower line (N-S)
    ctx.fillStyle = 'rgba(0,0,0,0.14)'; roundRect(ox - 1, cy - s * 0.16, s + 2, s * 0.42, s * 0.06); ctx.fill();
    ctx.fillStyle = '#c9a06a';                                 // support posts
    [0.16, 0.84].forEach(function (fx) { ctx.fillRect(ox + fx * s - s * 0.04, cy - s * 0.18, s * 0.08, s * 0.36); });
    ctx.fillStyle = '#e8c48f'; roundRect(ox - 1, cy - s * 0.22, s + 2, s * 0.44, s * 0.07); ctx.fill();  // deck
    ctx.strokeStyle = '#c79a5c'; ctx.lineWidth = Math.max(1.5, s * 0.03); ctx.strokeRect(ox, cy - s * 0.22, s, s * 0.44);
    drawSeg(centerline(x, y, 1, 3, 12), false);                // upper rails (E-W)
  }
  function drawSwitch(x, y, cell) {              // T-junction with a switch lever (สับราง)
    var s = S.cell, o = openings('switch', cell.rot);
    drawSeg(centerline(x, y, o[0], o[1], 12), cell.water);     // trunk
    drawSeg(halfLine(x, y, o[2], 6), cell.water);              // branch stub
    var active = ((cell.sw ? 2 : 1) + cell.rot) % 4;           // active exit for a trunk-in train
    var cx = x * s + s / 2, cyy = y * s + s / 2, ae = edgeMid(x, y, active);
    ctx.strokeStyle = '#2ecc40'; ctx.lineWidth = Math.max(3, s * 0.11); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cyy); ctx.lineTo(cx + (ae[0] - cx) * 0.55, cyy + (ae[1] - cyy) * 0.55); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cyy, s * 0.09, 0, Math.PI * 2); ctx.fillStyle = '#2ecc40'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
  }
  function drawWye(x, y, cell) {                 // Y-fork: stem forks into two curved arms
    var s = S.cell, stem = (2 + cell.rot) % 4, aE = (1 + cell.rot) % 4, aW = (3 + cell.rot) % 4;
    drawSeg(centerline(x, y, stem, aE, 12), cell.water);
    drawSeg(centerline(x, y, stem, aW, 12), cell.water);
    var m = edgeMid(x, y, stem);
    ctx.beginPath(); ctx.arc(m[0], m[1], s * 0.07, 0, Math.PI * 2); ctx.fillStyle = '#5a5a5a'; ctx.fill();
  }
  function drawJunction(x, y, cell) {            // passive fork/merge (ทางแยก 1→2)
    var s = S.cell, o = openings('junction', cell.rot);
    drawSeg(centerline(x, y, o[0], o[1], 12), cell.water);   // trunk
    drawSeg(halfLine(x, y, o[2], 6), cell.water);            // branch
    var cx = x * s + s / 2, cy = y * s + s / 2;
    ctx.beginPath(); ctx.arc(cx, cy, s * 0.08, 0, Math.PI * 2); ctx.fillStyle = '#5a5a5a'; ctx.fill();
  }
  function drawStationStop(x, y) {               // little station house (top-left corner)
    var s = S.cell, ox = x * s, oy = y * s;
    ctx.fillStyle = '#f4a261'; roundRect(ox + s * 0.08, oy + s * 0.22, s * 0.34, s * 0.22, s * 0.04); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.beginPath();
    ctx.moveTo(ox + s * 0.05, oy + s * 0.24); ctx.lineTo(ox + s * 0.25, oy + s * 0.10);
    ctx.lineTo(ox + s * 0.45, oy + s * 0.24); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff3d6'; ctx.fillRect(ox + s * 0.22, oy + s * 0.30, s * 0.06, s * 0.10);
  }
  function drawRail(pts, off) {
    ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = Math.max(1.6, S.cell * 0.045);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath();
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], pr = pts[Math.max(0, i - 1)], nx = pts[Math.min(pts.length - 1, i + 1)];
      var tx = nx[0] - pr[0], ty = nx[1] - pr[1], tl = Math.hypot(tx, ty) || 1;
      var ox = -ty / tl * off, oy = tx / tl * off;
      if (i === 0) ctx.moveTo(p[0] + ox, p[1] + oy); else ctx.lineTo(p[0] + ox, p[1] + oy);
    }
    ctx.stroke();
  }
  function drawBridge(pts, s) {
    // tan deck under the track
    ctx.strokeStyle = '#d9b382'; ctx.lineWidth = s * 0.62; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    ctx.strokeStyle = '#b98e57'; ctx.lineWidth = s * 0.62; ctx.setLineDash([s * 0.14, s * 0.10]);
    ctx.beginPath(); pts.forEach(function (p, i) { i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]); }); ctx.stroke();
    ctx.setLineDash([]);
  }
  function drawStation(st, col, label) {
    var s = S.cell, cx = st.x * s + s / 2, cy = st.y * s + s / 2, R = s * 0.34;
    // stub of track pointing into the grid
    var em = edgeMid(st.x, st.y, st.d);
    ctx.strokeStyle = '#5a5a5a'; ctx.lineWidth = Math.max(2, s * 0.09); ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(em[0], em[1]); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    ctx.lineWidth = Math.max(2, s * 0.05); ctx.strokeStyle = '#fff'; ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.round(s * 0.34) + "px 'Itim',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    if (label.length === 1) ctx.fillText(label, cx, cy + 1);
    else { ctx.font = Math.round(s * 0.42) + "px sans-serif"; ctx.fillText(label, cx, cy + 1); }
  }

  // ---- Pointer ------------------------------------------------------------
  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault(); ensureAudio();
    if (S.running) { stopTrain(); }
    var c = cellAt(e.clientX, e.clientY); if (!c) return;
    if (isStation(c.x, c.y)) return;             // can't edit station cells
    var cell = S.grid[c.y][c.x];
    if (cell.fixed) return;
    if (S.tool === 'erase') { cell.type = null; buzz(6); sndClack(); render(); return; }
    if (!cell.type) { cell.type = S.tool; cell.rot = 0; cell.sw = 0; sndClack(); buzz(8); }
    else if (cell.type === 'switch') {           // tap a switch: flip it (สับราง); every 2nd tap rotates
      cell.sw = cell.sw ? 0 : 1; if (cell.sw === 0) cell.rot = (cell.rot + 1) % 4; sndRot(); buzz(6);
    }
    else {                                       // tapping any placed piece rotates it
      var n = (cell.type === 'straight' || cell.type === 'station') ? 2 : (cell.type === 'cross' ? 1 : 4);
      cell.rot = (cell.rot + 1) % n; sndRot(); buzz(5);
    }
    render();
  });
  function isStation(x, y) {
    return (S.a && S.a.x === x && S.a.y === y) || (S.b && S.b.x === x && S.b.y === y);
  }

  // ---- Trace path from station A -----------------------------------------
  function tracePath() {
    var pts = [], reachedB = false, looped = false;
    if (!S.a) return { pts: pts, reachedB: reachedB, looped: looped };
    var s = S.cell;
    var startC = [S.a.x * s + s / 2, S.a.y * s + s / 2];
    var stub = edgeMid(S.a.x, S.a.y, S.a.d);
    pts.push(startC); pts.push(stub);
    var cx = S.a.x, cy = S.a.y, exitDir = S.a.d, steps = 0, seen = {};
    while (steps++ < 400) {
      var nx = cx + DV[exitDir][0], ny = cy + DV[exitDir][1];
      if (nx < 0 || ny < 0 || nx >= S.cols || ny >= S.rows) break;
      var entry = opp(exitDir);
      if (S.b && nx === S.b.x && ny === S.b.y) {
        if (entry === S.b.d) { pts.push(edgeMid(nx, ny, entry)); pts.push([nx * s + s / 2, ny * s + s / 2]); reachedB = true; }
        break;
      }
      if (nx === S.a.x && ny === S.a.y) { looped = true; break; }   // back to depot
      var cell = S.grid[ny][nx];
      if (!cell.type || !hasOpen(cell, entry)) break;
      var outs = openings(cell.type, cell.rot).filter(function (o) { return o !== entry; });
      var out;
      if (cell.type === 'cross' || cell.type === 'station') out = opp(entry);   // straight through
      else if (cell.type === 'junction') out = hasOpen(cell, opp(entry)) ? opp(entry) : outs[0];  // fork: straight, else branch
      else if (cell.type === 'wye') { var stem = (2 + cell.rot) % 4; out = (entry === stem) ? outs[0] : stem; }  // Y-fork
      else if (cell.type === 'switch') {
        var be = (entry - cell.rot + 4) % 4;                 // base entry (W=3 trunk, E=1, S=2 branch)
        var bx = (be === 3) ? (cell.sw ? 2 : 1) : 3;         // W -> E(straight) or S(branch); E/S -> W
        out = (bx + cell.rot) % 4;
      } else out = outs[0];
      if (out === undefined) break;
      var key = nx + ',' + ny + ',' + entry;
      if (seen[key]) { looped = true; break; }
      seen[key] = 1;
      var cl = centerline(nx, ny, entry, out, 12);
      for (var i = 0; i < cl.length; i++) pts.push(cl[i]);
      cx = nx; cy = ny; exitDir = out;
    }
    return { pts: pts, reachedB: reachedB, looped: looped };
  }

  // ---- Train animation ----------------------------------------------------
  function polyLen(pts) { var L = 0; for (var i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return L; }
  function ptAt(pts, dist) {
    for (var i = 1; i < pts.length; i++) {
      var seg = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
      if (dist <= seg) { var t = seg ? dist / seg : 0;
        return { x: pts[i-1][0] + (pts[i][0]-pts[i-1][0]) * t, y: pts[i-1][1] + (pts[i][1]-pts[i-1][1]) * t,
                 a: Math.atan2(pts[i][1]-pts[i-1][1], pts[i][0]-pts[i-1][0]) }; }
      dist -= seg;
    }
    var n = pts.length - 1;
    return { x: pts[n][0], y: pts[n][1], a: Math.atan2(pts[n][1]-pts[n-1][1], pts[n][0]-pts[n-1][0]) };
  }
  function runTrain() {
    ensureAudio();
    if (S.running) { stopTrain(); return; }
    var tr = tracePath();
    if (tr.pts.length < 3) { sndNope(); buzz(20); flashInfo('ต่อรางก่อนนะ'); return; }
    var len = polyLen(tr.pts);
    S.running = true; $('runBtn').classList.add('running'); $('runBtn').textContent = '■ หยุด';
    sndWhistle(); buzz(30);
    var speed = Math.max(70, S.cell * 2.4);      // px per second
    var t0 = null, dist = 0, arrived = false;
    S.anim = { pts: tr.pts, len: len, dist: 0, looped: tr.looped };
    function frame(ts) {
      if (!S.running) return;
      if (t0 === null) t0 = ts;
      var dt = Math.min(0.05, (ts - t0) / 1000); t0 = ts;
      if (S.anim.pause && ts < S.anim.pause) { render(); S.anim.raf = requestAnimationFrame(frame); return; }
      dist += speed * dt;
      // chuff sound rhythm
      chuffTimer += dt; if (chuffTimer > 0.28) { chuffTimer = 0; sndChuff(); }
      // station stop: brief pause + whistle when the loco reaches a station cell
      var lead = ptAt(tr.pts, tr.looped ? ((dist % len) + len) % len : Math.min(dist, len));
      var scx = Math.floor(lead.x / S.cell), scy = Math.floor(lead.y / S.cell);
      if (scx >= 0 && scy >= 0 && scx < S.cols && scy < S.rows && S.grid[scy][scx].type === 'station') {
        var skey = scx + ',' + scy;
        if (skey !== S.anim.lastStation) { S.anim.lastStation = skey; sndWhistle(); S.anim.pause = ts + 650; }
      } else { S.anim.lastStation = null; }
      if (dist >= len) {
        if (tr.looped) { dist -= len; }
        else if (!arrived) {
          arrived = true; S.anim.dist = len; render();
          stopTrain();
          if (tr.reachedB && S.mode === 'puzzle') onWin();
          else { sndWhistle(); }
          return;
        }
      }
      S.anim.dist = dist; render();
      S.anim.raf = requestAnimationFrame(frame);
    }
    S.anim.raf = requestAnimationFrame(frame);
  }
  function stopTrain() {
    S.running = false;
    if (S.anim && S.anim.raf) cancelAnimationFrame(S.anim.raf);
    S.anim = null;
    var rb = $('runBtn'); if (rb) { rb.classList.remove('running'); rb.textContent = '▶ วิ่ง!'; }
  }
  function drawTrain() {
    var pts = S.anim.pts, d = S.anim.dist, s = S.cell;
    var carGap = s * 0.72, colors = ['#e23b3b', '#4a90e2', '#ffd93d'];
    for (var c = 0; c < 3; c++) {
      var dd = d - c * carGap; if (dd < 0) continue;
      if (!S.anim.looped && dd > S.anim.len) continue;
      var dm = S.anim.looped ? ((dd % S.anim.len) + S.anim.len) % S.anim.len : dd;
      var p = ptAt(pts, dm);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      var bw = s * 0.5, bh = s * 0.34;
      ctx.fillStyle = 'rgba(0,0,0,0.18)'; roundRect(-bw/2, -bh/2 + s*0.06, bw, bh, s*0.08); ctx.fill();
      ctx.fillStyle = colors[c]; roundRect(-bw/2, -bh/2, bw, bh, s*0.08); ctx.fill();
      if (c === 0) { // loco: chimney + cab window
        ctx.fillStyle = '#333'; roundRect(bw*0.18, -bh/2 - s*0.1, s*0.12, s*0.12, s*0.03); ctx.fill();
        ctx.fillStyle = '#bfe3ff'; roundRect(-bw*0.36, -bh*0.28, s*0.14, s*0.2, s*0.03); ctx.fill();
      }
      ctx.restore();
    }
  }
  function roundRect(x, y, w, h, r) { ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

  // ---- Win ----------------------------------------------------------------
  function onWin() {
    S.cleared[S.levelIdx] = 1; saveCleared();
    sndWin(); buzz([30, 40, 30]); confetti();
    $('winText').textContent = 'รถไฟถึงแล้ว! 🚂';
    $('nextBtn').style.display = (S.levelIdx + 1 < LEVELS.length) ? '' : 'none';
    setTimeout(function () { $('winOverlay').classList.add('shown'); }, 500);
  }
  function confetti() {
    var cols = ['#ff6b9d','#ffd93d','#7ed957','#4a90e2','#a259d6','#ff9f43'];
    for (var i = 0; i < 40; i++) {
      var d = document.createElement('div'); d.className = 'confetti';
      d.style.left = Math.random() * 100 + 'vw';
      d.style.background = cols[i % cols.length];
      d.style.animationDuration = (1.6 + Math.random() * 1.4) + 's';
      d.style.animationDelay = (Math.random() * 0.3) + 's';
      document.body.appendChild(d);
      setTimeout(function (el) { return function () { el.remove(); }; }(d), 3200);
    }
  }
  var flashT = 0;
  function flashInfo(msg) {
    var el = $('infoText'), old = el.textContent; el.textContent = msg;
    clearTimeout(flashT); flashT = setTimeout(function () {
      el.textContent = S.mode === 'sandbox' ? '🏗️ สร้างอิสระ' : ('ด่าน ' + (S.levelIdx + 1)); }, 1400);
  }

  // ---- Select screen build ------------------------------------------------
  function renderLevels() {
    var g = $('levelGrid'); g.innerHTML = '';
    LEVELS.forEach(function (L, i) {
      var d = document.createElement('div'); d.className = 'lcard';
      d.innerHTML = '<div class="ln">' + (i + 1) + '</div>' + (S.cleared[i] ? '<div class="done-star">⭐</div>' : '');
      d.addEventListener('click', function () { ensureAudio(); startPuzzle(i); });
      g.appendChild(d);
    });
  }
  function showLevels(show) {
    $('levelTitle').style.display = show ? '' : 'none';
    $('levelGrid').style.display = show ? '' : 'none';
    $('modePuzzle').classList.toggle('sel', show);
  }

  // ---- Tools wiring -------------------------------------------------------
  var toolBtns = { straight: $('tStraight'), curve: $('tCurve'), junction: $('tJunction'), wye: $('tWye'),
                   'switch': $('tSwitch'), cross: $('tCross'), station: $('tStation'), erase: $('tErase') };
  function selTool(t) {
    S.tool = t;
    Object.keys(toolBtns).forEach(function (k) { toolBtns[k].classList.toggle('sel', k === t); });
    buzz(6);
  }
  Object.keys(toolBtns).forEach(function (k) { toolBtns[k].addEventListener('click', function () { selTool(k); }); });

  $('runBtn').addEventListener('click', runTrain);
  $('resetBtn').addEventListener('click', function () {
    stopTrain();
    if (S.mode === 'puzzle') startPuzzle(S.levelIdx); else startSandbox();
    buzz(12);
  });
  $('menuBtn').addEventListener('click', backToSelect);
  $('selBtn').addEventListener('click', function () { $('winOverlay').classList.remove('shown'); backToSelect(); });
  $('nextBtn').addEventListener('click', function () {
    $('winOverlay').classList.remove('shown');
    if (S.levelIdx + 1 < LEVELS.length) startPuzzle(S.levelIdx + 1); else backToSelect();
  });
  function backToSelect() {
    stopTrain();
    $('menuBtn').style.display = 'none';
    $('gameScreen').classList.remove('active');
    $('selectScreen').classList.add('active');
    renderLevels();
  }

  $('modePuzzle').addEventListener('click', function () { ensureAudio(); showLevels(true); renderLevels(); });
  $('modeSandbox').addEventListener('click', function () { ensureAudio(); startSandbox(); });

  // ---- Init ---------------------------------------------------------------
  renderLevels();
  var rt = 0;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () {
    if ($('gameScreen').classList.contains('active')) { stopTrain(); fit(); render(); } }, 150); });
  window.addEventListener('orientationchange', function () { clearTimeout(rt); rt = setTimeout(function () {
    if ($('gameScreen').classList.contains('active')) { stopTrain(); fit(); render(); } }, 250); });
})();
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
