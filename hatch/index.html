<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🐣 ฟักไข่ — คิดส์เล่น</title>
<meta name="description" content="ฟักไข่ไก่ เป็ด เต่าทะเล จระเข้ นกกระจอกเทศ เพนกวิน ตามจำนวนวันจริง ส่องดูลูกในไข่ แล้วดูแลลูกสัตว์ สำหรับเด็กเล็ก">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ฟักไข่">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 1100px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .view { position: relative; background: #fffef9; border: 4px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .view svg { display: block; width: 100%; height: auto; touch-action: none; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 12px 0 0; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 20px; font-weight: 600;
    min-height: 64px; min-width: 64px; padding: 0 22px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform .1s;
  }
  .chip:active { transform: translateY(2px) scale(0.96); }
  .chip.on { background: var(--gold); border-color: #e0b400; }
  .fact { margin-top: 12px; background: #fff; border: 4px solid var(--card-border); border-radius: 24px; padding: 12px 16px; font-size: 18px; line-height: 1.45; box-shadow: 0 5px 0 rgba(0,0,0,0.12); cursor: pointer; }
  .fact::before { content: '💡 '; }
  .hidden { display: none !important; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>🐣 ฟักไข่</h1></header>
  <div class="view"><svg id="scene" viewBox="0 0 1000 640" aria-label="ฟักไข่"></svg></div>
  <div class="row" id="ctrls"></div>
  <div class="fact" id="fact"></div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene'), ctrls = $('ctrls');
const K = 'stroke="#2d3436" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
const k3 = 'stroke="#2d3436" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"';
const lerp = (a, b, u) => a + (b - a) * u;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
function svgPt(ev) { const p = scene.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(scene.getScreenCTM().inverse()); }

// ============================================================================
// SPECIES — incubation days and egg sizes are real (cm = egg length).
// Egg looks: brown hen's egg, pale greenish duck egg, round leathery sea-turtle
// egg (ping-pong ball), long chalky crocodile egg, huge pitted ostrich egg,
// pear-shaped emperor-penguin egg balanced on dad's feet.
// ============================================================================
const SPECIES = {
  chicken: { th: 'ไก่', baby: 'ลูกเจี๊ยบ', days: 21, cm: 5.7, rx: 60, ry: 78, fill: '#d9a066', scene: 'barn', hard: true,
    fact: 'แม่ไก่กกไข่ 21 วัน และพลิกไข่วันละหลายครั้ง ลูกเจี๊ยบใช้ปุ่มแข็งที่ปลายปากเจาะเปลือก ออกมาตัวเปียก แล้วขนจะแห้งฟูภายในไม่กี่ชั่วโมง',
    done: 'ลูกเจี๊ยบออกมาแล้ว แตะพื้นเพื่อโรยอาหาร' },
  duck: { th: 'เป็ด', baby: 'ลูกเป็ด', days: 28, cm: 6.5, rx: 64, ry: 84, fill: '#e3efe5', scene: 'pond', hard: true,
    fact: 'ไข่เป็ดใช้เวลาฟัก 28 วัน ลูกเป็ดจะเดินตามสิ่งแรกที่เห็นตอนออกจากไข่ เหมือนเป็นแม่ และว่ายน้ำได้ตั้งแต่เกิด',
    done: 'ลูกเป็ดออกมาแล้ว ลูกเป็ดเดินตามหนู ลากนิ้วดูสิ' },
  turtle: { th: 'เต่าทะเล', baby: 'ลูกเต่าทะเล', days: 55, cm: 4.2, rx: 40, ry: 40, fill: '#f5f2e8', scene: 'beach', soft: true, many: 7,
    fact: 'แม่เต่าทะเลขุดหลุมวางไข่บนหาดทรายครั้งละราว 100 ฟอง แล้วกลับลงทะเล ไข่ฟักด้วยความอุ่นของแดดราว 2 เดือน ทรายอุ่นมากจะได้ลูกเต่าตัวเมียมาก',
    done: 'ลูกเต่าทะเลออกมาแล้ว แตะลูกเต่าให้คลานลงทะเล' },
  croc: { th: 'จระเข้', baby: 'ลูกจระเข้', days: 80, cm: 7.5, rx: 44, ry: 66, fill: '#f7f4ec', scene: 'mound', many: 5,
    fact: 'จระเข้น้ำจืดของไทยทำรังเป็นกองใบไม้ ใบไม้เน่าทำให้รังอุ่น แม่จระเข้เฝ้ารังราว 80 วัน ลูกจะร้องเรียกจากในไข่ แม่จึงขุดรังแล้วคาบลูกไปที่น้ำอย่างเบามือ',
    done: 'ลูกจระเข้ร้องเรียกแม่ แตะแม่จระเข้ให้คาบลูกไปที่น้ำ' },
  ostrich: { th: 'นกกระจอกเทศ', baby: 'ลูกนกกระจอกเทศ', days: 42, cm: 15, rx: 108, ry: 132, fill: '#f3e7c9', scene: 'savanna', hard: true, pores: true,
    fact: 'ไข่นกกระจอกเทศใหญ่ที่สุดในโลก ยาวราว 15 เซนติเมตร หนักเท่าไข่ไก่ราว 24 ฟอง เปลือกหนามาก ใช้เวลาฟัก 42 วัน พ่อนกช่วยกกไข่ตอนกลางคืน',
    done: 'ลูกนกกระจอกเทศออกมาแล้ว แตะให้วิ่ง ลูกนกกระจอกเทศวิ่งเร็วมาก' },
  penguin: { th: 'เพนกวินจักรพรรดิ', baby: 'ลูกเพนกวิน', days: 65, cm: 12, rx: 70, ry: 92, fill: '#e8efe6', scene: 'ice', hard: true,
    fact: 'พ่อเพนกวินจักรพรรดิวางไข่ไว้บนเท้า แล้วคลุมด้วยพุงอุ่นๆ ยืนกลางพายุหิมะราว 65 วัน โดยไม่กินอะไรเลย',
    done: 'ลูกเพนกวินออกมาแล้ว แตะพ่อเพนกวินให้ป้อนอาหาร' },
};
const ORDER = ['chicken', 'duck', 'turtle', 'croc', 'ostrich', 'penguin'];

// ---- drawing helpers ----
function egg(rx, ry, fill, opt = {}) {          // centred at 0,0 — narrow end up for bird eggs
  const pear = opt.round ? 0 : 0.18;
  const d = `M0,${-ry} C${rx * (1 - pear)},${-ry} ${rx},${-ry * 0.1} ${rx},${ry * 0.25} C${rx},${ry * 0.8} ${rx * 0.55},${ry} 0,${ry} C${-rx * 0.55},${ry} ${-rx},${ry * 0.8} ${-rx},${ry * 0.25} C${-rx},${-ry * 0.1} ${-rx * (1 - pear)},${-ry} 0,${-ry} Z`;
  let s = `<path d="${d}" fill="${fill}" ${K}/>`;
  if (opt.pores) for (let i = 0; i < 40; i++) { const a = i * 2.39, r = Math.sqrt(i / 40) * 0.85; s += `<circle cx="${(Math.cos(a) * r * rx).toFixed(1)}" cy="${(Math.sin(a) * r * ry * 0.9).toFixed(1)}" r="1.6" fill="#c9b48a"/>`; }
  if (opt.chalk) s += `<path d="M${-rx * 0.6},${-ry * 0.1} h${rx * 1.2}" stroke="#e2dccb" stroke-width="${ry * 0.3}" opacity=".7"/>`;
  s += `<ellipse cx="${-rx * 0.35}" cy="${-ry * 0.45}" rx="${rx * 0.18}" ry="${ry * 0.12}" fill="#fff" opacity=".55"/>`;
  return { d, s };
}
function eggOf(sp, scale = 1) { const S = SPECIES[sp]; return egg(S.rx * scale, S.ry * scale, S.fill, { round: sp === 'turtle', pores: S.pores, chalk: sp === 'croc' }); }

// ---- babies (drawn at 0,0 standing on y=0, facing right, ~120 tall). wet = 1 just out of the egg ----
function baby(sp, wet = 0, t = 0, act = '') {
  const peck = act === 'peck' ? Math.max(0, Math.sin(t * 10)) : 0;
  if (sp === 'chicken') {
    const c = wet > 0.5 ? '#c9b25a' : '#ffe066', fluff = 1 - wet * 0.25;
    return `<path d="M-6,0 L-10,14 M6,0 L10,14 M-10,14 h-8 M10,14 h8" stroke="#f0a030" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="0" cy="-34" rx="${40 * fluff}" ry="${36 * fluff}" fill="${c}" ${K}/>
      <g transform="rotate(${peck * 35} 18 -40)"><circle cx="24" cy="-70" r="${24 * fluff}" fill="${c}" ${K}/><path d="M44,-72 L58,-66 L44,-62 Z" fill="#f0a030" ${k3}/><circle cx="32" cy="-76" r="4" fill="#2d3436"/>${wet > 0.5 ? '' : '<path d="M14,-94 q4,-10 10,0 q4,-10 8,2" fill="none" stroke="#e0c040" stroke-width="3"/>'}</g>
      <path d="M-20,-40 q14,14 30,4" fill="none" ${k3}/>`;
  }
  if (sp === 'duck') {
    const c = wet > 0.5 ? '#bfae4a' : '#ffd84a';
    return `<path d="M-8,0 l-4,10 l-12,4 l14,0 l6,-10 M8,0 l4,10 l12,4 l-14,0 l-6,-10" fill="#f08a2a" stroke="#c96a12" stroke-width="3"/>
      <ellipse cx="-4" cy="-34" rx="44" ry="34" fill="${c}" ${K}/><path d="M-46,-40 l-14,-10 l6,16 Z" fill="${c}" ${k3}/>
      <g transform="rotate(${peck * 30} 18 -44)"><circle cx="24" cy="-72" r="25" fill="${c}" ${K}/><path d="M42,-74 Q66,-76 68,-66 Q66,-58 42,-62 Z" fill="#f08a2a" ${k3}/><circle cx="32" cy="-78" r="4" fill="#2d3436"/></g>
      <path d="M-30,-40 q20,16 40,2" fill="none" ${k3}/>`;
  }
  if (sp === 'turtle') {
    const k = Math.sin(t * 10) * 10;
    return `<g transform="rotate(${k} -16 -6)"><path d="M-14,-6 L-36,-20 L-30,-2 Z" fill="#3f4a3a" ${k3}/></g><g transform="rotate(${-k} 18 -6)"><path d="M18,-6 L44,-22 L40,-2 Z" fill="#3f4a3a" ${k3}/></g>
      <ellipse cx="0" cy="-10" rx="30" ry="16" fill="#4e5a45" ${K}/><path d="M-20,-14 h40 M-8,-22 v14 M8,-22 v14" stroke="#2d3436" stroke-width="2"/>
      <ellipse cx="38" cy="-10" rx="12" ry="9" fill="#5b6650" ${k3}/><circle cx="43" cy="-12" r="2.5" fill="#2d3436"/>`;
  }
  if (sp === 'croc') {
    return `<path d="M-60,-8 Q-90,-6 -100,4 Q-80,0 -58,2 Z" fill="#6d7a3a" ${k3}/><ellipse cx="-20" cy="-12" rx="44" ry="14" fill="#7d8a44" ${K}/>
      ${[-44, -28, -12, 4].map((x) => `<path d="M${x},-24 l6,-6 l6,6" fill="#5d6a2a" stroke="#2d3436" stroke-width="2"/>`).join('')}
      <path d="M20,-20 Q60,-24 74,-12 Q60,-4 20,-4 Z" fill="#7d8a44" ${K}/><circle cx="34" cy="-22" r="6" fill="#ffd93d" stroke="#2d3436" stroke-width="2.5"/><ellipse cx="34" cy="-22" rx="1.6" ry="5" fill="#2d3436"/>
      <path d="M26,-10 l40,-2" stroke="#2d3436" stroke-width="2"/><path d="M-36,-2 l-6,8 M0,-2 l6,8" stroke="#2d3436" stroke-width="5" stroke-linecap="round"/>
      ${[-40, -20, 0].map((x) => `<path d="M${x},-12 h10" stroke="#3d4a1a" stroke-width="3"/>`).join('')}`;
  }
  if (sp === 'ostrich') {
    const run = act === 'run' ? Math.sin(t * 20) * 25 : 0;
    return `<g transform="rotate(${run} -6 -40)"><path d="M-6,-40 L-10,-4 l-10,4" fill="none" stroke="#c9a27a" stroke-width="7" stroke-linecap="round"/></g><g transform="rotate(${-run} 6 -40)"><path d="M6,-40 L10,-4 l12,4" fill="none" stroke="#c9a27a" stroke-width="7" stroke-linecap="round"/></g>
      <ellipse cx="0" cy="-60" rx="36" ry="28" fill="#c9a27a" ${K}/>${[-20, -6, 8, 22].map((x) => `<path d="M${x},-84 l-4,-8 M${x},-36 l-4,8" stroke="#3d2e1e" stroke-width="3"/>`).join('')}
      <path d="M-10,-58 h24 M-14,-68 h28" stroke="#3d2e1e" stroke-width="4" stroke-dasharray="4 4"/>
      <path d="M22,-76 Q30,-110 28,-126" fill="none" stroke="#2d3436" stroke-width="16" stroke-linecap="round"/><path d="M22,-76 Q30,-110 28,-126" fill="none" stroke="#d9b48a" stroke-width="9" stroke-linecap="round"/>
      <circle cx="30" cy="-132" r="14" fill="#d9b48a" ${k3}/><path d="M42,-134 L58,-130 L42,-126 Z" fill="#8d7a5a" ${k3}/><circle cx="34" cy="-136" r="3" fill="#2d3436"/>`;
  }
  // emperor penguin chick: silver-grey down, black head, white face mask
  return `<ellipse cx="0" cy="-46" rx="40" ry="46" fill="#b8bfc6" ${K}/><path d="M-30,-60 q-16,20 -10,40 M30,-60 q16,20 10,40" fill="none" ${k3}/>
    <circle cx="0" cy="-104" r="30" fill="#2d3436"/><path d="M-22,-104 Q-20,-82 0,-80 Q20,-82 22,-104 Q12,-94 0,-96 Q-12,-94 -22,-104 Z" fill="#fafafa"/>
    <circle cx="-10" cy="-100" r="4" fill="#fff"/><circle cx="-10" cy="-100" r="2.2" fill="#2d3436"/><circle cx="10" cy="-100" r="4" fill="#fff"/><circle cx="10" cy="-100" r="2.2" fill="#2d3436"/>
    <path d="M-4,-90 L0,-80 L4,-90 Z" fill="#555"/><ellipse cx="-12" cy="0" rx="12" ry="5" fill="#555"/><ellipse cx="12" cy="0" rx="12" ry="5" fill="#555"/>`;
}

// ---- embryo seen when candling: grows with the day ----
function embryo(sp, u, rx, ry) {
  if (u < 0.15) return `<circle cx="0" cy="${ry * 0.1}" r="${rx * 0.35}" fill="#ffb347" opacity=".8"/>`;
  if (u < 0.4) return `<circle cx="0" cy="${ry * 0.1}" r="${rx * 0.38}" fill="#ffb347" opacity=".7"/>${[0, 1, 2, 3, 4, 5].map((i) => { const a = i * 1.05; return `<path d="M0,${ry * 0.1} q${Math.cos(a) * rx * 0.4},${Math.sin(a) * ry * 0.3} ${Math.cos(a + 0.4) * rx * 0.7},${Math.sin(a + 0.4) * ry * 0.55}" fill="none" stroke="#c0392b" stroke-width="2.5" opacity=".7"/>`; }).join('')}<circle cx="0" cy="${ry * 0.05}" r="${rx * 0.12}" fill="#5d3a1a" opacity=".7"/>`;
  const k = (u - 0.4) / 0.6;
  return `<ellipse cx="0" cy="${ry * 0.15}" rx="${rx * (0.35 + 0.45 * k)}" ry="${ry * (0.3 + 0.45 * k)}" fill="#3d2a1a" opacity=".75"/><circle cx="${rx * 0.15}" cy="${-ry * (0.05 + 0.35 * k)}" r="${rx * (0.15 + 0.15 * k)}" fill="#3d2a1a" opacity=".75"/>
    <path d="M${-rx * 0.8},${-ry * 0.72} Q0,${-ry * 0.9} ${rx * 0.8},${-ry * 0.72}" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>`;
}

// ---- backdrops ----
function backdrop(kind, t) {
  const sky = (c1, c2) => `<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="1000" height="640" fill="url(#bg)"/>`;
  if (kind === 'barn') return sky('#e9c49a', '#d8ae7e') + `${[0, 1, 2, 3, 4, 5, 6].map((i) => `<path d="M${i * 150},0 v640" stroke="#c49a6c" stroke-width="6"/>`).join('')}<rect x="760" y="70" width="170" height="130" fill="#bfe6ff" stroke="#8d5a2b" stroke-width="10"/><path d="M845,70 v130 M760,135 h170" stroke="#8d5a2b" stroke-width="8"/>
    <path d="M0,500 L1000,500 L1000,640 L0,640 Z" fill="#e8c86a"/>${[...Array(30)].map((_, i) => `<path d="M${(i * 37) % 1000},${520 + (i * 13) % 100} l${10 + i % 7},-8" stroke="#c9a227" stroke-width="3"/>`).join('')}`;
  if (kind === 'pond') return sky('#9fdcff', '#dff4ff') + `<path d="M0,420 Q300,390 600,420 Q800,440 1000,410 L1000,640 L0,640 Z" fill="#8bc34a"/><ellipse cx="820" cy="560" rx="200" ry="60" fill="#3a9ad9" stroke="#2d6fa3" stroke-width="6"/><path d="M60,430 v-80 M80,430 v-100 M100,430 v-70" stroke="#558b2f" stroke-width="6"/>`;
  if (kind === 'beach') return sky('#1b2160', '#3a4a8a') + `<circle cx="820" cy="110" r="44" fill="#fdf6d8"/>${starsOf(20)}<path d="M0,330 L1000,330 L1000,430 L0,430 Z" fill="#1e5fa8"/><path d="M820,330 l-30,100 h60 Z" fill="#fdf6d8" opacity=".25"/>
    <path d="M0,420 Q250,400 500,420 Q750,440 1000,410 L1000,640 L0,640 Z" fill="#d9c08a"/><path d="M0,428 q50,-10 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0 t100,0" fill="none" stroke="#fff" stroke-width="5" opacity=".7"/>`;
  if (kind === 'mound') return sky('#b8e0c8', '#e0f2e4') + `<path d="M0,430 L1000,430 L1000,640 L0,640 Z" fill="#7a9a4a"/><path d="M0,520 Q160,500 300,520 L300,640 L0,640 Z" fill="#4a8ab8"/>${[60, 920, 980].map((x) => `<path d="M${x},430 v-200" stroke="#5d7a3a" stroke-width="12"/><path d="M${x},240 q-50,-30 -90,0 M${x},240 q50,-30 90,0 M${x},250 q-30,-50 -70,-60 M${x},250 q30,-50 70,-60" fill="none" stroke="#4caf50" stroke-width="10" stroke-linecap="round"/>`).join('')}`;

      if (b.act === 'run') { b.x += b.dir * 420 * dt; if (b.x > 900 || b.x < 100) b.dir *= -1; if (b.t > b.until) b.act = ''; }
    }
    const inWater = sp === 'duck' && b.x > 640 && b.y > 520;
    const y = sp === 'turtle' ? b.y : b.y + (inWater ? 10 : 0);
    let art = baby(sp, 0, b.t, b.act);
    if (sp === 'turtle') art = `<g transform="rotate(-90)">${art}</g>`;
    if (sp === 'penguin') { s += ''; continue; }
    s += `<g transform="translate(${b.x.toFixed(0)} ${y.toFixed(0)}) scale(${sx * (sp === 'turtle' ? 1 : 1)} 1)" data-tap="baby" data-i="${babies.indexOf(b)}" style="cursor:pointer">${inWater ? `<clipPath id="wcl"><rect x="-80" y="-200" width="160" height="190"/></clipPath><g clip-path="url(#wcl)">${art}</g>` : art}</g>`;
  }
  if (sp === 'penguin') { const b = babies[0]; s += `<g transform="translate(560 ${468 - (dadFeed > 0 ? 6 : 0)}) scale(.9)" data-tap="baby" data-i="0">${baby('penguin', 0, b.t)}</g>`; }
  if (sp === 'turtle' && babies.every((b) => b.gone) && !babies.done) { babies.done = true; speak('ลูกเต่าทุกตัวลงทะเลแล้ว ว่ายไปตามแสงจันทร์'); cheer(); }
  if (sp === 'croc' && mom && mom.state === 'carry') {
    mom.k = clamp((now - mom.t0) / 3500);
    if (mom.k >= 1) { const left = babies.find((b) => !b.gone); if (left) { left.gone = true; } mom.state = 'wait'; mom.x = 820; if (babies.every((b) => b.gone)) { speak('แม่จระเข้พาลูกทุกตัวไปที่น้ำแล้ว'); cheer(); } }
  }
  return s;
}
function splashAt(x) { tone(900, 0.08, 'sine', 0.06); }

// ---- input ----
scene.addEventListener('pointerdown', (ev) => {
  ensureAudio();
  if (phase === 'pick') return;
  const q = svgPt(ev), tgt = ev.target.closest('[data-tap]'), kind = tgt && tgt.dataset.tap;
  if (phase === 'warm') {
    if (sp === 'turtle') { if (kind === 'sun') warm(); return; }
    if (sp === 'penguin') { warm(); return; }
    if (sp === 'croc') { warm(); return; }
    if (kind === 'egg' || Math.hypot(q.x - 500, q.y - 430) < 220) warm();
    return;
  }
  if (phase === 'pip') { tapCrack(); return; }
  if (phase !== 'baby') return;
  if (sp === 'chicken') { if (q.y > 420) { for (let i = 0; i < 6; i++) feed.push({ x: q.x + (Math.random() - 0.5) * 40, y: Math.max(470, q.y) + (Math.random() - 0.5) * 20 }); tone(700, 0.05, 'sine', 0.05); buzz(6); if (!feedSaid) { feedSaid = 1; speak('ลูกเจี๊ยบจิกกินอาหาร จิ๊บ จิ๊บ'); } } return; }
  if (sp === 'duck') { finger = { x: q.x, y: q.y }; try { scene.setPointerCapture(ev.pointerId); } catch (_) {} return; }
  if (sp === 'turtle') { const i = tgt && +tgt.dataset.i; const b = kind === 'baby' ? babies[i] : babies.find((o) => !o.go && !o.gone); if (b) { b.go = true; buzz(8); tone(500, 0.08, 'sine', 0.06); } return; }
  if (sp === 'croc') { if (kind === 'mom' && mom && mom.state === 'wait' && babies.some((b) => !b.gone)) { mom.state = 'carry'; mom.t0 = performance.now(); mom.x0 = 600; mom.k = 0; buzz(10); if (!momSaid) { momSaid = 1; speak('แม่จระเข้คาบลูกไว้ในปากอย่างเบามือ ไม่กัดลูกเลย'); } } else chirp(); return; }
  if (sp === 'ostrich') { const b = babies[0]; b.act = 'run'; b.until = b.t + 2; b.dir = q.x > b.x ? 1 : -1; buzz(8); speak('ลูกนกกระจอกเทศวิ่งเร็วมาก'); return; }
  if (sp === 'penguin') { if (dadFeed <= 0) { dadFeed = 0.001; buzz(8); speak('พ่อเพนกวินป้อนอาหารให้ลูก จากปากสู่ปาก'); } }
});
let feedSaid = 0, momSaid = 0;
scene.addEventListener('pointermove', (ev) => { if (finger) { const q = svgPt(ev); finger = { x: q.x, y: q.y }; } });
const endPtr = () => { finger = null; };
scene.addEventListener('pointerup', endPtr); scene.addEventListener('pointercancel', endPtr);
$('fact').addEventListener('click', () => { ensureAudio(); speak($('fact').textContent); });

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  if (!document.hidden) {
    if (dadFeed > 0) { dadFeed += dt / 2.4; if (dadFeed >= 1) dadFeed = 0; }
    if (phase === 'pick') { if (!scene.querySelector('[data-egg]')) renderPick(); }
    else renderGame(now, dt);
  }
  requestAnimationFrame(tick);
}

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
}
function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
const blip = (f) => tone(f, 0.12, 'sine', 0.1);
function cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.15), i * 110)); }
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function pickVoice() {
  try { return (speechSynthesis.getVoices() || []).find(v => (v.lang || '').toLowerCase().startsWith('th')) || null; } catch (e) { return null; }
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
// Recorded clip first (voice/, made by tools/gen_voice.py), device TTS as fallback.
function speak(text) {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  if (!window.VoiceClips) { deviceSpeak(text); return; }
  ensureAudio(); VoiceClips.say(text, AC, deviceSpeak);
}
function deviceSpeak(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function celebrate(n) {
  const cols = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#9b59b6', '#ff914d'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// Block double-tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

$('fact').textContent = PICK_FACT;
renderPick();
requestAnimationFrame(tick);

// Every line the game can say — `index.html?lines` prints them for tools/gen_voice.py.
VoiceClips.lines(() => {
  const L = ['เลือกไข่ที่จะฟัก', PICK_FACT, 'ได้ยินเสียงไหม ลูกเริ่มเจาะเปลือกแล้ว แตะช่วยดู', 'ได้ยินเสียงร้องจากในไข่ ลูกจระเข้เรียกแม่แล้ว',
    'ไข่เริ่มขยับ ลูกเต่ากำลังใช้ปุ่มที่ปลายปากกรีดเปลือก', 'ส่องไฟดูในไข่ ยังเห็นแต่ไข่แดง', 'เห็นเส้นเลือดเล็กๆ และจุดหัวใจ ลูกเริ่มเติบโตแล้ว', 'ลูกตัวใหญ่ขึ้นจนเกือบเต็มไข่แล้ว',
    'ลูกเจี๊ยบจิกกินอาหาร จิ๊บ จิ๊บ', 'ลูกเต่าทุกตัวลงทะเลแล้ว ว่ายไปตามแสงจันทร์', 'แม่จระเข้พาลูกทุกตัวไปที่น้ำแล้ว', 'แม่จระเข้คาบลูกไว้ในปากอย่างเบามือ ไม่กัดลูกเลย',
    'ลูกนกกระจอกเทศวิ่งเร็วมาก', 'พ่อเพนกวินป้อนอาหารให้ลูก จากปากสู่ปาก'];
  for (const id of ORDER) { const S = SPECIES[id]; L.push(S.fact, S.done, WARM_SAY[id]); for (let k = 1; k <= TAPS; k++) L.push('วันที่ ' + Math.round(S.days * k / TAPS)); }
  return L;
});

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
