<!DOCTYPE html><html><head><meta charset="utf-8"><title>planet sprites</title></head><body><pre id="out"></pre>
<script>
// Renders solar-system/img/<id>.webp — small "real photo" sprites of each body, front-lit,
// from the same surface maps + shader the game uses. Run via tools/gen_planet_sprites.sh
const FS = `precision highp float;
uniform vec2 uC;uniform float uR;uniform mat3 uM;uniform mat3 uMT;uniform vec3 uL;
uniform sampler2D uTex;uniform sampler2D uCloud;uniform sampler2D uRing;
uniform float uEmis;uniform float uHasCloud;uniform float uHasRing;uniform float uRin;uniform float uRout;
const float PI=3.14159265;
void main(){
  vec2 p=(gl_FragCoord.xy-uC)/uR; float d2=dot(p,p);
  vec4 col=vec4(0.); float pz=-1e9;
  if(d2<=1.){
    vec3 n=vec3(p,sqrt(1.-d2)); vec3 q=uMT*n;
    float lon=atan(q.x,q.z), lat=asin(clamp(q.y,-1.,1.));
    vec2 uv=vec2(.5+lon/(2.*PI), .5-lat/PI);
    vec3 c=texture2D(uTex,uv).rgb;
    if(uHasCloud>.5){ float cl=texture2D(uCloud,uv).r; c=mix(c,vec3(1.),cl*.8); }
    if(uEmis>.5){ c*=0.62+0.48*n.z; }
    else { float dif=max(dot(n,uL),0.); c*=0.05+0.95*dif; }
    col=vec4(c,1.); pz=n.z;
  }
  if(uHasRing>.5){
    vec3 N=uM*vec3(0.,1.,0.);
    if(abs(N.z)>1e-3){
      float z=-(p.x*N.x+p.y*N.y)/N.z; vec3 P=vec3(p,z); float r=length(P);
      if(r>uRin&&r<uRout&&z>pz){
        vec4 rc=texture2D(uRing,vec2((r-uRin)/(uRout-uRin),.5));
        float lit=.35+.65*abs(dot(N,uL));
        // the planet's own shadow falls on the rings
        float along=dot(P,uL); if(along<0.&&length(P-along*uL)<1.) lit*=.25;
        vec3 rr=rc.rgb*lit; float a=rc.a;
        col=vec4(mix(col.rgb,rr,a), max(col.a,a));
      }
    }
  }
  gl_FragColor=vec4(col.rgb*col.a,col.a);
}`;
const BODIES = [
  ['sun','2k_sun.jpg',0,7.25,1], ['mercury','2k_mercury.jpg',0,0.03,0], ['venus','2k_venus_atmosphere.jpg',0,2.6,0],
  ['earth','2k_earth_daymap.jpg',-100,23.4,0], ['moon','2k_moon.jpg',0,0,0], ['mars','2k_mars.jpg',134,25.2,0],
  ['jupiter','2k_jupiter.jpg',48,3.1,0], ['saturn','2k_saturn.jpg',0,26.7,0], ['uranus','2k_uranus.jpg',0,97.8,0], ['neptune','2k_neptune.jpg',0,28.3,0]];
const S = 512;
const cv = document.createElement('canvas'); cv.width = cv.height = S;
const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
function sh(t, s) { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); if (!gl.getShaderParameter(o, gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(o); return o; }
const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}'));
// sprites must be straight alpha for <image>: un-premultiply at the end
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS.replace('gl_FragColor=vec4(col.rgb*col.a,col.a);', 'gl_FragColor=vec4(col.rgb,col.a);')));
gl.linkProgram(pr); gl.useProgram(pr);
const bf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, bf); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const lc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(lc); gl.vertexAttribPointer(lc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(pr, n);
gl.uniform1i(U('uTex'), 0); gl.uniform1i(U('uCloud'), 1); gl.uniform1i(U('uRing'), 2);
const load = (f) => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = '../solar-system/tex/' + f; });
function tex(img, unit, clamp) { const t = gl.createTexture(); gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, clamp ? gl.CLAMP_TO_EDGE : gl.REPEAT); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); }
function mul(a,b){const r=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)r[i*3+j]=a[i*3]*b[j]+a[i*3+1]*b[3+j]+a[i*3+2]*b[6+j];return r;}
const Rx=t=>[1,0,0,0,Math.cos(t),-Math.sin(t),0,Math.sin(t),Math.cos(t)], Ry=t=>[Math.cos(t),0,Math.sin(t),0,1,0,-Math.sin(t),0,Math.cos(t)], Rz=t=>[Math.cos(t),-Math.sin(t),0,Math.sin(t),Math.cos(t),0,0,0,1];
const cm=m=>[m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]], tr=m=>[m[0],m[3],m[6],m[1],m[4],m[7],m[2],m[5],m[8]];
(async () => {
  const out = {};
  const clouds = await load('2k_earth_clouds.jpg'), ring = await load('2k_saturn_ring_alpha.png');
  for (const [id, f, spinDeg, axis, emis] of BODIES) {
    tex(await load(f), 0); tex(clouds, 1); tex(ring, 2, true);
    const M = mul(Rx(id === 'saturn' ? 0.32 : 0.22), mul(Rz(axis * Math.PI / 180), Ry(spinDeg * Math.PI / 180)));
    gl.uniformMatrix3fv(U('uM'), false, cm(M)); gl.uniformMatrix3fv(U('uMT'), false, cm(tr(M)));
    const L = [-0.35, 0.3, 0.89]; const l = Math.hypot(...L); gl.uniform3f(U('uL'), L[0]/l, L[1]/l, L[2]/l);
    const R = id === 'saturn' ? S / 2 / 2.3 : S / 2 - 2;
    gl.uniform2f(U('uC'), S / 2, S / 2); gl.uniform1f(U('uR'), R);
    gl.uniform1f(U('uEmis'), emis); gl.uniform1f(U('uHasCloud'), id === 'earth' ? 1 : 0); gl.uniform1f(U('uHasRing'), id === 'saturn' ? 1 : 0);
    gl.uniform1f(U('uRin'), 1.24); gl.uniform1f(U('uRout'), 2.27);
    gl.viewport(0, 0, S, S); gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES, 0, 3);
    out[id] = cv.toDataURL('image/webp', 0.86);
  }
  document.getElementById('out').textContent = JSON.stringify(out);
  document.title = 'done';
})();
</script></body></html>
