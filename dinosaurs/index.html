<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🦖 โลกไดโนเสาร์ — คิดส์เล่น</title>
<meta name="description" content="เกมไดโนเสาร์สำหรับเด็กไทย ข้อมูลจริง เทียบขนาดกับตัวเรา ขุดฟอสซิล และไดโนเสาร์ที่พบในประเทศไทย">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ไดโนเสาร์">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }

  .app {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }

  .modes { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 600;
    min-height: 56px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform .1s;
  }
  .chip:active { transform: translateY(2px) scale(0.96); }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .main > * { min-width: 0; }
  @media (min-width: 900px) and (orientation: landscape) {
    .main { grid-template-columns: minmax(0, 1fr) 380px; }
  }
  .view {
    position: relative; background: #fffef9;
    border: 4px solid #fff; border-radius: 28px; overflow: hidden;
    box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .view svg { display: block; width: 100%; height: auto; }
  #scene { cursor: pointer; touch-action: manipulation; max-height: 70vh; }
  #scene .dino { transform-box: fill-box; transform-origin: 50% 100%; }
  #scene .dino.idle { animation: breathe 3s ease-in-out infinite; }
  #scene .dino.fly { animation: glide 3s ease-in-out infinite; }
  #scene .dino.hop { animation: hop .5s ease; }
  @keyframes breathe { 50% { transform: scaleY(1.025); } }
  @keyframes glide { 50% { transform: translateY(-14px) rotate(-2deg); } }
  @keyframes hop { 30% { transform: translateY(-6%) scale(1.04); } 60% { transform: translateY(0) scale(.98); } }
  .hint {
    position: absolute; left: 50%; top: 12px; transform: translateX(-50%); pointer-events: none;
    font-size: 15px; color: #fff; background: rgba(0,0,0,0.4); padding: 5px 14px; border-radius: 999px; white-space: nowrap;
  }
  #sizeWrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #sizeSvg { min-width: 760px; }
  .note { font-size: 13px; color: #7a6f60; text-align: center; padding: 4px 12px 10px; }

  #digView { touch-action: none; }
  #sand { position: absolute; left: 0; top: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; transition: opacity .8s; }
  #sand.gone { opacity: 0; pointer-events: none; }
  .bone path, .bone ellipse, .bone circle { fill: #f3e8cc !important; stroke: #8b7355 !important; }
  .bone .eye { fill: #5a4630 !important; stroke: none !important; }
  .bone .deco { display: none; }
  #digColor { transition: opacity 1s; }

  /* dinosaur picker strip */
  .strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
  @media (min-width: 640px) { .strip { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  @media (min-width: 1000px) { .strip { grid-template-columns: repeat(11, minmax(0, 1fr)); } }
  .dbtn {
    position: relative; min-height: 84px; border-radius: 20px;
    background: #fff; border: 3px solid var(--card-border);
    color: var(--ink); font-family: 'Mitr', sans-serif; font-size: 12px; font-weight: 500; line-height: 1.15; text-align: center; overflow-wrap: anywhere;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    cursor: pointer; padding: 6px 2px; box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    transition: transform .1s, border-color .15s;
  }
  .dbtn svg { width: 64px; height: 43px; }
  .dbtn:active { transform: translateY(2px) scale(0.95); }
  .dbtn.sel { border-color: var(--brand); background: #ffe8f0; }
  .dbtn .flag { position: absolute; top: 2px; right: 4px; font-size: 13px; }

  .panel {
    background: var(--card); color: var(--ink);
    border: 4px solid var(--card-border); border-radius: 28px;
    padding: 16px 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .p-head { display: flex; align-items: center; gap: 10px; }
  .p-head svg { width: 96px; height: 64px; flex-shrink: 0; }
  .p-name { font-family: 'Itim', cursive; font-size: 28px; line-height: 1.05; color: var(--brand-dark); }
  .p-sub { font-size: 13px; color: #777; }
  .say {
    margin-left: auto; flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--card-border); background: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .say:active { transform: translateY(2px); }
  .diet { display: inline-block; margin-top: 4px; font-size: 14px; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #eef8e6; }
  .diet.meat { background: #ffe6e1; } .diet.fish { background: #e3f1ff; }
  .facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; margin: 12px 0 8px; }
  .fact { background: #fff8ec; border-radius: 16px; padding: 8px 10px; }
  .fact .k { font-size: 13px; color: #6b7280; }
  .fact .v { font-size: 16px; font-weight: 600; line-height: 1.25; }
  .tl { width: 100%; height: auto; display: block; margin-top: 6px; }
  .know { margin: 8px 0 0; padding: 0; list-style: none; }
  .know li { background: #fff6d6; border-radius: 16px; padding: 8px 12px; margin-top: 8px; font-size: 16px; line-height: 1.4; }
  .know li::before { content: '💡 '; }
  .res { font-size: 19px; line-height: 1.45; margin-top: 8px; text-align: center; }
  .res b { color: var(--brand-dark); font-size: 24px; }
  .src { font-size: 11px; color: #9aa3b5; margin-top: 10px; }
  .big-btn {
    font-family: 'Mitr', sans-serif; font-size: 24px; font-weight: 700;
    min-height: 72px; width: 100%; margin-top: 12px; border-radius: 999px;
    border: 3px solid var(--brand-dark); background: var(--brand); color: #fff;
    box-shadow: 0 5px 0 var(--brand-dark); cursor: pointer;
  }
  .big-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--brand-dark); }
  .q-text { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); text-align: center; margin: 6px 0; line-height: 1.2; }
  .bar { height: 22px; border-radius: 999px; background: #f1e6cf; overflow: hidden; margin: 10px 0 4px; border: 3px solid #e3d3b0; }
  .bar > div { height: 100%; width: 0; background: linear-gradient(90deg, #ffd93d, #ff914d); transition: width .25s; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>🦖 โลกไดโนเสาร์</h1></header>

  <div class="modes" id="modes">
    <button class="chip on" data-mode="explore">🦕 สำรวจ</button>
    <button class="chip" data-mode="size">📏 ตัวใหญ่แค่ไหน</button>
    <button class="chip" data-mode="dig">🦴 ขุดฟอสซิล</button>
  </div>

  <div class="main">
    <div>
      <div class="view" id="exploreView">
        <svg id="scene" viewBox="0 0 1000 620" aria-label="ไดโนเสาร์"></svg>
        <div class="hint">👆 แตะไดโนเสาร์</div>
      </div>
      <div class="view hidden" id="sizeView">
        <div id="sizeWrap"><svg id="sizeSvg" aria-label="เทียบขนาดไดโนเสาร์"></svg></div>
        <div class="note">ทุกอย่างในภาพนี้ย่อด้วยอัตราส่วนเดียวกัน เทียบกันได้ตามจริง · เลื่อนดูทางขวาได้</div>
      </div>
      <div class="view hidden" id="digView">
        <svg id="digSvg" viewBox="0 0 1000 620" aria-label="ขุดฟอสซิล"></svg>
        <canvas id="sand"></canvas>
      </div>
      <div class="strip" id="strip"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
'use strict';

// ============================================================================
// DATA — sizes/ages from the Wikipedia species articles (which cite the
// published estimates). Where scientists disagree, the card shows the range.
// `L` = length in metres used for the to-scale drawing (wingspan for Pteranodon).
// Ma = million years ago. Periods: Triassic 252–201, Jurassic 201–145, Cretaceous 145–66.
// ============================================================================
const DINOS = [
  { id: 'trex', th: 'ทีเร็กซ์', sci: 'Tyrannosaurus rex · ไทรันโนซอรัส เร็กซ์', diet: 'meat',
    L: 12, len: 'ราว 12 เมตร', wt: 'ราว 8 ตัน', ma: [68, 66], where: 'อเมริกาเหนือ',
    know: ['ฟันซี่ใหญ่ที่สุดยาวราว 30 เซนติเมตร (รวมราก)',
           'แขนสั้นนิดเดียว มีนิ้วแค่ 2 นิ้ว',
           'ทีเร็กซ์อยู่ใกล้ยุคของเรา มากกว่ายุคของสเตโกซอรัสเสียอีก'],
    say: 'ทีเร็กซ์ นักล่าตัวใหญ่ กินเนื้อ ยาวราว 12 เมตร' },
  { id: 'tri', th: 'ไทรเซอราทอปส์', sci: 'Triceratops', diet: 'plant',
    L: 8.5, len: '8–9 เมตร', wt: '6–12 ตัน', ma: [68, 66], where: 'อเมริกาเหนือ',
    know: ['มี 3 เขา กับแผงคอใหญ่ ชื่อแปลว่า "หน้าสามเขา"',
           'อยู่ยุคเดียวกับทีเร็กซ์ เคยพบรอยฟันทีเร็กซ์บนกระดูกของมัน'],
    say: 'ไทรเซอราทอปส์ มีสามเขา กินพืช' },
  { id: 'brachio', th: 'แบรคิโอซอรัส', sci: 'Brachiosaurus', diet: 'plant',
    L: 20, len: '18–22 เมตร', wt: '28–47 ตัน', ma: [154, 153], where: 'อเมริกาเหนือ',
    know: ['ขาหน้ายาวกว่าขาหลัง หลังเลยลาดลงเหมือนยีราฟ',
           'ยกหัวได้สูงราว 9–13 เมตร สูงกว่าตึก 3 ชั้น',
           'กินใบไม้บนยอดต้นไม้สูงๆ'],
    say: 'แบรคิโอซอรัส คอยาวมาก กินใบไม้บนยอดไม้' },
  { id: 'stego', th: 'สเตโกซอรัส', sci: 'Stegosaurus', diet: 'plant',
    L: 7, len: '6.5–9 เมตร', wt: '3.5–7 ตัน', ma: [155, 145], where: 'อเมริกาเหนือ และโปรตุเกส',
    know: ['แผ่นบนหลังแผ่นใหญ่สุดสูงราว 1 เมตร',
           'ปลายหางมีหนามแหลม 4 อัน ไว้ป้องกันตัว',
           'หัวเล็กมาก เมื่อเทียบกับตัวที่ใหญ่โต'],
    say: 'สเตโกซอรัส มีแผ่นบนหลัง และหนามที่หาง' },
  { id: 'raptor', th: 'เวโลซิแรปเตอร์', sci: 'Velociraptor', diet: 'meat',
    L: 1.8, len: '1.5–2 เมตร', wt: 'ราว 15–20 กิโลกรัม', ma: [75, 71], where: 'มองโกเลีย และจีน',
    know: ['ตัวจริงเล็กกว่าที่คิด สะโพกสูงแค่ราวครึ่งเมตร',
           'มีขนเหมือนนก และมีกรงเล็บโค้งที่เท้า'],
    say: 'เวโลซิแรปเตอร์ ตัวเล็ก มีขนเหมือนนก วิ่งเร็ว' },
  { id: 'spino', th: 'สไปโนซอรัส', sci: 'Spinosaurus', diet: 'fish',
    L: 14, len: 'ราว 14 เมตร', wt: 'ราว 7 ตัน', ma: [100, 94], where: 'แอฟริกา (อียิปต์ โมร็อกโก)',
    know: ['มีครีบใหญ่บนหลัง กระดูกครีบยาวได้ราว 1.6 เมตร',
           'ปากยาวคล้ายจระเข้ จับปลากินเก่ง แต่ก็กินสัตว์อื่นด้วย',
           'ยาวกว่าทีเร็กซ์ แต่อยู่คนละยุค ไม่เคยเจอกัน'],
    say: 'สไปโนซอรัส มีครีบบนหลัง ชอบกินปลา' },
  { id: 'ankylo', th: 'แองคิโลซอรัส', sci: 'Ankylosaurus', diet: 'plant',
    L: 7, len: '6–8 เมตร', wt: '4.8–8 ตัน', ma: [68, 66], where: 'อเมริกาเหนือ',
    know: ['ตัวมีเกราะกระดูกแข็งๆ เหมือนรถถัง',
           'ปลายหางเป็นก้อนกระดูกเหมือนตะบอง ไว้ฟาดศัตรู'],
    say: 'แองคิโลซอรัส ตัวมีเกราะ หางเป็นตะบอง' },
  { id: 'para', th: 'พาราซอโรโลฟัส', sci: 'Parasaurolophus', diet: 'plant',
    L: 9, len: '7.5–9.5 เมตร', wt: 'ราว 2.5–5 ตัน', ma: [76.5, 73], where: 'อเมริกาเหนือ',
    know: ['หงอนยาวกลวงข้างใน นักวิทยาศาสตร์คิดว่าอาจใช้ส่งเสียงร้องเรียกกัน',
           'ปากแบนคล้ายปากเป็ด'],
    say: 'พาราซอโรโลฟัส มีหงอนยาว ปากเหมือนเป็ด' },
  { id: 'ptera', th: 'เทอราโนดอน', sci: 'Pteranodon', diet: 'fish', fly: true,
    L: 5.6, len: 'ปีกกว้าง 4–7 เมตร', wt: 'ราว 20–50 กิโลกรัม', ma: [86, 78], where: 'อเมริกาเหนือ',
    know: ['เทอราโนดอนไม่ใช่ไดโนเสาร์นะ เป็นสัตว์เลื้อยคลานบินได้ ญาติของไดโนเสาร์',
           'ปากไม่มีฟันเลย บินจับปลาในทะเลกิน'],
    say: 'เทอราโนดอน บินได้ แต่ไม่ใช่ไดโนเสาร์นะ' },
  { id: 'phuwiang', th: 'ภูเวียงโกซอรัส', sci: 'Phuwiangosaurus sirindhornae · ภูเวียงโกซอรัส สิรินธรเน่', diet: 'plant', thai: true,
    L: 17, len: '15–20 เมตร', wt: 'ราว 17 ตัน', ma: [134, 132], where: 'ภูเวียง จ.ขอนแก่น ประเทศไทย',
    know: ['ไดโนเสาร์คอยาวของไทย พบที่ภูเวียง จังหวัดขอนแก่น เมื่อปี 2525',
           'ชื่อ สิรินธรเน่ ตั้งเพื่อเฉลิมพระเกียรติ สมเด็จพระกนิษฐาธิราชเจ้า กรมสมเด็จพระเทพรัตนราชสุดา ที่สนพระทัยเรื่องไดโนเสาร์'],
    say: 'ภูเวียงโกซอรัส ไดโนเสาร์คอยาวของไทย พบที่ขอนแก่น' },
  { id: 'siamo', th: 'สยามโมไทรันนัส', sci: 'Siamotyrannus isanensis · สยามโมไทรันนัส อีสานเอนซิส', diet: 'meat', thai: true,
    L: 7, len: '6–10 เมตร', wt: 'ราว 0.5–1.75 ตัน', ma: [145, 120], where: 'ภูเวียง จ.ขอนแก่น ประเทศไทย',
    know: ['นักล่าของไทย พบที่ภูเวียง จังหวัดขอนแก่น เมื่อปี 2536',
           'ชื่อแปลว่า "ทรราชแห่งสยาม จากภาคอีสาน"',
           'เคยคิดว่าเป็นญาติของทีเร็กซ์ แต่ตอนนี้นักวิทยาศาสตร์คิดว่าไม่ใช่ญาติใกล้กัน'],
    say: 'สยามโมไทรันนัส นักล่าของไทย พบที่ขอนแก่น' },
];
const BY = Object.fromEntries(DINOS.map(d => [d.id, d]));
const DIET = { plant: ['🌿 กินพืช', ''], meat: ['🍖 กินเนื้อ', 'meat'], fish: ['🐟 กินปลา', 'fish'] };
const PERIODS = [['ไทรแอสซิก', 252, 201, '#f6b26b'], ['จูราสสิก', 201, 145, '#93c47d'], ['ครีเทเชียส', 145, 66, '#6fa8dc']];
const periodOf = (ma) => (PERIODS.find(p => ma <= p[1] && ma > p[2]) || PERIODS[2])[0];
const KID_M = 1.1;    // a 5-year-old is ~110 cm tall

function dinoSvg(id, opts = {}) {
  const a = ART[id];
  const inner = `<g stroke="#2d3436" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">${a.draw(a.c, a.d, a.b)}</g>`;
  if (!opts.bone) return inner;
  const [cx, cy, rx, ry] = a.rib;
  let ribs = `<path d="M${cx - rx},${cy - ry * 0.5} Q${cx},${cy - ry * 1.05} ${cx + rx},${cy - ry * 0.5}"/>`;
  for (let i = 0; i < 6; i++) {
    const x = cx - rx * 0.62 + i * rx * 0.25;
    ribs += `<path d="M${x},${cy - ry * 0.72} Q${x - 7},${cy} ${x - 3},${cy + ry * 0.62}"/>`;
  }
  return `<g class="bone">${inner}<g fill="none" stroke="#8b7355" stroke-width="3" stroke-linecap="round">${ribs}</g></g>`;
}

function placeDino(id, xStart, airM = 0) {
  const a = ART[id], d = BY[id];

  return { svg: `<svg x="${xStart - a.x0 * k}" y="${SG - GROUND * k - airM * PPM}" width="${w}" height="${h}" viewBox="0 0 240 160">${dinoSvg(id)}</svg>`, end: xStart + d.L * PPM };

// 🦴 DIG — brush sand off a hidden skeleton, then it comes to life
// ============================================================================

// ============================================================================
const strip = $('strip'), panel = $('panel');

}
function maTxt(d) { return (d.ma[0] === d.ma[1] ? d.ma[0] : d.ma[0] + '–' + d.ma[1]) + ' ล้านปีก่อน'; }
function head(d) {

    <div><div class="p-name">${d.th}</div><div class="p-sub">${d.sci}</div><span class="diet ${DIET[d.diet][1]}">${DIET[d.diet][0]}</span></div>

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;

}

// Block double-tap zoom on iOS
let lastTouchEnd = 0;

/* Auto-update: offer a "tap to update" pill when a new version is deployed

(function () {
  if (!('serviceWorker' in navigator)) return;

    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';

  function watch(reg) {

    function check() { reg.update().catch(function () {}); }
