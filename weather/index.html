<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<script src="../audio-unlock.js"></script>
<script src="../voice-clips.js"></script>
<script src="voice/map.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>⛈️ ฟ้าฝน — คิดส์เล่น</title>
<meta name="description" content="เกมลม ฝน พายุ สำหรับเด็กไทย ดูลมบกลมทะเล ลากเมฆให้ฝนตก นับฟ้าร้องหาระยะพายุ และหมุนพายุไต้ฝุ่นเอง">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ฟ้าฝน">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 60%, #7ed957 100%);
    background-attachment: fixed;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.5; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }

  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60;
    transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .app {
    position: relative; z-index: 1;
    max-width: 1200px; margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
  }
  header { text-align: center; margin: 0 60px 8px; }
  h1 {
    font-family: 'Itim', cursive; font-weight: normal;
    font-size: clamp(30px, 6.5vw, 50px); margin: 4px 0 0;
    color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
  }
  .modes, .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  .chip {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 600;
    min-height: 56px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform .1s;
  }
  .chip:active { transform: translateY(2px) scale(0.96); }
  .chip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .row .chip.on { background: var(--gold); border-color: #e0b400; color: var(--ink); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; align-items: start; }
  .main > * { min-width: 0; }
  @media (min-width: 900px) and (orientation: landscape) { .main { grid-template-columns: minmax(0, 1fr) 360px; } }
  .view { position: relative; background: #fffef9; border: 4px solid #fff; border-radius: 28px; overflow: hidden; box-shadow: 0 6px 0 rgba(0,0,0,0.15); }
  .view svg { display: block; width: 100%; height: auto; }
  #scene { max-height: 70vh; touch-action: none; }
  .hold {
    font-family: 'Mitr', sans-serif; font-size: 22px; font-weight: 700; color: #fff;
    width: 100%; min-height: 84px; border-radius: 999px; margin-top: 10px; cursor: pointer;
    border: 4px solid #c0392b; background: #ff7f50; box-shadow: 0 6px 0 #c0392b; touch-action: none;
  }
  .hold.on { transform: translateY(4px); box-shadow: 0 2px 0 #c0392b; background: #ffb347; }

  /* info panel — inline, never a popup */
  .panel {
    background: var(--card); color: var(--ink);
    border: 4px solid var(--card-border); border-radius: 28px;
    padding: 16px 16px 18px; box-shadow: 0 6px 0 rgba(0,0,0,0.15);
  }
  .say {
    margin-left: auto; flex-shrink: 0;
    width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid var(--card-border); background: #fff; font-size: 28px; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .say:active { transform: translateY(2px); }
  .say.on { background: var(--gold); border-color: #e0b400; }
  .sayrow { display: flex; justify-content: flex-end; }
  .sayrow .say { width: auto; padding: 0 18px; border-radius: 999px; font-family: inherit; font-size: 18px; font-weight: 600; color: var(--ink); }
  .sayable { cursor: pointer; -webkit-tap-highlight-color: transparent; transition: transform .1s; }
  .sayable:active { transform: scale(0.97); }
  .know li.sayable::after { content: ' 🔈'; font-size: 13px; opacity: .55; }
  .reading { outline: 4px solid var(--gold); outline-offset: 2px; border-radius: 16px; background-color: #fff3b0 !important; }
  .know { margin: 8px 0 0; padding: 0; list-style: none; }
  .know li { background: #fff6d6; border-radius: 16px; padding: 8px 12px; margin-top: 8px; font-size: 16px; line-height: 1.4; }
  .know li::before { content: '💡 '; }
  .q-text { font-family: 'Itim', cursive; font-size: 30px; color: var(--brand-dark); text-align: center; margin: 6px 0; line-height: 1.2; }
  .res { font-size: 18px; line-height: 1.45; margin-top: 10px; }
  .res b { color: var(--brand-dark); }
  .warn { background: #ffe1e1; border-radius: 16px; padding: 8px 12px; margin-top: 10px; font-size: 16px; line-height: 1.4; font-weight: 600; }
  .src { font-size: 11px; color: #9aa3b5; margin-top: 10px; }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 90; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>

<div class="app">
  <header><h1>⛈️ ฟ้าฝน</h1></header>
  <div class="modes" id="modes">
    <button class="chip on" data-mode="wind">💨 ลม</button>
    <button class="chip" data-mode="rain">🌧️ ฝน</button>
    <button class="chip" data-mode="thunder">⚡ ฟ้าแลบ ฟ้าร้อง</button>
    <button class="chip" data-mode="typhoon">🌀 พายุไต้ฝุ่น</button>
  </div>
  <div class="main">
    <div>
      <div class="view"><svg id="scene" viewBox="0 0 1000 640" aria-label="ฟ้าฝน"></svg></div>
      <div id="ctrls"></div>
    </div>
    <div class="panel" id="panel"></div>
  </div>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene'), ctrls = $('ctrls'), panel = $('panel');
let mode = 'wind';
function svgPt(ev) {
  const pt = scene.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(scene.getScreenCTM().inverse());
}
const knowList = (a) => `<ul class="know">${a.map((k) => `<li>${k}</li>`).join('')}</ul>`;
function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)), A = p(a), B = p(b);
  t = Math.max(0, Math.min(1, t));
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function cloudShape(cx, cy, s, fill, extra = '') {
  return `<g ${extra}><ellipse cx="${cx}" cy="${cy + 18 * s}" rx="${110 * s}" ry="${34 * s}" fill="${fill}"/><circle cx="${cx - 52 * s}" cy="${cy + 4 * s}" r="${40 * s}" fill="${fill}"/>
    <circle cx="${cx}" cy="${cy - 18 * s}" r="${56 * s}" fill="${fill}"/><circle cx="${cx + 54 * s}" cy="${cy + 2 * s}" r="${42 * s}" fill="${fill}"/></g>`;
}

// ============================================================================
// 💨 WIND — land heats and cools faster than the sea. Day: warm air rises over the
// land and cooler sea air flows in = sea breeze ลมทะเล. Night: the reverse = ลมบก.
// ============================================================================
let windDay = true, windK = 1;
const LOOP = [[200, 450], [790, 450], [790, 175], [200, 175]];
const LOOP_LEN = 2 * (590 + 275);
let parts = [...Array(44)].map((_, i) => ({ s: i / 44 + Math.random() * 0.01, j: (Math.random() - 0.5) * 30 }));
function loopAt(s) {
  s = ((s % 1) + 1) % 1;
  let d = s * LOOP_LEN;
  for (let i = 0; i < 4; i++) {
    const a = LOOP[i], b = LOOP[(i + 1) % 4], L = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (d <= L) return [a[0] + (b[0] - a[0]) * d / L, a[1] + (b[1] - a[1]) * d / L, i];
    d -= L;
  }
  return [...LOOP[0], 0];
}
let boatX = 300;
function buildWind() {
  scene.innerHTML = `<defs><linearGradient id="wsky" x1="0" y1="0" x2="0" y2="1"><stop id="ws0" offset="0"/><stop id="ws1" offset="1"/></linearGradient>
      <marker id="ah" markerWidth="5" markerHeight="5" refX="2.5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#fff"/></marker></defs>
    <rect width="1000" height="640" fill="url(#wsky)"/>
    <g id="wsun" style="cursor:pointer"></g>
    <path d="M0,470 L500,470 L500,640 L0,640 Z" fill="#2f86d1"/>
    <path d="M0,480 q40,-8 80,0 t80,0 t80,0 t80,0 t80,0 t80,0" fill="none" stroke="#9fd3ff" stroke-width="4" opacity=".7"/>
    <path d="M480,470 Q520,462 560,462 L1000,440 L1000,640 L470,640 Z" fill="#f2d48b"/>
    <path d="M600,458 L1000,436 L1000,640 L600,640 Z" fill="#7ed957"/>
    <text x="700" y="455" font-size="90" text-anchor="middle">🌴</text><text x="900" y="440" font-size="80" text-anchor="middle">🏠</text>
    <g id="flag"></g><g id="boat"></g>
    <path id="bigArrow" d="" fill="none" stroke="#fff" stroke-width="10" stroke-dasharray="26 18" opacity=".55" marker-end="url(#ah)"/>
    <g id="air"></g>
    <g id="thermo"></g>
    <text id="wMsg" x="500" y="54" text-anchor="middle" font-family="Mitr" font-size="30" font-weight="700" fill="#fff" stroke="#1b2160" stroke-width="7" paint-order="stroke"></text>
    <text x="250" y="560" text-anchor="middle" font-family="Mitr" font-size="28" font-weight="700" fill="#fff">ทะเล</text>
    <text x="800" y="560" text-anchor="middle" font-family="Mitr" font-size="28" font-weight="700" fill="#2d5a2a">พื้นดิน</text>`;
  $('wsun').addEventListener('click', () => { ensureAudio(); setWindDay(!windDay); });
  placeWind(0, 0);
}
function thermo(x, hot, lab) {
  const h = 30 + hot * 110, col = mix('#3a9ad9', '#e74c3c', hot);
  return `<g transform="translate(${x} 250)"><rect x="-14" y="-140" width="28" height="160" rx="14" fill="#fff" stroke="#2d3436" stroke-width="4"/>
    <rect x="-7" y="${10 - h}" width="14" height="${h}" rx="7" fill="${col}"/><circle cx="0" cy="26" r="20" fill="${col}" stroke="#2d3436" stroke-width="4"/>
    <text x="0" y="74" text-anchor="middle" font-family="Mitr" font-size="22" font-weight="700" fill="#fff" stroke="#1b2160" stroke-width="5" paint-order="stroke">${lab}</text></g>`;
}
function placeWind(dt, now) {
  windK += ((windDay ? 1 : -1) - windK) * Math.min(1, dt * 1.5);
  const night = (1 - windK) / 2;
  $('ws0').setAttribute('stop-color', mix('#6ec6ff', '#0b1033', night)); $('ws1').setAttribute('stop-color', mix('#d8f1ff', '#2a3170', night));
  $('wsun').innerHTML = windDay ? `<circle cx="120" cy="100" r="62" fill="#ffd93d"/><circle cx="120" cy="100" r="80" fill="#ffd93d" opacity=".3"/><circle r="90" cx="120" cy="100" fill="transparent"/>`
    : `<circle cx="120" cy="100" r="50" fill="#fdf6d8"/><circle cx="142" cy="88" r="46" fill="${mix('#6ec6ff', '#0b1033', night)}"/><circle r="90" cx="120" cy="100" fill="transparent"/>`;
  const speed = 0.055 * windK;
  let s = '';
  for (const p of parts) {
    p.s += speed * dt;
    const [x, y, side] = loopAt(p.s), horiz = side === 0 || side === 2;
    const px = horiz ? x : x + p.j, py = horiz ? y + p.j : y;
    s += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="7" fill="#fff" opacity=".85"/>`;
  }
  $('air').innerHTML = s;
  // big circulation arrow (clockwise by day as seen here: along the sea surface toward the land)
  const d = windK >= 0 ? 'M230,420 L760,420 L760,205 L230,205 L230,380' : 'M760,420 L230,420 L230,205 L760,205 L760,380';
  $('bigArrow').setAttribute('d', d); $('bigArrow').setAttribute('stroke-dashoffset', (-now / 20 * Math.sign(windK)).toFixed(0));
  $('thermo').innerHTML = thermo(90, windDay ? 0.5 : 0.55, 'ทะเล') + thermo(930, windDay ? 0.95 : 0.15, 'พื้นดิน');
  // flag points the way the wind blows
  const w = Math.sin(now / 150) * 6, dir = windK >= 0 ? 1 : -1, L = 70 * Math.min(1, Math.abs(windK) + 0.15);
  $('flag').innerHTML = `<path d="M610,470 L610,330" stroke="#555" stroke-width="6"/><path d="M610,334 q${dir * L / 2},${w} ${dir * L},0 l0,40 q${-dir * L / 2},${-w} ${-dir * L},0 Z" fill="#ff6b9d" stroke="#2d3436" stroke-width="3"/>`;
  boatX += windK * 22 * dt; if (boatX > 440) boatX = 60; if (boatX < 40) boatX = 430;
  $('boat').innerHTML = `<text x="${boatX.toFixed(0)}" y="478" font-size="70" text-anchor="middle" transform="${windK < 0 ? `translate(${(2 * boatX).toFixed(0)} 0) scale(-1 1)` : ''}">⛵</text>`;
  $('wMsg').textContent = windDay ? '☀️ กลางวัน: ลมทะเล พัดเข้าฝั่ง' : '🌙 กลางคืน: ลมบก พัดออกทะเล';
}
function setWindDay(d) {
  windDay = d; buzz(10); blip(d ? 700 : 420);
  renderWindCtrls(); renderWind();
  speak(d ? WIND_SAY.day : WIND_SAY.night);
}
const WIND_SAY = {
  day: 'กลางวัน พื้นดินร้อนเร็วกว่าน้ำทะเล อากาศร้อนลอยขึ้น อากาศเย็นจากทะเลไหลเข้ามาแทน เกิดเป็นลมทะเล',
  night: 'กลางคืน พื้นดินเย็นเร็วกว่าน้ำทะเล อากาศเหนือทะเลอุ่นกว่าจึงลอยขึ้น อากาศจากฝั่งไหลออกไปแทน เกิดเป็นลมบก',
};
function renderWindCtrls() {
  ctrls.innerHTML = `<div class="row"><button class="chip ${windDay ? 'on' : ''}" data-d="1">☀️ กลางวัน</button><button class="chip ${windDay ? '' : 'on'}" data-d="0">🌙 กลางคืน</button></div>`;
  for (const b of ctrls.querySelectorAll('[data-d]')) b.addEventListener('click', () => { ensureAudio(); setWindDay(b.dataset.d === '1'); });
}
const WIND_KNOW = [
  'ลมคืออากาศที่เคลื่อนที่ อากาศร้อนเบาจึงลอยขึ้น แล้วอากาศเย็นไหลเข้ามาแทนที่',
  'พื้นดินร้อนเร็วและเย็นเร็วกว่าน้ำ ลมจึงเปลี่ยนทางระหว่างกลางวันกับกลางคืน',
  'ชาวประมงพื้นบ้านออกเรือตอนกลางคืนหรือเช้ามืดด้วยลมบก แล้วกลับเข้าฝั่งตอนบ่ายด้วยลมทะเล',
  'กลางเดือนพฤษภาคมถึงกลางเดือนตุลาคม ลมมรสุมตะวันตกเฉียงใต้พาความชื้นจากมหาสมุทรอินเดียมา ไทยจึงเข้าฤดูฝน',
  'กลางเดือนตุลาคมถึงกลางเดือนกุมภาพันธ์ ลมมรสุมตะวันออกเฉียงเหนือพาอากาศเย็นและแห้งมา ไทยจึงเข้าฤดูหนาว',
];
function renderWind() {
  panel.innerHTML = `<div class="q-text">${windDay ? '🌊➡️🏝️ ลมทะเล' : '🏝️➡️🌊 ลมบก'}</div>
    <div class="res" data-say="${windDay ? WIND_SAY.day : WIND_SAY.night}">${windDay ? 'กลางวัน พื้นดิน<b>ร้อนเร็วกว่า</b>น้ำทะเล อากาศร้อนลอยขึ้น อากาศเย็นจากทะเลไหลเข้ามาแทน' : 'กลางคืน พื้นดิน<b>เย็นเร็วกว่า</b>น้ำทะเล อากาศเหนือทะเลอุ่นกว่าจึงลอยขึ้น อากาศจากฝั่งไหลออกไปแทน'}</div>
    <div class="res">👆 แตะ${windDay ? 'ดวงอาทิตย์' : 'ดวงจันทร์'} หรือปุ่มด้านล่าง เพื่อสลับกลางวันกลางคืน ดูธงกับเรือใบ</div>
    ${knowList(WIND_KNOW)}<div class="src">ฤดูมรสุมตามกรมอุตุนิยมวิทยา · ลูกศรและเม็ดอากาศวาดให้เห็นทางลม</div>`;
  sayKit();
}

// ============================================================================
// 🌧️ RAIN — the water cycle: the Sun lifts water vapour off the sea (ระเหย), it
// gathers into a cloud of tiny droplets (ควบแน่น), the cloud gets heavy and rains
// (ฝนตก) — easier over the mountain — and rivers carry it back (ไหลกลับ).
// ============================================================================
const SEA_X = 520, MTN = 'M520,640 L560,520 Q640,400 700,330 Q760,250 800,240 Q850,250 900,330 Q960,420 1000,470 L1000,640 Z';
let vapor = [], drops = [], cl = { x: 330, y: 150, water: 4 }, raining = false, rainbow = 0, riverFlow = 0, vapT = 0, clDrag = null, stage = '', saidStage = {};
function resetRain() { vapor = []; drops = []; cl = { x: 330, y: 150, water: 4 }; raining = false; rainbow = 0; riverFlow = 0; stage = ''; saidStage = {}; }
function buildRain() {
  scene.innerHTML = `<defs><linearGradient id="rsky" x1="0" y1="0" x2="0" y2="1"><stop id="rs0" offset="0" stop-color="#6ec6ff"/><stop id="rs1" offset="1" stop-color="#d8f1ff"/></linearGradient></defs>
    <rect width="1000" height="640" fill="url(#rsky)"/>
    <g id="rbow"></g>
    <g id="rsun" style="cursor:pointer"><circle cx="100" cy="90" r="80" fill="#ffd93d" opacity=".3"/><circle cx="100" cy="90" r="58" fill="#ffd93d"/></g>
    <path d="${MTN}" fill="#6aa84f"/><path d="M700,330 Q760,250 800,240 Q850,250 900,330 Q850,300 800,310 Q750,300 700,330 Z" fill="#4e8a3a"/>
    <path d="M0,500 L${SEA_X},500 L560,640 L0,640 Z" fill="#2f86d1"/>
    <path d="M0,510 q40,-8 80,0 t80,0 t80,0 t80,0 t80,0 t80,0" fill="none" stroke="#9fd3ff" stroke-width="4" opacity=".7"/>
    <path id="river" d="M800,300 Q770,360 800,410 Q830,460 760,500 Q690,540 640,560 Q590,580 540,560" fill="none" stroke="#5bc0eb" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 14"/>
    <text x="230" y="590" text-anchor="middle" font-family="Mitr" font-size="28" font-weight="700" fill="#fff">ทะเล</text>
    <text x="830" y="600" text-anchor="middle" font-family="Mitr" font-size="26" font-weight="700" fill="#2d5a2a">ภูเขา</text>
    <g id="vap"></g><g id="cloudG" style="cursor:grab"></g><g id="drops"></g>
    <text id="rMsg" x="500" y="50" text-anchor="middle" font-family="Mitr" font-size="30" font-weight="700" fill="#fff" stroke="#1b2160" stroke-width="7" paint-order="stroke">👆 แตะทะเล ให้ไอน้ำลอยขึ้น</text>`;

let AC = null;

  if (!('speechSynthesis' in window)) { setTimeout(end, 0); return; }

    .replace(/\s*\([^)]*[A-Za-z][^)]*\)/g, '').replace(/[A-Za-z][A-Za-z’' ]*[A-Za-z]/g, '')

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
