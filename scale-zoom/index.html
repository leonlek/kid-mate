<!DOCTYPE html>

<meta name="description" content="ซูมจากอะตอม ไวรัส เม็ดเลือด มด เด็ก ช้าง วาฬ ตึก ภูเขา ดาวเคราะห์ ดวงอาทิตย์ ไปจนถึงกาแล็กซีและจักรวาล ทุกอย่างขนาดเทียบกันจริง">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<style>
  :root {
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --ink: #2d3436;
    --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: 'Mitr', -apple-system, sans-serif; color: var(--ink);
    background: linear-gradient(180deg, #b5e8ff 0%, #d9f3c9 65%, #7ed957 100%);
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px; opacity: 0.3; pointer-events: none;
    letter-spacing: 80px; animation: drift 40s linear infinite; z-index: 2;
  }
  @keyframes drift { from { transform: translateX(-10%); } to { transform: translateX(10%); } }
  .home-btn {
    position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: #fff; border: 3px solid var(--brand); box-shadow: 0 3px 0 var(--brand-dark);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; text-decoration: none; color: var(--ink); z-index: 60; transition: transform .12s;
  }
  .home-btn:active { transform: scale(0.92); }
  .wrap { position: relative; z-index: 1; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
  .stage { position: relative; flex: 1 1 auto; min-height: 0; touch-action: none; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  h1 {
    position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; z-index: 3; text-align: center;
    font-family: 'Itim', cursive; font-weight: normal; margin: 0; pointer-events: none;
    font-size: clamp(26px, 5.5vw, 42px); color: var(--brand-dark); text-shadow: 3px 3px 0 #fff;
    transition: color .4s, text-shadow .4s;
  }
  h1.dark { color: var(--gold); text-shadow: 3px 3px 0 var(--brand-dark); }
  .ruler {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3;
    display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 15px; pointer-events: none;
    background: rgba(255,255,255,0.85); border-radius: 999px; padding: 3px 12px;
  }
  .ruler i { display: block; height: 8px; border: 3px solid var(--ink); border-top: 0; }
  .panel {
    flex: 0 0 auto; background: var(--card); border-top: 4px solid var(--card-border);
    border-radius: 26px 26px 0 0; box-shadow: 0 -4px 0 rgba(0,0,0,0.06);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
  }
  .card { display: flex; align-items: center; gap: 10px; cursor: pointer; min-height: 64px; max-width: 760px; margin: 0 auto; }
  .card .big { font-size: 40px; width: 52px; text-align: center; flex-shrink: 0; }
  .card .name { font-family: 'Itim', cursive; font-size: 28px; color: var(--brand-dark); line-height: 1.1; }
  .card .size { font-size: 18px; font-weight: 600; }
  .card .cmp { font-size: 15px; color: #6b7280; }
  .card .spk { margin-left: auto; font-size: 28px; flex-shrink: 0; }
  .ctrls { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .btn {
    min-width: 64px; min-height: 64px; border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; font-family: 'Mitr', sans-serif; font-size: 26px; font-weight: 700; color: var(--ink);
    box-shadow: 0 4px 0 rgba(0,0,0,0.15); cursor: pointer; padding: 0 16px; transition: transform .1s; touch-action: none;
  }
  .btn:active, .btn.held { transform: translateY(2px) scale(0.95); }
  .btn.main { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .dots { display: flex; justify-content: center; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .dots b { width: 8px; height: 8px; border-radius: 50%; background: #e3e7ec; }
  .dots b.on { background: var(--brand); transform: scale(1.4); }
  .dots b.seen { background: #ffc2d6; }
</style>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// ============================================================================
// THINGS — every size is a real measurement (sources in CREDITS / CLAUDE.md):
// L = the size we compare (metres), w × h = the drawing box, all at ONE scale.
// ============================================================================
const LY = 9.4607e15, AU = 1.496e11;
const IMG = {};
for (const id of ['moon', 'earth', 'jupiter', 'sun']) { const im = new Image(); im.src = '../solar-system/img/' + id + '.webp'; IMG[id] = im; }

const T = [
  { id: 'atom', e: '⚛️', name: 'อะตอมไฮโดรเจน', L: 1.06e-10, w: 1.06e-10, h: 1.06e-10, show: 'กว้างราว 0.1 นาโนเมตร', say: 'อะตอมไฮโดรเจน กว้างราว ศูนย์จุดหนึ่ง นาโนเมตร เล็กที่สุดในเกมนี้', draw: atom },
  { id: 'dna', e: '🧬', name: 'ดีเอ็นเอ', L: 2e-9, w: 2e-9, h: 1.4e-8, show: 'เส้นกว้างราว 2 นาโนเมตร', say: 'เส้นดีเอ็นเอ กว้างราว 2 นาโนเมตร', draw: dna },
  { id: 'virus', e: '🦠', name: 'ไวรัสไข้หวัดใหญ่', L: 1e-7, w: 1e-7, h: 1e-7, show: 'กว้างราว 0.1 ไมโครเมตร (80–120 นาโนเมตร)', say: 'ไวรัสไข้หวัดใหญ่ กว้างราว 100 นาโนเมตร', draw: virus },
  { id: 'bact', e: '🦠', name: 'แบคทีเรีย อีโคไล', L: 2e-6, w: 2e-6, h: 0.8e-6, show: 'ยาวราว 2 ไมโครเมตร', say: 'แบคทีเรียอีโคไล ยาวราว 2 ไมโครเมตร', draw: bacterium },
  { id: 'rbc', e: '🩸', name: 'เม็ดเลือดแดง', L: 7.5e-6, w: 7.5e-6, h: 7.5e-6, show: 'กว้างราว 7.5 ไมโครเมตร (6–8)', say: 'เม็ดเลือดแดง กว้างราว 7.5 ไมโครเมตร ในเลือดหนึ่งหยดมีหลายร้อยล้านเม็ด', draw: rbc },
  { id: 'hair', e: '💇', name: 'เส้นผม', L: 7e-5, w: 7e-5, h: 6e-4, show: 'หนาราว 0.07 มิลลิเมตร', say: 'เส้นผมหนาราว 0.07 มิลลิเมตร', draw: hair },
  { id: 'mite', e: '🔍', name: 'ไรฝุ่น', L: 3e-4, w: 3e-4, h: 2e-4, show: 'ยาวราว 0.3 มิลลิเมตร', say: 'ไรฝุ่น ยาวราว 0.3 มิลลิเมตร ตัวเล็กจนมองด้วยตาเปล่าแทบไม่เห็น', draw: mite },
  { id: 'ant', e: '🐜', name: 'มดแดง', L: 9e-3, w: 9e-3, h: 4.5e-3, show: 'ยาวราว 8–10 มิลลิเมตร (มดตัวใหญ่ในรัง)', say: 'มดแดง ยาวราว 1 เซนติเมตร', draw: emoji('🐜', 1.25, 0.25) },
  { id: 'kid', e: '🧍', name: 'เด็ก 7 ขวบ', L: 1.2, w: 0.45, h: 1.2, show: 'สูงราว 120 เซนติเมตร', say: 'เด็กเจ็ดขวบ สูงราว 120 เซนติเมตร', draw: kid },
  { id: 'ele', e: '🐘', name: 'ช้างเอเชีย', L: 2.7, w: 3.5, h: 2.7, show: 'สูงที่ไหล่ราว 2.4–2.7 เมตร', say: 'ช้างเอเชีย สูงที่ไหล่ราว 2.7 เมตร', draw: emoji('🐘', 1.25, -0.035) },
  { id: 'whale', e: '🐋', name: 'วาฬสีน้ำเงิน', L: 29.9, w: 29.9, h: 7, show: 'ยาวได้ถึงราว 30 เมตร สัตว์ใหญ่ที่สุดในโลก', say: 'วาฬสีน้ำเงิน ยาวได้ถึงราว 30 เมตร เป็นสัตว์ที่ใหญ่ที่สุดที่เคยมีมา', draw: whale },
  { id: 'mhn', e: '🏙️', name: 'ตึกมหานคร', L: 314, w: 55, h: 314, show: 'สูง 314 เมตร กรุงเทพฯ', say: 'ตึกมหานคร ในกรุงเทพ สูง 314 เมตร', draw: mahanakhon },
  { id: 'burj', e: '🏢', name: 'บุรจญ์เคาะลีฟะฮ์', L: 828, w: 110, h: 828, show: 'สูง 828 เมตร ตึกที่สูงที่สุดในโลก', say: 'บุรจญ์เคาะลีฟะฮ์ ที่ดูไบ สูง 828 เมตร เป็นตึกที่สูงที่สุดในโลก', draw: burj },
  { id: 'everest', e: '🏔️', name: 'ยอดเขาเอเวอเรสต์', L: 8849, w: 22000, h: 8849, show: 'สูง 8,849 เมตร จากระดับน้ำทะเล', say: 'ยอดเขาเอเวอเรสต์ สูง 8,849 เมตร เป็นยอดเขาที่สูงที่สุดในโลก', draw: everest },
  { id: 'moon', e: '🌙', name: 'ดวงจันทร์', L: 3.475e6, w: 3.475e6, h: 3.475e6, show: 'กว้าง 3,475 กิโลเมตร', say: 'ดวงจันทร์ กว้าง 3,475 กิโลเมตร', draw: sprite('moon', 1) },
  { id: 'earth', e: '🌏', name: 'โลก', L: 1.2756e7, w: 1.2756e7, h: 1.2756e7, show: 'กว้าง 12,756 กิโลเมตร', say: 'โลกของเรา กว้าง 12,756 กิโลเมตร', draw: sprite('earth', 1) },
  { id: 'jupiter', e: '🪐', name: 'ดาวพฤหัสบดี', L: 1.42984e8, w: 1.42984e8, h: 1.42984e8, show: 'กว้าง 142,984 กิโลเมตร ดาวเคราะห์ใหญ่ที่สุด', say: 'ดาวพฤหัสบดี กว้าง 142,984 กิโลเมตร ใหญ่ที่สุดในระบบสุริยะ ยกเว้นดวงอาทิตย์', draw: sprite('jupiter', 1) },
  { id: 'sun', e: '☀️', name: 'ดวงอาทิตย์', L: 1.3914e9, w: 1.3914e9, h: 1.3914e9, show: 'กว้างราว 1.39 ล้านกิโลเมตร', say: 'ดวงอาทิตย์ กว้างราว 1.39 ล้านกิโลเมตร ใส่โลกได้กว่า 1 ล้านใบ', draw: sprite('sun', 1) },
  { id: 'betel', e: '🔴', name: 'ดาวบีเทลจุส', L: 764 * 1.3914e9, w: 764 * 1.3914e9, h: 764 * 1.3914e9, show: 'ราว 760 เท่าของดวงอาทิตย์ (ค่าประมาณ)', say: 'ดาวบีเทลจุส ในกลุ่มดาวเต่า ใหญ่กว่าดวงอาทิตย์ราว 760 เท่า นักดาราศาสตร์ยังวัดได้ไม่ตรงกัน', draw: betelgeuse },
  { id: 'ss', e: '🌀', name: 'ระบบสุริยะ (ถึงดาวเนปจูน)', L: 60.1 * AU, w: 60.1 * AU, h: 60.1 * AU, show: 'กว้างราว 9,000 ล้านกิโลเมตร', say: 'วงโคจรของดาวเนปจูน กว้างราว 9,000 ล้านกิโลเมตร แสงต้องเดินทางกว่า 8 ชั่วโมง จึงข้ามจากฝั่งหนึ่งไปอีกฝั่งได้', draw: solar },
  { id: 'mw', e: '🌌', name: 'กาแล็กซีทางช้างเผือก', L: 1e5 * LY, w: 1e5 * LY, h: 1e5 * LY, show: 'กว้างราว 100,000 ปีแสง', say: 'กาแล็กซีทางช้างเผือก บ้านของเรา กว้างราว 1 แสนปีแสง มีดาวหลายแสนล้านดวง', draw: galaxy },
  { id: 'uni', e: '✨', name: 'จักรวาลที่มองเห็นได้', L: 9.3e10 * LY, w: 9.3e10 * LY, h: 9.3e10 * LY, show: 'กว้างราว 93,000 ล้านปีแสง', say: 'จักรวาลที่เรามองเห็นได้ กว้างราว 93,000 ล้านปีแสง ใหญ่ที่สุดในเกมนี้', draw: universe },
];
// lay everything out in a row on the same ground line, left = smallest
{
  let x = 0;
  for (const t of T) { t.x = x; x += t.w + Math.max(t.w * 0.35, 0); }
}
const N = T.length;

// ============================================================================
// DRAWINGS — (c, x, y, w, h): x,y = bottom-left on screen in px, w,h = box in px
// ============================================================================
function atom(c, x, y, w, h) {
  const cx = x + w / 2, cy = y - h / 2, r = w / 2;
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, 'rgba(120,170,255,0.75)'); g.addColorStop(1, 'rgba(120,170,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
  c.fillStyle = '#ff6b6b'; c.beginPath(); c.arc(cx, cy, Math.max(1, r * 0.06), 0, 7); c.fill();
  c.fillStyle = '#3a6fd8'; c.beginPath(); c.arc(cx + r * 0.55, cy - r * 0.3, Math.max(1, r * 0.05), 0, 7); c.fill();
}
function dna(c, x, y, w, h) {
  c.lineWidth = Math.max(1, w * 0.12);
  for (const [col, ph] of [['#ff6b9d', 0], ['#5bc0eb', Math.PI]]) {
    c.strokeStyle = col; c.beginPath();
    for (let k = 0; k <= 60; k++) { const u = k / 60; c.lineTo(x + w / 2 + Math.sin(u * 14 + ph) * w * 0.45, y - u * h); }
    c.stroke();
  }
  c.strokeStyle = '#b8c0c8'; c.lineWidth = Math.max(1, w * 0.06);
  for (let k = 0; k < 24; k++) { const u = (k + 0.5) / 24, s = Math.sin(u * 14) * w * 0.45; c.beginPath(); c.moveTo(x + w / 2 + s, y - u * h); c.lineTo(x + w / 2 - s, y - u * h); c.stroke(); }
}
function virus(c, x, y, w, h) {
  const cx = x + w / 2, cy = y - h / 2, r = w * 0.38;
  c.strokeStyle = '#8e44ad'; c.lineWidth = Math.max(1, r * 0.08);
  for (let k = 0; k < 18; k++) { const a = k / 18 * 6.283; c.beginPath(); c.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); c.lineTo(cx + Math.cos(a) * r * 1.3, cy + Math.sin(a) * r * 1.3); c.stroke(); }
  c.fillStyle = '#c39bd3'; c.beginPath(); c.arc(cx, cy, r, 0, 7); c.fill();
  c.strokeStyle = '#6c3483'; c.lineWidth = Math.max(1, r * 0.05); c.stroke();
}
function bacterium(c, x, y, w, h) {
  c.strokeStyle = '#3d8b3d'; c.lineWidth = Math.max(1, h * 0.04);
  for (let k = 0; k < 3; k++) { c.beginPath(); c.moveTo(x, y - h / 2); for (let u = 0; u <= 1; u += 0.05) c.lineTo(x - u * w * 0.8, y - h / 2 + Math.sin(u * 12 + k) * h * 0.25 + (k - 1) * h * 0.2); c.stroke(); }
  c.fillStyle = '#7ed957'; c.strokeStyle = '#3d8b3d'; c.lineWidth = Math.max(1, h * 0.06);
  c.beginPath(); c.roundRect(x, y - h, w, h, h / 2); c.fill(); c.stroke();
}
function rbc(c, x, y, w, h) {
  const cx = x + w / 2, cy = y - h / 2;
  const g = c.createRadialGradient(cx, cy, 0, cx, cy, w / 2);
  g.addColorStop(0, '#ff9a9a'); g.addColorStop(0.45, '#e74c3c'); g.addColorStop(1, '#a93226');
  c.fillStyle = g; c.beginPath(); c.arc(cx, cy, w / 2, 0, 7); c.fill();
}
function hair(c, x, y, w, h) {
  c.fillStyle = '#4a3020'; c.fillRect(x, y - h, w, h);
  c.fillStyle = 'rgba(255,255,255,0.18)'; c.fillRect(x + w * 0.2, y - h, w * 0.15, h);
}
function mite(c, x, y, w, h) {
  const cx = x + w / 2, cy = y - h * 0.5;
  c.strokeStyle = '#a0784a'; c.lineWidth = Math.max(1, w * 0.035);
  for (let k = 0; k < 4; k++) for (const s of [-1, 1]) {
    const bx = cx - w * 0.25 + k * w * 0.16;
    c.beginPath(); c.moveTo(bx, cy); c.lineTo(bx + s * w * 0.04, cy + h * 0.5); c.stroke();
  }
  c.fillStyle = '#e8d5b0'; c.strokeStyle = '#a0784a';
  c.beginPath(); c.ellipse(cx, cy - h * 0.05, w * 0.42, h * 0.38, 0, 0, 7); c.fill(); c.stroke();
}
function emoji(ch, scale, drop) {
  return (c, x, y, w, h) => {
    const s = Math.max(w, h) * scale;
    if (s > 4000) return;
    c.font = s + 'px sans-serif'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
    c.fillText(ch, x + w / 2, y + s * drop * 0.6);
  };
}
function kid(c, x, y, w, h) {
  const cx = x + w / 2, s = h / 120;
  c.lineCap = 'round';
  c.fillStyle = '#3d6fd8'; c.fillRect(cx - 9 * s, y - 52 * s, 7 * s, 52 * s); c.fillRect(cx + 2 * s, y - 52 * s, 7 * s, 52 * s);

  function track(w) {
