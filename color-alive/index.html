  .app {

  header { text-align: center; margin: 0 60px 8px; }

  .chip {
    font-family: 'Mitr', sans-serif; font-size: 20px; font-weight: 600;
    min-height: 64px; min-width: 64px; padding: 0 22px;

  .pcard {

  .pcard:active { transform: scale(.96); }

  .palette { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0 4px; }
  .sw {
    width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.2); transition: transform .12s;

  .done-btn {
    font-family: 'Mitr', sans-serif; font-size: 26px; font-weight: 700;
    min-height: 80px; width: 100%; margin-top: 12px; border-radius: 999px;
    border: 3px solid var(--brand-dark); background: var(--brand); color: #fff;
    box-shadow: 0 5px 0 var(--brand-dark); cursor: pointer;

  /* iPad landscape: colours + done button in a column beside the picture, so nothing needs scrolling */
  @media (orientation: landscape) and (min-width: 900px) {
    #paintScreen:not(.hidden) { display: grid; grid-template-columns: minmax(0, 1fr) 236px; gap: 16px; align-items: center; }

    #paintScreen .palette { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px; justify-content: center; margin: 0; }
    #worldScreen .view { max-width: calc((100dvh - 300px) * 1000 / 640); margin: 0 auto; }
    #worldScreen .done-btn { display: block; max-width: 520px; margin: 12px auto 0; }

  .pop { animation: pop .35s ease; transform-box: fill-box; transform-origin: center; }

  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }

function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);

const blip = (f) => tone(f, 0.12, 'sine', 0.1);
const boop = () => tone(220, 0.22, 'triangle', 0.12);

function speak(text) {

let lastTouchEnd = 0;

    'จิ๊บ จิ๊บ นกบินขึ้นไปเกาะกิ่งไม้', 'ปลากระโดดขึ้นมาจากน้ำ', 'แปร๊นนน ช้างชูงวงทักทาย', 'โฮ่ง โฮ่ง หมากระดิกหางดีใจ', 'เมี้ยว แมวชอบให้ลูบหัว'];
  for (const [, n] of PALETTE) L.push(n);

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
