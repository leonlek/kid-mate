<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>🪣 แตะเติมสี — คิดส์เล่น</title>
<meta name="description" content="เกมแตะเติมสี แตะช่องให้สีเต็มทันที ง่ายสำหรับเด็กเล็ก ฝึกรู้จักสีและส่วนต่างๆ ของภาพ">
<meta name="theme-color" content="#ff6b9d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="แตะเติมสี">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon-180.png">
<link rel="manifest" href="../manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Itim&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-3: #b5e8ff; --grass-1: #7ed957;
    --brand: #ff6b9d; --brand-dark: #e54b82;
    --gold: #ffd93d; --good: #5bc13a; --good-dark: #3fa024;
    --bad: #ff5757; --bad-dark: #d83838;
    --ink: #2d3436; --card: #ffffff; --card-border: #ffd6e4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Mitr', -apple-system, sans-serif;
    color: var(--ink);
    overflow-x: hidden;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 10%, #fff9c4 0%, transparent 50%),
      radial-gradient(ellipse at 85% 15%, #ffcfd2 0%, transparent 45%),
      linear-gradient(180deg, var(--sky-3) 0%, #d9f3c9 65%, var(--grass-1) 100%);
    background-attachment: fixed;
    user-select: none;
    -webkit-user-select: none;
  }
  body::before {
    content: '☁️ ☁️     ☁️';
    position: fixed; top: 20px; left: 0; right: 0;
    text-align: center; font-size: 42px;
    opacity: 0.55; pointer-events: none;
    letter-spacing: 80px;
    animation: drift 40s linear infinite;
    z-index: 0;
  }
  @keyframes drift {
    from { transform: translateX(-10%); }
    to { transform: translateX(10%); }
  }

  .app { max-width: 880px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
  body:has(#gameScreen.active) .app {
    max-width: 100%; padding: 0; height: 100vh; height: 100dvh;
  }
  body:has(#gameScreen.active)::before { display: none; }

  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hero { text-align: center; padding: 14px 10px 24px; }
  .hero h1 {
    font-family: 'Itim', cursive;
    font-size: clamp(42px, 9vw, 68px);
    margin: 0; color: var(--brand-dark);
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(0,0,0,0.08);
    letter-spacing: 1px;
  }
  .hero p {
    font-size: clamp(16px, 3.4vw, 22px);
    margin: 12px 0 0; color: #555; font-weight: 500;
  }

  .lgrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px; margin: 24px 0 32px;
  }
  .lcard {
    background: var(--card); border: 4px solid var(--card-border);
    border-radius: 24px; padding: 16px 14px 14px; text-align: center;
    cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,0.07);
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative; overflow: hidden;
  }
  .lcard:active { transform: scale(0.96) translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.07); }
  .lcard:hover { border-color: var(--brand); }
  .lcard svg.preview {
    width: 100%;
    height: 110px;
    display: block;
    margin: 0 auto 8px;
  }
  .lcard svg.preview path,
  .lcard svg.preview circle,
  .lcard svg.preview ellipse,
  .lcard svg.preview polygon,
  .lcard svg.preview rect {
    stroke: var(--brand-dark); stroke-width: 4; fill: #fff;
  }
  .lcard .ltitle {
    font-family: 'Itim', cursive; font-size: 24px;
    color: var(--brand-dark); text-shadow: 2px 2px 0 #fff;
  }
  /* Small inline category header inside the grid */
  .lgrid .cat-header {
    grid-column: 1 / -1;
    font-family: 'Itim', cursive;
    font-size: 18px;
    color: var(--brand-dark);
    margin: 10px 4px 0;
    text-shadow: 2px 2px 0 #fff;
    letter-spacing: 0.5px;
    font-weight: normal;
  }
  .lgrid .cat-header:first-child { margin-top: 0; }
  @media (max-width: 480px) {
    .lgrid .cat-header { font-size: 16px; margin: 6px 4px 0; }
  }

  .lvfilter { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin: 6px 0 0; }
  .lvchip {
    font-family: 'Mitr', sans-serif; font-size: 18px; font-weight: 500;
    min-height: 56px; min-width: 64px; padding: 0 18px;
    border-radius: 999px; border: 3px solid var(--card-border);
    background: #fff; color: var(--ink); cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08); transition: transform .12s;
  }
  .lvchip:active { transform: translateY(2px) scale(0.96); }
  .lvchip.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .lcard .stars { position: absolute; top: 8px; right: 10px; font-size: 13px; letter-spacing: 1px; }

  /* Game */
  #gameScreen.active {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .top-bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin: 12px 76px 0 76px;   /* leave space for home + back buttons */
    flex-wrap: nowrap;
  }
  .picture-title {
    font-family: 'Itim', cursive;
    font-size: clamp(20px, 3.6vw, 30px);
    color: var(--brand-dark);
    text-shadow: 2px 2px 0 #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
    flex: 0 1 auto;
  }
  .top-bar-buttons {
    display: flex; gap: 6px;
    flex-shrink: 0;
  }
  .icon-btn {
    background: #fff;
    border: 3px solid var(--card-border);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: 'Itim', cursive;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,0.08);
    transition: transform .12s, box-shadow .12s, opacity .12s;
    color: var(--ink);
  }
  .icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,0.08); }
  .icon-btn:disabled { opacity: 0.4; cursor: default; pointer-events: none; }
  .icon-btn .btn-label { display: inline; margin-left: 4px; }
  @media (max-width: 600px) {
    .icon-btn { padding: 8px 11px; font-size: 20px; }
    .icon-btn .btn-label { display: none; }
    .top-bar { margin: 8px 64px 0 64px; }
    .picture-title { font-size: 18px; }
  }

  .canvas-area {
    flex: 1 1 auto;
    display: flex; align-items: center; justify-content: center;
    padding: 12px;
    min-height: 0;
  }
  .canvas-stage {
    background: #fff;
    border: 4px solid #fff;
    border-radius: 28px;
    box-shadow: 0 6px 0 rgba(0,0,0,0.10);
    /* Square stage to fit the 800x800 viewBox */
    aspect-ratio: 1 / 1;
    width: min(100%, 540px, calc(100dvh - 240px));
    overflow: hidden;
    touch-action: none;
  }
  .canvas-stage svg {
    width: 100%; height: 100%;
    display: block;
  }
  .canvas-stage svg .region {
    cursor: pointer;
    transition: filter .15s;
  }
  .canvas-stage svg .region:active {
    filter: brightness(1.1);
  }
  .canvas-stage svg .outline {
    fill: none;
    stroke: #2d3436;
    stroke-width: 6;
    stroke-linejoin: round;
    pointer-events: none;
  }

  /* ====================================================================
     Picture completion animations — when kid colors every region the
     finished picture comes to life briefly. Each picture picks one anim
     name (see PICTURE_META). Origin tweaks let things rotate/scale around
     a sensible pivot (feet for bouncing animals, center for spinners).
     ==================================================================== */
  .canvas-stage svg { transform-origin: 50% 80%; }

  .canvas-stage svg.anim-fly { animation: anim-fly 2.4s cubic-bezier(.5,.1,.7,.4) forwards; }
  @keyframes anim-fly {
    0%   { transform: translate(0,0) rotate(0) scale(1); }
    100% { transform: translate(120%, -130%) rotate(35deg) scale(.5); }
  }

  .canvas-stage svg.anim-swim { animation: anim-swim 2.2s ease-in-out; }
  @keyframes anim-swim {
    0%, 100% { transform: translate(0,0) rotate(0); }
    20% { transform: translate(-12%, -4%) rotate(-6deg); }
    50% { transform: translate(15%, 3%) rotate(8deg); }
    80% { transform: translate(-8%, 5%) rotate(-4deg); }
  }

  .canvas-stage svg.anim-drive { animation: anim-drive 2.2s ease-in forwards; }
  @keyframes anim-drive {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-3%); }
    100% { transform: translateX(170%); }
  }

  .canvas-stage svg.anim-launch { animation: anim-launch 2.4s cubic-bezier(.4,0,.7,.3) forwards; }
  @keyframes anim-launch {
    0%   { transform: translateY(0); }
    15%  { transform: translateY(2%); }
    100% { transform: translateY(-170%); }
  }

  .canvas-stage svg.anim-bounce { animation: anim-bounce 1.8s ease-in-out; transform-origin: 50% 95%; }
  @keyframes anim-bounce {
    0%, 100% { transform: translateY(0) scaleY(1); }
    20%  { transform: translateY(0) scaleY(.86); }
    40%  { transform: translateY(-15%) scaleY(1.08); }
    60%  { transform: translateY(0) scaleY(.92); }
    80%  { transform: translateY(-7%) scaleY(1.04); }
  }

  .canvas-stage svg.anim-hop { animation: anim-hop 1.8s ease-out; transform-origin: 50% 95%; }
  @keyframes anim-hop {
    0%, 50%, 100% { transform: translateY(0); }
    25% { transform: translateY(-22%); }
    75% { transform: translateY(-14%); }
  }

  .canvas-stage svg.anim-spin { animation: anim-spin 2s linear; transform-origin: 50% 50%; }
  @keyframes anim-spin { to { transform: rotate(360deg); } }

  .canvas-stage svg.anim-glow { animation: anim-glow 2.5s ease-in-out; transform-origin: 50% 50%; }
  @keyframes anim-glow {
    0%, 100% { filter: drop-shadow(0 0 0 transparent); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 24px var(--gold)) drop-shadow(0 0 50px var(--brand)); transform: scale(1.06); }
  }

  .canvas-stage svg.anim-wiggle { animation: anim-wiggle 2s ease-in-out; transform-origin: 50% 90%; }
  @keyframes anim-wiggle {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-5deg) translateY(-2%); }
    40% { transform: rotate(5deg); }
    60% { transform: rotate(-3deg); }
    80% { transform: rotate(3deg); }
  }

  .canvas-stage svg.anim-sway { animation: anim-sway 2.2s ease-in-out; transform-origin: 50% 95%; }
  @keyframes anim-sway {
    0%, 100% { transform: translateX(0) rotate(0); }
    25% { transform: translateX(-5%) rotate(-3deg); }
    50% { transform: translateX(5%) rotate(3deg); }
    75% { transform: translateX(-3%) rotate(-2deg); }
  }

  .canvas-stage svg.anim-shimmer { animation: anim-shimmer 2.5s ease-in-out; transform-origin: 50% 50%; }
  @keyframes anim-shimmer {
    0%, 100% { filter: brightness(1) saturate(1); transform: scale(1); }
    25% { filter: brightness(1.15) saturate(1.4) hue-rotate(20deg); transform: scale(1.03); }
    50% { filter: brightness(1.3) saturate(1.6) hue-rotate(-20deg); transform: scale(1.05); }
    75% { filter: brightness(1.15) saturate(1.4) hue-rotate(10deg); transform: scale(1.03); }
  }

  .canvas-stage svg.anim-waddle { animation: anim-waddle 2s ease-in-out; transform-origin: 50% 95%; }
  @keyframes anim-waddle {
    0%, 100% { transform: rotate(0) translateX(0); }
    25% { transform: rotate(-6deg) translateX(-4%); }
    50% { transform: rotate(0) translateX(0); }
    75% { transform: rotate(6deg) translateX(4%); }
  }

  .palette {
    flex: 0 0 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 12px 14px env(safe-area-inset-bottom);
    flex-wrap: wrap;
  }
  .swatch {
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 4px solid #fff;
    box-shadow: 0 4px 0 rgba(0,0,0,0.18);
    cursor: pointer;
    transition: transform .12s, box-shadow .12s;
    position: relative;
  }
  .swatch:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.18); }
  .swatch.active {
    border-color: var(--gold);
    transform: scale(1.12);
    box-shadow: 0 6px 0 rgba(0,0,0,0.18), 0 0 0 4px var(--gold);
  }
  .swatch.eraser {
    background:
      linear-gradient(45deg, #fff 25%, #ddd 25%, #ddd 50%, #fff 50%, #fff 75%, #ddd 75%);
    background-size: 14px 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
  }

  /* Big banner overlay */
  .overlay-msg {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    pointer-events: none; z-index: 100;
    font-family: 'Itim', cursive; color: #fff; text-align: center;
  }
  .overlay-msg.shown { display: flex; }
  .overlay-msg .msg {
    background: var(--brand); border: 4px solid #fff; border-radius: 32px;
    padding: 28px 48px; font-size: clamp(40px, 7.5vw, 70px); line-height: 1.1;
    box-shadow: 0 8px 0 rgba(0,0,0,0.18);
    animation: msgPop .5s cubic-bezier(0.34, 1.56, 0.64, 1);
    text-shadow: 3px 3px 0 var(--brand-dark);
    max-width: 90vw;
  }
  .overlay-msg .msg.win {
    background: var(--gold); color: var(--ink);
    text-shadow: 3px 3px 0 #fff, 4px 4px 0 rgba(0,0,0,0.15);
  }
  @keyframes msgPop {
    0%   { transform: scale(0.4) rotate(-6deg); opacity: 0; }
    60%  { transform: scale(1.1) rotate(2deg); opacity: 1; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  .confetti {
    position: fixed; top: -20px;
    width: 12px; height: 18px;
    z-index: 90; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  .home-btn, .back-btn {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    width: 52px; height: 52px;
    border-radius: 50%;
    background: #fff; border: 3px solid var(--brand);
    box-shadow: 0 3px 0 var(--brand-dark);
    align-items: center; justify-content: center;
    font-size: 24px; text-decoration: none; color: var(--ink);
    z-index: 60;
    transition: transform .12s;
    font-family: inherit; padding: 0; cursor: pointer;
  }
  .home-btn { left: 12px; display: flex; font-size: 26px; }
  .back-btn { right: 12px; display: none; }
  .back-btn.show { display: flex; }
  .home-btn:active, .back-btn:active { transform: scale(0.92); }

  .howto {
    list-style: none; padding: 12px 18px; margin: 8px auto 14px;
    max-width: 360px; background: rgba(255,255,255,0.55);
    border: 2px dashed var(--card-border); border-radius: 18px;
    font-size: 16px; color: #555; font-weight: 500; text-align: left;
  }
  .howto li { display: flex; align-items: center; gap: 10px; padding: 3px 0; line-height: 1.3; }
  .howto-icon { font-size: 22px; flex-shrink: 0; width: 28px; text-align: center; }
  @media (min-width: 768px) { .howto { font-size: 18px; max-width: 440px; } .howto-icon { font-size: 26px; } }

  @media (min-width: 768px) {
    .lgrid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .swatch { width: 64px; height: 64px; }
    .palette { gap: 14px; }
  }
  @media (min-width: 1024px) {
    .lgrid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 480px) {
    .swatch { width: 44px; height: 44px; border-width: 3px; }
    .palette { gap: 8px; padding: 8px 10px env(safe-area-inset-bottom); }
    .top-bar { margin: 8px 70px 0 70px; }
    .canvas-area { padding: 8px; }
    .lcard svg.preview { height: 90px; }
    .lcard .ltitle { font-size: 20px; }
  }
</style>
</head>
<body>
<a class="home-btn" href="../" aria-label="กลับหน้าหลัก">🏠</a>
<button class="back-btn" id="backBtn" type="button" aria-label="เลือกรูปใหม่">📋</button>
<div class="app">

  <section id="selectScreen" class="screen active">
    <header class="hero">
      <h1>🪣 แตะเติมสี</h1>
      <ul class="howto">
        <li><span class="howto-icon">🖼️</span> เลือกรูปที่อยากระบาย</li>
        <li><span class="howto-icon">🎨</span> แตะสีจากจานด้านล่าง</li>
        <li><span class="howto-icon">👆</span> แตะบนรูปเพื่อระบาย</li>
      </ul>
    </header>
    <div id="levelFilter" class="lvfilter" role="tablist"></div>
    <div id="levelGrid" class="lgrid"></div>
  </section>

  <section id="gameScreen" class="screen">
    <div class="top-bar">
      <div class="picture-title" id="pictureTitle">รูป</div>
      <div class="top-bar-buttons">
        <button class="icon-btn" id="undoBtn" disabled aria-label="ย้อนคืน"><span aria-hidden="true">↩️</span><span class="btn-label">ย้อน</span></button>
        <button class="icon-btn" id="resetBtn" aria-label="ล้างทั้งหมด"><span aria-hidden="true">🧽</span><span class="btn-label">ล้าง</span></button>
        <button class="icon-btn" id="saveBtn" aria-label="บันทึกรูป"><span aria-hidden="true">💾</span><span class="btn-label">บันทึก</span></button>
        <button class="icon-btn" id="doneBtn" aria-label="เสร็จ"><span aria-hidden="true">✓</span><span class="btn-label">เสร็จ</span></button>
      </div>
    </div>
    <div class="canvas-area">
      <div class="canvas-stage" id="canvasStage">
        <svg id="paintSvg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">
          <g id="regionsGroup"></g>
          <g id="outlineGroup"></g>
        </svg>
      </div>
    </div>
    <div class="palette" id="palette"></div>
  </section>

</div>

<div id="overlayMsg" class="overlay-msg"></div>

<script src="pictures.js"></script>
<script>
'use strict';

// ============================================================================
// PALETTE — 9 colors + eraser
// ============================================================================
const COLORS = [
  '#ff6b9d',  // pink
  '#e74c3c',  // red
  '#ff914d',  // orange
  '#f1c40f',  // yellow
  '#7ed957',  // green
  '#5bc0eb',  // light blue
  '#3498db',  // blue
  '#1e3a8a',  // navy
  '#9b59b6',  // purple
  '#a0522d',  // brown
  '#2c3e50',  // dark
  '#f8c8a0',  // skin
  '#95a5a6',  // grey
  '#16a085',  // teal
];

const ANIM_MS = {
  fly: 2400, swim: 2200, drive: 2200, launch: 2400,
  bounce: 1800, hop: 1800, spin: 2000, glow: 2500,
  wiggle: 2000, sway: 2200, shimmer: 2500, waddle: 2000,
};

const PROGRESS_KEY = 'coloringProgress';

// ============================================================================
// STATE
// ============================================================================
const state = {
  picture: null,
  currentColor: COLORS[0],
  fills: {},          // regionId -> color
  history: [],        // [{ regionId, prev, next }] for undo
  drawing: false,
  pointerId: null,
  pendingTimers: [],
  completionPlayed: false,
};

// ============================================================================
// AUDIO — soft "tap" sound when painting
// ============================================================================
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
}
function playPaintTone(idx) {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.value = 380 + (idx % 8) * 60;
  o.connect(g).connect(audioCtx.destination);
  const t = audioCtx.currentTime, d = 0.08;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.10, t + 0.005);
  g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
function playWin() {
  [523, 659, 784].forEach((f,i) => setTimeout(() => {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    o.connect(g).connect(audioCtx.destination);
    const t = audioCtx.currentTime, d = 0.22;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.18, t + 0.01);
    g.gain.linearRampToValueAtTime(0, t + d);
    o.start(t); o.stop(t + d + 0.02);
  }, i * 110));
}

// ============================================================================
// DOM
// ============================================================================
const $ = (id) => document.getElementById(id);
const screens = {
  select:  $('selectScreen'),
  game:    $('gameScreen'),
};
const levelGrid    = $('levelGrid');
const palette      = $('palette');
const overlay      = $('overlayMsg');
const regionsGroup = $('regionsGroup');
const outlineGroup = $('outlineGroup');
const pictureTitle = $('pictureTitle');

// ============================================================================
// UTIL
// ============================================================================
function buzz(p) { if (navigator.vibrate) navigator.vibrate(p); }
function showScreen(name) {
  for (const k of Object.keys(screens)) screens[k].classList.toggle('active', k===name);
  document.getElementById('backBtn').classList.toggle('show', name === 'game');
}
function later(fn, ms) {
  const id = setTimeout(fn, ms);
  state.pendingTimers.push(id);
  return id;
}

// ============================================================================
// SELECT
// ============================================================================
let levelFilter = 0; // 0 = all, 1..3 = star level
function renderFilter() {
  const box = $('levelFilter');
  box.innerHTML = '';
  [[0, 'ทั้งหมด'], [1, '⭐'], [2, '⭐⭐'], [3, '⭐⭐⭐']].forEach(([lv, label]) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'lvchip' + (levelFilter === lv ? ' on' : '');
    b.textContent = label;
    b.addEventListener('click', () => { levelFilter = lv; buzz(8); renderFilter(); renderSelect(); });
    box.appendChild(b);
  });
}
function renderSelect() {
  levelGrid.innerHTML = '';
  for (const cat of CATEGORIES) {
    const picsInCat = PICTURES.filter(p => {
      const m = PICTURE_META[p.id] || {};
      return m.category === cat.id && (!levelFilter || m.level === levelFilter);
    });
    if (picsInCat.length === 0) continue;
    const h = document.createElement('h3');
    h.className = 'cat-header';
    h.textContent = cat.label;
    levelGrid.appendChild(h);
    for (const pic of picsInCat) {
      const c = document.createElement('div');
      c.className = 'lcard';
      const previewSvg = buildPreviewSvg(pic);
      const lv = (PICTURE_META[pic.id] || {}).level || 1;
      c.innerHTML = `
        <div class="stars" aria-hidden="true">${'⭐'.repeat(lv)}</div>
        ${previewSvg}
        <div class="ltitle">${pic.name}</div>
      `;
      c.addEventListener('click', () => { ensureAudio(); openPicture(pic); });
      levelGrid.appendChild(c);
    }
  }
}
function buildPreviewSvg(pic) {
  // Simplified — render all regions as outline-only
  const parts = pic.regions.map(r => regionSvg(r, true));
  return `<svg class="preview" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid meet">${parts.join('')}</svg>`;
}

function regionSvg(r, outlineOnly) {
  const fill = outlineOnly ? 'none' : (r.fill || '#fff');
  const stroke = outlineOnly ? '#e54b82' : '#2d3436';
  const sw = outlineOnly ? 4 : (r.strokeWidth || 6);
  const common = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;
  if (r.shape === 'circle') return `<circle cx="${r.cx}" cy="${r.cy}" r="${r.r}" ${common} />`;
  if (r.shape === 'ellipse') return `<ellipse cx="${r.cx}" cy="${r.cy}" rx="${r.rx}" ry="${r.ry}" ${common} />`;
  if (r.shape === 'rect') return `<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.rx || 0}" ${common} />`;
  if (r.shape === 'path') return `<path d="${r.d}" ${common} />`;
  return '';
}

// ============================================================================
// PAINT
// ============================================================================
function openPicture(pic) {
  state.picture = pic;
  state.fills = {};
  state.history = [];
  state.drawing = false;
  state.completionPlayed = false;
  pictureTitle.textContent = pic.name;
  const svgEl = document.getElementById('paintSvg');
  if (svgEl) clearAnimClasses(svgEl);
  buildCanvas();
  updateUndoBtn();
  showScreen('game');
}

function clearAnimClasses(svgEl) {
  for (const cls of Array.from(svgEl.classList)) {
    if (cls.startsWith('anim-')) svgEl.classList.remove(cls);
  }
}

function playPictureAnim(force) {
  if (state.completionPlayed && !force) return;
  state.completionPlayed = true;
  const pic = state.picture;
  if (!pic) return;
  const meta = PICTURE_META[pic.id] || {};
  const animKey = meta.anim || 'glow';
  const svgEl = document.getElementById('paintSvg');
  if (!svgEl) return;
  const cls = 'anim-' + animKey;
  clearAnimClasses(svgEl);
  void svgEl.offsetWidth;
  svgEl.classList.add(cls);
  const ms = ANIM_MS[animKey] || 2200;
  later(() => {
    flashOverlay('ครบแล้ว! เก่งมาก! 🌟', 1500, 'win');
    playWin();
    celebrate(160);
    saveProgress();
    buzz([40, 30, 60]);
  }, Math.max(0, ms - 300));
  // Keep "drive/launch/fly" anims at their end state so the picture stays
  // offscreen — for everything else clear the class so the picture returns.
  const isExit = (animKey === 'drive' || animKey === 'launch' || animKey === 'fly');
  if (!isExit) {
    later(() => { if (svgEl) svgEl.classList.remove(cls); }, ms + 60);
  }
}

function updateUndoBtn() {
  const btn = document.getElementById('undoBtn');
  if (btn) btn.disabled = state.history.length === 0;
}

function buildCanvas() {
  regionsGroup.innerHTML = '';
  outlineGroup.innerHTML = '';
  // One element per region (fill + its own outline), drawn back→front, so a
  // region in front hides the outline of the one behind it.
  for (const r of state.picture.regions) {
    const el = createSvgEl(r);
    el.setAttribute('stroke-linejoin', 'round');
    el.setAttribute('stroke-linecap', 'round');
    if (r.noClick) {
      // Details (eyes, lines) — not paintable
      el.setAttribute('fill', r.fill || 'none');
      el.setAttribute('stroke', r.stroke || '#2d3436');
      el.setAttribute('stroke-width', r.strokeWidth || 6);
      el.style.pointerEvents = 'none';
      regionsGroup.appendChild(el);
      continue;
    }
    el.classList.add('region');
    el.dataset.regionId = r.id;
    el.setAttribute('fill', state.fills[r.id] || '#fff');
    el.setAttribute('stroke', '#2d3436');
    el.setAttribute('stroke-width', r.strokeWidth || 6);
    el.addEventListener('pointerdown', (e) => onRegionPointer(e, r.id));
    el.addEventListener('pointerenter', (e) => {
      if (state.drawing && state.pointerId === e.pointerId) paintRegion(r.id);
    });
    regionsGroup.appendChild(el);
  }
}
function createSvgEl(r) {
  const ns = 'http://www.w3.org/2000/svg';
  let el;
  if (r.shape === 'circle') {
    el = document.createElementNS(ns, 'circle');
    el.setAttribute('cx', r.cx); el.setAttribute('cy', r.cy); el.setAttribute('r', r.r);
  } else if (r.shape === 'ellipse') {
    el = document.createElementNS(ns, 'ellipse');
    el.setAttribute('cx', r.cx); el.setAttribute('cy', r.cy);
    el.setAttribute('rx', r.rx); el.setAttribute('ry', r.ry);
  } else if (r.shape === 'rect') {
    el = document.createElementNS(ns, 'rect');
    el.setAttribute('x', r.x); el.setAttribute('y', r.y);
    el.setAttribute('width', r.w); el.setAttribute('height', r.h);
    if (r.rx) el.setAttribute('rx', r.rx);
  } else {
    el = document.createElementNS(ns, 'path');
    el.setAttribute('d', r.d);
  }
  return el;
}

function onRegionPointer(e, regionId) {
  e.preventDefault();
  state.drawing = true;
  state.pointerId = e.pointerId;
  paintRegion(regionId);
}

function paintRegion(regionId) {
  const fill = state.currentColor === '__erase__' ? '#fff' : state.currentColor;
  const prev = state.fills[regionId] || '#fff';
  if (prev === fill) return;
  state.history.push({ regionId, prev, next: fill });
  if (state.history.length > 200) state.history.shift(); // cap history
  state.fills[regionId] = fill;
  const el = regionsGroup.querySelector(`[data-region-id="${regionId}"]`);
  if (el) el.setAttribute('fill', fill);
  buzz(8);
  playPaintTone(Object.keys(state.fills).length);
  updateUndoBtn();

  // Did this stroke complete the whole picture? Auto-play the reward anim.
  const total = state.picture.regions.filter(r => !r.noClick).length;
  const filledCount = Object.values(state.fills).filter(c => c && c !== '#fff').length;
  if (filledCount === total) {
    if (!state.completionPlayed) later(() => playPictureAnim(false), 200);
  } else {
    state.completionPlayed = false;
  }
}

document.addEventListener('pointerup', () => {
  state.drawing = false;
  state.pointerId = null;
});
document.addEventListener('pointercancel', () => {
  state.drawing = false;
  state.pointerId = null;
});

// ============================================================================
// PALETTE
// ============================================================================
function renderPalette() {
  palette.innerHTML = '';
  for (let i = 0; i < COLORS.length; i++) {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' active' : '');
    sw.style.background = COLORS[i];
    sw.dataset.color = COLORS[i];
    sw.addEventListener('click', () => selectColor(COLORS[i], sw));
    palette.appendChild(sw);
  }
  // Eraser
  const er = document.createElement('div');
  er.className = 'swatch eraser';
  er.textContent = '🧽';
  er.dataset.color = '__erase__';
  er.addEventListener('click', () => selectColor('__erase__', er));
  palette.appendChild(er);
}

function selectColor(color, el) {
  state.currentColor = color;
  for (const s of palette.querySelectorAll('.swatch')) s.classList.remove('active');
  el.classList.add('active');
}

// ============================================================================
// BUTTONS
// ============================================================================
$('backBtn').addEventListener('click', () => {
  if (overlay) { overlay.classList.remove('shown'); overlay.innerHTML = ''; }
  renderSelect();
  showScreen('select');
});

$('resetBtn').addEventListener('click', () => {
  state.fills = {};
  state.history = [];
  state.completionPlayed = false;
  for (const el of regionsGroup.querySelectorAll('.region')) el.setAttribute('fill', '#fff');
  const svgEl = document.getElementById('paintSvg');
  if (svgEl) clearAnimClasses(svgEl);
  buzz(20);
  updateUndoBtn();
});

$('undoBtn').addEventListener('click', () => {
  const last = state.history.pop();
  if (!last) { updateUndoBtn(); return; }
  if (last.prev === '#fff') delete state.fills[last.regionId];
  else state.fills[last.regionId] = last.prev;
  const el = regionsGroup.querySelector(`[data-region-id="${last.regionId}"]`);
  if (el) el.setAttribute('fill', last.prev);
  buzz(12);
  state.completionPlayed = false;
  const svgEl = document.getElementById('paintSvg');
  if (svgEl) clearAnimClasses(svgEl);
  updateUndoBtn();
});

$('saveBtn').addEventListener('click', () => savePng());

function savePng() {
  if (!state.picture) return;
  const svgEl = document.getElementById('paintSvg');
  if (!svgEl) return;
  // Clone and ensure a white background
  const ns = 'http://www.w3.org/2000/svg';
  const clone = svgEl.cloneNode(true);
  clone.setAttribute('xmlns', ns);
  const bg = document.createElementNS(ns, 'rect');
  bg.setAttribute('x', '0'); bg.setAttribute('y', '0');
  bg.setAttribute('width', '800'); bg.setAttribute('height', '800');
  bg.setAttribute('fill', '#ffffff');
  clone.insertBefore(bg, clone.firstChild);
  const xml = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const SIZE = 1600;
    const canvas = document.createElement('canvas');
    canvas.width = SIZE; canvas.height = SIZE;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.drawImage(img, 0, 0, SIZE, SIZE);
    URL.revokeObjectURL(url);
    exportImage(canvas, `regaiy-see-${state.picture.id}.png`);
  };
  img.onerror = () => { flashOverlay('บันทึกไม่ได้ 😢', 1200); URL.revokeObjectURL(url); };
  img.src = url;
}
// Save that works on iPad: hand the PNG to the share sheet ("Save Image" → Photos),
// falling back to a direct download where sharing files isn't supported.
function exportImage(cvs, filename) {
  let url;
  try { url = cvs.toDataURL('image/png'); } catch (e) { flashOverlay('บันทึกไม่ได้ 😢', 1200); return; }
  let file = null;
  try {
    const arr = url.split(','), mime = (arr[0].match(/:(.*?);/) || [])[1] || 'image/png';
    const bstr = atob(arr[1]); let n = bstr.length; const u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    file = new File([u8], filename, { type: mime });
  } catch (e) {}
  const done = () => { flashOverlay('บันทึกแล้ว! 💾', 1100, 'win'); buzz([30, 20, 30]); };
  if (file && navigator.canShare && navigator.canShare({ files: [file] }) && navigator.share) {
    navigator.share({ files: [file] }).then(done, (err) => {
      if (err && err.name === 'AbortError') return;
      dlURL(url, filename); done();
    });
    return;
  }
  dlURL(url, filename); done();
}
function dlURL(url, filename) {
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
}

$('doneBtn').addEventListener('click', () => {
  const filledCount = Object.values(state.fills).filter(c => c && c !== '#fff').length;
  const total = state.picture.regions.filter(r => !r.noClick).length;
  if (filledCount === 0) {
    flashOverlay('ลองระบายเลย!', 1400, '');
    return;
  }
  if (filledCount < total) {
    flashOverlay('สวยจังเลย! 🎨', 1400, 'win');
    playWin();
    celebrate(70);
    saveProgress();
    return;
  }
  // Fully complete — replay the picture's reward animation.
  playPictureAnim(true);
});

function flashOverlay(text, ms, extra) {
  overlay.classList.add('shown');
  overlay.innerHTML = `<div class="msg ${extra || ''}">${text}</div>`;
  setTimeout(() => { overlay.classList.remove('shown'); overlay.innerHTML = ''; }, ms);
}

function celebrate(n) {
  const colors = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#ff914d', '#b388ff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (2 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 0.8 + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    if (Math.random() > 0.5) c.style.borderRadius = '50%';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 5000);
  }
}

// ============================================================================
// PERSISTENCE — track which pictures kid has finished
// ============================================================================
function saveProgress() {
  if (!state.picture) return;
  let progress = {};
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (raw) progress = JSON.parse(raw);
  } catch (e) {}
  progress[state.picture.id] = (progress[state.picture.id] || 0) + 1;
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}

// ============================================================================
// EVENTS
// ============================================================================
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

// Init
renderPalette();
renderFilter();
renderSelect();
</script>
<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
