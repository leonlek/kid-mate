<script>
'use strict';
const $ = (id) => document.getElementById(id);
const scene = $('scene'), scene2 = $('scene2'), ctrls = $('ctrls'), panel = $('panel');
const MONTHS = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const MSHORT = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
const WDAYS = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
let mode = 'tonight';

function starfield(seed, n, w = 1000, h = 700) {
  let s = '', x = seed;
  const rnd = () => (x = (x * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) s += `<circle cx="${(rnd() * w).toFixed(0)}" cy="${(rnd() * h).toFixed(0)}" r="${(0.8 + rnd() * 1.8).toFixed(1)}" fill="#fff" opacity="${(0.25 + rnd() * 0.55).toFixed(2)}"/>`;
  return s;
}
function svgPt(svg, ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
let uidN = 0;
const uid = () => 'u' + (++uidN);

// ---- the Moon's face ----
// img/nearside.webp = the real near side (tools/gen_moon_sprites.sh). The dark part
// keeps a faint image: earthshine. e = 0 new → π full → 2π; waxing lights the RIGHT
// side (as seen from Thailand, north up).
function litPath(e, R) {
  const k = (1 - Math.cos(e)) / 2, waxing = ((e % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) < Math.PI;
  if (k < 0.006) return null;
  if (k > 0.994) return 'full';
  const rx = (Math.abs(1 - 2 * k) * R).toFixed(1), cres = k < 0.5;
  return waxing
    ? `M 0 ${-R} A ${R} ${R} 0 0 1 0 ${R} A ${rx} ${R} 0 0 ${cres ? 0 : 1} 0 ${-R} Z`
    : `M 0 ${-R} A ${R} ${R} 0 0 0 0 ${R} A ${rx} ${R} 0 0 ${cres ? 1 : 0} 0 ${-R} Z`;
}
function moonFace(R, opt = '') {
  return `<image href="img/nearside.webp" x="${-R}" y="${-R}" width="${2 * R}" height="${2 * R}" ${opt}/>`;
}
function moonDisc(R, e) {
  const d = litPath(e, R), id = uid();
  let s = `<circle r="${R}" fill="#151830"/>` + moonFace(R, 'opacity=".14"');
  if (d === 'full') s += moonFace(R);
  else if (d) s += `<clipPath id="${id}"><path d="${d}"/></clipPath>` + moonFace(R, `clip-path="url(#${id})"`);
  return s;
}

// ============================================================================
// 🔭 TONIGHT — the real phase for any date. New/full moon instants from Meeus,
// Astronomical Algorithms ch. 49 (main periodic terms, good to a few minutes).
// Thai lunar days are counted from the day of the true new moon (Thai time); the
// official Thai calendar is computed differently and can be a day off — the card says so.
// ============================================================================
const SYN = 29.530588861, DAY = 864e5;
const jdOf = (ms) => ms / DAY + 2440587.5, msOf = (jd) => (jd - 2440587.5) * DAY;
const rad = (d) => d * Math.PI / 180;
function phaseJDE(k, full) {
  const kk = k + (full ? 0.5 : 0), T = kk / 1236.85, E = 1 - 0.002516 * T;
  const M = rad(2.5534 + 29.1053567 * kk), Mp = rad(201.5643 + 385.81693528 * kk), F = rad(160.7108 + 390.67050284 * kk), O = rad(124.7746 - 1.56375588 * kk);
  const S = Math.sin;
  let jd = 2451550.09766 + 29.530588861 * kk + 0.00015437 * T * T;
  jd += (full ? -0.40614 : -0.40720) * S(Mp) + (full ? 0.17302 : 0.17241) * E * S(M) + (full ? 0.01614 : 0.01608) * S(2 * Mp)
    + (full ? 0.01043 : 0.01039) * S(2 * F) + (full ? 0.00734 : 0.00739) * E * S(Mp - M) - (full ? 0.00515 : 0.00514) * E * S(Mp + M)
    + (full ? 0.00209 : 0.00208) * E * E * S(2 * M) - 0.00111 * S(Mp - 2 * F) - 0.00057 * S(Mp + 2 * F) + 0.00056 * E * S(2 * Mp + M)
    - 0.00042 * S(3 * Mp) + 0.00042 * E * S(M + 2 * F) + 0.00038 * E * S(M - 2 * F) - 0.00024 * E * S(2 * Mp - M) - 0.00017 * S(O);
  return jd;
}
function lunation(ms) {
  const jd = jdOf(ms);
  let k = Math.floor((jd - 2451550.09766) / SYN), a = phaseJDE(k, false);
  while (a > jd) { k--; a = phaseJDE(k, false); }
  let b = phaseJDE(k + 1, false);
  while (b <= jd) { k++; a = b; b = phaseJDE(k + 1, false); }
  return { k, prev: msOf(a), next: msOf(b), full: msOf(phaseJDE(k, true)) };
}
const dayIdx = (ms) => Math.floor(ms / DAY + 7 / 24);            // Thai calendar day number
const eveMs = (di) => (di - 7 / 24 + 20 / 24) * DAY;            // 8 pm Thai time that day
const today = dayIdx(Date.now());
let selDay = today;
function thDate(di, short) {
  const d = new Date(di * DAY);                                  // UTC fields = the Thai date
  return short ? d.getUTCDate() + ' ' + MSHORT[d.getUTCMonth()]
    : 'วัน' + WDAYS[d.getUTCDay()] + 'ที่ ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543);
}
function timeTH(h) {
  if (h === 0) return 'เที่ยงคืน';
  if (h < 6) return 'ตี ' + h;
  if (h < 12) return h + ' โมงเช้า';
  if (h === 12) return 'เที่ยงวัน';
  if (h === 13) return 'บ่ายโมง';
  if (h < 16) return 'บ่าย ' + (h - 12) + ' โมง';
  if (h < 19) return (h - 12) + ' โมงเย็น';
  return (h - 18) + ' ทุ่ม';
}
const PH_NAMES = ['คืนเดือนเพ็ญ', 'เดือนดับ'];
for (let i = 1; i <= 15; i++) PH_NAMES.push('ขึ้น ' + i + ' ค่ำ', 'แรม ' + i + ' ค่ำ');
function moonInfo(di) {
  const ms = eveMs(di), L = lunation(ms);
  const f = (ms - L.prev) / (L.next - L.prev), e = 2 * Math.PI * f;
  const n = di - dayIdx(L.prev), newDay = dayIdx(L.next), fullDay = dayIdx(L.full);
  const nextFull = fullDay >= di ? fullDay : dayIdx(msOf(phaseJDE(L.k + 1, true)));
  const isFull = di === fullDay, isNew = n === 0 || di === newDay;
  const name = isFull ? 'คืนเดือนเพ็ญ' : isNew ? 'เดือนดับ' : n <= 15 ? 'ขึ้น ' + n + ' ค่ำ' : 'แรม ' + (n - 15) + ' ค่ำ';
  return {
    e, f, name, isFull, isNew,
    pct: Math.round((1 - Math.cos(e)) / 2 * 20) * 5,
    rise: Math.round(6 + f * 24.84) % 24,                       // the Moon rises ~50 min later each day
    nextFull, toFull: nextFull - di, newDay: n === 0 ? di : newDay, toNew: n === 0 ? 0 : newDay - di,
  };
}
const VIS = [
  [0.034, 'คืนนี้มองไม่เห็นดวงจันทร์ เพราะด้านที่สว่างหันไปทางดวงอาทิตย์ และดวงจันทร์ขึ้นตกพร้อมดวงอาทิตย์'],
  [0.22, 'ดูได้ตอนหัวค่ำ ทางทิศตะวันตก หลังดวงอาทิตย์ตก แล้วดวงจันทร์จะตกตามไป'],
  [0.28, 'ดูได้ตอนหัวค่ำ ดวงจันทร์ครึ่งดวงอยู่สูงกลางฟ้า แล้วตกตอนเที่ยงคืน'],
  [0.47, 'ดวงจันทร์ขึ้นตอนบ่าย ดูได้ตั้งแต่หัวค่ำจนดึก'],
  [0.53, 'ดวงจันทร์เต็มดวงขึ้นทางทิศตะวันออกตอนดวงอาทิตย์ตก และอยู่บนฟ้าทั้งคืน'],
  [0.72, 'ดวงจันทร์ขึ้นตอนค่ำ ดูได้ตั้งแต่ดึกจนถึงเช้า'],
  [0.78, 'ดวงจันทร์ขึ้นตอนเที่ยงคืน ตอนเช้ายังเห็นอยู่บนฟ้า แม้เป็นกลางวันแล้ว'],
  [0.966, 'ดูได้ตอนเช้ามืด ทางทิศตะวันออก ก่อนดวงอาทิตย์ขึ้น'],
  [1.01, 'คืนนี้มองไม่เห็นดวงจันทร์ เพราะด้านที่สว่างหันไปทางดวงอาทิตย์ และดวงจันทร์ขึ้นตกพร้อมดวงอาทิตย์'],
];
const visOf = (f) => VIS.find((v) => f < v[0])[1];
const TONIGHT_KNOW = [
  'ดวงจันทร์ไม่มีแสงในตัวเอง แสงที่เห็นคือแสงอาทิตย์ที่สะท้อนมา',

    <ul class="know">${m.know.map((k) => `<li>${k}</li>`).join('')}</ul>
    <div class="src">ข้อมูล: NASA Science · ภาพวาดประกอบ ไม่ใช่ภาพถ่าย</div>`;

}

// ============================================================================
// MODES
// ============================================================================
function setMode(m) {
  mode = m; stopReading(); setHold(false); engineOff(); tPlay = false;
  for (const b of document.querySelectorAll('#modes .chip')) b.classList.toggle('on', b.dataset.mode === m);
  scene2.classList.toggle('hidden', m !== 'solar' && m !== 'tide');
  if (m === 'tonight') { buildTonight(); buildDays(); renderTonight(); speak(whenOf(selDay) + ' ' + moonInfo(selDay).name); }
  else if (m === 'land') { if (lm.state === 'fly' || lm.state === 'bounce') lm.state = 'ready'; if (lm.state === 'walk') lm.state = 'ready'; astro = null; buildLand(); renderLandCtrls(); renderLand(); speak('พายานลงจอดบนดวงจันทร์ กดปุ่มเริ่มลงจอดเลย'); }
  else if (m === 'solar') { sState = 'x'; buildSolar(); renderSolarCtrls(); renderSolar(); speak('ลากดวงจันทร์ไปบังดวงอาทิตย์'); }
  else if (m === 'tide') { tLast = ''; buildTide(); renderTideCtrls(); renderTide(); speak('ลากโลกให้หมุน ดูน้ำขึ้นน้ำลงที่ชายหาด'); }
  else if (m === 'moons') { buildMoons(); renderMoonsCtrls(); renderMoons(); speak(MBY[selMoon].say); }
}
for (const b of document.querySelectorAll('#modes .chip')) b.addEventListener('click', () => { ensureAudio(); buzz(8); setMode(b.dataset.mode); });
document.addEventListener('keydown', (e) => { if (e.code === 'Space' && mode === 'land' && lm.state === 'fly') { e.preventDefault(); if (!lm.hold) { ensureAudio(); setHold(true); } } });
document.addEventListener('keyup', (e) => { if (e.code === 'Space' && mode === 'land') setHold(false); });

let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === 'land' && !document.hidden) { landTick(dt); astroTick(now); }
  tideTick(dt);
  requestAnimationFrame(tick);
}

// ============================================================================
// SOUND + SPEECH + FX
// ============================================================================
let AC = null;
function ensureAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state !== 'running') { try { AC.resume(); } catch (e) {} }
}
function tone(f, d, type = 'sine', v = 0.12) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.type = type; o.frequency.value = f; o.connect(g).connect(AC.destination);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.01); g.gain.linearRampToValueAtTime(0, t + d);
  o.start(t); o.stop(t + d + 0.02);
}
const blip = (f) => tone(f, 0.12, 'sine', 0.1);
const boop = () => tone(220, 0.22, 'triangle', 0.12);
function cheer() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'triangle', 0.15), i * 110)); }
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
function pickVoice() {
  try { return (speechSynthesis.getVoices() || []).find(v => (v.lang || '').toLowerCase().startsWith('th')) || null; } catch (e) { return null; }
}
if ('speechSynthesis' in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
// Recorded clip first (voice/, made by tools/gen_voice.py), device TTS as fallback.
function speak(text) { stopReading(); sayNow(text); }
// Resolves when the line has finished (or was cut off) — lets 🔊 read a card line by line.
function sayNow(text) {
  try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (e) {}
  ensureAudio();
  return new Promise((res) => {
    let fell = false;
    const fb = (t) => { fell = true; deviceSpeak(t, res); };
    if (!window.VoiceClips) { fb(text); return; }
    VoiceClips.say(text, AC, fb).then((ok) => { if (!fell) res(ok); });
  });
}
function deviceSpeak(text, done) {
  let fin = false;
  const end = () => { if (!fin) { fin = true; if (done) done(true); } };
  if (!('speechSynthesis' in window)) { setTimeout(end, 0); return; }
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'th-TH'; u.rate = 0.9; u.pitch = 1.05;
    const v = pickVoice(); if (v) u.voice = v;
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  } catch (e) { end(); }
  setTimeout(end, 1500 + text.length * 140);          // Safari sometimes never fires onend
}

// ---- 🔊 tap-to-hear on every info card (same as ท่องอวกาศ) ----
function sayable(t) {                    // card text → speech: no emoji/English, symbols as words
  return String(t)
    .replace(/[\p{Extended_Pictographic}\u{1F3FB}-\u{1F3FF}️‍]/gu, '')
    .replace(/\s*\([^)]*[A-Za-z][^)]*\)/g, '').replace(/[A-Za-z][A-Za-z’' ]*[A-Za-z]/g, '')
    .replace(/กม\.\/ชม\./g, 'กิโลเมตรต่อชั่วโมง').replace(/กม\./g, 'กิโลเมตร').replace(/ชม\./g, 'ชั่วโมง')
    .replace(/ม\.\/วินาที/g, 'เมตรต่อวินาที')
    .replace(/กก\./g, 'กิโลกรัม').replace(/ซม\./g, 'เซนติเมตร').replace(/พ\.ศ\./g, 'พุทธศักราช')
    .replace(/°C/g, ' องศาเซลเซียส').replace(/°/g, ' องศา').replace(/%/g, ' เปอร์เซ็นต์')
    .replace(/(^|[\s~(])-(?=\d)/g, '$1ลบ ').replace(/~/g, 'ประมาณ ').replace(/¼/g, 'หนึ่งในสี่')
    .replace(/–/g, ' ถึง ').replace(/[—·:→()]/g, ' ').replace(/ฯ/g, '')
    .replace(/\s+/g, ' ').trim();
}
function plainText(el) {
  const c = el.cloneNode(true);
  for (const x of c.querySelectorAll('br')) x.replaceWith(' ');
  for (const x of c.querySelectorAll('div')) x.append(' ');
  return c.textContent;
}
const sayOf = (el) => el.dataset.say !== undefined ? el.dataset.say : sayable(plainText(el));
let readTok = 0, readBtn = null;
function clearReading() { for (const e of document.querySelectorAll('.reading')) e.classList.remove('reading'); }
function stopReading() {
  if (readBtn) { readBtn.classList.remove('on'); readBtn = null; }
  clearReading();
  return ++readTok;
}
function hear(el) {
  const my = stopReading();
  el.classList.add('reading');
  sayNow(sayOf(el)).then(() => { if (my === readTok) clearReading(); });
}
async function readAll(btn) {
  if (readBtn === btn) {                 // tap again = stop
    stopReading(); if (window.VoiceClips) VoiceClips.stop();
    try { speechSynthesis.cancel(); } catch (e) {}
    return;
  }
  const my = stopReading(); readBtn = btn; btn.classList.add('on');
  for (const el of panel.querySelectorAll('.sayable')) {
    if (my !== readTok || !el.isConnected) return;
    clearReading(); el.classList.add('reading');
    try { el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    await sayNow(sayOf(el));
    if (my !== readTok) return;
    await new Promise((r) => setTimeout(r, 250));
  }
  if (my === readTok) stopReading();
}
const SAY_SEL = '.p-head > div, .q-text, .clockbig, .badge, .res, .warn, .fact, .know li, [data-sayme]';
function sayKit() {
  stopReading();
  const items = [...panel.querySelectorAll(SAY_SEL)].filter((el) => sayOf(el));
  for (const el of items) {
    el.classList.add('sayable');
    el.addEventListener('click', () => { ensureAudio(); buzz(8); hear(el); });
  }
  if (items.length < 2) return;
  let btn = panel.querySelector('.p-head .say');
  if (!btn) {
    const head = panel.querySelector('.p-head');
    if (head) head.insertAdjacentHTML('beforeend', '<button class="say">🔊</button>');
    else panel.insertAdjacentHTML('afterbegin', '<div class="sayrow"><button class="say">🔊 ฟังทั้งการ์ด</button></div>');
    btn = panel.querySelector('.p-head .say, .sayrow .say');
  }
  btn.setAttribute('aria-label', 'ฟังทั้งการ์ด');
  btn.addEventListener('click', () => { ensureAudio(); buzz(8); readAll(btn); });
}
function celebrate(n) {
  const cols = ['#ff6b9d', '#ffd93d', '#7ed957', '#5bc0eb', '#9b59b6', '#ff914d'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.6) + 's';
    c.style.animationDelay = (Math.random() * 0.4) + 's';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3800);
  }
}

// Block double-tap zoom on iOS
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 300) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

setMode(location.hash === '#moons' ? 'moons' : 'tonight');   // ท่องอวกาศ links straight to 🪐

VoiceClips.lines(() => {

    'แตะพื้นเพื่อเดิน แล้วดูรอยเท้านะ', 'บนดวงจันทร์ตัวเบา กระโดดได้สูงกว่าบนโลกราว 6 เท่า',
    'ปักธงแล้ว บนดวงจันทร์ไม่มีลม ธงจริงของนักบินอวกาศจึงต้องมีคานค้ำไว้ไม่ให้ห้อย', 'พายานลงจอดบนดวงจันทร์ กดปุ่มเริ่มลงจอดเลย',
    'สุริยุปราคาเต็มดวง ฟ้ามืด เห็นดาว และเห็นแสงเรืองรอบดวงอาทิตย์', 'สุริยุปราคาวงแหวน ดวงจันทร์อยู่ไกล จึงบังไม่มิด เหลือแสงเป็นวงแหวน',

    'ลากโลกให้หมุน ดูน้ำขึ้นน้ำลงที่ชายหาด', 'ขนาดเทียบกันตามจริง แกนีมีดใหญ่กว่าดาวพุธเสียอีก'];
  for (const w of ['คืนนี้', 'คืนนั้น']) { for (const n of PH_NAMES) L.push(w + ' ' + n); L.push(w + 'เป็นคืนเพ็ญ'); }

  for (let h = 0; h < 24; h++) L.push('ดวงจันทร์ขึ้นราว ' + timeTH(h));

  for (let d = 1; d <= 31; d++) L.push('อีก ' + d + ' วัน จะถึงคืนเพ็ญ', 'อีก ' + d + ' วัน จะถึงเดือนดับ');
  for (const v of VIS) L.push(v[1]);
  for (const m of MOONS) L.push(m.say);
  const grab = () => L.push(...[...panel.querySelectorAll('.sayable')].map(sayOf));
  renderTonight(); grab();
  for (const st of ['ready', 'fly', 'landed', 'hard', 'walk']) for (const v of [1, 3, 5]) { lm.state = st; lm.vHit = v; renderLand(); grab(); }

  L.push('ดวงอาทิตย์ ดวงจันทร์ และโลก เรียงเป็นแนวเดียวกัน น้ำขึ้นมากและลงมาก เรียกว่าน้ำเกิด', 'ดวงจันทร์อยู่ตั้งฉากกับดวงอาทิตย์ แรงดึงหักล้างกัน น้ำขึ้นลงน้อย เรียกว่าน้ำตาย');

<script>
/* Auto-update: offer a "tap to update" pill when a new version is deployed
   (never reload on its own while a child is playing). */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var sw = navigator.serviceWorker, reloading = false, shown = false;
  if (sw.controller) {
    sw.addEventListener('controllerchange', function () {
      if (reloading) return; reloading = true; location.reload();
    });
  }
  function offer(worker) {
    if (shown || !worker || !sw.controller) return;
    shown = true;
    var st = document.createElement('style');
    st.textContent = '@keyframes swUpIn{from{opacity:0;transform:translate(-50%,-18px)}to{opacity:1;transform:translateX(-50%)}}';
    document.head.appendChild(st);
    var b = document.createElement('button');
    b.textContent = '✨ มีเวอร์ชันใหม่ · แตะอัปเดต';
    b.setAttribute('style', 'position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));'
      + 'transform:translateX(-50%);z-index:99999;font-family:inherit;font-size:16px;font-weight:600;'
      + 'color:#fff;background:#ff6b9d;border:3px solid #e54b82;border-radius:999px;padding:11px 20px;'
      + 'box-shadow:0 4px 0 rgba(0,0,0,.18);cursor:pointer;-webkit-tap-highlight-color:transparent;animation:swUpIn .3s ease;');
    b.onclick = function () { b.disabled = true; b.textContent = '⏳ กำลังอัปเดต…'; worker.postMessage({ type: 'skipWaiting' }); };
    document.body.appendChild(b);
  }
  function track(w) {
    if (!w) return;
    if (w.state === 'installed') { offer(w); return; }
    w.addEventListener('statechange', function () { if (w.state === 'installed') offer(w); });
  }
  function watch(reg) {
    if (!reg) return;
    if (reg.waiting) offer(reg.waiting);
    track(reg.installing);
    reg.addEventListener('updatefound', function () { track(reg.installing); });
    function check() { reg.update().catch(function () {}); }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
    window.addEventListener('focus', check);
    setInterval(check, 60000);
  }
  sw.getRegistration().then(watch).catch(function () {});
})();
</script>
